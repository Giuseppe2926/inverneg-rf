<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RF MKT Garita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ──────────────────────────────────────────────────────────────── */
:root {
  --bg:#fdf8f0; --bg-card:#ffffff; --bg-muted:#faf5eb;
  --fg:#1c1209; --fg-muted:#78614a; --fg-subtle:#a68c6d;
  --border:#e8dcc8; --border-focus:#b45309;
  --primary:#b45309; --primary-h:#92400e; --primary-fg:#fff;
  --ok:#16a34a; --ok-bg:#f0fdf4; --ok-bd:#bbf7d0;
  --warn:#d97706; --warn-bg:#fffbeb; --warn-bd:#fde68a;
  --err:#dc2626; --err-bg:#fef2f2; --err-bd:#fecaca;
  --info:#b45309; --info-bg:#fff7ed; --info-bd:#fed7aa;
  --gray:#f5ebe0;
  --r:8px; --r-lg:12px;
  --sh:0 1px 3px rgba(0,0,0,.08);
  --sh-md:0 4px 12px rgba(0,0,0,.1);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1000; --bg-card:#241800; --bg-muted:#1c1100;
    --fg:#fdf8f0; --fg-muted:#c9a96e; --fg-subtle:#8c6d40;
    --border:#3d2c10; --border-focus:#d97706;
    --primary:#d97706; --primary-h:#b45309;
    --ok-bg:#052e16; --ok-bd:#14532d;
    --warn-bg:#1c0f00; --warn-bd:#78350f;
    --err-bg:#1c0a0a; --err-bd:#7f1d1d;
    --info-bg:#1c0f00; --info-bd:#78350f;
    --gray:#241800;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1000; --bg-card:#241800; --bg-muted:#1c1100;
  --fg:#fdf8f0; --fg-muted:#c9a96e; --fg-subtle:#8c6d40;
  --border:#3d2c10; --border-focus:#d97706;
  --primary:#d97706; --primary-h:#b45309;
  --ok-bg:#052e16; --ok-bd:#14532d;
  --warn-bg:#1c0f00; --warn-bd:#78350f;
  --err-bg:#1c0a0a; --err-bd:#7f1d1d;
  --info-bg:#1c0f00; --info-bd:#78350f;
  --gray:#241800;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;font-size:14px;
     background:var(--bg);color:var(--fg);
     padding-inline:16px;padding-block:16px}

/* ── HEADER ─────────────────────────────────────────────────────────────── */
.app-hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px;
         padding-bottom:14px;border-bottom:1px solid var(--border)}
.app-hdr h1{margin:0;font-size:17px;font-weight:700;flex:1}
.app-hdr .user{font-size:12px;color:var(--fg-muted);max-width:160px;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.garita-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:20px;background:var(--info-bg);color:var(--primary);
  border:1px solid var(--info-bd);font-size:11px;font-weight:700;white-space:nowrap}

/* ── BUTTONS ─────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
     border-radius:var(--r);border:none;font:inherit;font-size:13px;
     font-weight:500;cursor:pointer;transition:.15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover:not(:disabled){background:var(--primary-h)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover:not(:disabled){background:#15803d}
.btn-secondary{background:var(--bg-muted);color:var(--fg);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--gray)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}

/* ── BADGES ──────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
       font-size:11px;font-weight:600;white-space:nowrap}
.b-aprobada{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-reprogramada{background:var(--info-bg);color:var(--primary);border:1px solid var(--info-bd)}
.b-recibidook{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-novedades{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-parcialrec{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-rechazadoop{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.b-nopresentado{background:var(--gray);color:var(--fg-muted);border:1px solid var(--border)}
.b-pendiente{background:var(--gray);color:var(--fg-muted);border:1px solid var(--border)}

/* ── MISC ────────────────────────────────────────────────────────────────── */
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);
      border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
.spin-sm{width:12px;height:12px;border-width:1.5px}
@keyframes sp{to{transform:rotate(360deg)}}
.login-wrap{display:flex;flex-direction:column;align-items:center;
            justify-content:center;min-height:100vh;padding:24px;text-align:center}
.login-card{background:var(--bg-card);border:1px solid var(--border);
            border-radius:var(--r-lg);padding:40px;max-width:380px;width:100%;
            box-shadow:var(--sh-md)}
.login-card h2{font-size:20px;font-weight:700;margin:0 0 6px}
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
.a-err{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err)}
.a-info{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--primary)}
.a-ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}

/* ── BUSCADOR ────────────────────────────────────────────────────────────── */
.srch-card{background:var(--bg-card);border:1px solid var(--border);
           border-radius:var(--r-lg);margin-bottom:14px;box-shadow:var(--sh);overflow:hidden}
.srch-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;
          border-bottom:1px solid var(--border);background:var(--bg-muted)}
.srch-hdr-lbl{font-size:13px;font-weight:700;color:var(--primary);flex:1}
.srch-body{padding:14px 16px}
.srch-input-wrap{position:relative;display:flex;align-items:center;gap:8px}
.srch-input{width:100%;padding:9px 36px 9px 38px;border:1.5px solid var(--border);
            border-radius:var(--r);background:var(--bg);color:var(--fg);
            font:inherit;font-size:13px;outline:none;transition:.15s}
.srch-input:focus{border-color:var(--border-focus)}
.srch-input-ico{position:absolute;left:11px;font-size:15px;pointer-events:none;color:var(--fg-muted)}
.srch-clear{position:absolute;right:8px;width:22px;height:22px;
            border:none;background:transparent;cursor:pointer;font-size:13px;
            color:var(--fg-muted);border-radius:50%;display:flex;align-items:center;
            justify-content:center;padding:0;transition:.1s}
.srch-clear:hover{background:var(--gray);color:var(--fg)}
.srch-hint{font-size:12px;color:var(--fg-subtle);margin-top:8px}
.srch-results{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.srch-date-grp{border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.srch-date-hdr{display:flex;align-items:center;justify-content:space-between;
               padding:8px 14px;background:var(--bg-muted);border-bottom:1px solid var(--border)}
.srch-date-lbl{font-size:12px;font-weight:700;text-transform:capitalize;color:var(--fg)}
.srch-date-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.srch-tag-hoy{background:var(--primary);color:#fff}
.srch-tag-fut{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.srch-tag-pas{background:var(--gray);color:var(--fg-muted);border:1px solid var(--border)}
.srch-line{padding:10px 14px;border-bottom:1px solid var(--border);
           display:flex;flex-direction:column;gap:4px}
.srch-line:last-child{border-bottom:none}
.srch-line-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.srch-line-mat{font-size:13px;font-weight:600}
.srch-line-hora{font-size:12px;color:var(--primary);font-weight:600;white-space:nowrap}
.srch-line-mid{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.srch-line-action{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.srch-no-res{padding:20px;text-align:center;color:var(--fg-muted);font-size:13px}
.presente-info{display:flex;flex-direction:column;gap:2px}
.presente-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
  border-radius:20px;background:var(--ok-bg);color:var(--ok);
  border:1px solid var(--ok-bd);font-size:12px;font-weight:600}
.presente-sub{font-size:11px;color:var(--fg-muted)}
.mark-err{font-size:11px;color:var(--err);margin-top:4px}

/* ── CALENDARIO ──────────────────────────────────────────────────────────── */
.cal-wrap{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:780px){.cal-wrap.panel-open{grid-template-columns:1fr 380px;align-items:start}}
.cal-card-c{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh)}
.cal-hdr-c{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.cal-month-lbl{font-size:15px;font-weight:700;text-transform:capitalize}
.cal-nav-c{display:flex;gap:4px;align-items:center}
.btn-cal-t{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-card);color:var(--fg-muted);cursor:pointer;font-family:inherit}
.btn-cal-t:hover{background:var(--gray)}
.btn-cal-n{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-card);color:var(--fg-muted);font-size:14px;cursor:pointer;font-family:inherit}
.btn-cal-n:hover{background:var(--gray)}
.cal-grid-c{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow-c{padding:7px 4px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-subtle);background:var(--gray);border-bottom:1px solid var(--border)}
.cal-day-c{min-height:90px;padding:6px;cursor:pointer;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px;transition:background .1s}
.cal-day-c:nth-child(7n){border-right:none}
.cal-day-c:hover{background:var(--bg-muted)}
.cal-day-c.c-other{opacity:.3;pointer-events:none}
.cal-day-c.c-today .cal-dn-c{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.cal-day-c.c-sel{background:var(--info-bg);outline:2px solid var(--primary);outline-offset:-2px}
.cal-dn-c{font-size:11px;font-weight:600;color:var(--fg);width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cal-day-c.c-other .cal-dn-c{color:var(--fg-subtle)}
.c-info{display:flex;flex-direction:column;gap:2px;margin-top:1px}
.c-load-row{display:flex;align-items:center;gap:4px}
.c-load-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.c-load-txt{font-size:10px;font-weight:600;line-height:1}
.c-units{font-size:10px;color:var(--fg-subtle);line-height:1}
.c-exec-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.c-exec-ico{font-size:10px;line-height:1.4;white-space:nowrap}
.c-pres-row{font-size:10px;color:var(--ok);font-weight:600;line-height:1}
.clv-ok   .c-load-dot{background:#16a34a}.clv-ok   .c-load-txt{color:#16a34a}
.clv-warn .c-load-dot{background:#d97706}.clv-warn .c-load-txt{color:#d97706}
.clv-alrt .c-load-dot{background:#ea580c}.clv-alrt .c-load-txt{color:#ea580c}
.clv-crit .c-load-dot{background:#dc2626}.clv-crit .c-load-txt{color:#dc2626}
.cal-legend-c{display:flex;gap:14px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--border);background:var(--gray)}
.cal-leg-it{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--fg-muted)}
.cal-leg-d{width:7px;height:7px;border-radius:50%}

/* ── DETALLE ─────────────────────────────────────────────────────────────── */
.cal-dp-c{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-md)}
.cal-dp-hdr-c{padding:13px 16px;background:var(--info-bg);border-bottom:1px solid var(--info-bd);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cal-dp-date{font-size:13px;font-weight:700;color:var(--primary);text-transform:capitalize;line-height:1.3}
.cal-dp-meta{font-size:11px;color:var(--fg-muted);margin-top:3px}
.cal-dp-cls{width:26px;height:26px;flex-shrink:0;border-radius:var(--r);border:1px solid var(--info-bd);background:transparent;color:var(--primary);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.cal-dp-cls:hover{background:var(--info-bd)}
.cal-dp-body{max-height:520px;overflow-y:auto}
.cal-dp-empty-c{padding:30px 16px;text-align:center;color:var(--fg-muted);font-size:13px}
.cal-line-c{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.cal-line-c:last-child{border-bottom:none}
.cal-lt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cal-lprov{font-size:13px;font-weight:600;color:var(--fg)}
.cal-lhora{font-size:12px;color:var(--primary);white-space:nowrap;font-weight:600}
.cal-lmid{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:2px}
.cal-laction{margin-top:7px;padding-top:7px;border-top:1px solid var(--border)}
.prov-hdr{padding:8px 16px 0;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-subtle)}

@media(max-width:600px){.cal-day-c{min-height:64px;padding:4px}.c-units,.c-exec-row{display:none}}
.refresh-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.refresh-meta{font-size:12px;color:var(--fg-muted)}
</style>

<body>
<div id="app"><div class="login-wrap"><div class="spin"></div></div></div>

<script>
'use strict';

/* ── CONFIG ──────────────────────────────────────────────────────────────── */
const MSAL_CFG = {
  auth:{
    clientId:'ec976114-e146-4ce4-850c-5d978e12acfd',
    authority:'https://login.microsoftonline.com/5e008bd3-17b6-4f83-8d23-019691a40609',
    redirectUri: location.origin + location.pathname
  },
  cache:{cacheLocation:'sessionStorage',storeAuthStateInCookie:false}
};
const SITE   = 'inverneg.sharepoint.com,8b946a6c-31b9-4bf7-95d0-ab47d29a4d63,ad88c61f-b207-49a4-9105-8b3b57b31906';
const SCOPES = ['https://graph.microsoft.com/Sites.ReadWrite.All'];
const BASE   = 'https://graph.microsoft.com/v1.0';

/* ── STATE ───────────────────────────────────────────────────────────────── */
let msalApp, me;
let lineas    = [];
let busy      = false;
let busyMark  = new Set();
let markErr   = {};
let lastLoad  = null;
let calYr = new Date().getFullYear(), calMo = new Date().getMonth(), calSel = null;
const CAL_TOD = new Date().toISOString().split('T')[0];
let searchQ   = '';

/* ── GRAPH ───────────────────────────────────────────────────────────────── */
function login(){ msalApp.loginRedirect({scopes:SCOPES}); }

async function tok(){
  if(!msalApp) throw new Error('MSAL no inicializado');
  const acc = msalApp.getActiveAccount();
  if(!acc) throw new Error('Sin sesión');
  return msalApp.acquireTokenSilent({scopes:SCOPES, account:acc})
    .catch(()=>msalApp.acquireTokenRedirect({scopes:SCOPES}))
    .then(r=>r?r.accessToken:Promise.reject(new Error('redirect')));
}

async function gGet(url){
  const t = await tok();
  const r = await fetch(url, {headers:{Authorization:`Bearer ${t}`}});
  if(!r.ok){const e=await r.text(); throw new Error(`${r.status} ${e}`);}
  return r.json();
}

async function gPatch(url, body){
  const t = await tok();
  const r = await fetch(url, {
    method:'PATCH',
    headers:{Authorization:`Bearer ${t}`, 'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!r.ok){const e=await r.text(); throw new Error(`${r.status} ${e}`);}
  return r.status===204 ? null : r.json();
}

async function gAll(url){
  let res=[], next=url;
  while(next){
    const d = await gGet(next);
    res = res.concat(d.value||[]);
    next = d['@odata.nextLink']||null;
  }
  return res;
}

/* ── UTILS ───────────────────────────────────────────────────────────────── */
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function badge(e){
  const m = {
    Aprobada:'aprobada', Reprogramada:'reprogramada',
    'Recibido OK':'recibidook', 'Recibido con Novedades':'novedades',
    'Parcialmente Recibida':'parcialrec', 'Rechazado por Operación':'rechazadoop',
    'No Presentado':'nopresentado'
  };
  return `<span class="badge b-${m[e]||'pendiente'}">${esc(e||'—')}</span>`;
}

function fmtTime(s){
  if(!s) return '—';
  const p = String(s).split(':');
  return p.length>=2 ? `${p[0]}:${p[1]}` : s;
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T12:00:00');
  return d.toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'});
}

function nowISO(){ return new Date().toISOString(); }
function nowHHMM(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

/* ── ACCIÓN: PROVEEDOR PRESENTE ──────────────────────────────────────────── */
async function markPresente(id){
  if(busyMark.has(id)) return;
  busyMark.add(id);
  delete markErr[id];
  if(calSel) renderDetail(calSel);
  renderSearchResults();

  try{
    const fechaISO = nowISO();
    const horaHHMM = nowHHMM();
    const usuario  = me?.name || me?.username || '';

    await gPatch(
      `${BASE}/sites/${SITE}/lists/MKT_Lineas/items/${id}/fields`,
      {
        FechaLlegadaGarita: fechaISO,
        HoraLlegadaGarita:  horaHHMM,
        UsuarioGarita:       usuario
      }
    );

    const l = lineas.find(x => x.id === id);
    if(l){
      l.FechaLlegadaGarita = fechaISO;
      l.HoraLlegadaGarita  = horaHHMM;
      l.UsuarioGarita       = usuario;
    }
  } catch(e){
    console.warn('[MARK]', e.message);
    markErr[id] = e.message;
  }

  busyMark.delete(id);
  buildGrid();
  if(calSel) renderDetail(calSel);
  renderSearchResults();
}

/* ── BUSCADOR ────────────────────────────────────────────────────────────── */
function buildProviderList(){
  const dl = document.getElementById('provDl');
  if(!dl) return;
  const names = [...new Set(lineas.map(l=>l.Proveedor||'').filter(Boolean))].sort();
  dl.innerHTML = names.map(n=>`<option value="${esc(n)}">`).join('');
}

function renderSearchResults(){
  const container = document.getElementById('srchResults');
  if(!container) return;
  const q = searchQ.trim().toLowerCase();
  if(!q){ container.innerHTML=''; return; }

  const matches = lineas.filter(l=>(l.Proveedor||'').toLowerCase().includes(q));

  if(!matches.length){
    container.innerHTML=`<div class="srch-no-res">🔍 Sin resultados para "<strong>${esc(searchQ.trim())}</strong>"</div>`;
    return;
  }

  // Agrupar por fecha
  const byDate = {};
  matches.forEach(l=>{
    const iso = ((l.FechaAprobada||l.FechaSolicitada)||'').split('T')[0];
    if(iso){ if(!byDate[iso])byDate[iso]=[]; byDate[iso].push(l); }
  });

  // Ordenar: hoy primero, luego futuros asc, luego pasados desc
  const sorted = Object.keys(byDate).sort((a,b)=>{
    if(a===CAL_TOD) return -1; if(b===CAL_TOD) return 1;
    const af=a>CAL_TOD, bf=b>CAL_TOD;
    if(af&&!bf) return -1; if(!af&&bf) return 1;
    if(af&&bf)  return a.localeCompare(b);
    return b.localeCompare(a);
  });

  container.innerHTML = sorted.map(iso=>{
    const isHoy = iso===CAL_TOD;
    const isFut = iso>CAL_TOD;
    const ls    = byDate[iso];
    const ds    = fmtDate(iso);
    const tagH  = isHoy
      ? `<span class="srch-date-tag srch-tag-hoy">Hoy</span>`
      : isFut
        ? `<span class="srch-date-tag srch-tag-fut">Programado</span>`
        : `<span class="srch-date-tag srch-tag-pas">Pasado</span>`;
    const linesH = ls.map(l=>{
      const yaPresente = !!l.FechaLlegadaGarita;
      const enProceso  = busyMark.has(l.id);
      const errMsg     = markErr[l.id]||'';
      let actionHTML   = '';
      if(yaPresente){
        const h = l.HoraLlegadaGarita || fmtTime((l.FechaLlegadaGarita||'').split('T')[1]);
        actionHTML = `<div class="presente-info">
          <span class="presente-badge">✅ Proveedor presente · ${esc(h)}</span>
          ${l.UsuarioGarita?`<span class="presente-sub">Registrado por ${esc(l.UsuarioGarita)}</span>`:''}
        </div>`;
      } else if(enProceso){
        actionHTML = `<span class="badge b-pendiente"><span class="spin spin-sm" style="display:inline-block;margin-right:4px"></span> Registrando…</span>`;
      } else {
        actionHTML = `<button class="btn btn-ok btn-xs" data-id="${esc(l.id)}">✅ Proveedor Presente</button>`;
      }
      return `<div class="srch-line">
        <div class="srch-line-top">
          <span class="srch-line-mat">${esc(l.Material||'—')}</span>
          <span class="srch-line-hora">${fmtTime(l.HoraAprobada||l.HoraSolicitada)}</span>
        </div>
        <div class="srch-line-mid">
          <span style="font-size:11px;color:var(--fg-subtle)">${(Number(l.Cantidad)||0).toLocaleString('es-EC')} un</span>
          ${badge(l.EstadoLinea)}
          ${l.EstadoRecepcion?badge(l.EstadoRecepcion):''}
        </div>
        <div class="srch-line-action">
          ${actionHTML}
          ${errMsg?`<div class="mark-err">Error: ${esc(errMsg)}</div>`:''}
        </div>
      </div>`;
    }).join('');
    return `<div class="srch-date-grp">
      <div class="srch-date-hdr">
        <span class="srch-date-lbl">${esc(ds.charAt(0).toUpperCase()+ds.slice(1))}</span>
        ${tagH}
      </div>
      ${linesH}
    </div>`;
  }).join('');

  // Vincular botones
  container.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click',()=>markPresente(btn.dataset.id));
  });
}

function bindSearch(){
  const inp = document.getElementById('srchInput');
  const clr = document.getElementById('srchClear');
  if(!inp) return;
  inp.value = searchQ;
  inp.addEventListener('input', e=>{
    searchQ = e.target.value;
    clr.style.display = searchQ ? 'flex' : 'none';
    renderSearchResults();
  });
  clr.addEventListener('click',()=>{
    searchQ=''; inp.value=''; clr.style.display='none';
    renderSearchResults(); inp.focus();

}

/* ── CALENDARIO ──────────────────────────────────────────────────────────── */
const CAL_MON = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const CAL_DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const EXEC_MAP = [
  {ico:'✅', key:'Recibido OK'}, {ico:'⚠️', key:'Recibido con Novedades'},
  {ico:'📦', key:'Parcialmente Recibida'}, {ico:'🚫', key:'No Presentado'},
  {ico:'❌', key:'Rechazado por Operación'}
];

function lnDia(iso){
  return lineas.filter(l=>{
    const fa=(l.FechaAprobada||'').split('T')[0];
    const fs=(l.FechaSolicitada||'').split('T')[0];
    return (fa||fs)===iso;
  });
}
function loadLv(n){ if(!n)return''; if(n<=3)return'clv-ok'; if(n<=5)return'clv-warn'; if(n<=7)return'clv-alrt'; return'clv-crit'; }
function totalUn(ls){ return ls.reduce((a,l)=>a+(Number(l.Cantidad)||0),0); }

function calHTML(){
  return `<div class="cal-wrap" id="calWrap">
    <div class="cal-card-c">
      <div class="cal-hdr-c">
        <span class="cal-month-lbl" id="calLbl">—</span>
        <div class="cal-nav-c">
          <button class="btn-cal-t" id="btnHoy">Hoy</button>
          <button class="btn-cal-n" id="btnPrev">‹</button>
          <button class="btn-cal-n" id="btnNext">›</button>
        </div>
      </div>
      <div class="cal-grid-c" id="calGrid"></div>
      <div class="cal-legend-c">
        <div class="cal-leg-it"><div class="cal-leg-d" style="background:#16a34a"></div>1–3 rec</div>
        <div class="cal-leg-it"><div class="cal-leg-d" style="background:#d97706"></div>4–5 rec</div>
        <div class="cal-leg-it"><div class="cal-leg-d" style="background:#ea580c"></div>6–7 rec</div>
        <div class="cal-leg-it"><div class="cal-leg-d" style="background:#dc2626"></div>8+ rec</div>
        <div class="cal-leg-it"><div class="cal-leg-d" style="background:#16a34a;opacity:.5"></div>✅ Presentes</div>
      </div>
    </div>
    <div class="cal-dp-c" id="calDp" hidden>
      <div class="cal-dp-hdr-c">
        <div><div class="cal-dp-date" id="calDpDate">—</div><div class="cal-dp-meta" id="calDpMeta">—</div></div>
        <button class="cal-dp-cls" id="calDpClose">✕</button>
      </div>
      <div class="cal-dp-body" id="calDpBody"></div>
    </div>
  </div>`;
}

function buildGrid(){
  const yr=calYr, mo=calMo;
  document.getElementById('calLbl').textContent=`${CAL_MON[mo]} ${yr}`;
  const grid=document.getElementById('calGrid');
  const first=new Date(yr,mo,1).getDay();
  const inMon=new Date(yr,mo+1,0).getDate();
  const inPrev=new Date(yr,mo,0).getDate();
  let h=CAL_DOW.map(d=>`<div class="cal-dow-c">${d}</div>`).join('');
  let cells='';
  for(let i=0;i<first;i++){
    const d=inPrev-first+1+i;
    const iso=`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=makeCell(iso,d,true);
  }
  for(let d=1;d<=inMon;d++){
    const iso=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=makeCell(iso,d,false);
  }
  const tail=(first+inMon)%7;
  const nx=tail?7-tail:0;
  for(let i=1;i<=nx;i++){
    const iso=`${yr}-${String(mo+2).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    cells+=makeCell(iso,i,true);
  }
  grid.innerHTML=h+cells;
  grid.querySelectorAll('.cal-day-c:not(.c-other)').forEach(el=>{
    el.addEventListener('click',()=>{
      grid.querySelectorAll('.cal-day-c').forEach(d=>d.classList.remove('c-sel'));
      el.classList.add('c-sel');
      calSel=el.dataset.iso;
      renderDetail(calSel);
    });
  });
  if(calSel){
    const el=grid.querySelector(`[data-iso="${calSel}"]`);
    if(el) el.classList.add('c-sel');
  }
}

function makeCell(iso,n,other){
  const ls=lnDia(iso);
  const cnt=ls.length;
  const un=totalUn(ls);
  const lv=loadLv(cnt);
  const presentes=ls.filter(l=>l.FechaLlegadaGarita).length;
  let cls='cal-day-c';
  if(other) cls+=' c-other';
  if(iso===CAL_TOD) cls+=' c-today';
  if(iso===calSel)  cls+=' c-sel';
  if(lv)            cls+=' '+lv;
  const exec={};
  ls.forEach(l=>{ if(l.EstadoRecepcion) exec[l.EstadoRecepcion]=(exec[l.EstadoRecepcion]||0)+1; });
  const execH=EXEC_MAP.filter(x=>exec[x.key]).map(x=>`<span class="c-exec-ico">${x.ico}${exec[x.key]}</span>`).join('');
  return `<div class="${cls}" data-iso="${iso}">
    <span class="cal-dn-c">${n}</span>
    ${cnt?`<div class="c-info">
      <div class="c-load-row"><div class="c-load-dot"></div><span class="c-load-txt">${cnt} rec</span></div>
      <div class="c-units">${un.toLocaleString('es-EC')} un</div>
      ${presentes?`<div class="c-pres-row">✅ ${presentes} presente${presentes!==1?'s':''}</div>`:''}
      ${execH?`<div class="c-exec-row">${execH}</div>`:''}
    </div>`:''}
  </div>`;
}

function renderDetail(iso){
  const dp=document.getElementById('calDp');
  const wrap=document.getElementById('calWrap');
  dp.hidden=false; wrap.classList.add('panel-open');
  const ls=lnDia(iso);
  const d=new Date(iso+'T12:00:00');
  const ds=d.toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  document.getElementById('calDpDate').textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
  const presentes=ls.filter(l=>l.FechaLlegadaGarita).length;
  const metaParts=[`${ls.length} recepción${ls.length!==1?'es':''}`,`${totalUn(ls).toLocaleString('es-EC')} unidades`];
  if(presentes) metaParts.push(`✅ ${presentes} presente${presentes!==1?'s':''}`);
  document.getElementById('calDpMeta').textContent=metaParts.join(' · ');
  const body=document.getElementById('calDpBody');
  if(!ls.length){
    body.innerHTML=`<div class="cal-dp-empty-c"><div style="font-size:28px;margin-bottom:8px">🚧</div>Sin recepciones programadas para este día.</div>`;
    return;
  }
  const byProv={};
  ls.forEach(l=>{ const p=l.Proveedor||'—'; if(!byProv[p])byProv[p]=[]; byProv[p].push(l); });
  body.innerHTML=Object.entries(byProv).map(([prov,items])=>`
    <div class="prov-hdr">🏭 ${esc(prov)}</div>
    ${items.map(l=>{
      const yaPresente=!!l.FechaLlegadaGarita;
      const enProceso=busyMark.has(l.id);
      const errMsg=markErr[l.id]||'';
      let actionHTML='';
      if(yaPresente){
        const h=l.HoraLlegadaGarita||fmtTime((l.FechaLlegadaGarita||'').split('T')[1]);
        actionHTML=`<div class="presente-info">
          <span class="presente-badge">✅ Proveedor presente · ${esc(h)}</span>
          ${l.UsuarioGarita?`<span class="presente-sub">Registrado por ${esc(l.UsuarioGarita)}</span>`:''}
        </div>`;
      } else if(enProceso){
        actionHTML=`<span class="badge b-pendiente"><span class="spin spin-sm" style="display:inline-block;margin-right:4px"></span> Registrando…</span>`;
      } else {
        actionHTML=`<button class="btn btn-ok btn-sm" data-id="${esc(l.id)}">✅ Proveedor Presente</button>`;
      }
      return `<div class="cal-line-c">
        <div class="cal-lt">
          <span class="cal-lprov">${esc(l.Material||'—')}</span>
          <span class="cal-lhora">${fmtTime(l.HoraAprobada||l.HoraSolicitada)}</span>
        </div>
        <div class="cal-lmid">
          <span style="font-size:11px;color:var(--fg-subtle)">${(Number(l.Cantidad)||0).toLocaleString('es-EC')} un</span>
          ${badge(l.EstadoLinea)}
          ${l.EstadoRecepcion?badge(l.EstadoRecepcion):''}
        </div>
        <div class="cal-laction">
          ${actionHTML}
          ${errMsg?`<div class="mark-err">Error: ${esc(errMsg)}</div>`:''}
        </div>
      </div>`;
    }).join('')}
  `).join('');
  body.querySelectorAll('button[data-id]').forEach(btn=>{
    btn.addEventListener('click',()=>markPresente(btn.dataset.id));
  });
}

function bindCal(){
  buildGrid();
  if(!calSel){
    if(lnDia(CAL_TOD).length){ calSel=CAL_TOD; buildGrid(); renderDetail(CAL_TOD); }
  } else {
    renderDetail(calSel);
  }
  document.getElementById('btnPrev')?.addEventListener('click',()=>{
    calMo--; if(calMo<0){calMo=11;calYr--;} buildGrid();
  });
  document.getElementById('btnNext')?.addEventListener('click',()=>{
    calMo++; if(calMo>11){calMo=0;calYr++;} buildGrid();
  });
  document.getElementById('btnHoy')?.addEventListener('click',()=>{
    calYr=new Date().getFullYear(); calMo=new Date().getMonth();
    calSel=CAL_TOD; buildGrid(); renderDetail(CAL_TOD);
  });
  document.getElementById('calDpClose')?.addEventListener('click',()=>{
    document.getElementById('calDp').hidden=true;
    document.getElementById('calWrap').classList.remove('panel-open');
    document.querySelectorAll('.cal-day-c').forEach(d=>d.classList.remove('c-sel'));
    calSel=null;
  });
}

/* ── RENDER ──────────────────────────────────────────────────────────────── */
function render(){
  const app=document.getElementById('app');
  if(!me){ renderLogin(app); return; }
  if(busy){
    app.innerHTML=`<div class="app-hdr">
      <span style="font-size:22px">🚧</span>
      <h1>RF MKT · Garita</h1>
    </div>
    <div style="text-align:center;padding:40px 0"><span class="spin"></span><p style="color:var(--fg-muted);font-size:13px;margin-top:10px">Cargando recepciones…</p></div>`;
    return;
  }
  const now=lastLoad?new Date(lastLoad).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'—';
  app.innerHTML=`
    <div class="app-hdr">
      <span style="font-size:22px">🚧</span>
      <h1>RF MKT · Garita</h1>
      <span class="garita-badge">Control de llegadas</span>
      <span class="user">${esc(me?.name||me?.username||'')}</span>
    </div>
    <div class="refresh-bar">
      <span class="refresh-meta">Actualizado ${now} · ${lineas.length} recepción${lineas.length!==1?'es':''} programadas</span>
      <button class="btn btn-secondary btn-sm" id="btnRef">🔄 Actualizar</button>
    </div>
    <div id="ac"></div>
    ${searchHTML()}
    ${calHTML()}`;
  document.getElementById('btnRef')?.addEventListener('click', loadData);
  bindSearch();
  buildProviderList();
  bindCal();
}

function renderLogin(app){
  app.innerHTML=`<div class="login-wrap"><div class="login-card">
    <div style="font-size:40px;margin-bottom:10px">🚧</div>
    <h2>RF MKT · Garita</h2>
    <p style="color:var(--fg-muted);font-size:13px;margin:0 0 20px">Calendario de recepciones · Control de llegadas</p>
    <button class="btn btn-primary" style="width:100%;justify-content:center" id="btnLogin">Iniciar sesión con Microsoft</button>
  </div></div>`;
  document.getElementById('btnLogin')?.addEventListener('click', login);
}

/* ── DATA ────────────────────────────────────────────────────────────────── */
async function loadData(){
  busy=true; render();
  try{
    const items=await gAll(`${BASE}/sites/${SITE}/lists/MKT_Lineas/items?$expand=fields&$top=500`);
    const all=items.map(i=>({id:i.id,...i.fields}));
    lineas=all.filter(l=>l.EstadoLinea==='Aprobada'||l.EstadoLinea==='Reprogramada');
    lastLoad=new Date().toISOString();
  } catch(e){
    console.warn('[DATA]',e.message);
    const ac=document.getElementById('ac');
    if(ac) ac.innerHTML=`<div class="alert a-err">Error al cargar datos: ${esc(e.message)}</div>`;
  }
  busy=false; render();
}

/* ── BOOT ────────────────────────────────────────────────────────────────── */
(function bootMsal(){
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js';
  s.onload=function(){
    msalApp=new msal.PublicClientApplication(MSAL_CFG);
    msalApp.handleRedirectPromise().then(function(res){
      if(res&&res.account){ me=res.account; msalApp.setActiveAccount(me); loadData(); }
      else{
        const all=msalApp.getAllAccounts();
        if(all.length>0){ me=all[0]; msalApp.setActiveAccount(me); loadData(); }
        else{ render(); }
      }
    }).catch(function(e){ console.error('[MSAL]',e); render(); });
  };
  s.onerror=function(){
    document.getElementById('app').innerHTML=
      '<div class="login-wrap"><div class="login-card"><p style="color:var(--err)">No se pudo cargar la librería de autenticación.</p></div></div>';
  };
  document.head.appendChild(s);
})();
</script>
