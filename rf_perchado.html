<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RF Perchado — Inverneg</title>
<style>
/* ── Tokens — coherente con RF Recepción ─────────────────────── */
:root{
  --bg:#0D1117;--sur:#161B22;--sur2:#1C2330;--bor:#2A3340;
  --txt:#E6EDF3;--mut:#7D8590;
  --acc:#58A6FF;--ok:#3FB950;--warn:#E3B341;--dan:#F85149;--rec:#F0883E;
  /* Nuevos para Perchado */
  --perc:#A78BFA;       /* violeta — distingue Perchado de Recepción */
  --sep:#34D399;        /* verde esmeralda — Separación */
  --sep-warn:#FCD34D;   /* amarillo — advertencia separación pendiente */
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ── Header ────────────────────────────────────────────────── */
.hdr{
  background:var(--sur);border-bottom:1px solid var(--bor);
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.hdr-brand{font-size:13px;font-weight:700;color:var(--perc);letter-spacing:.06em}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.hdr-back{
  font-size:12px;color:var(--mut);cursor:pointer;
  display:flex;align-items:center;gap:4px;
}
.hdr-back:hover{color:var(--txt)}

/* ── Pantalla principal ────────────────────────────────────── */
#screen{padding:14px 16px;max-width:480px;margin:0 auto}
.loading{text-align:center;padding:48px 16px;color:var(--mut);font-size:13px}
.loading-icon{font-size:28px;margin-bottom:10px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Tipografía y layout base ──────────────────────────────── */
.lbl{font-size:11px;color:var(--mut);letter-spacing:.04em;margin-bottom:4px;margin-top:10px}
.inp{
  width:100%;background:var(--sur2);border:1px solid var(--bor);
  color:var(--txt);font-size:16px;padding:10px 12px;border-radius:7px;
  outline:none;font-family:inherit;
}
.inp:focus{border-color:var(--acc)}
.inp-xl{font-size:22px;font-weight:700;text-align:center;letter-spacing:.04em;text-transform:uppercase}

/* ── Botones ───────────────────────────────────────────────── */
.btn{
  border:none;border-radius:8px;padding:12px 18px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  width:100%;margin-top:8px;transition:opacity .15s;
}
.btn:active{opacity:.75}
.btn-perc{background:var(--perc);color:#000}
.btn-sep{background:var(--sep);color:#000}
.btn-ok{background:var(--ok);color:#000}
.btn-sec{background:var(--sur2);color:var(--txt);border:1px solid var(--bor)}
.btn-warn{background:var(--warn);color:#000}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{margin-top:0}

/* ── Cards de selección ────────────────────────────────────── */
.mode-card{
  background:var(--sur2);border:1px solid var(--bor);
  border-radius:10px;padding:18px;
  cursor:pointer;transition:border-color .15s,background .15s;
  display:flex;align-items:center;gap:14px;
  margin-bottom:8px;
}
.mode-card:hover{background:#232b38;border-color:var(--bor)}
.mode-card.perc{border-left:3px solid var(--perc)}
.mode-card.sep{border-left:3px solid var(--sep)}
.mode-icon{font-size:26px;flex-shrink:0}
.mode-title{font-size:15px;font-weight:700;margin-bottom:3px}
.mode-sub{font-size:11px;color:var(--mut)}

/* ── Cards de ítem (LPN / SKU) ─────────────────────────────── */
.item-card{
  background:var(--sur2);border:1px solid var(--bor);border-radius:8px;
  padding:12px 14px;margin-bottom:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  transition:border-color .15s;
}
.item-card:hover,.item-card:active{border-color:var(--perc)}
.item-card.selected{border-color:var(--perc);background:#1d1e30}
.item-main{font-size:14px;font-weight:700;color:var(--acc);margin-bottom:2px}
.item-sub{font-size:11px;color:var(--mut)}
.item-qty{text-align:right;flex-shrink:0}
.item-qty-num{font-size:20px;font-weight:700;color:var(--txt)}
.item-qty-lbl{font-size:10px;color:var(--mut)}

/* ── Badge contextual ──────────────────────────────────────── */
.badge{
  display:inline-block;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:700;margin-bottom:10px;
}
.badge-perc{background:rgba(167,139,250,.15);color:var(--perc);border:1px solid rgba(167,139,250,.3)}
.badge-sep{background:rgba(52,211,153,.12);color:var(--sep);border:1px solid rgba(52,211,153,.25)}
.badge-pedido{background:rgba(88,166,255,.12);color:var(--acc);border:1px solid rgba(88,166,255,.25)}

/* ── Advertencia separación pendiente ─────────────────────── */
.sep-warn-box{
  background:rgba(252,211,77,.08);
  border:1px solid rgba(252,211,77,.3);
  border-radius:8px;padding:10px 12px;margin:8px 0;
}
.sep-warn-title{font-size:12px;font-weight:700;color:var(--sep-warn);margin-bottom:6px}
.sep-warn-row{display:flex;justify-content:space-between;font-size:11px;color:var(--txt);padding:2px 0}
.sep-warn-total{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--sep-warn);padding-top:6px;margin-top:4px;border-top:1px solid rgba(252,211,77,.2)}

/* ── Panel de saldo ────────────────────────────────────────── */
.saldo-panel{
  background:var(--sur);border:1px solid var(--bor);
  border-radius:8px;padding:12px 14px;margin-bottom:10px;
}
.saldo-sku{font-size:15px;font-weight:700;color:var(--acc);margin-bottom:2px}
.saldo-desc{font-size:11px;color:var(--mut);margin-bottom:10px}
.saldo-row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.saldo-row-lbl{font-size:11px;color:var(--mut)}
.saldo-row-val{font-size:14px;font-weight:700}
.saldo-disponible{font-size:24px;font-weight:700;color:var(--ok);margin-top:4px}
.saldo-div{border-top:1px solid var(--bor);margin:8px 0}

/* ── Input cantidad grande (Zebra) ─────────────────────────── */
.qty-wrap{margin:10px 0}
.qty-lbl{font-size:11px;color:var(--mut);margin-bottom:5px}
.qty-input{
  width:100%;background:var(--sur);border:2px solid var(--bor);
  color:var(--txt);font-size:36px;font-weight:700;
  text-align:center;padding:14px;border-radius:10px;
  outline:none;font-family:inherit;
}
.qty-input:focus{border-color:var(--perc)}
.qty-input.mode-sep:focus{border-color:var(--sep)}

/* ── Destino / empresa ─────────────────────────────────────── */
.dest-panel{
  background:var(--sur2);border:1px solid var(--bor);
  border-radius:8px;padding:12px 14px;margin-top:6px;
}
.dest-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.dest-lbl{font-size:11px;color:var(--mut)}
.dest-val{font-size:12px;font-weight:700;color:var(--txt)}
.dest-auto{font-size:10px;color:var(--mut);font-style:italic}

/* ── Empresa chips ──────────────────────────────────────────── */
.empresa-row{display:flex;gap:8px;margin-top:6px}
.empresa-chip{
  flex:1;padding:10px;border-radius:7px;text-align:center;
  font-size:14px;font-weight:700;cursor:pointer;
  border:2px solid var(--bor);background:var(--sur2);color:var(--mut);
  transition:all .15s;
}
.empresa-chip.active{border-color:var(--perc);color:var(--perc);background:rgba(167,139,250,.1)}

/* ── Resumen de movimiento ──────────────────────────────────── */
.resumen-box{
  background:var(--sur);border:1px solid var(--bor);
  border-radius:10px;padding:14px;margin:10px 0;
}
.resumen-titulo{font-size:12px;color:var(--mut);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.resumen-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bor);font-size:12px}
.resumen-row:last-child{border-bottom:none;padding-top:8px;font-size:14px;font-weight:700}
.resumen-lbl{color:var(--mut)}
.resumen-val{font-weight:600}

/* ── Estado vacío ───────────────────────────────────────────── */
.empty-state{
  text-align:center;padding:32px 16px;color:var(--mut);font-size:13px;
  border:1px dashed var(--bor);border-radius:8px;margin-top:8px;
}
.empty-icon{font-size:28px;margin-bottom:8px}

/* ── Toast ──────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  background:var(--sur2);color:var(--txt);border:1px solid var(--bor);
  padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;
  white-space:nowrap;max-width:90vw;
}
#toast.show{opacity:1}

/* ── Footer ─────────────────────────────────────────────────── */
.ftr{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--sur);border-top:1px solid var(--bor);
  padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));
  font-size:11px;color:var(--mut);display:flex;justify-content:space-between;
}
.ftr-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:4px}

/* Chips de selección de operador */
.op-grid{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.op-chip{background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:14px 16px;cursor:pointer;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.op-chip:hover,.op-chip:active{border-color:var(--perc);background:#1d1e30}
.op-avatar{width:32px;height:32px;border-radius:50%;background:var(--perc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000;flex-shrink:0}
.op-banner{background:rgba(167,139,250,.1);border-bottom:1px solid rgba(167,139,250,.2);padding:5px 16px;font-size:11px;color:var(--perc);font-weight:600;display:flex;align-items:center;gap:6px}
.mov-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bor);font-size:12px}
.mov-hora{width:44px;color:var(--mut);flex-shrink:0;font-size:11px}
.mov-sku{flex:1;font-weight:700;color:var(--acc)}
.mov-cant{width:60px;text-align:right;font-weight:700}
.mov-dest{width:90px;text-align:right;font-size:10px;color:var(--mut)}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center;gap:12px">
    <div id="btn-atras" onclick="goBack()" style="display:none;cursor:pointer;font-size:13px;color:var(--mut);padding:4px 8px;border:1px solid var(--bor);border-radius:6px">← Atrás</div>
    <div>
      <div class="hdr-brand">▸ RF PERCHADO</div>
      <div class="hdr-sub">Inverneg · CND</div>
    </div>
  </div>
  <div onclick="showMenuPrincipal()" style="cursor:pointer;font-size:13px;color:var(--mut);padding:4px 8px;border:1px solid var(--bor);border-radius:6px">🏠 Inicio</div>
</div>

<div id="op-banner" style="display:none" class="op-banner">
  <span>👤</span><span id="op-banner-txt">—</span>
</div>
<div id="screen">
  <div class="loading">
    <div class="loading-icon">⏳</div>
    <div>Iniciando sesión Microsoft...</div>
  </div>
</div>

<div id="toast"></div>
<div class="ftr">
  <span><span class="ftr-dot"></span><span id="ftr-status">CONECTANDO</span></span>
  <span id="ftr-user">—</span>
</div>

<script>
(function(){
'use strict';

/* ── CFG ──────────────────────────────────────────────────────── */
var CFG={
  clientId:   'ec976114-e146-4ce4-850c-5d978e12acfd',
  tenantId:   '5e008bd3-17b6-4f83-8d23-019691a40609',
  siteId:     'inverneg.sharepoint.com,8b946a6c-31b9-4bf7-95d0-ab47d29a4d63,ad88c61f-b207-49a4-9105-8b3b57b31906',
  perchadoNombre:'Inverneg_PerchadoRF.xlsx',
  recepcionNombre:'Inverneg_ConteoRF_Base_Live.xlsx',
  listas:{
    recepciones:'RF_PRecepciones_LRecepciones',
    movimientos:'RF_PRecepciones_LMovimientos',
  },
  empresas:{
    'INV':{almacenOrigen:'CND2-IMPO', ubicOrigen:'N1-IMPO', label:'INV — Inverneg'},
    'ECM':{almacenOrigen:'ECO3-IMPO', ubicOrigen:'E3-IMPO', label:'ECM — Economisa'},
  },
};
var GRAPH='https://graph.microsoft.com/v1.0';
var SCOPES=['Files.ReadWrite','Sites.ReadWrite.All'];
var msalInst,msalAcc;

/* ── Estado de sesión ────────────────────────────────────────── */
var S={
  pedido:'',
  operador:'',       // operador seleccionado en pantalla de selección
  modo:'',           // PERCHADO | SEPARACION
  subModo:'',        // por-sku | por-lpn
  empresa:'INV',
  skuActual:null,    // {sku, desc, factor}
  lpnActual:'',
  cantActual:0,
  almacenDest:'',
  ubicDest:'',
  destinoSep:'',
  historial:[],      // breadcrumb para goBack()
};

/* ── DB catálogos ────────────────────────────────────────────── */
var DB={
  pedidos:[],
  operadores:[],           // hoja Operadores del Excel perchado
  ubicaciones:[],          // hoja Ubicaciones del Excel perchado
  destinosSep:[],          // hoja DestinosSeparacion
  separacionPendiente:[],  // hoja Separacion (solicitudes analistas)
  codigosBarra:[],         // hoja C.Barra del Excel recepcion
  perchadoDriveId:null,perchadoItemId:null,
  recepDriveId:null,recepItemId:null,
  listIds:{recepciones:null,movimientos:null},
};

/* ── Utils ───────────────────────────────────────────────────── */
function normStr(s){return s?s.toString().trim().toUpperCase():'';}
function pad(n){return String(n).padStart(2,'0');}
function ahora(){
  var d=new Date();
  return{
    fecha:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
    hora:pad(d.getHours())+':'+pad(d.getMinutes()),
    ts:d.toISOString(),
  };
}
function $r(id){return document.getElementById(id);}
function render(html){$r('screen').innerHTML=html;}
function toast(msg,ms){
  var t=$r('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},ms||2000);
}
function setStatus(s,ok){
  $r('ftr-status').textContent=s;
  $r('ftr-status').previousSibling.style.background=ok?'var(--ok)':'var(--warn)';
}

/* ── Breadcrumb ──────────────────────────────────────────────── */
function pushScreen(id,fn){
  var pos=-1;
  for(var i=0;i<S.historial.length;i++){if(S.historial[i].id===id){pos=i;break;}}
  if(pos>=0) S.historial=S.historial.slice(0,pos);
  S.historial.push({id:id,fn:fn});
  actualizarBack();
}
function goBack(){
  if(S.historial.length<=1){showMenuPrincipal();return;}
  S.historial.pop();
  var prev=S.historial[S.historial.length-1];
  if(prev&&prev.fn) prev.fn();
  else showMenuPrincipal();
  actualizarBack();
}
function actualizarBack(){
  var btn=$r('btn-atras');
  if(btn) btn.style.display=S.historial.length>1?'block':'none';
}

/* ── GRAPH helpers ───────────────────────────────────────────── */
function getToken(){
  return msalInst.acquireTokenSilent({scopes:SCOPES,account:msalAcc})
    .catch(function(){return msalInst.acquireTokenRedirect({scopes:SCOPES});});
}
function gGet(url){
  return getToken().then(function(r){
    return fetch(url,{headers:{'Authorization':'Bearer '+r.accessToken}});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+':'+t.slice(0,100));});
    return r.json();
  });
}
function gPost(url,body){
  return getToken().then(function(r){
    return fetch(url,{method:'POST',
      headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'},
      body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+':'+t.slice(0,120));});
    return r.json();
  });
}
function urlWB(driveId,itemId,hoja){
  return GRAPH+'/drives/'+driveId+'/items/'+itemId+
    "/workbook/worksheets('"+hoja+"')/usedRange";
}
function urlLista(id){return GRAPH+'/sites/'+CFG.siteId+'/lists/'+id;}

/* ── Descubrimiento de archivos y listas ─────────────────────── */
function descubrirExcel(nombre){
  var url=GRAPH+'/sites/'+CFG.siteId+'/drive/root/search(q=\''+encodeURIComponent(nombre)+'\')';
  return gGet(url).then(function(d){
    var f=d.value&&d.value.find(function(x){return x.name===nombre;});
    if(!f) throw new Error('Archivo no encontrado: '+nombre);
    return{driveId:f.parentReference&&f.parentReference.driveId,itemId:f.id};
  });
}
function descubrirListas(){
  return gGet(GRAPH+'/sites/'+CFG.siteId+'/lists?$select=id,displayName&$top=200')
    .then(function(d){
      (d.value||[]).forEach(function(l){
        Object.keys(CFG.listas).forEach(function(k){
          if(l.displayName===CFG.listas[k]) DB.listIds[k]=l.id;
        });
      });
    });
}

/* ── Parsers Excel ───────────────────────────────────────────── */
function parsearHoja(values,mapFn){
  if(!values||values.length<2) return[];
  var hdr=values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  return values.slice(1).filter(function(r){return r.some(function(c){return c!==null&&c!=='';})}).map(function(r){return mapFn(hdr,r);});
}
function idx(hdr,names){
  for(var i=0;i<names.length;i++){var j=hdr.indexOf(names[i]);if(j>=0)return j;}return -1;
}
function parsearUbicaciones(d){
  if(!d||!d.values||d.values.length<2){
    console.warn('[UBIC-PARSE] Hoja vacía o sin datos');
    DB.ubicaciones=[];return;
  }
  // Log encabezados raw para detectar nombres de columna
  var hdrRaw=d.values[0];
  console.log('[UBIC-PARSE] Encabezados raw:',hdrRaw.map(function(v,i){return i+'="'+v+'"'}).join(' | '));
  var hdr=hdrRaw.map(function(v){return(v||'').toString().trim().toLowerCase();});
  var iEmp=idx(hdr,['empresa']);
  var iAlm=idx(hdr,['almacen','almacén']);
  var iUbic=idx(hdr,['ubicacion','ubicación']);
  var iTipo=idx(hdr,['tipo']);
  console.log('[UBIC-PARSE] Índices → empresa:'+iEmp+' almacen:'+iAlm+' ubicacion:'+iUbic+' tipo:'+iTipo);
  // Log primer registro raw para ver valores reales
  if(d.values.length>1){
    var r1=d.values[1];
    console.log('[UBIC-PARSE] Primer registro raw:',r1.map(function(v,i){return i+'="'+v+'"'}).join(' | '));
    console.log('[UBIC-PARSE] Primer registro parseado:',
      '{Empresa:"'+r1[iEmp]+'"|normEmpresa:"'+normStr(r1[iEmp]||'')+'"|Almacen:"'+r1[iAlm]+'"|Ubicacion:"'+r1[iUbic]+'"|Tipo:"'+r1[iTipo]+'"}');
  }
  DB.ubicaciones=parsearHoja(d.values,function(h,r){
    var emp=(r[iEmp]||'').toString().trim();
    var alm=(r[iAlm]||'').toString().trim();
    var ubic=(r[iUbic]||'').toString().trim();
    var tipo=(r[iTipo]||'').toString().trim();
    return{empresa:emp,almacen:alm,ubicacion:ubic,tipo:tipo};
  });
  // Log resumen por empresa
  var porEmp={};
  DB.ubicaciones.forEach(function(u){
    var k='"'+u.empresa+'"(norm:"'+normStr(u.empresa)+'")';
    porEmp[k]=(porEmp[k]||0)+1;
  });
  console.log('[UBIC-PARSE] Registros por empresa:',JSON.stringify(porEmp));
  console.log('[UBIC-PARSE] Total cargadas:',DB.ubicaciones.length);
}
function parsearDestinos(d){
  DB.destinosSep=parsearHoja(d.values,function(h,r){
    return{destino:r[idx(h,['destino'])]||'',almacen:r[idx(h,['almacen'])]||'',ubicacion:r[idx(h,['ubicacion'])]||''};
  });
}
function parsearOperadores(d){
  if(!d||!d.values||d.values.length<2){DB.operadores=[];return;}
  // Hoja con una columna: Operadores
  var hdr=d.values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  var iOp=idx(hdr,['operadores','operador','nombre','name']);
  if(iOp<0) iOp=0; // fallback primera columna
  DB.operadores=d.values.slice(1)
    .map(function(r){return(r[iOp]||'').toString().trim();})
    .filter(function(v){return v.length>0;})
    .sort();
  console.log('[OPS] Operadores cargados:',DB.operadores.length,'→',DB.operadores.join(', '));
}
function parsearSeparacion(d){
  DB.separacionPendiente=parsearHoja(d.values,function(h,r){
    return{pedido:r[idx(h,['pedido'])]||'',sku:r[idx(h,['sku'])]||'',cantidad:Number(r[idx(h,['cantidad'])])||0,fecha:r[idx(h,['fecha'])]||'',destino:r[idx(h,['destino'])]||''};
  });
}
function parsearCBarra(d){
  if(!d||!d.values||d.values.length<2) return;
  var hdr=d.values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  var iS=hdr.findIndex(function(h){return h==='sku'||h.indexOf('codigo')>-1||h==='cod';});
  if(iS<0) iS=0;
  var iD=hdr.findIndex(function(h){return h.indexOf('desc')>-1;});
  d.values.slice(1).forEach(function(r){
    if(!r[iS]) return;
    var sku=r[iS].toString().trim();
    if(!DB.codigosBarra.find(function(x){return x.sku===sku;}))
      DB.codigosBarra.push({sku:sku,desc:iD>=0&&r[iD]?r[iD].toString().trim():''});
  });
}

/* ── Cálculo de saldo ────────────────────────────────────────── */
function calcularSaldos(recepciones,movimientos,logSKU){
  // Retorna Map de "LPN|SKU" → {lpn,sku,desc,recibido,movido,saldo,created}
  // logSKU: si se pasa, loguea detalle para ese SKU específico
  var mapa={};

  // Normalizar LPN a string siempre — evita que número 1 ≠ string "1"
  function normLPN(v){ return v!==null&&v!==undefined&&v!==''?String(v).trim():'(sin LPN)'; }

  // Sumar recibido OK (correcciones participan como negativos, dañado excluido)
  recepciones.forEach(function(r){
    if(normStr(r.Estado||'')==='DAÑADO') return;
    var lpn=normLPN(r.LPN);
    var sku=(r.CodProducto||'').toString().trim();
    var k=lpn+'|'+sku;
    if(!mapa[k]) mapa[k]={lpn:lpn,sku:sku,desc:r.Nombre||'',recibido:0,movido:0,saldo:0,created:r.Created||''};
    mapa[k].recibido+=Number(r.Cantidad)||0;
  });

  // Log recepciones agrupadas para el SKU de diagnóstico
  if(logSKU){
    var recSKU=Object.keys(mapa).filter(function(k){return normStr(mapa[k].sku)===normStr(logSKU);});
    console.log('[SKU-SALDO] === Recepciones por LPN para SKU='+logSKU+' ===');
    recSKU.forEach(function(k){
      console.log('[SKU-SALDO] LPN="'+mapa[k].lpn+'" recibido='+mapa[k].recibido);
    });
  }

  // Restar movimientos ejecutados (Perchado + Separación)
  movimientos.forEach(function(m){
    var lpn=normLPN(m.LPN);
    var sku=(m.SKU||'').toString().trim();
    var k=lpn+'|'+sku;
    if(logSKU&&normStr(sku)===normStr(logSKU)){
      console.log('[SKU-SALDO] Movimiento: LPN="'+lpn+'" tipo='+m.TipoMovimiento+' cant='+m.Cantidad+
        ' clave_existe='+(!!mapa[k]));
    }
    if(!mapa[k]){
      if(logSKU&&normStr(sku)===normStr(logSKU))
        console.warn('[SKU-SALDO] DESCUENTO PERDIDO — clave "'+k+'" no existe en mapa de recepciones');
      return;
    }
    mapa[k].movido+=Number(m.Cantidad)||0;
  });

  // Calcular saldo y log final
  Object.keys(mapa).forEach(function(k){
    mapa[k].saldo=mapa[k].recibido-mapa[k].movido;
  });

  if(logSKU){
    var resSKU=Object.keys(mapa).filter(function(k){return normStr(mapa[k].sku)===normStr(logSKU);});
    console.log('[SKU-SALDO] === Saldo final por LPN para SKU='+logSKU+' ===');
    resSKU.forEach(function(k){
      var e=mapa[k];
      console.log('[SKU-SALDO] LPN="'+e.lpn+'" recibido='+e.recibido+' movido='+e.movido+' saldo='+e.saldo);
    });
    var totalSaldo=resSKU.reduce(function(a,k){return a+mapa[k].saldo;},0);
    console.log('[SKU-SALDO] Total saldo '+logSKU+':',totalSaldo);
  }

  return mapa;
}

/* ── Separación pendiente para un SKU ───────────────────────── */
function sepPendienteSKU(pedido,sku){
  // Lo que está en la hoja Separacion (solicitud) menos lo ya ejecutado (TipoMov=SEPARACION)
  var reqs=DB.separacionPendiente.filter(function(r){
    return normStr(r.pedido)===normStr(pedido)&&normStr(r.sku)===normStr(sku);
  });
  if(!reqs.length) return null;
  // Consolidar por destino
  var porDest={};
  reqs.forEach(function(r){
    var k=r.destino||'Sin destino';
    porDest[k]=(porDest[k]||0)+r.cantidad;
  });
  return porDest;
}

function renderSepWarn(pedido,sku){
  var pd=sepPendienteSKU(pedido,sku);
  if(!pd) return '';
  var total=Object.values(pd).reduce(function(a,v){return a+v;},0);
  if(total<=0) return '';
  var rows=Object.keys(pd).map(function(d){
    return '<div class="sep-warn-row"><span>'+d+'</span><span>'+pd[d]+' un</span></div>';
  }).join('');
  return '<div class="sep-warn-box">'+
    '<div class="sep-warn-title">⚠ Separación pendiente</div>'+
    rows+
    '<div class="sep-warn-total"><span>Total pendiente</span><span>'+total+' un</span></div>'+
    '<div style="font-size:10px;color:var(--mut);margin-top:4px">Solo informativo — no afecta el saldo disponible</div>'+
  '</div>';
}

function buscarLPN(){
  var lpn=($r('inp-lpn').value||'').trim();
  if(!lpn){toast('Ingresa un LPN');return;}
  S.lpnActual=lpn;
  render('<div class="loading"><div class="loading-icon">⏳</div><div>Cargando SKUs del pallet...</div></div>');
  Promise.all([
    cargarRecepcionesPedido(S.pedido),
    cargarMovimientosPedido(S.pedido),
  ]).then(function(res){
    // Para loguear: detectar qué SKU tiene movimientos en este LPN
    var saldosPrev=calcularSaldos(res[0],[]);// solo recepciones para ver qué hay
    var skuDelLPN=Object.keys(saldosPrev).filter(function(k){
      return normStr(saldosPrev[k].lpn)===normStr(lpn);
    }).map(function(k){return saldosPrev[k].sku;});
    var logSKULPN=skuDelLPN[0]||null; // loguear el primer SKU del LPN
    var saldos=calcularSaldos(res[0],res[1],logSKULPN);
    // Log para diagnóstico: ver todos los LPN disponibles en el pedido
    var lpnsEnPedido=[...new Set(Object.keys(saldos).map(function(k){return saldos[k].lpn;}))];
    console.log('[LPN-BUSQ] Buscando LPN="'+lpn+'" norm="'+normStr(lpn)+'"');
    console.log('[LPN-BUSQ] LPNs en pedido ('+lpnsEnPedido.length+'):',
      lpnsEnPedido.map(function(l){return '"'+l+'"(norm:"'+normStr(l)+'")';}).join(' | '));

    var skus=Object.keys(saldos)
      .map(function(k){return saldos[k];})
      .filter(function(s){
        var match=normStr(s.lpn)===normStr(lpn);
        return match&&s.saldo>0;
      })
      .sort(function(a,b){return a.sku.localeCompare(b.sku);});

    console.log('[LPN-BUSQ] SKUs encontrados con saldo>0:',skus.length);
    if(skus.length>0){
      console.log('[LPN-BUSQ] Primer SKU:',JSON.stringify({sku:skus[0].sku,saldo:skus[0].saldo,lpn:skus[0].lpn}));
    } else {
      // Mostrar todos los saldos del pedido para ver qué hay
      var todos=Object.keys(saldos).map(function(k){return saldos[k];});
      console.log('[LPN-BUSQ] Saldos del pedido (primeros 5):',
        todos.slice(0,5).map(function(s){return 'LPN="'+s.lpn+'" SKU='+s.sku+' saldo='+s.saldo;}).join(' | '));
    }
    window._saldosCache=saldos;
    showListaSKUParaLPN(lpn,skus);
  });
}

      }
    });
  });

function _initBuscadorDrop(inpId,dropId,badgeId,opciones,onSelect){
  var inp=document.getElementById(inpId);
  var drop=document.getElementById(dropId);
  var badge=document.getElementById(badgeId);
  if(!inp||!drop) return;

  // Limpiar listeners anteriores clonando el nodo
  var nuevoInp=inp.cloneNode(true);
  inp.parentNode.replaceChild(nuevoInp,inp);
  inp=nuevoInp;

  function filtrar(){
    var q=(inp.value||'').trim().toUpperCase();
    drop.innerHTML='';
    var matches=opciones.filter(function(o){return !q||o.toUpperCase().indexOf(q)>=0;}).slice(0,30);
    if(!matches.length||!q){drop.style.display='none';return;}
    matches.forEach(function(o){
      var item=document.createElement('div');
      item.style.cssText='padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--bor);font-size:13px;font-weight:600';
      item.textContent=o;
      item.addEventListener('mouseover',function(){this.style.background='var(--bor)';});
      item.addEventListener('mouseout',function(){this.style.background='';});
      item.addEventListener('mousedown',function(e){
        e.preventDefault();
        inp.value=o;
        drop.style.display='none';
        if(badge){badge.textContent='✓ '+o;badge.style.display='block';}
        onSelect(o);
      });
      drop.appendChild(item);
    });
    drop.style.display='block';
  }

  inp.addEventListener('input',filtrar);
  inp.addEventListener('focus',filtrar);
  inp.addEventListener('blur',function(){setTimeout(function(){drop.style.display='none';},180);});
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      var q=(inp.value||'').trim().toUpperCase();
      var exacto=opciones.find(function(o){return o.toUpperCase()===q;});
      if(exacto){inp.value=exacto;drop.style.display='none';if(badge){badge.textContent='✓ '+exacto;badge.style.display='block';}onSelect(exacto);}
    }
  });
}

function showSeparacion(){
  pushScreen('separacion',showSeparacion);actualizarBack();
  S.empresa='INV'; // Separación siempre INV

  // Cargar tareas del pedido desde la hoja Separacion
  render('<div class="loading"><div class="loading-icon">⏳</div><div>Cargando tareas de separación...</div></div>');

  Promise.all([cargarRecepcionesPedido(S.pedido),cargarMovimientosPedido(S.pedido)]).then(function(res){
    var saldos=calcularSaldos(res[0],res[1]);

    // Consolidar tareas por Pedido+SKU+Destino
    var reqs=DB.separacionPendiente.filter(function(r){return normStr(r.pedido)===normStr(S.pedido);});
    var consolidado={};
    reqs.forEach(function(r){
      var k=normStr(r.sku)+'|'+(r.destino||'');
      if(!consolidado[k]) consolidado[k]={sku:r.sku,destino:r.destino,cantidad:0};
      consolidado[k].cantidad+=r.cantidad;
    });
    var tareas=Object.values(consolidado).sort(function(a,b){return a.sku.localeCompare(b.sku);});

    // Calcular saldo total por SKU (suma todos los LPN)
    var saldoXsku={};
    Object.keys(saldos).forEach(function(k){
      var s=saldos[k];
      if(!saldoXsku[normStr(s.sku)]) saldoXsku[normStr(s.sku)]=0;
      saldoXsku[normStr(s.sku)]+=s.saldo;
    });

    if(!tareas.length){
      render(
        '<div class="badge badge-sep">SEPARACIÓN — '+S.pedido+'</div>'+
        '<div class="empty-state" style="margin-top:14px">'+
          '<div class="empty-icon">✓</div>'+
          'No hay tareas de separación pendientes para este pedido'+
        '</div>'+
        '<button class="btn btn-sec" style="margin-top:12px" onclick="showMenuPrincipal()">⌂ Menú principal</button>'
      );
      return;
    }

    var h='<div class="badge badge-sep">SEPARACIÓN — '+S.pedido+'</div>'+
      '<div style="font-size:11px;color:var(--mut);margin:6px 0 10px">'+tareas.length+' tareas de separación • Empresa INV • Origen automático</div>';

    tareas.forEach(function(t,i){
      var dispTotal=saldoXsku[normStr(t.sku)]||0;
      var factible=dispTotal>=t.cantidad;
      var colorFact=factible?'var(--ok)':'var(--dan)';
      var destInfo=DB.destinosSep.find(function(d){return normStr(d.destino)===normStr(t.destino);});
      h+='<div style="background:var(--sur2);border:1px solid '+(factible?'var(--bor)':'var(--dan)')+';border-radius:8px;padding:12px 14px;margin-bottom:8px">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">'+
          '<div><div style="font-size:14px;font-weight:700;color:var(--acc)">'+t.sku+'</div>'+
          '<div style="font-size:11px;color:var(--mut)">Destino: '+t.destino+(destInfo?' → '+destInfo.almacen+'/'+destInfo.ubicacion:'')+'</div></div>'+
          '<div style="text-align:right">'+
            '<div style="font-size:18px;font-weight:700">'+t.cantidad+' un</div>'+
            '<div style="font-size:10px;color:'+colorFact+'">Disp: '+dispTotal+' un</div>'+
          '</div>'+
        '</div>'+
        (factible?
          '<button class="btn btn-sep" style="font-size:13px;padding:9px" onclick="ejecutarSeparacion('+i+',\''+t.sku+'\','+t.cantidad+',\''+t.destino+'\','+dispTotal+')">✓ Ejecutar separación</button>':
          '<div style="font-size:11px;color:var(--dan);padding:6px 0">⚠ Stock insuficiente — disponible: '+dispTotal+' un</div>'
        )+
      '</div>';
    });
    window._tareasActuales=tareas;
    render(h);
  });
}

function ejecutarSeparacion(idx,sku,cantReq,destino,saldoDisp){
  var destInfo=DB.destinosSep.find(function(d){return normStr(d.destino)===normStr(destino);});
  if(!destInfo){toast('Destino no encontrado en catálogo');return;}

  var origData=CFG.empresas['INV'];
  var t=ahora();
  render('<div class="loading"><div class="loading-icon">⏳</div><div>Procesando separación...</div></div>');

  // Re-calcular saldos para FIFO
  Promise.all([cargarRecepcionesPedido(S.pedido),cargarMovimientosPedido(S.pedido)]).then(function(res){
    var saldos=calcularSaldos(res[0],res[1]);

    // FIFO: LPN ordenados por fecha de recepción (campo Created de SP), fallback alfanumérico
    var lpnsDelSKU=Object.keys(saldos)
      .map(function(k){return saldos[k];})
      .filter(function(s){return normStr(s.sku)===normStr(sku)&&s.saldo>0;})
      .sort(function(a,b){
        if(a.created&&b.created) return new Date(a.created)-new Date(b.created);
        return a.lpn.localeCompare(b.lpn);
      });

    var pendiente=cantReq;
    var posts=[];

    for(var i=0;i<lpnsDelSKU.length&&pendiente>0;i++){
      var s=lpnsDelSKU[i];
      var tomar=Math.min(pendiente,s.saldo);
      var cb=DB.codigosBarra.find(function(x){return normStr(x.sku)===normStr(sku);});
      posts.push({fields:{
        Title:          S.pedido+'-SEP-'+t.ts.replace(/[:.]/g,'')+'-'+i,
        Pedido:         S.pedido,
        LPN:            s.lpn,
        SKU:            sku,
        Descripcion:    cb?cb.desc:'',
        Cantidad:       tomar,
        TipoMovimiento: 'SEPARACION',
        AlmacenOrigen:  origData.almacenOrigen,
        UbicacionOrigen:origData.ubicOrigen,
        AlmacenDestino: destInfo.almacen,
        UbicacionDestino:destInfo.ubicacion,
        DestinoSeparacion:destino,
        // Empresa no existe en SP
        Operador:       S.operador||msalAcc&&(msalAcc.username||msalAcc.name)||'',
        FechaMovimiento:t.ts,  // ISO completo con hora para trazabilidad
        Observacion:    '',
      }});
      pendiente-=tomar;
    }

    if(pendiente>0){
      toast('Stock insuficiente al validar. Disponible: '+(cantReq-pendiente)+' un');
      showSeparacion();
      return;
    }

    // Ejecutar todos los posts secuencialmente
    var chain=Promise.resolve();
    posts.forEach(function(p){
      chain=chain.then(function(){
        return gPost(urlLista(DB.listIds.movimientos)+'/items',p);
      });
    });
    chain.then(function(){
      var lineas=posts.map(function(p){
        return '• LPN '+p.fields.LPN+': '+p.fields.Cantidad+' un';
      }).join('\n');
      render(
        '<div style="text-align:center;padding:24px 0">'+
          '<div style="font-size:48px;margin-bottom:12px">✓</div>'+
          '<div style="font-size:18px;font-weight:700;color:var(--sep);margin-bottom:8px">Separación ejecutada</div>'+
          '<div style="font-size:13px;color:var(--txt);margin-bottom:4px">'+cantReq+' un de '+sku+' → '+destino+'</div>'+
          '<div style="font-size:11px;color:var(--mut);white-space:pre-line">'+lineas+'</div>'+
        '</div>'+
        '<div class="btn-row" style="flex-direction:column">'+
          '<button class="btn btn-sep" onclick="showSeparacion()">← Volver a tareas</button>'+
          '<button class="btn btn-sec" onclick="showMenuPrincipal()">⌂ Menú principal</button>'+
        '</div>'
      );
    }).catch(function(e){toast('Error: '+e.message.slice(0,60));showSeparacion();});
  });
}

// Devuelve el Tipo de una ubicación destino (PERCHADO, IMPO, DANA, OBSE, PEND)
// Si no se encuentra, devuelve 'PERCHADO' como fallback
function tipoUbicacion(almacen, ubicacion){
  var u=DB.ubicaciones.find(function(u){
    return normStr(u.almacen)===normStr(almacen)&&normStr(u.ubicacion)===normStr(ubicacion);
  });
  return u&&u.tipo?u.tipo.toString().trim().toUpperCase():'PERCHADO';
}

// Categoriza un movimiento en las 5 categorías del resumen
function categorizarMovimiento(mov){
  if(normStr(mov.TipoMovimiento||'')===normStr('SEPARACION')) return 'SEP';
  return tipoUbicacion(mov.AlmacenDestino||'', mov.UbicacionDestino||'');
}


// ── Calcular resumen de perchado para un pedido ───────────────────
function calcularResumenPerchado(recepciones, movimientos){
  // Recibido OK (correcciones participan, dañados excluidos)
  var recibidoOK=0;
  recepciones.forEach(function(r){
    if(normStr(r.Estado||'')!=='DAÑADO') recibidoOK+=Number(r.Cantidad)||0;
  });

  // Categorías del resumen
  var cats={PERCHADO:0,IMPO:0,DANA:0,OBSE:0,PEND:0,SEP:0};

  // Detalle por destino: {almacen+'/'+ubicacion → {almacen,ubicacion,tipo,cantidad}}
  var detalle={};

  movimientos.forEach(function(m){
    var cant=Number(m.Cantidad)||0;
    var cat=categorizarMovimiento(m);
    if(cats.hasOwnProperty(cat)) cats[cat]+=cant;
    else cats['PERCHADO']+=cant; // fallback

    // Acumular detalle por destino
    var alm=m.AlmacenDestino||'';
    var ubic=m.UbicacionDestino||'';
    var key=normStr(alm)+'|'+normStr(ubic);
    if(!detalle[key]) detalle[key]={almacen:alm,ubicacion:ubic,tipo:cat,cantidad:0};
    detalle[key].cantidad+=cant;
  });

  var totalMovido=cats.PERCHADO+cats.IMPO+cats.DANA+cats.OBSE+cats.PEND+cats.SEP;
  var saldo=recibidoOK-totalMovido;
  var pct=recibidoOK>0?Math.round(totalMovido/recibidoOK*100):0;

  return{
    recibidoOK:recibidoOK,
    perchado:cats.PERCHADO,
    impo:cats.IMPO,
    dana:cats.DANA,
    obse:cats.OBSE,
    pend:cats.PEND,
    sep:cats.SEP,
    totalMovido:totalMovido,
    saldo:saldo,
    pct:pct,
    finalizado:saldo<=0,
    detalle:Object.values(detalle).sort(function(a,b){return b.cantidad-a.cantidad;}),
  };
}

              '<div>'+
                '<div style="font-size:13px;font-weight:700">'+d.almacen+'</div>'+
                '<div style="font-size:11px;color:var(--mut)">'+d.ubicacion+'</div>'+
                '<div style="font-size:10px;color:'+color+';margin-top:2px">'+d.tipo+'</div>'+
              '</div>'+
              '<div style="text-align:right">'+
                '<div style="font-size:18px;font-weight:700">'+d.cantidad.toLocaleString()+'</div>'+
                '<div style="font-size:10px;color:var(--mut)">'+pctD+'% del total</div>'+
              '</div>'+
            '</div>'+
            '<div style="height:3px;background:var(--bor);border-radius:2px;margin-top:8px">'+
              '<div style="height:100%;width:'+Math.min(pctD,100)+'%;background:'+color+';border-radius:2px"></div>'+
            '</div>'+
          '</div>';
        }).join('')+
      '</div>'
    :'<div class="empty-state"><div class="empty-icon">📊</div>Sin movimientos registrados aún</div>')+

    '<button class="btn btn-sec" style="margin-top:10px" onclick="showMenuPrincipal()">⌂ Menú principal</button>';

  render(h);
}


// ── Pantalla: Vista Operativa del Pedido ─────────────────────────
function showVistaOperativa(){
  pushScreen('vista-op',showVistaOperativa);actualizarBack();
  render('<div class="loading"><div class="loading-icon">⏳</div><div>Cargando movimientos...</div></div>');
  Promise.all([
    cargarRecepcionesPedido(S.pedido),
    cargarMovimientosPedido(S.pedido),
  ]).then(function(res){
    var movs=res[1];
    console.log('[VISTA-OP] Pedido='+S.pedido+' movimientos encontrados:',movs.length);
    if(movs.length>0){
      console.log('[VISTA-OP] Primer mov raw:',JSON.stringify({
        SKU:movs[0].SKU, Cantidad:movs[0].Cantidad,
        FechaMovimiento:movs[0].FechaMovimiento,
        AlmacenDestino:movs[0].AlmacenDestino,
        Created:movs[0].Created,
        Pedido:movs[0].Pedido,
      }));
    }
    // Ordenar por Created de SP (timestamp exacto) o FechaMovimiento ISO
    movs.sort(function(a,b){
      var ta=a.Created||a.FechaMovimiento||'';
      var tb=b.Created||b.FechaMovimiento||'';
      return ta.localeCompare(tb);
    });
    var resumen=calcularResumenPerchado(res[0],res[1]);

    var h='<div class="badge badge-perc">VISTA OPERATIVA</div>'+
      '<div class="badge badge-pedido" style="margin-left:6px">'+S.pedido+'</div>';

    // Minibarra de progreso
    var col=resumen.finalizado?'var(--ok)':'var(--perc)';
    h+='<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px">'+
      '<span style="font-size:11px;color:var(--mut)">Avance del pedido</span>'+
      '<span style="font-size:14px;font-weight:700;color:'+col+'">'+resumen.pct+'%</span>'+
    '</div>'+
    '<div style="height:5px;background:var(--sur2);border-radius:3px;margin-bottom:12px">'+
      '<div style="height:100%;width:'+Math.min(resumen.pct,100)+'%;background:'+col+';border-radius:3px"></div>'+
    '</div>';

    // Tabla de movimientos
    h+='<div class="card-title" style="font-size:11px;color:var(--mut);letter-spacing:.05em;margin-bottom:6px">MOVIMIENTOS REGISTRADOS</div>';
    if(!movs.length){
      h+='<div class="empty-state"><div class="empty-icon">📋</div>Sin movimientos aún</div>';
    } else {
      h+='<div style="display:flex;gap:0;padding:4px 0;border-bottom:2px solid var(--bor);font-size:10px;color:var(--mut);font-weight:700">'+
        '<span style="width:44px">HORA</span>'+
        '<span style="flex:1">SKU</span>'+
        '<span style="width:60px;text-align:right">CANT</span>'+
        '<span style="width:90px;text-align:right">DESTINO</span>'+
      '</div>';
      // Mostrar hasta los últimos 50 movimientos, más recientes abajo
      movs.slice(-50).forEach(function(m){
        // FechaMovimiento puede ser ISO "2026-09-28T14:32:00Z" o solo fecha "2026-09-28"
        var _fm=m.FechaMovimiento||m.Created||'';
        var hora='—';
        if(_fm.length>=16){
          // Convertir UTC a local para mostrar hora correcta
          try{
            var _dt=new Date(_fm);
            if(!isNaN(_dt)){
              hora=pad(_dt.getHours())+':'+pad(_dt.getMinutes());
            }
          }catch(e){ hora=_fm.slice(11,16)||'—'; }
        }
        var tipoCols={'PERCHADO':'var(--ok)','SEPARACION':'var(--sep)','DANA':'var(--dan)','OBSE':'var(--warn)','PEND':'var(--warn)'};
        var tipo=categorizarMovimiento(m);
        var color=tipoCols[tipo]||'var(--txt)';
        h+='<div class="mov-row">'+
          '<span class="mov-hora">'+hora+'</span>'+
          '<span class="mov-sku" style="color:'+color+'">'+
            (m.SKU||'—')+
            '<div style="font-size:9px;color:var(--mut);font-weight:400">'+m.TipoMovimiento+'</div>'+
          '</span>'+
          '<span class="mov-cant">'+Number(m.Cantidad||0).toLocaleString()+'</span>'+
          '<span class="mov-dest">'+(m.AlmacenDestino||'—')+'</span>'+
        '</div>';
      });
      if(movs.length>50){
        h+='<div style="font-size:10px;color:var(--mut);padding:6px 0;text-align:center">... +'+(movs.length-50)+' movimientos anteriores</div>';
      }
    }

    // Totales
    h+='<div style="background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:12px 14px;margin-top:12px">'+
      '<div style="font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.05em;margin-bottom:8px">TOTALES DEL PEDIDO</div>';
    function filaT(lbl,val,color){
      if(!val) return '';
      return '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bor);font-size:12px">'+
        '<span style="color:var(--mut)">'+lbl+'</span>'+
        '<span style="font-weight:700;color:'+(color||'var(--txt)')+'">'+val.toLocaleString()+' un</span>'+
      '</div>';
    }
    h+=filaT('Recibido OK',resumen.recibidoOK);
    h+=filaT('Perchado',resumen.perchado,'var(--ok)');
    if(resumen.impo) h+=filaT('Importación',resumen.impo,'var(--acc)');
    h+=filaT('Separación',resumen.sep,'var(--sep)');
    h+=filaT('Dañados',resumen.dana,'var(--dan)');
    h+=filaT('Observación',resumen.obse,'var(--warn)');
    if(resumen.pend) h+=filaT('Pendiente',resumen.pend,'var(--warn)');
    h+='<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:14px;font-weight:700;border-top:2px solid var(--bor);margin-top:4px">'+
      '<span style="color:var(--mut)">Saldo pendiente</span>'+
      '<span style="color:'+(resumen.finalizado?'var(--ok)':'var(--dan)')+'">'+
        resumen.saldo.toLocaleString()+' un '+
        (resumen.finalizado?'✅':'⏳')+
      '</span>'+
    '</div>';
    h+='</div>';

    h+='<button class="btn btn-sec" style="margin-top:10px" onclick="goBack()">← Volver</button>';
    render(h);
  });
}
