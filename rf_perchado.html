<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RF Perchado — Inverneg</title>
<style>
/* ── Tokens — coherente con RF Recepción ─────────────────────── */
:root{
  --bg:#0D1117;--sur:#161B22;--sur2:#1C2330;--bor:#2A3340;
  --txt:#E6EDF3;--mut:#7D8590;
  --acc:#58A6FF;--ok:#3FB950;--warn:#E3B341;--dan:#F85149;--rec:#F0883E;
  /* Nuevos para Perchado */
  --perc:#A78BFA;       /* violeta — distingue Perchado de Recepción */
  --sep:#34D399;        /* verde esmeralda — Separación */
  --sep-warn:#FCD34D;   /* amarillo — advertencia separación pendiente */
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ── Header ────────────────────────────────────────────────── */
.hdr{
  background:var(--sur);border-bottom:1px solid var(--bor);
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.hdr-brand{font-size:13px;font-weight:700;color:var(--perc);letter-spacing:.06em}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.hdr-back{
  font-size:12px;color:var(--mut);cursor:pointer;
  display:flex;align-items:center;gap:4px;
}
.hdr-back:hover{color:var(--txt)}

/* ── Pantalla principal ────────────────────────────────────── */
#screen{padding:14px 16px;max-width:480px;margin:0 auto}
.loading{text-align:center;padding:48px 16px;color:var(--mut);font-size:13px}
.loading-icon{font-size:28px;margin-bottom:10px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Tipografía y layout base ──────────────────────────────── */
.lbl{font-size:11px;color:var(--mut);letter-spacing:.04em;margin-bottom:4px;margin-top:10px}
.inp{
  width:100%;background:var(--sur2);border:1px solid var(--bor);
  color:var(--txt);font-size:16px;padding:10px 12px;border-radius:7px;
  outline:none;font-family:inherit;
}
.inp:focus{border-color:var(--acc)}
.inp-xl{font-size:22px;font-weight:700;text-align:center;letter-spacing:.04em;text-transform:uppercase}

/* ── Botones ───────────────────────────────────────────────── */
.btn{
  border:none;border-radius:8px;padding:12px 18px;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  width:100%;margin-top:8px;transition:opacity .15s;
}
.btn:active{opacity:.75}
.btn-perc{background:var(--perc);color:#000}
.btn-sep{background:var(--sep);color:#000}
.btn-ok{background:var(--ok);color:#000}
.btn-sec{background:var(--sur2);color:var(--txt);border:1px solid var(--bor)}
.btn-warn{background:var(--warn);color:#000}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-row .btn{margin-top:0}

/* ── Cards de selección ────────────────────────────────────── */
.mode-card{
  background:var(--sur2);border:1px solid var(--bor);
  border-radius:10px;padding:18px;
  cursor:pointer;transition:border-color .15s,background .15s;
  display:flex;align-items:center;gap:14px;
  margin-bottom:8px;
}
.mode-card:hover{background:#232b38;border-color:var(--bor)}
.mode-card.perc{border-left:3px solid var(--perc)}
.mode-card.sep{border-left:3px solid var(--sep)}
.mode-icon{font-size:26px;flex-shrink:0}
.mode-title{font-size:15px;font-weight:700;margin-bottom:3px}
.mode-sub{font-size:11px;color:var(--mut)}

/* ── Cards de ítem (LPN / SKU) ─────────────────────────────── */
.item-card{
  background:var(--sur2);border:1px solid var(--bor);border-radius:8px;
  padding:12px 14px;margin-bottom:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  transition:border-color .15s;
}
.item-card:hover,.item-card:active{border-color:var(--perc)}
.item-card.selected{border-color:var(--perc);background:#1d1e30}
.item-main{font-size:14px;font-weight:700;color:var(--acc);margin-bottom:2px}
.item-sub{font-size:11px;color:var(--mut)}
.item-qty{text-align:right;flex-shrink:0}
.item-qty-num{font-size:20px;font-weight:700;color:var(--txt)}
.item-qty-lbl{font-size:10px;color:var(--mut)}

/* ── Badge contextual ──────────────────────────────────────── */
.badge{
  display:inline-block;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:700;margin-bottom:10px;
}
.badge-perc{background:rgba(167,139,250,.15);color:var(--perc);border:1px solid rgba(167,139,250,.3)}
.badge-sep{background:rgba(52,211,153,.12);color:var(--sep);border:1px solid rgba(52,211,153,.25)}
.badge-pedido{background:rgba(88,166,255,.12);color:var(--acc);border:1px solid rgba(88,166,255,.25)}

/* ── Advertencia separación pendiente ─────────────────────── */
.sep-warn-box{
  background:rgba(252,211,77,.08);
  border:1px solid rgba(252,211,77,.3);
  border-radius:8px;padding:10px 12px;margin:8px 0;
}
.sep-warn-title{font-size:12px;font-weight:700;color:var(--sep-warn);margin-bottom:6px}
.sep-warn-row{display:flex;justify-content:space-between;font-size:11px;color:var(--txt);padding:2px 0}
.sep-warn-total{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--sep-warn);padding-top:6px;margin-top:4px;border-top:1px solid rgba(252,211,77,.2)}

/* ── Panel de saldo ────────────────────────────────────────── */
.saldo-panel{
  background:var(--sur);border:1px solid var(--bor);
  border-radius:8px;padding:12px 14px;margin-bottom:10px;
}
.saldo-sku{font-size:15px;font-weight:700;color:var(--acc);margin-bottom:2px}
.saldo-desc{font-size:11px;color:var(--mut);margin-bottom:10px}
.saldo-row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0}
.saldo-row-lbl{font-size:11px;color:var(--mut)}
.saldo-row-val{font-size:14px;font-weight:700}
.saldo-disponible{font-size:24px;font-weight:700;color:var(--ok);margin-top:4px}
.saldo-div{border-top:1px solid var(--bor);margin:8px 0}

/* ── Input cantidad grande (Zebra) ─────────────────────────── */
.qty-wrap{margin:10px 0}
.qty-lbl{font-size:11px;color:var(--mut);margin-bottom:5px}
.qty-input{
  width:100%;background:var(--sur);border:2px solid var(--bor);
  color:var(--txt);font-size:36px;font-weight:700;
  text-align:center;padding:14px;border-radius:10px;
  outline:none;font-family:inherit;
}
.qty-input:focus{border-color:var(--perc)}
.qty-input.mode-sep:focus{border-color:var(--sep)}

/* ── Destino / empresa ─────────────────────────────────────── */
.dest-panel{
  background:var(--sur2);border:1px solid var(--bor);
  border-radius:8px;padding:12px 14px;margin-top:6px;
}
.dest-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.dest-lbl{font-size:11px;color:var(--mut)}
.dest-val{font-size:12px;font-weight:700;color:var(--txt)}
.dest-auto{font-size:10px;color:var(--mut);font-style:italic}

/* ── Empresa chips ──────────────────────────────────────────── */
.empresa-row{display:flex;gap:8px;margin-top:6px}
.empresa-chip{
  flex:1;padding:10px;border-radius:7px;text-align:center;
  font-size:14px;font-weight:700;cursor:pointer;
  border:2px solid var(--bor);background:var(--sur2);color:var(--mut);
  transition:all .15s;
}
.empresa-chip.active{border-color:var(--perc);color:var(--perc);background:rgba(167,139,250,.1)}

/* ── Resumen de movimiento ──────────────────────────────────── */
.resumen-box{
  background:var(--sur);border:1px solid var(--bor);
  border-radius:10px;padding:14px;margin:10px 0;
}
.resumen-titulo{font-size:12px;color:var(--mut);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.resumen-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bor);font-size:12px}
.resumen-row:last-child{border-bottom:none;padding-top:8px;font-size:14px;font-weight:700}
.resumen-lbl{color:var(--mut)}
.resumen-val{font-weight:600}

/* ── Estado vacío ───────────────────────────────────────────── */
.empty-state{
  text-align:center;padding:32px 16px;color:var(--mut);font-size:13px;
  border:1px dashed var(--bor);border-radius:8px;margin-top:8px;
}
.empty-icon{font-size:28px;margin-bottom:8px}

/* ── Toast ──────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%);
  background:var(--sur2);color:var(--txt);border:1px solid var(--bor);
  padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;
  white-space:nowrap;max-width:90vw;
}
#toast.show{opacity:1}

/* ── Footer ─────────────────────────────────────────────────── */
.ftr{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--sur);border-top:1px solid var(--bor);
  padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));
  font-size:11px;color:var(--mut);display:flex;justify-content:space-between;
}
.ftr-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:4px}

/* Chips de selección de operador */
.op-grid{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.op-chip{background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:14px 16px;cursor:pointer;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.op-chip:hover,.op-chip:active{border-color:var(--perc);background:#1d1e30}
.op-avatar{width:32px;height:32px;border-radius:50%;background:var(--perc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#000;flex-shrink:0}
.op-banner{background:rgba(167,139,250,.1);border-bottom:1px solid rgba(167,139,250,.2);padding:5px 16px;font-size:11px;color:var(--perc);font-weight:600;display:flex;align-items:center;gap:6px}
.mov-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--bor);font-size:12px}
.mov-hora{width:44px;color:var(--mut);flex-shrink:0;font-size:11px}
.mov-sku{flex:1;font-weight:700;color:var(--acc)}
.mov-cant{width:60px;text-align:right;font-weight:700}
.mov-dest{width:90px;text-align:right;font-size:10px;color:var(--mut)}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center;gap:12px">
    <div id="btn-atras" onclick="goBack()" style="display:none;cursor:pointer;font-size:13px;color:var(--mut);padding:4px 8px;border:1px solid var(--bor);border-radius:6px">← Atrás</div>
    <div>
      <div class="hdr-brand">▸ RF PERCHADO</div>
      <div class="hdr-sub">Inverneg · CND</div>
    </div>
  </div>
  <div onclick="showMenuPrincipal()" style="cursor:pointer;font-size:13px;color:var(--mut);padding:4px 8px;border:1px solid var(--bor);border-radius:6px">🏠 Inicio</div>
</div>

<div id="op-banner" style="display:none" class="op-banner">
  <span>👤</span><span id="op-banner-txt">—</span>
</div>
<div id="screen">
  <div class="loading">
    <div class="loading-icon">⏳</div>
    <div>Iniciando sesión Microsoft...</div>
  </div>
</div>

<div id="toast"></div>
<div class="ftr">
  <span><span class="ftr-dot"></span><span id="ftr-status">CONECTANDO</span></span>
  <span id="ftr-user">—</span>
</div>

<script>
(function(){
'use strict';

/* ── CFG ──────────────────────────────────────────────────────── */
var CFG={
  clientId:   'ec976114-e146-4ce4-850c-5d978e12acfd',
  tenantId:   '5e008bd3-17b6-4f83-8d23-019691a40609',
  siteId:     'inverneg.sharepoint.com,8b946a6c-31b9-4bf7-95d0-ab47d29a4d63,ad88c61f-b207-49a4-9105-8b3b57b31906',
  perchadoNombre:'Inverneg_PerchadoRF.xlsx',
  recepcionNombre:'Inverneg_ConteoRF_Base_Live.xlsx',
  listas:{
    recepciones:'RF_PRecepciones_LRecepciones',
    movimientos:'RF_PRecepciones_LMovimientos',
  },
  empresas:{
    'INV':{almacenOrigen:'CND2-IMPO', ubicOrigen:'N1-IMPO', label:'INV — Inverneg'},
    'ECM':{almacenOrigen:'ECO3-IMPO', ubicOrigen:'E3-IMPO', label:'ECM — Economisa'},
  },
  almacenDestDefault:'CND2-BODE',  // precargado en formulario; operador puede cambiar
  destinosValidosSep:['Quito','CRD','Cuenca','Ambato','Matriz'],
};
var GRAPH='https://graph.microsoft.com/v1.0';
var SCOPES=['Files.ReadWrite','Sites.ReadWrite.All'];
var msalInst,msalAcc;

/* ── Estado de sesión ────────────────────────────────────────── */
var S={
  pedido:'',
  operador:'',       // operador seleccionado en pantalla de selección
  modo:'',           // PERCHADO | SEPARACION
  subModo:'',        // por-sku | por-lpn
  empresa:'INV',
  skuActual:null,    // {sku, desc, factor}
  lpnActual:'',
  cantActual:0,
  almacenDest:'',
  ubicDest:'',
  destinoSep:'',
  historial:[],      // breadcrumb para goBack()
};

/* ── DB catálogos ────────────────────────────────────────────── */
var DB={
  pedidos:[],
  operadores:[],           // hoja Operadores del Excel perchado
  ubicaciones:[],          // hoja Ubicaciones del Excel perchado
  destinosSep:[],          // hoja DestinosSeparacion
  separacionPendiente:[],  // hoja Separacion (solicitudes analistas)
  codigosBarra:[],         // hoja C.Barra del Excel recepcion
  perchadoDriveId:null,perchadoItemId:null,
  recepDriveId:null,recepItemId:null,
  listIds:{recepciones:null,movimientos:null},
};

/* ── Utils ───────────────────────────────────────────────────── */
function normStr(s){return s?s.toString().trim().toUpperCase():'';}
function pad(n){return String(n).padStart(2,'0');}
function ahora(){
  var d=new Date();
  return{
    fecha:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),
    hora:pad(d.getHours())+':'+pad(d.getMinutes()),
    ts:d.toISOString(),
  };
}
function $r(id){return document.getElementById(id);}
function render(html){$r('screen').innerHTML=html;}
function toast(msg,ms){
  var t=$r('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},ms||2000);
}
function setStatus(s,ok){
  $r('ftr-status').textContent=s;
  $r('ftr-status').previousSibling.style.background=ok?'var(--ok)':'var(--warn)';
}

/* ── Breadcrumb ──────────────────────────────────────────────── */
function pushScreen(id,fn){
  var pos=-1;
  for(var i=0;i<S.historial.length;i++){if(S.historial[i].id===id){pos=i;break;}}
  if(pos>=0) S.historial=S.historial.slice(0,pos);
  S.historial.push({id:id,fn:fn});
  actualizarBack();
}
function goBack(){
  if(S.historial.length<=1){showMenuPrincipal();return;}
  S.historial.pop();
  var prev=S.historial[S.historial.length-1];
  if(prev&&prev.fn) prev.fn();
  else showMenuPrincipal();
  actualizarBack();
}
function actualizarBack(){
  var btn=$r('btn-atras');
  if(btn) btn.style.display=S.historial.length>1?'block':'none';
}

/* ── GRAPH helpers ───────────────────────────────────────────── */
function getToken(){
  return msalInst.acquireTokenSilent({scopes:SCOPES,account:msalAcc})
    .catch(function(){return msalInst.acquireTokenRedirect({scopes:SCOPES});});
}
function gGet(url){
  return getToken().then(function(r){
    return fetch(url,{headers:{'Authorization':'Bearer '+r.accessToken}});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+':'+t.slice(0,100));});
    return r.json();
  });
}
function gPost(url,body){
  return getToken().then(function(r){
    return fetch(url,{method:'POST',
      headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'},
      body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+':'+t.slice(0,120));});
    return r.json();
  });
}
function urlWB(driveId,itemId,hoja){
  return GRAPH+'/drives/'+driveId+'/items/'+itemId+
    "/workbook/worksheets('"+hoja+"')/usedRange";
}
function urlLista(id){return GRAPH+'/sites/'+CFG.siteId+'/lists/'+id;}

/* ── Descubrimiento de archivos y listas ─────────────────────── */
function descubrirExcel(nombre){
  var url=GRAPH+'/sites/'+CFG.siteId+'/drive/root/search(q=\''+encodeURIComponent(nombre)+'\')';
  return gGet(url).then(function(d){
    var f=d.value&&d.value.find(function(x){return x.name===nombre;});
    if(!f) throw new Error('Archivo no encontrado: '+nombre);
    return{driveId:f.parentReference&&f.parentReference.driveId,itemId:f.id};
  });
}
function descubrirListas(){
  return gGet(GRAPH+'/sites/'+CFG.siteId+'/lists?$select=id,displayName&$top=200')
    .then(function(d){
      (d.value||[]).forEach(function(l){
        Object.keys(CFG.listas).forEach(function(k){
          if(l.displayName===CFG.listas[k]) DB.listIds[k]=l.id;
        });
      });
    });
}

/* ── Parsers Excel ───────────────────────────────────────────── */
function parsearHoja(values,mapFn){
  if(!values||values.length<2) return[];
  var hdr=values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  return values.slice(1).filter(function(r){return r.some(function(c){return c!==null&&c!=='';})}).map(function(r){return mapFn(hdr,r);});
}
function idx(hdr,names){
  for(var i=0;i<names.length;i++){var j=hdr.indexOf(names[i]);if(j>=0)return j;}return -1;
}
function parsearUbicaciones(d){
  if(!d||!d.values||d.values.length<2){
    console.warn('[UBIC-PARSE] Hoja vacía o sin datos');
    DB.ubicaciones=[];return;
  }
  // Log encabezados raw para detectar nombres de columna
  var hdrRaw=d.values[0];
  console.log('[UBIC-PARSE] Encabezados raw:',hdrRaw.map(function(v,i){return i+'="'+v+'"'}).join(' | '));
  var hdr=hdrRaw.map(function(v){return(v||'').toString().trim().toLowerCase();});
  var iEmp=idx(hdr,['empresa']);
  var iAlm=idx(hdr,['almacen','almacén']);
  var iUbic=idx(hdr,['ubicacion','ubicación']);
  var iTipo=idx(hdr,['tipo']);
  console.log('[UBIC-PARSE] Índices → empresa:'+iEmp+' almacen:'+iAlm+' ubicacion:'+iUbic+' tipo:'+iTipo);
  // Log primer registro raw para ver valores reales
  if(d.values.length>1){
    var r1=d.values[1];
    console.log('[UBIC-PARSE] Primer registro raw:',r1.map(function(v,i){return i+'="'+v+'"'}).join(' | '));
    console.log('[UBIC-PARSE] Primer registro parseado:',
      '{Empresa:"'+r1[iEmp]+'"|normEmpresa:"'+normStr(r1[iEmp]||'')+'"|Almacen:"'+r1[iAlm]+'"|Ubicacion:"'+r1[iUbic]+'"|Tipo:"'+r1[iTipo]+'"}');
  }
  DB.ubicaciones=parsearHoja(d.values,function(h,r){
    var emp=(r[iEmp]||'').toString().trim();
    var alm=(r[iAlm]||'').toString().trim();
    var ubic=(r[iUbic]||'').toString().trim();
    var tipo=(r[iTipo]||'').toString().trim();
    return{empresa:emp,almacen:alm,ubicacion:ubic,tipo:tipo};
  });
  // Log resumen por empresa
  var porEmp={};
  DB.ubicaciones.forEach(function(u){
    var k='"'+u.empresa+'"(norm:"'+normStr(u.empresa)+'")';
    porEmp[k]=(porEmp[k]||0)+1;
  });
  console.log('[UBIC-PARSE] Registros por empresa:',JSON.stringify(porEmp));
  console.log('[UBIC-PARSE] Total cargadas:',DB.ubicaciones.length);
}
function parsearDestinos(d){
  DB.destinosSep=parsearHoja(d.values,function(h,r){
    return{destino:r[idx(h,['destino'])]||'',almacen:r[idx(h,['almacen'])]||'',ubicacion:r[idx(h,['ubicacion'])]||''};
  });
}
function parsearOperadores(d){
  if(!d||!d.values||d.values.length<2){DB.operadores=[];return;}
  // Hoja con una columna: Operadores
  var hdr=d.values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  var iOp=idx(hdr,['operadores','operador','nombre','name']);
  if(iOp<0) iOp=0; // fallback primera columna
  DB.operadores=d.values.slice(1)
    .map(function(r){return(r[iOp]||'').toString().trim();})
    .filter(function(v){return v.length>0;})
    .sort();
  console.log('[OPS] Operadores cargados:',DB.operadores.length,'→',DB.operadores.join(', '));
}
function parsearSeparacion(d){
  if(!d||!d.values||d.values.length<2){
    console.warn('[SEP] Hoja Separacion vacía o sin filas');
    DB.separacionPendiente=[];
    return;
  }
  // LOG: encabezados raw — crítico para saber la estructura de la hoja
  var hdrRaw=d.values[0];
  console.log('[SEP] Encabezados raw ('+hdrRaw.length+' columnas):',
    hdrRaw.map(function(v,i){return i+'="'+v+'"';}).join(' | '));
  console.log('[SEP] Primera fila de datos:',
    d.values[1].map(function(v,i){return i+'="'+v+'"';}).join(' | '));

  var hdr=hdrRaw.map(function(v){return(v||'').toString().trim().toLowerCase();});

  // Detectar si es estructura VERTICAL (columna "destino") u HORIZONTAL (destinos como encabezados)
  var tieneDestino=hdr.indexOf('destino')>=0||hdr.indexOf('destination')>=0;
  var iSku=idx(hdr,['sku','código sku','codigo sku','cod sku','codigosku']);
  var iPed=idx(hdr,['pedido']);
  var iCant=idx(hdr,['cantidad']);
  var iFecha=idx(hdr,['fecha']);

  console.log('[SEP] Estructura detectada:',tieneDestino?'VERTICAL (columna destino)':'HORIZONTAL (destinos como columnas)');
  console.log('[SEP] Índices: pedido='+iPed+' sku='+iSku+' cantidad='+iCant+' fecha='+iFecha+' destino='+(tieneDestino?hdr.indexOf('destino'):-1));

  DB.separacionPendiente=[];

  if(tieneDestino){
    // Estructura VERTICAL: Pedido | SKU | Cantidad | Fecha | Destino
    var iDest=hdr.indexOf('destino');
    d.values.slice(1).forEach(function(r){
      if(!r.some(function(c){return c!==null&&c!=='';} )) return; // fila vacía
      var skuRaw=iPed>=0?r[iSku]:null;
      DB.separacionPendiente.push({
        pedido:iPed>=0?(r[iPed]||'').toString().trim():'',
        sku:skuRaw!==null&&skuRaw!==undefined?skuRaw.toString().trim():'',
        cantidad:iCant>=0?Number(r[iCant])||0:0,
        fecha:iFecha>=0?(r[iFecha]||'').toString().trim():'',
        destino:iDest>=0?(r[iDest]||'').toString().trim():'',
      });
    });
  } else {
    // Estructura HORIZONTAL: Pedido | SKU | Fecha? | CRD | Cuenca | Ambato | Quito | Matriz | ...
    // Las columnas de destino son todas las que no son pedido/sku/fecha/cantidad
    var colsReservadas=['pedido','sku','fecha','cantidad','descripcion','descripción'];
        // Solo columnas que estén en la lista de destinos válidos
    var destValiNorm=(CFG.destinosValidosSep||[]).map(function(v){return v.trim().toLowerCase();});
    var destCols=hdr.map(function(h2,i){
      if(colsReservadas.indexOf(h2)>=0||!h2) return null;
      var valido=destValiNorm.length===0||destValiNorm.indexOf(h2.trim().toLowerCase())>=0;
      return valido?{nombre:hdrRaw[i].toString().trim(),idx:i}:null;
    }).filter(Boolean);
    console.log('[SEP] Destinos válidos config:',CFG.destinosValidosSep?CFG.destinosValidosSep.join(', '):'todos');
    console.log('[SEP] Columnas de destino usadas:',destCols.map(function(c){return '"'+c.nombre+'"';}).join(', '));
    console.log('[SEP] Columnas de destino detectadas:',destCols.map(function(c){return '"'+c.nombre+'"';}).join(', '));

    d.values.slice(1).forEach(function(r){
      if(!r.some(function(c){return c!==null&&c!=='';} )) return;
      var pedido=iPed>=0?(r[iPed]||'').toString().trim():'';
      var skuRaw=iSku>=0?r[iSku]:null;
      var sku=skuRaw!==null&&skuRaw!==undefined?skuRaw.toString().trim():'';
      var fecha=iFecha>=0?(r[iFecha]||'').toString().trim():'';
      if(!sku) return;
      // Generar un registro por cada columna-destino con cantidad > 0
      destCols.forEach(function(col){
        var cant=Number(r[col.idx])||0;
        if(cant>0){
          DB.separacionPendiente.push({
            pedido:pedido, sku:sku, cantidad:cant, fecha:fecha, destino:col.nombre
          });
        }
      });
    });
    console.log('[SEP] Registros expandidos (uno por destino con cant>0):',DB.separacionPendiente.length);
  }

  if(DB.separacionPendiente.length>0){
    console.log('[SEP] Primer registro parseado:',JSON.stringify(DB.separacionPendiente[0]));
  }
  console.log('[SEP] Total registros Separacion:',DB.separacionPendiente.length);
}
function parsearCBarra(d){
  if(!d||!d.values||d.values.length<2) return;
  var hdr=d.values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  // Columna A = SKU, B = Desc, D = CB Unidad, F = CB Caja (por índice fijo + búsqueda por nombre)
  var iS=hdr.findIndex(function(h){return h==='sku'||h==='código sku'||h==='codigo sku'||h.indexOf('cod')===0;});
  if(iS<0) iS=0;
  var iDesc=hdr.findIndex(function(h){return h.indexOf('desc')>-1;});
  // CB Unidad: columna D (índice 3) o por nombre
  var iCBU=hdr.findIndex(function(h){return h.indexOf('barras unidad')>-1||h.indexOf('cod. de barras u')>-1;});
  if(iCBU<0) iCBU=3; // columna D por defecto
  // CB Caja: columna F (índice 5) o por nombre
  var iCBC=hdr.findIndex(function(h){return h.indexOf('barras caja')>-1||h.indexOf('cod. de barras c')>-1;});
  if(iCBC<0) iCBC=5; // columna F por defecto
  console.log('[CBARRA] índices: SKU='+iS+' Desc='+iDesc+' CB_Unidad='+iCBU+' CB_Caja='+iCBC);
  if(d.values.length>1){
    var r1=d.values[1];
    console.log('[CBARRA] Fila[1]: SKU="'+r1[iS]+'" CB_U="'+r1[iCBU]+'" CB_C="'+r1[iCBC]+'"');
  }
  d.values.slice(1).forEach(function(r){
    var sku=(r[iS]||'').toString().trim();
    if(!sku) return;
    var desc=iDesc>=0&&r[iDesc]?r[iDesc].toString().trim():'';
    var cbU=(r[iCBU]||'').toString().trim();
    var cbC=(r[iCBC]||'').toString().trim();
    // Guardar una entrada por SKU (dedup)
    var existe=DB.codigosBarra.find(function(x){return x.sku===sku;});
    if(!existe){
      DB.codigosBarra.push({sku:sku, desc:desc, cbUnidad:cbU, cbCaja:cbC});
    } else {
      // Agregar CBs adicionales si la misma fila tiene otro código de barra
      if(cbU&&!existe.cbUnidad) existe.cbUnidad=cbU;
      if(cbC&&!existe.cbCaja) existe.cbCaja=cbC;
    }
  });
  console.log('[CBARRA] Cargados:',DB.codigosBarra.length,'SKUs con equivalencias de códigos de barras');
}

/* ── Cálculo de saldo ────────────────────────────────────────── */
// normLPN: convierte LPN a string normalizado — definida globalmente para uso en validaciones
function normLPN(v){ return v!==null&&v!==undefined&&v!==''?String(v).trim():'(sin LPN)'; }

function calcularSaldos(recepciones,movimientos,logSKU){
  // Retorna Map de "LPN|SKU" → {lpn,sku,desc,recibido,movido,saldo,created}
  // logSKU: si se pasa, loguea detalle para ese SKU específico
  var mapa={};
  // Clave siempre UPPERCASE para evitar mismatch por capitalización del LPN ingresado
  function claveK(lpn,sku){ return normLPN(lpn).toUpperCase()+'|'+String(sku).trim().toUpperCase(); }

  // Normalizar LPN a string siempre — evita que número 1 ≠ string "1"

  // Sumar recibido OK (correcciones participan como negativos, dañado excluido)
  recepciones.forEach(function(r){
    if(normStr(r.Estado||'')==='DAÑADO') return;
    var lpn=normLPN(r.LPN);
    var sku=(r.CodProducto||'').toString().trim();
    var k=claveK(lpn,sku);
    if(!mapa[k]) mapa[k]={lpn:lpn,sku:sku,desc:r.Nombre||'',recibido:0,movido:0,saldo:0,created:r.Created||''};
    mapa[k].recibido+=Number(r.Cantidad)||0;
  });

  // Log recepciones agrupadas para el SKU de diagnóstico
  if(logSKU){
    var recSKU=Object.keys(mapa).filter(function(k){return normStr(mapa[k].sku)===normStr(logSKU);});
    console.log('[SKU-SALDO] === Recepciones por LPN para SKU='+logSKU+' ===');
    recSKU.forEach(function(k){
      console.log('[SKU-SALDO] LPN="'+mapa[k].lpn+'" recibido='+mapa[k].recibido);
    });
  }

  // Restar movimientos ejecutados (Perchado + Separación)
  movimientos.forEach(function(m){
    var lpn=normLPN(m.LPN);
    var sku=(m.SKU||'').toString().trim();
    var k=claveK(lpn,sku);
    if(logSKU&&normStr(sku)===normStr(logSKU)){
      console.log('[SKU-SALDO] Movimiento: LPN="'+lpn+'" tipo='+m.TipoMovimiento+' cant='+m.Cantidad+
        ' clave_existe='+(!!mapa[k]));
    }
    if(!mapa[k]){
      if(logSKU&&normStr(sku)===normStr(logSKU))
        console.warn('[SKU-SALDO] DESCUENTO PERDIDO — clave "'+k+'" no existe en mapa de recepciones');
      return;
    }
    mapa[k].movido+=Number(m.Cantidad)||0;
  });

  // Calcular saldo y log final
  Object.keys(mapa).forEach(function(k){
    mapa[k].saldo=mapa[k].recibido-mapa[k].movido;
  });

  if(logSKU){
    var resSKU=Object.keys(mapa).filter(function(k){return normStr(mapa[k].sku)===normStr(logSKU);});
    console.log('[SKU-SALDO] === Saldo final por LPN para SKU='+logSKU+' ===');
    resSKU.forEach(function(k){
      var e=mapa[k];
      console.log('[SKU-SALDO] LPN="'+e.lpn+'" recibido='+e.recibido+' movido='+e.movido+' saldo='+e.saldo);
    });
    var totalSaldo=resSKU.reduce(function(a,k){return a+mapa[k].saldo;},0);
    console.log('[SKU-SALDO] Total saldo '+logSKU+':',totalSaldo);
  }

  return mapa;
}

/* ── Separación pendiente para un SKU ───────────────────────── */
function sepPendienteSKU(pedido,sku){
  // Solicitudes de la hoja Separacion
  var reqs=DB.separacionPendiente.filter(function(r){
    return normStr(r.pedido)===normStr(pedido)&&normStr(r.sku)===normStr(sku);
  });
  if(!reqs.length) return null;
  // Consolidar solicitudes por destino
  var porDest={};
  reqs.forEach(function(r){
    var k=r.destino||'Sin destino';
    porDest[k]=(porDest[k]||0)+r.cantidad;
  });
  // Descontar movimientos SEPARACION ya ejecutados en SP (cargados en DB._movsCache)
  var movsEjec=DB._movsCache||[];
  movsEjec.forEach(function(m){
    if(normStr(m.TipoMovimiento)!=='SEPARACION') return;
    if(normStr(m.Pedido||'')!==normStr(pedido)) return;
    if(normStr(m.SKU||'')!==normStr(sku)) return;
    var dest=m.DestinoSeparacion||m.AlmacenDestino||'Sin destino';
    // Intentar coincidir con alguna clave del porDest
    var matchKey=Object.keys(porDest).find(function(k2){
      return normStr(k2)===normStr(dest);
    })||dest;
    if(porDest[matchKey]!==undefined){
      porDest[matchKey]-=Number(m.Cantidad)||0;
      if(porDest[matchKey]<0) porDest[matchKey]=0;
    }
  });
  // Eliminar destinos con pendiente <= 0
  Object.keys(porDest).forEach(function(k){if(porDest[k]<=0) delete porDest[k];});
  if(!Object.keys(porDest).length) return null;
  return porDest;
}

function renderSepWarn(pedido,sku){
  var pd=sepPendienteSKU(pedido,sku);
  if(!pd) return '';
  var total=Object.values(pd).reduce(function(a,v){return a+v;},0);
  if(total<=0) return '';
  var rows=Object.keys(pd).map(function(d){
    return '<div class="sep-warn-row"><span>'+d+'</span><span>'+pd[d]+' un</span></div>';
  }).join('');
  return '<div class="sep-warn-box">'+
    '<div class="sep-warn-title">⚠ Separación pendiente</div>'+
    rows+
    '<div class="sep-warn-total"><span>Total pendiente</span><span>'+total+' un</span></div>'+
    '<div style="font-size:10px;color:var(--mut);margin-top:4px">Solo informativo — no afecta el saldo disponible</div>'+
  '</div>';
}

    var badge=document.getElementById('badge-pedido-sel');
    if(!inp||!drop) return;

    function filtrar(){
      var q=(inp.value||'').trim().toUpperCase();
      drop.innerHTML='';
      var matches=DB.pedidos.filter(function(p){return !q||p.toUpperCase().indexOf(q)>=0;}).slice(0,25);
      if(!matches.length||!q){drop.style.display='none';return;}
      matches.forEach(function(p){
        var item=document.createElement('div');
        item.style.cssText='padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--bor);font-size:14px;font-weight:600;color:var(--txt)';
        item.textContent=p;
        item.addEventListener('mouseover',function(){this.style.background='var(--bor)';});
        item.addEventListener('mouseout',function(){this.style.background='';});
        item.addEventListener('mousedown',function(e){
          e.preventDefault();
          selPedidoBuscador(p);
        });
        drop.appendChild(item);
      });
      drop.style.display='block';
    }

    inp.addEventListener('input',filtrar);
    inp.addEventListener('focus',filtrar);
    inp.addEventListener('blur',function(){setTimeout(function(){drop.style.display='none';},180);});
    inp.addEventListener('keydown',function(e){
      if(e.key==='Enter'){
        var q=(inp.value||'').trim().toUpperCase();
        var exacto=DB.pedidos.find(function(p){return p.toUpperCase()===q;});
        if(exacto) selPedidoBuscador(exacto);
        else if(window._pedidoActualMenu) selPedidoBuscador(window._pedidoActualMenu);
      }
    });
  },0);
}

// ── Resolver código leído → SKU real ─────────────────────────────
// Acepta: SKU directo, código de barras unidad (col D), código de barras caja (col F)
function resolverSKU(codigoLeido){
  var q=codigoLeido.toString().trim().toUpperCase();
  if(!q) return null;
  // 1. Coincidencia directa de SKU
  var porSKU=DB.codigosBarra.find(function(x){return normStr(x.sku)===q;});
  if(porSKU) return {sku:porSKU.sku, desc:porSKU.desc, via:'SKU'};
  // 2. Código de barras unidad (col D)
  var porCBU=DB.codigosBarra.find(function(x){return x.cbUnidad&&normStr(x.cbUnidad)===q;});
  if(porCBU) return {sku:porCBU.sku, desc:porCBU.desc, via:'CB_Unidad'};
  // 3. Código de barras caja (col F)
  var porCBC=DB.codigosBarra.find(function(x){return x.cbCaja&&normStr(x.cbCaja)===q;});
  if(porCBC) return {sku:porCBC.sku, desc:porCBC.desc, via:'CB_Caja'};
  // 4. No encontrado — devolver null (el llamador decide si continúa igual)
  return null;
}
function buscarSKU(){
  var codigoLeido=($r('inp-sku').value||'').trim();
  if(!codigoLeido){toast('Ingresa un SKU o código de barras');return;}
  var resuelto=resolverSKU(codigoLeido);
  // skuNorm siempre UPPERCASE — claveK en calcularSaldos también es UPPERCASE
  var skuNorm=(resuelto?resuelto.sku:codigoLeido).toString().trim().toUpperCase();
  var desc=resuelto?resuelto.desc:'';
  console.log('[SKU-BUSQ] ingresado:',JSON.stringify(codigoLeido),
    '→ skuNorm:',JSON.stringify(skuNorm));
  if(resuelto&&resuelto.via!=='SKU'){
    console.log('[EQUIV] Código "'+codigoLeido+'" → SKU "'+skuNorm+'" via '+resuelto.via);
    toast('Código resuelto → '+skuNorm, 1500);
  }
  S.skuActual={sku:skuNorm, desc:desc};
  render('<div class="loading"><div class="loading-icon">⏳</div><div>Calculando saldos...</div></div>');
  Promise.all([
    cargarRecepcionesPedido(S.pedido),
    cargarMovimientosPedido(S.pedido),
  ]).then(function(res){
    DB._movsCache=res[1];
    var saldos=calcularSaldos(res[0],res[1],skuNorm);
    // Filtrar: s.sku viene del SP original, claveK lo convirtió a UPPER en el mapa
    // Comparar siempre en UPPERCASE en ambos lados
    var lpns=Object.keys(saldos)
      .map(function(k){return saldos[k];})
      .filter(function(s){
        return s.sku.toString().trim().toUpperCase()===skuNorm&&s.saldo>0;
      })
      .sort(function(a,b){return String(a.lpn).localeCompare(String(b.lpn));});
    console.log('[SKU-BUSQ] LPNs con saldo>0:',lpns.map(function(s){
      return s.lpn+'('+s.saldo+')';
    }).join(', ')||'ninguno');
    window._saldosCache=saldos;
    showListaLPNParaSKU(skuNorm,lpns);
  });
}

function buscarLPN(){
  var lpn=($r('inp-lpn').value||'').trim();

  S.lpnActual=lpn;
  render('<div class="loading"><div class="loading-icon">⏳</div><div>Cargando SKUs del pallet...</div></div>');
  Promise.all([
    cargarRecepcionesPedido(S.pedido),

  ]).then(function(res){
    // Para loguear: detectar qué SKU tiene movimientos en este LPN
    var saldosPrev=calcularSaldos(res[0],[]);// solo recepciones para ver qué hay
    var skuDelLPN=Object.keys(saldosPrev).filter(function(k){
      return normStr(saldosPrev[k].lpn)===normStr(lpn);
    }).map(function(k){return saldosPrev[k].sku;});
    var logSKULPN=skuDelLPN[0]||null; // loguear el primer SKU del LPN

      lpnsEnPedido.map(function(l){return '"'+l+'"(norm:"'+normStr(l)+'")';}).join(' | '));

    var skus=Object.keys(saldos)
      .map(function(k){return saldos[k];})
      .filter(function(s){
        var match=normStr(s.lpn)===normStr(lpn);
        return match&&s.saldo>0;
      })
      .sort(function(a,b){return a.sku.localeCompare(b.sku);});

function _initBuscadorDrop(inpId,dropId,badgeId,opciones,onSelect){
  var inp=document.getElementById(inpId);
  var drop=document.getElementById(dropId);
  var badge=document.getElementById(badgeId);
  if(!inp||!drop) return;

  // Limpiar listeners anteriores clonando el nodo
  var nuevoInp=inp.cloneNode(true);
  inp.parentNode.replaceChild(nuevoInp,inp);
  inp=nuevoInp;

  function filtrar(){
    var q=(inp.value||'').trim().toUpperCase();
    drop.innerHTML='';
    var matches=opciones.filter(function(o){return !q||o.toUpperCase().indexOf(q)>=0;}).slice(0,30);
    if(!matches.length||!q){drop.style.display='none';return;}
    matches.forEach(function(o){
      var item=document.createElement('div');
      item.style.cssText='padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--bor);font-size:13px;font-weight:600';
      item.textContent=o;
      item.addEventListener('mouseover',function(){this.style.background='var(--bor)';});
      item.addEventListener('mouseout',function(){this.style.background='';});
      item.addEventListener('mousedown',function(e){
        e.preventDefault();
        inp.value=o;
        drop.style.display='none';
        if(badge){badge.textContent='✓ '+o;badge.style.display='block';}
        onSelect(o);
      });
      drop.appendChild(item);
    });
    drop.style.display='block';
  }

  inp.addEventListener('input',filtrar);
  inp.addEventListener('focus',filtrar);
  inp.addEventListener('blur',function(){setTimeout(function(){drop.style.display='none';},180);});
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      var q=(inp.value||'').trim().toUpperCase();
      var exacto=opciones.find(function(o){return o.toUpperCase()===q;});
      if(exacto){inp.value=exacto;drop.style.display='none';if(badge){badge.textContent='✓ '+exacto;badge.style.display='block';}onSelect(exacto);}
    }
  });
}

  console.log('[POST-MOV] new Date()='+_d.toString());

  console.log('[POST-MOV] FechaMovimiento enviado='+fields.FechaMovimiento);

  render('<div class="loading"><div class="loading-icon">⏳</div><div>Guardando movimiento...</div></div>');

function showSeparacion(){

    // Saldo total por SKU (todos los LPN)
    var saldoXsku={};
    Object.keys(saldos).forEach(function(k){
      var s=saldos[k];
      if(!saldoXsku[normStr(s.sku)]) saldoXsku[normStr(s.sku)]=0;
      saldoXsku[normStr(s.sku)]+=s.saldo;
    });

    // LOG diagnóstico
    console.log('[SEP] Pedido seleccionado:',S.pedido,'norm:',normStr(S.pedido));
    console.log('[SEP] Total registros en DB.separacionPendiente:',DB.separacionPendiente.length);
    if(DB.separacionPendiente.length>0){
      var p0s=DB.separacionPendiente[0];
      console.log('[SEP] Primer registro en DB:',JSON.stringify(p0s));
      console.log('[SEP] Pedidos distintos en DB:',
        [...new Set(DB.separacionPendiente.map(function(r){return r.pedido;}))].join(' | '));
    }

    // Consolidar por Destino+SKU — solo registros del pedido activo con cantidad > 0
    var reqs=DB.separacionPendiente.filter(function(r){
      var match=normStr(r.pedido)===normStr(S.pedido)&&r.cantidad>0;
      return match;
    });
    console.log('[SEP] Registros para pedido "'+S.pedido+'":',reqs.length);
    if(reqs.length>0) console.log('[SEP] Primer registro del pedido:',JSON.stringify(reqs[0]));
    var porDestSku={};
    reqs.forEach(function(r){
      var dest=(r.destino||'Sin destino').toString().trim();
      var sku=String(r.sku).trim();
      if(!porDestSku[dest]) porDestSku[dest]={};
      if(!porDestSku[dest][sku]) porDestSku[dest][sku]=0;
      porDestSku[dest][sku]+=Number(r.cantidad)||0;
    });

    // Filtrar SKU con cantidad <= 0 y destinos vacíos
    Object.keys(porDestSku).forEach(function(dest){
      Object.keys(porDestSku[dest]).forEach(function(sku){
        if(porDestSku[dest][sku]<=0) delete porDestSku[dest][sku];
      });
      if(!Object.keys(porDestSku[dest]).length) delete porDestSku[dest];
    });

    var destinos=Object.keys(porDestSku).sort();
    console.log('[SEP] Destinos con tareas:',destinos.join(', '));

    window._sepData={porDestSku:porDestSku,saldoXsku:saldoXsku};

    if(!destinos.length){
      render(
        '<div class="badge badge-sep">SEPARACIÓN — '+S.pedido+'</div>'+
        '<div class="empty-state" style="margin-top:14px">'+
          '<div class="empty-icon">✓</div>No hay tareas de separación pendientes para este pedido'+
        '</div>'+
        '<button class="btn btn-sec" style="margin-top:12px" onclick="showMenuPrincipal()">⌂ Menú principal</button>'
      );
      return;
    }
    _renderDestinosSep(destinos,porDestSku,saldoXsku);
  });
}

// ── Selección de LPN origen para Separación ──────────────────────
function _seleccionarLPNSep(sku,cantReq,destino,saldoDisp){
  pushScreen('sep-lpn-'+sku,function(){_seleccionarLPNSep(sku,cantReq,destino,saldoDisp);});
  actualizarBack();
  render('<div class="loading"><div class="loading-icon">⏳</div><div>Calculando saldos por LPN...</div></div>');

  Promise.all([cargarRecepcionesPedido(S.pedido),cargarMovimientosPedido(S.pedido)]).then(function(res){
    DB._movsCache=res[1];
    var saldos=calcularSaldos(res[0],res[1]);
    // Log diagnóstico
    var todasEntradas=Object.keys(saldos).map(function(k){
      return {k:k,sku:saldos[k].sku,lpn:saldos[k].lpn,saldo:saldos[k].saldo};
    });
    console.log('[SEP-LPN] SKU buscado:',JSON.stringify(sku),'norm:',normStr(sku));
    console.log('[SEP-LPN] Total entradas en saldos:',todasEntradas.length);
    console.log('[SEP-LPN] Todas las entradas:',JSON.stringify(todasEntradas.slice(0,10)));
    // LPN con saldo > 0 para este SKU, orden FIFO por fecha de creación
    var lpns=Object.keys(saldos)
      .map(function(k){return saldos[k];})
      .filter(function(s){
        var match=normStr(s.sku)===normStr(sku)&&s.saldo>0;
        if(!match&&s.saldo>0) console.log('[SEP-LPN] SKU descartado:',JSON.stringify(s.sku),'norm:',normStr(s.sku));
        return match;
      })
      .sort(function(a,b){
        if(a.created&&b.created) return new Date(a.created)-new Date(b.created);
        return String(a.lpn).localeCompare(String(b.lpn));
      });

    var destInfo=DB.destinosSep.find(function(d){return normStr(d.destino)===normStr(destino);});

    render(
      '<div class="badge badge-sep">'+destino+'</div>'+
      '<div class="badge badge-pedido" style="margin-left:6px">'+S.pedido+'</div>'+
      '<div class="saldo-panel" style="margin-top:10px">'+
        '<div class="saldo-sku">'+sku+'</div>'+
        '<div class="saldo-row"><span class="saldo-row-lbl">Cantidad a separar</span>'+
          '<span class="saldo-row-val">'+cantReq+' un</span></div>'+
        (destInfo?'<div class="saldo-row"><span class="saldo-row-lbl">Destino</span>'+
          '<span class="saldo-row-val">'+destInfo.almacen+' / '+destInfo.ubicacion+'</span></div>':'')+
      '</div>'+
      '<div class="lbl" style="margin-top:10px">selecciona el LPN origen</div>'+
      '<div id="lpn-sep-grid"></div>'
    );

    var grid=document.getElementById('lpn-sep-grid');
    if(!grid) return;

    if(!lpns.length){
      grid.innerHTML='<div class="empty-state"><div class="empty-icon">⚠</div>Sin saldo disponible para este SKU</div>';
      return;
    }

    lpns.forEach(function(s){
      var suficiente=s.saldo>=cantReq;
      var card=document.createElement('div');
      card.className='item-card';
      card.style.cssText='border-left:3px solid '+(suficiente?'var(--sep)':'var(--warn)');
      card.innerHTML=
        '<div style="flex:1">'+
          '<div class="item-main">'+s.lpn+'</div>'+
          '<div class="item-sub" style="color:'+(suficiente?'var(--ok)':'var(--warn)')+'">'+
            s.saldo+' un disponibles'+
            (!suficiente?' — insuficiente para '+cantReq+' un':'')+
          '</div>'+
        '</div>'+
        '<div class="item-qty">'+
          '<div class="item-qty-num">'+s.saldo+'</div>'+
          '<div class="item-qty-lbl">disp.</div>'+
        '</div>';
      card.addEventListener('click',(function(lpn,saldoLPN){
        return function(){
          if(cantReq>saldoLPN){
            toast('Saldo insuficiente en este LPN: '+saldoLPN+' un disponibles');
            return;
          }
          _ejecutarSepConLPN(sku,cantReq,destino,lpn);
        };
      })(s.lpn,s.saldo));
      grid.appendChild(card);
    });
  }).catch(function(e){
    render('<div class="empty-state"><div class="empty-icon">⚠</div>Error cargando saldos: '+e.message+'</div>');
  });
}

      gGet(urlLista(DB.listIds.recepciones)+'/items?$expand=fields&$top=2000')
        .then(function(d){
          var ps=[...new Set((d.value||[]).map(function(i){return(i.fields||{}).Pedido||'';}).filter(Boolean))].sort();
          DB.pedidos=ps;
          showSeleccionOperador();
        }).catch(function(){showSeleccionOperador();});
    } else {
      showSeleccionOperador();
    }
  }).catch(function(e){
    console.error('[BOOT]',e.message);
    setStatus('ERROR',false);
    showMenuPrincipal();
  });
}


// Devuelve el Tipo de una ubicación destino (PERCHADO, IMPO, DANA, OBSE, PEND)
// Si no se encuentra, devuelve 'PERCHADO' como fallback
function tipoUbicacion(almacen, ubicacion){
  var u=DB.ubicaciones.find(function(u){
    return normStr(u.almacen)===normStr(almacen)&&normStr(u.ubicacion)===normStr(ubicacion);
  });
  return u&&u.tipo?u.tipo.toString().trim().toUpperCase():'PERCHADO';
}

// Categoriza un movimiento en las 5 categorías del resumen
function categorizarMovimiento(mov){
  if(normStr(mov.TipoMovimiento||'')===normStr('SEPARACION')) return 'SEP';
  return tipoUbicacion(mov.AlmacenDestino||'', mov.UbicacionDestino||'');
}


// ── Calcular resumen de perchado para un pedido ───────────────────
function calcularResumenPerchado(recepciones, movimientos){
  // Recibido OK (correcciones participan, dañados excluidos)
  var recibidoOK=0;
  recepciones.forEach(function(r){
    if(normStr(r.Estado||'')!=='DAÑADO') recibidoOK+=Number(r.Cantidad)||0;
  });

  // Categorías del resumen
  var cats={PERCHADO:0,IMPO:0,DANA:0,OBSE:0,PEND:0,SEP:0};

  // Detalle por destino: {almacen+'/'+ubicacion → {almacen,ubicacion,tipo,cantidad}}
  var detalle={};

  movimientos.forEach(function(m){
    var cant=Number(m.Cantidad)||0;
    var cat=categorizarMovimiento(m);
    if(cats.hasOwnProperty(cat)) cats[cat]+=cant;
    else cats['PERCHADO']+=cant; // fallback

    // Acumular detalle por destino
    var alm=m.AlmacenDestino||'';
    var ubic=m.UbicacionDestino||'';
    var key=normStr(alm)+'|'+normStr(ubic);
    if(!detalle[key]) detalle[key]={almacen:alm,ubicacion:ubic,tipo:cat,cantidad:0};
    detalle[key].cantidad+=cant;
  });

  var totalMovido=cats.PERCHADO+cats.IMPO+cats.DANA+cats.OBSE+cats.PEND+cats.SEP;
  var saldo=recibidoOK-totalMovido;
  var pct=recibidoOK>0?Math.round(totalMovido/recibidoOK*100):0;

  return{
    recibidoOK:recibidoOK,
    perchado:cats.PERCHADO,
    impo:cats.IMPO,
    dana:cats.DANA,
    obse:cats.OBSE,
    pend:cats.PEND,
    sep:cats.SEP,
    totalMovido:totalMovido,
    saldo:saldo,
    pct:pct,
    finalizado:saldo<=0,
    detalle:Object.values(detalle).sort(function(a,b){return b.cantidad-a.cantidad;}),
  };
}

      '<span style="font-size:14px;font-weight:700;color:'+(color||'var(--txt)')+'">'+val.toLocaleString()+' un</span>'+
    '</div>'+bar;
  }

  var h=
    '<div class="badge badge-perc">RESUMEN DE PERCHADO</div>'+
    '<div class="badge badge-pedido" style="margin-left:6px">'+pedido+'</div>'+

    // Estado y avance

      '<div>'+
        '<div style="font-size:11px;color:var(--mut)">Estado del perchado</div>'+
        '<div style="font-size:16px;font-weight:700;color:'+estadoColor+';margin-top:2px">'+estadoTxt+'</div>'+
      '</div>'+
      '<div style="text-align:right">'+
        '<div style="font-size:28px;font-weight:700;color:'+estadoColor+'">'+r.pct+'%</div>'+
        '<div style="font-size:10px;color:var(--mut)">avance</div>'+
      '</div>'+
    '</div>'+

    // Barra de progreso grande
    '<div style="height:8px;background:var(--sur2);border-radius:4px;margin-bottom:14px;overflow:hidden">'+
      '<div style="height:100%;width:'+Math.min(r.pct,100)+'%;background:'+(fin?'var(--ok)':'var(--perc)')+';border-radius:4px;transition:width .5s"></div>'+
    '</div>'+

    // Tabla resumen nivel 1
    '<div class="saldo-panel">'+
      fila('Recibido OK',r.recibidoOK,'var(--txt)')+
      '<div style="height:6px"></div>'+
      (r.perchado>0?fila('Perchado (normal)',r.perchado,'var(--ok)',r.recibidoOK?Math.round(r.perchado/r.recibidoOK*100):0):'') +
      (r.impo>0?fila('Importación',r.impo,'var(--acc)',r.recibidoOK?Math.round(r.impo/r.recibidoOK*100):0):'') +
      (r.sep>0?fila('Separación',r.sep,'var(--sep)',r.recibidoOK?Math.round(r.sep/r.recibidoOK*100):0):'') +
      (r.dana>0?fila('Dañados',r.dana,'var(--dan)',r.recibidoOK?Math.round(r.dana/r.recibidoOK*100):0):'') +
      (r.obse>0?fila('Observación',r.obse,'var(--warn)',r.recibidoOK?Math.round(r.obse/r.recibidoOK*100):0):'') +
      (r.pend>0?fila('Pendiente',r.pend,'var(--warn)',r.recibidoOK?Math.round(r.pend/r.recibidoOK*100):0):'') +
      '<div style="height:6px"></div>'+
      '<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;font-weight:700">'+
        '<span style="color:var(--mut)">Total movido</span>'+
        '<span>'+r.totalMovido.toLocaleString()+' un</span>'+
      '</div>'+
      '<div style="display:flex;justify-content:space-between;padding:8px 0;font-size:15px;font-weight:700;border-top:2px solid var(--bor)">'+
        '<span style="color:var(--mut)">Saldo pendiente</span>'+
        '<span style="color:'+(fin?'var(--ok)':'var(--dan)')+'">'+r.saldo.toLocaleString()+' un</span>'+

              '<div style="height:100%;width:'+Math.min(pctD,100)+'%;background:'+color+';border-radius:2px"></div>'+
            '</div>'+

        }).join('')+

    '<button class="btn btn-sec" style="margin-top:10px" onclick="showMenuPrincipal()">⌂ Menú principal</button>';

  render(h);
}

function _renderVisualizacion(pedido){
  render('<div class="loading"><div class="loading-icon">⏳</div><div>Cargando movimientos...</div></div>');
  Promise.all([
    cargarRecepcionesPedido(pedido),
    cargarMovimientosPedido(pedido),
  ]).then(function(res){
    var recepciones=res[0];
    var movs=res[1];
    console.log('[VIS] Pedido='+pedido+' recepciones='+recepciones.length+' movimientos='+movs.length);

    // Ordenar más reciente primero
    movs.sort(function(a,b){
      var ta=a.FechaMovimiento||a.Created||'';
      var tb=b.FechaMovimiento||b.Created||'';
      return tb.localeCompare(ta);
    });

    var resumen=calcularResumenPerchado(recepciones,movs);

    var h='<div class="badge badge-perc">👁 VISUALIZACIÓN</div>'+
      '<div class="badge badge-pedido" style="margin-left:6px">'+pedido+'</div>'+
      // Botón para cambiar de pedido
      '<div style="text-align:right;margin-top:-24px;margin-bottom:8px">'+
        '<span style="font-size:11px;color:var(--mut);cursor:pointer;text-decoration:underline" '+
          'onclick="S.pedido=\'\';showVistaOperativa()">cambiar pedido</span>'+
      '</div>';

    // ── Resumen rápido en tarjetas ─────────────────────────────
    function kpi(lbl,val,col){
      if(!val&&val!==0) return '';
      return '<div style="background:var(--sur2);border:1px solid var(--bor);border-radius:7px;'+
        'padding:8px 10px;text-align:center">'+
        '<div style="font-size:9px;color:var(--mut);margin-bottom:3px">'+lbl+'</div>'+
        '<div style="font-size:16px;font-weight:700;color:'+(col||'var(--txt)')+'">'+
          Number(val).toLocaleString()+'</div>'+
      '</div>';
    }
    h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0">'+
      kpi('Recibido OK', resumen.recibidoOK,'')+
      kpi('Saldo pendiente', resumen.saldo, resumen.finalizado?'var(--ok)':'var(--dan)')+
      kpi('Avance', resumen.pct+'%', resumen.finalizado?'var(--ok)':'var(--warn)')+
    '</div>'+
    '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">'+
      kpi('Perchado', resumen.perchado||0, 'var(--ok)')+
      kpi('Separación', resumen.sep||0, 'var(--sep)')+
      kpi('Dañados', resumen.dana||0, 'var(--dan)')+
      kpi('Observación', resumen.obse||0, 'var(--warn)')+
    '</div>';

    // ── Historial de movimientos (más reciente primero) ────────
    h+='<div style="font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.05em;'+
      'margin-bottom:6px">HISTORIAL DE MOVIMIENTOS ('+movs.length+')</div>';

    if(!movs.length){
      h+='<div class="empty-state"><div class="empty-icon">📋</div>Sin movimientos registrados</div>';
    } else {
      // Encabezado tabla
      h+='<div style="background:var(--sur);border:1px solid var(--bor);border-radius:8px;overflow:hidden">'+
        '<div style="display:grid;grid-template-columns:52px 1fr 1fr 56px 1fr;'+
          'gap:0;padding:6px 10px;background:var(--sur2);'+
          'font-size:9px;font-weight:700;color:var(--mut);letter-spacing:.04em">'+
          '<span>HORA</span><span>OPERADOR</span><span>SKU</span>'+
          '<span style="text-align:right">CANT</span><span style="text-align:right">DESTINO</span>'+
        '</div>';

      movs.forEach(function(mov,i){
        // Hora local desde FechaMovimiento ISO
        var _fm=mov.FechaMovimiento||mov.Created||'';
        var horaStr='—';
        var fechaStr='';
        if(_fm.length>=16){
          try{
            var _d=new Date(_fm);
            if(!isNaN(_d)){
              horaStr=pad(_d.getHours())+':'+pad(_d.getMinutes());
              fechaStr=pad(_d.getDate())+'/'+(pad(_d.getMonth()+1));
            }
          }catch(e){}
        }
        // Color por tipo de destino
        var tipo=categorizarMovimiento(mov);
        var tipoCols={PERCHADO:'var(--ok)',SEPARACION:'var(--sep)',
          SEP:'var(--sep)',DANA:'var(--dan)',OBSE:'var(--warn)',PEND:'var(--warn)'};
        var col=tipoCols[tipo]||'var(--txt)';
        var bg=i%2===0?'':'background:rgba(255,255,255,.02)';
        h+='<div style="display:grid;grid-template-columns:52px 1fr 1fr 56px 1fr;'+
          'gap:0;padding:7px 10px;border-top:1px solid var(--bor);font-size:11px;'+bg+'">'+
          '<div style="color:var(--mut)">'+
            '<div>'+horaStr+'</div>'+
            (fechaStr?'<div style="font-size:9px">'+fechaStr+'</div>':'')+
          '</div>'+
          '<div style="font-size:10px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
            (mov.Operador||'—')+'</div>'+
          '<div style="font-weight:700;color:'+col+'">'+
            (mov.SKU||'—')+
            '<div style="font-size:9px;color:var(--mut);font-weight:400">'+
              (mov.TipoMovimiento||'')+'</div>'+
          '</div>'+
          '<div style="text-align:right;font-weight:700">'+Number(mov.Cantidad||0).toLocaleString()+'</div>'+
          '<div style="text-align:right;font-size:10px;color:var(--mut);overflow:hidden;text-overflow:ellipsis">'+
            (mov.AlmacenDestino||'—')+
            (mov.UbicacionDestino?'<div style="font-size:9px">'+mov.UbicacionDestino+'</div>':'')+
          '</div>'+
        '</div>';
      });
      h+='</div>';
    }

    // ── Totales por destino ────────────────────────────────────
    if(resumen.detalle&&resumen.detalle.length){
      h+='<div style="font-size:11px;font-weight:700;color:var(--mut);letter-spacing:.05em;'+
        'margin:12px 0 6px">TOTALES POR DESTINO</div>';
      var tipoCols2={PERCHADO:'var(--ok)',IMPO:'var(--acc)',SEP:'var(--sep)',
        DANA:'var(--dan)',OBSE:'var(--warn)',PEND:'var(--warn)'};
      resumen.detalle.forEach(function(d){
        var col2=tipoCols2[d.tipo]||'var(--txt)';
        var pct=resumen.recibidoOK>0?Math.round(d.cantidad/resumen.recibidoOK*100):0;
        h+='<div style="display:flex;align-items:center;gap:10px;padding:7px 0;'+
          'border-bottom:1px solid var(--bor);font-size:12px">'+
          '<div style="width:8px;height:8px;border-radius:50%;background:'+col2+';flex-shrink:0"></div>'+
          '<div style="flex:1">'+
            '<div style="font-weight:700">'+d.almacen+'</div>'+
            '<div style="font-size:10px;color:var(--mut)">'+d.ubicacion+
              ' · <span style="color:'+col2+'">'+d.tipo+'</span></div>'+
          '</div>'+
          '<div style="text-align:right">'+
            '<div style="font-weight:700">'+Number(d.cantidad).toLocaleString()+' un</div>'+
            '<div style="font-size:10px;color:var(--mut)">'+pct+'%</div>'+
          '</div>'+
        '</div>';
      });
    }

    h+='<div style="margin-top:16px;display:flex;gap:8px">'+
      '<button class="btn btn-sec" style="flex:1" onclick="S.pedido=\'\';showVistaOperativa()">'+
        '🔄 Otro pedido</button>'+
      '<button class="btn btn-sec" style="flex:1" onclick="showMenuPrincipal()">⌂ Menú</button>'+
    '</div>';

    render(h);
  }).catch(function(e){
    console.error('[VIS] Error:',e.message);
    render('<div class="empty-state"><div class="empty-icon">⚠</div>Error cargando datos: '+e.message+'</div>');
  });
}
