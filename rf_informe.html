<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Informe de Novedades — Inverneg</title>
<style>
/* ── APP SHELL (solo pantalla) ─────────────────────────────────── */
:root{
  --bg:#0D1117;--sur:#161B22;--sur2:#1C2330;--bor:#2A3340;
  --txt:#E6EDF3;--mut:#7D8590;--acc:#58A6FF;--ok:#3FB950;
  --warn:#E3B341;--dan:#F85149;--rec:#F0883E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
.hdr{background:var(--sur);border-bottom:1px solid var(--bor);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.hdr-brand{font-size:13px;font-weight:700;color:var(--rec)}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.ftr{background:var(--sur);border-top:1px solid var(--bor);padding:8px 16px;font-size:11px;color:var(--mut);display:flex;justify-content:space-between}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:5px}
.dot.ok{background:var(--ok)}.dot.err{background:var(--dan)}
#screen{padding:16px;max-width:1000px;margin:0 auto}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;margin-top:10px}
.inp{width:100%;background:var(--sur2);border:1px solid var(--bor);color:var(--txt);font-size:15px;padding:9px 12px;border-radius:6px;outline:none;font-family:inherit}
.inp:focus{border-color:var(--acc)}
select.inp{appearance:none}
.btn{border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:active{opacity:.75}
.btn-rec{background:var(--rec);color:#000}
.btn-sec{background:var(--sur2);color:var(--txt);border:1px solid var(--bor)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.loading{text-align:center;padding:40px;color:var(--mut);font-size:13px}
.dd-item:hover{background:var(--bor)!important}

/* ═══════════════════════════════════════════════════════════════
   ESTILOS DEL INFORME — optimizados para A4
   ═══════════════════════════════════════════════════════════════ */
#informe-wrap{margin-top:20px}

.informe-page{
  background:#fff;color:#000;
  width:210mm;
  margin:0 auto 24px;
  padding:10mm 12mm 10mm 12mm;
  font-family:'Arial Narrow','Arial',sans-serif;
  font-size:9pt;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
}

/* Encabezado */
.inf-titulo{
  text-align:center;font-size:11pt;font-weight:700;
  letter-spacing:.06em;margin-bottom:8px;text-decoration:underline;
  text-transform:uppercase;
}
.inf-meta{margin-bottom:6px}
.inf-meta table{border-collapse:collapse;font-size:9pt}
.inf-meta td{padding:2px 4px 2px 0;line-height:1.5}
.inf-meta td:first-child{font-weight:700;white-space:nowrap;min-width:55px}
.inf-narr{font-size:8.5pt;margin-bottom:6px;line-height:1.5}

/* Tablas — tamaño FIJO: siempre 10 filas visibles */
.inf-tabla{width:100%;border-collapse:collapse;font-size:7pt;margin-bottom:5px;table-layout:fixed}
.inf-tabla th{
  background:#c0c0c0;border:1px solid #666;padding:2px 3px;
  text-align:center;font-size:7.5pt;font-weight:700;white-space:nowrap;
}
.inf-tabla td{
  border:1px solid #888;padding:2px 4px;text-align:center;
  vertical-align:middle;height:16px;font-size:8pt;
}
.inf-tabla td.left{text-align:left}
.inf-tabla tfoot td{font-weight:700;background:#ddd;border:1px solid #666;padding:2px 4px;text-align:center;font-size:8pt}

/* Anchos columnas tabla contenedores */
.inf-tabla col.c-num   {width:5%}
.inf-tabla col.c-cont  {width:22%}
.inf-tabla col.c-sello {width:13%}
.inf-tabla col.c-cap   {width:9%}
.inf-tabla col.c-fecha {width:14%}
.inf-tabla col.c-pall  {width:10%}

/* Tabla tiempos */
.inf-tabla-tiempos{width:100%;border-collapse:collapse;font-size:7pt;margin-bottom:5px;table-layout:fixed}
.inf-tabla-tiempos th{background:#c0c0c0;border:1px solid #666;padding:2px 4px;text-align:center;font-size:7.5pt;font-weight:700}
.inf-tabla-tiempos td{border:1px solid #888;padding:2px 4px;text-align:center;height:16px;font-size:8pt}
.inf-tabla-tiempos col.c-num{width:5%}
.inf-tabla-tiempos col.c-hora{width:11%}
.inf-tabla-tiempos col.c-tpo{width:13%}

/* Personal */
.inf-personal{font-size:8.5pt;margin:4px 0;line-height:1.5}
.inf-personal span{font-weight:700}
.inf-seccion{font-weight:700;margin:7px 0 4px;font-size:9pt;text-decoration:underline}
.inf-bodega{font-size:8.5pt;margin:0 0 4px;font-style:italic}

/* Tabla novedades */
.inf-tabla-nov{width:100%;border-collapse:collapse;font-size:7pt;margin-bottom:5px;table-layout:fixed}
.inf-tabla-nov th{background:#c0c0c0;border:1px solid #666;padding:2px 4px;text-align:center;font-size:7.5pt;font-weight:700}
.inf-tabla-nov td{border:1px solid #888;padding:2px 4px;height:16px;font-size:8pt}
.inf-tabla-nov td.right{text-align:right}
.inf-tabla-nov col.c-num  {width:4%}
.inf-tabla-nov col.c-item {width:14%}
.inf-tabla-nov col.c-lote {width:14%}
.inf-tabla-nov col.c-cant {width:10%}
.inf-tabla-nov col.c-marc {width:12%}
.inf-tabla-nov col.c-obs  {width:25%}
.inf-tabla-nov col.c-cont {width:21%}

/* Comentarios */
.inf-comentarios{font-size:8.5pt;white-space:pre-wrap;padding:5px 8px;border:1px solid #bbb;min-height:32px;background:#fafafa;line-height:1.6}

/* Firmas */
.inf-firmas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:22px;font-size:8.5pt;page-break-inside:avoid;}
.inf-firma-bloque{text-align:center}
.inf-firma-linea{border-top:1px solid #000;padding-top:4px;margin-top:42px;line-height:1.6}


/* Tabla detalle de recepción */
.inf-tabla-det{width:100%;border-collapse:collapse;font-size:8pt;margin-bottom:8px;table-layout:fixed}
.inf-tabla-det th{background:#c0c0c0;border:1px solid #666;padding:3px 4px;text-align:center;font-size:7.5pt;font-weight:700}
.inf-tabla-det td{border:1px solid #888;padding:2px 4px;height:15px;font-size:8pt}
.inf-tabla-det td.left{text-align:left}
.inf-tabla-det td.right{text-align:right}
.inf-tabla-det tfoot td{font-weight:700;background:#ddd;border:1px solid #666;padding:2px 4px;font-size:8pt}

/* Tabla detalle LPN */
.inf-tabla-lpn{width:100%;border-collapse:collapse;font-size:8pt;margin-bottom:4px;table-layout:fixed}
.inf-tabla-lpn th{background:#d8d8d8;border:1px solid #666;padding:2px 4px;text-align:center;font-size:7.5pt;font-weight:700}
.inf-tabla-lpn td{border:1px solid #aaa;padding:2px 5px;font-size:8pt}
.inf-tabla-lpn td.right{text-align:right}
.inf-tabla-lpn td.center{text-align:center}
.inf-tabla-lpn tfoot td{font-weight:700;background:#eee;border:1px solid #888;padding:2px 5px;font-size:8pt}
.inf-bloque-sku{border:1px solid #bbb;border-radius:4px;padding:8px 10px;margin-bottom:10px;page-break-inside:avoid}
.inf-sku-hdr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:6px;margin-bottom:6px;font-size:8pt}
.inf-sku-cell{border:1px solid #ccc;border-radius:3px;padding:3px 6px}
.inf-sku-cell .lbl{font-size:6.5pt;color:#666;text-transform:uppercase}
.inf-sku-cell .val{font-weight:700;font-size:9pt}
/* ── PRINT — eliminar headers/footers del navegador ─────────────── */
@page{
  size:A4 portrait;
  margin:0;  /* SIN márgenes — el padding lo maneja .informe-page */
}
@media print{
  html,body{
    background:#fff!important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  /* Ocultar todo excepto las páginas del informe */
  .hdr,.ftr,#screen>*:not(#informe-wrap),.btn-row,.no-print{display:none!important}
  #informe-wrap{margin:0!important}
  .informe-page{
    box-shadow:none!important;
    margin:0!important;
    width:210mm!important;
    min-height:auto!important;
    page-break-after:always;
    page-break-inside:avoid;
    border:none!important;
    padding:10mm 12mm!important;
  }
  .informe-page:last-child{page-break-after:auto}
  /* Forzar fondo gris en encabezados de tablas al imprimir */
  .inf-tabla th,.inf-tabla-tiempos th,.inf-tabla-nov th{background:#c0c0c0!important}
  .inf-tabla tfoot td{background:#ddd!important}
}

/* ── DETALLE DE RECEPCIÓN ────────────────────────────────────────── */
.det-page{
  background:#fff;color:#000;
  width:210mm;
  min-height:auto;
  margin:0 auto 24px;
  padding:12mm 14mm;
  font-family:'Arial Narrow','Arial',sans-serif;
  font-size:9pt;
  box-shadow:0 2px 12px rgba(0,0,0,.4);
}
.det-titulo{text-align:center;font-size:11pt;font-weight:700;letter-spacing:.05em;text-decoration:underline;text-transform:uppercase;margin-bottom:8px}
.det-meta{font-size:9pt;margin-bottom:8px}
.det-meta b{font-weight:700}
.det-tabla{width:100%;border-collapse:collapse;font-size:8pt;margin-top:6px;table-layout:fixed}
.det-tabla th{background:#c0c0c0;border:1px solid #666;padding:3px 5px;text-align:center;font-size:8pt;font-weight:700}
.det-tabla td{border:1px solid #888;padding:2px 5px;vertical-align:middle;font-size:8pt}
.det-tabla td.right{text-align:right}
.det-tabla td.center{text-align:center}
.det-tabla tr.completo td{background:#f0fff0}
.det-tabla tr.novedad td{background:#fff8f0}
.det-resumen{margin-top:10px;font-size:8.5pt;padding:6px 10px;border:1px solid #ccc;background:#f9f9f9}
.det-resumen b{font-weight:700}
@media print{
  .det-page{box-shadow:none!important;margin:0!important;width:210mm!important;page-break-after:always;border:none!important;padding:12mm 14mm!important}
  .det-page:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<div class="hdr">
  <div><div class="hdr-brand">▸ INFORMES DE NOVEDADES</div>
  <div class="hdr-sub">Inverneg · CND</div></div>
  <div style="font-size:11px;color:var(--mut)"><span class="dot" id="conn-dot"></span><span id="conn-lbl">CONECTANDO</span></div>
</div>

<div id="screen">
  <div class="loading" id="init-msg">Iniciando sesión Microsoft...</div>
</div>

<div class="ftr">
  <span>RF Novedades v1.0</span>
  <span id="ftr-user">—</span>
</div>

<script>
(function(){
'use strict';

/* ── CFG ─────────────────────────────────────── */
var CFG={
  clientId:   'ec976114-e146-4ce4-850c-5d978e12acfd',
  tenantId:   '5e008bd3-17b6-4f83-8d23-019691a40609',
  siteId:     'inverneg.sharepoint.com,8b946a6c-31b9-4bf7-95d0-ab47d29a4d63,ad88c61f-b207-49a4-9105-8b3b57b31906',
  catalogoNombre:'Inverneg_ConteoRF_Base_Live.xlsx',
  listas:{
    recepciones: 'RF_PRecepciones_LRecepciones',
    horas:       'RF_PRecepciones_LHoras',
  },
  defaults:{de:'Giuseppe Junco', para:'Karem Palan'},
};
var GRAPH='https://graph.microsoft.com/v1.0';
var msalInst, msalAcc;
var SCOPES=['Files.ReadWrite','Sites.ReadWrite.All'];
// Exponer al scope global para los onclick del HTML
window._loginRedirect=function(){if(msalInst)msalInst.loginRedirect({scopes:SCOPES});else console.error('msalInst no listo');}

/* ── DB ─────────────────────────────────────── */
var DB={
  pedidos:[],contenedores:[],packing:[],codigosBarra:[],
  catalogoDriveId:null,catalogoItemId:null,
  listIds:{recepciones:null,horas:null},
};

/* ── UTILS ───────────────────────────────────── */
function pad(n){return String(n).padStart(2,'0');}
function hoy(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fechaLarga(iso){
  if(!iso) return '';
  var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var p=iso.split('-'); if(p.length<3) return iso;
  return parseInt(p[2])+' de '+meses[parseInt(p[1])-1]+' de '+p[0];
}
function fechaCorta(iso){
  if(!iso) return ''; var p=iso.split('-');
  return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;
}
function normalizarFecha(v){
  if(!v) return '';
  if(typeof v==='number'){
    var d=new Date(Math.round((v-25569)*86400*1000));
    return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
  }
  var s=v.toString().trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  if(s.indexOf('T')>-1) return s.substring(0,10);
  var pts=s.split('/');
  if(pts.length===3){
    var d2=parseInt(pts[0]),m2=parseInt(pts[1]),a2=pts[2].length===4?pts[2]:'20'+pts[2];
    return a2+'-'+String(m2).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
  }
  return s;
}
function calcTiempo(desde,hasta){
  if(!desde||!hasta) return '—';
  var toMin=function(t){var p=t.split(':');return parseInt(p[0])*60+parseInt(p[1]||0);};
  var diff=toMin(hasta)-toMin(desde);
  if(diff<0) diff+=1440;
  var h=Math.floor(diff/60),m=diff%60;
  return pad(h)+':'+pad(m);
}
function normStr(s){return s?s.toString().trim().toUpperCase():'';}
function $r(id){return document.getElementById(id);}
function render(html){document.getElementById('screen').innerHTML=html;}
function setConn(s){
  var dot=$r('conn-dot'),lbl=$r('conn-lbl');
  dot.className='dot'+(s==='ok'?' ok':s==='err'?' err':'');
  lbl.textContent=s==='ok'?'LIVE':s==='err'?'SIN CONEXIÓN':'CONECTANDO';
}

/* ── GRAPH ───────────────────────────────────── */
function getToken(){
  var req={scopes:SCOPES,account:msalAcc};
  return msalInst.acquireTokenSilent(req).catch(function(){return msalInst.acquireTokenRedirect(req);});
}
function gGet(url){
  return getToken().then(function(r){
    return fetch(url,{headers:{'Authorization':'Bearer '+r.accessToken}});
  }).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error(r.status+':'+t.slice(0,120));});return r.json();});
}
function urlWB(hoja){
  return GRAPH+'/drives/'+DB.catalogoDriveId+'/items/'+DB.catalogoItemId+
    "/workbook/worksheets('"+hoja+"')/usedRange";
}
function urlLista(id){return GRAPH+'/sites/'+CFG.siteId+'/lists/'+id;}

/* ── DESCUBRIMIENTO ───────────────────────────── */
function descubrirListas(){
  return gGet(GRAPH+'/sites/'+CFG.siteId+'/lists?$select=id,displayName&$top=200').then(function(d){
    (d.value||[]).forEach(function(l){
      Object.keys(CFG.listas).forEach(function(k){if(l.displayName===CFG.listas[k])DB.listIds[k]=l.id;});
    });
  }).catch(function(e){console.error('[INIT] listas:',e.message);});
}
function descubrirExcel(){
  var nom=CFG.catalogoNombre;
  var urlSP=GRAPH+'/sites/'+CFG.siteId+'/drive/root/search(q=\''+encodeURIComponent(nom)+'\')';
  return gGet(urlSP).then(function(d){
    var f=d.value&&d.value.find(function(x){return x.name===nom;});
    if(!f) return gGet(GRAPH+'/me/drive/root/search(q=\''+encodeURIComponent(nom)+'\')').then(function(d2){
      return d2.value&&d2.value.find(function(x){return x.name===nom;});
    });
    return f;
  }).then(function(f){
    if(!f){console.error('[INIT] Excel no encontrado');return;}
    DB.catalogoDriveId=f.parentReference&&f.parentReference.driveId;
    DB.catalogoItemId=f.id;
  }).catch(function(e){console.error('[INIT] Excel:',e.message);});
}

/* ── LECTURA DE CATÁLOGOS ────────────────────── */
function cargarCatalogos(){
  return descubrirExcel().then(function(){
    if(!DB.catalogoDriveId) return;
    return Promise.all([
      gGet(urlWB('Pedidos')).then(function(d){parsearPedidos(d);}).catch(function(){}),
      gGet(urlWB('Contenedores')).then(function(d){parsearContenedores(d);}).catch(function(){}),
      gGet(urlWB('Packing')).then(function(d){parsearPacking(d);}).catch(function(){}),
      gGet(urlWB('C.Barra')).then(function(d){parsearCBarra(d);}).catch(function(){}),
    ]);
  });
}
function filaValida(v){return v!==null&&v!==undefined&&v.toString().trim().length>0;}
function parsearPedidos(d){
  if(!d||!d.values||d.values.length<2) return;
  var hdr=d.values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  var iP=hdr.indexOf('pedido');
  var iT=hdr.findIndex(function(h){return h==='tipo';});
  var iS=hdr.findIndex(function(h){return h==='status'||h==='estado';});
  d.values.slice(1).forEach(function(r){
    if(!filaValida(r[iP])) return;
    DB.pedidos.push({pedido:r[iP].toString().trim(),tipo:iT>=0&&r[iT]?r[iT].toString().trim():'',status:iS>=0&&r[iS]?r[iS].toString().trim():''});
  });
}
function parsearContenedores(d){
  if(!d||!d.values||d.values.length<2) return;
  var hdr=d.values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  var iP=hdr.indexOf('pedido');
  var iFP=hdr.findIndex(function(h){return h.indexOf('fechaprog')>-1||h==='fechaprogramada';});
  var iC=hdr.findIndex(function(h){return h.indexOf('contenedor')>-1;});
  var iS1=hdr.findIndex(function(h){return h.indexOf('sello')>-1&&!h.includes('2');});
  var iS2=hdr.findIndex(function(h){return h.includes('sello')&&(h.includes('2')||h.includes('ii'));});
  var iPall=hdr.findIndex(function(h){return h.indexOf('pallet')>-1;});
  var iStat=hdr.findIndex(function(h){return h==='status'||h==='estado';});
  var iFR=hdr.findIndex(function(h){return h.indexOf('fecharec')>-1;});
  d.values.slice(1).forEach(function(r){
    if(!filaValida(r[iP])) return;
    DB.contenedores.push({
      pedido:r[iP].toString().trim(),
      fechaProg:iFP>=0?normalizarFecha(r[iFP]):'',
      contenedor:iC>=0&&r[iC]?r[iC].toString().trim():'',
      pallets:iPall>=0&&r[iPall]?Number(r[iPall]):0,
      status:iStat>=0&&r[iStat]?r[iStat].toString().trim():'',
      fechaRec:iFR>=0?normalizarFecha(r[iFR]):'',
    });
  });
}
function parsearPacking(d){
  if(!d||!d.values||d.values.length<2) return;
  var hdr=d.values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  var iP=hdr.indexOf('pedido'),iS=hdr.findIndex(function(h){return h==='sku';});
  var iD=hdr.findIndex(function(h){return h.indexOf('desc')>-1;});
  var iQ=hdr.findIndex(function(h){return h.indexOf('cant')>-1||h==='cantidad';});
  d.values.slice(1).forEach(function(r){
    if(!filaValida(r[iP])||!filaValida(r[iS])) return;
    DB.packing.push({pedido:r[iP].toString().trim(),sku:r[iS].toString().trim(),desc:iD>=0&&r[iD]?r[iD].toString().trim():'',cantidad:iQ>=0&&r[iQ]?Number(r[iQ]):0});
  });
}
function parsearCBarra(d){
  if(!d||!d.values||d.values.length<2) return;
  var hdr=d.values[0].map(function(v){return(v||'').toString().trim().toLowerCase();});
  // Bug fix: indexOf puede devolver 0 (col A) que es falsy — no usar ||0
  var iS=hdr.findIndex(function(h){return h==='sku'||h==='codigo'||h==='cod';});
  if(iS<0) iS=0; // fallback col A si no encuentra encabezado SKU
  var iD=hdr.findIndex(function(h){return h.indexOf('desc')>-1;});
  var iM=hdr.findIndex(function(h){return h==='marca';});
  console.log('[C.BARRA] Encabezado:',hdr.join('|'),'| iSKU='+iS+' iDesc='+iD+' iMarca='+iM);
  var agregados=0;
  d.values.slice(1).forEach(function(r){
    if(!filaValida(r[iS])) return;
    var sku=r[iS].toString().trim();
    var marca=iM>=0&&r[iM]?r[iM].toString().trim():'';
    // Solo guardar primera ocurrencia de cada SKU para la marca
    if(!DB.codigosBarra.find(function(x){return x.sku===sku;})){
      DB.codigosBarra.push({sku:sku,desc:iD>=0&&r[iD]?r[iD].toString().trim():'',marca:marca});
      agregados++;
    }
  });
  console.log('[C.BARRA] SKUs únicos cargados:',agregados,'| Total registros:',d.values.length-1);
}
function getMarca(sku){
  var it=DB.codigosBarra.find(function(r){return normStr(r.sku)===normStr(sku);});
  return it?it.marca:'';
}

function cargarHorasPedido(pedido){
  if(!DB.listIds.horas){
    console.error('[LHORAS-INFO] Lista horas no disponible (DB.listIds.horas=null)');
    return Promise.resolve([]);
  }
  console.log('[LHORAS-INFO] Cargando LHoras para Pedido="'+pedido+'" listId='+DB.listIds.horas);
  return gGet(urlLista(DB.listIds.horas)+'/items?$expand=fields&$top=500').then(function(d){
    var items=(d.value||[]);
    console.log('[LHORAS-INFO] Total ítems en LHoras:',items.length);
    // Log primeros 3 para ver la estructura de campos
    items.slice(0,3).forEach(function(i,idx){
      var f=i.fields||{};
      var keys=Object.keys(f).filter(function(k){return !k.startsWith('@');});
      console.log('[LHORAS-INFO] Item['+idx+'] keys:',keys.join(','));
      console.log('[LHORAS-INFO] Item['+idx+'] Pedido="'+(f.Pedido||f.pedido||'?')+
        '" Contenedor="'+(f.Contenedor||f.contenedor||'?')+
        '" HoraLlegada="'+(f.HoraLlegada||'?')+
        '" Sello1="'+(f.Sello1||'?')+'"');
    });
    var fields=items.map(function(i){return i.fields||{};});
    var filtrados=fields.filter(function(f){
      var pedSP=f.Pedido||f.pedido||'';
      var match=normStr(pedSP)===normStr(pedido);
      return match;
    });
    console.log('[LHORAS-INFO] Pedido="'+pedido+'" -> Encontrados:',filtrados.length,
      'de',fields.length,'totales');
    if(filtrados.length>0){
      filtrados.forEach(function(f,i){
        console.log('[LHORAS-INFO] ['+i+'] Contenedor="'+(f.Contenedor||'?')+
          '" Llegada="'+(f.HoraLlegada||'')+'" Apertura="'+(f.HoraApertura||'')+
          '" Cierre="'+(f.HoraCierre||'')+'" Salida="'+(f.HoraSalida||'')+
          '" Personas='+(f.Personas||0)+
          ' Sello1="'+(f.Sello1||'')+'" Sello2="'+(f.Sello2||'')+'"');
      });
    } else if(fields.length>0){
      // Mostrar los valores de Pedido que hay en SP para comparar
      var pedidosSP=[...new Set(fields.map(function(f){return f.Pedido||f.pedido||'(vacío)';}))];
      console.warn('[LHORAS-INFO] Pedidos en LHoras SP:',pedidosSP.join(' | '));
      console.warn('[LHORAS-INFO] Buscando:',normStr(pedido),' vs SP:',pedidosSP.map(normStr).join(' | '));
    }
    return filtrados;
  }).catch(function(e){
    console.error('[LHORAS-INFO] Error cargando LHoras:',e.message);
    return[];
  });
}
function cargarRecepcionesPedido(pedido){
  if(!DB.listIds.recepciones) return Promise.resolve([]);
  return gGet(urlLista(DB.listIds.recepciones)+'/items?$expand=fields&$top=2000').then(function(d){
    return (d.value||[]).map(function(i){return i.fields||{};}).filter(function(f){
      return normStr(f.Pedido||'')===normStr(pedido);
    });
  }).catch(function(){return[];});
}

function _initBuscador(){
  var inp=document.getElementById('inp-busca');
  var drop=document.getElementById('lista-drop');
  if(!inp||!drop) return;

  inp.addEventListener('input', function(){
    _renderDrop(this.value);
  });
  inp.addEventListener('focus', function(){
    _renderDrop(this.value);
  });
  inp.addEventListener('blur', function(){
    setTimeout(function(){
      if(drop) drop.style.display='none';
    }, 200);
  });
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      var p=getPedidoActivo();
      if(p){ seleccionarPedido(p); }
      else { alert('Escribe un código de pedido válido'); }
    }
  });
}

function _renderDrop(q){
  var drop=document.getElementById('lista-drop');
  if(!drop) return;
  var norm=(q||'').trim().toUpperCase();
  var matches=DB.pedidos.filter(function(p){
    return !norm||p.pedido.toUpperCase().indexOf(norm)>-1||(p.tipo||'').toUpperCase().indexOf(norm)>-1;
  }).slice(0,20);

  // Limpiar y reconstruir con DOM puro
  drop.innerHTML='';
  if(!matches.length||!norm){ drop.style.display='none'; return; }

  matches.forEach(function(p){
    var item=document.createElement('div');
    item.style.cssText='padding:8px 12px;cursor:pointer;border-bottom:1px solid #2A3340;font-size:13px;color:#E6EDF3;user-select:none';
    item.innerHTML='<span style="color:#58A6FF;font-weight:700">'+p.pedido+'</span>'+
      (p.tipo?' <span style="color:#7D8590;font-size:11px"> · '+p.tipo+'</span>':'');
    item.addEventListener('mouseover', function(){ this.style.background='#2A3340'; });
    item.addEventListener('mouseout',  function(){ this.style.background=''; });
    // mousedown con preventDefault evita que blur del input cierre el dropdown
    // antes de que el clic se registre
    item.addEventListener('mousedown', function(e){
      e.preventDefault();
      console.log('[PEDIDO] clic en item:', p.pedido);
      seleccionarPedido(p.pedido);
    });
    drop.appendChild(item);
  });
  drop.style.display='block';

  // Si texto coincide exactamente con un pedido, preseleccionar
  var exacto=DB.pedidos.find(function(p){return p.pedido.toUpperCase()===norm;});
  if(exacto&&exacto.pedido!==window._pedidoSeleccionado){
    window._pedidoSeleccionado=exacto.pedido;
    console.log('[PEDIDO] coincidencia exacta preseleccionada:', exacto.pedido);
    _actualizarBadge();
  }
}

function seleccionarPedido(ped){
  console.log('[PEDIDO] seleccionarPedido("'+ped+'")');
    var inp=document.getElementById('inp-busca');
  var drop=document.getElementById('lista-drop');
  if(inp)  inp.value=ped;
  if(drop) drop.style.display='none';
  _actualizarBadge();
  console.log('[PEDIDO] _pedidoSeleccionado="'+window._pedidoSeleccionado+'"');
}

function _actualizarBadge(){
  var badge=document.getElementById('pedido-badge');
  if(!badge) return;
  if(window._pedidoSeleccionado){
    badge.textContent='✅ Pedido seleccionado: '+window._pedidoSeleccionado;
    badge.style.display='block';
  } else {
    badge.style.display='none';
  }
}

function getPedidoActivo(){
  // 1. Pedido confirmado por clic o coincidencia exacta
  if(window._pedidoSeleccionado){
    console.log('[PEDIDO] getPedidoActivo()="'+window._pedidoSeleccionado+'"');
    return window._pedidoSeleccionado;
  }
  // 2. Fallback: texto del input si coincide exactamente
  var v=(document.getElementById('inp-busca')||{}).value||'';
  var found=DB.pedidos.find(function(p){return p.pedido.toUpperCase()===v.toUpperCase();});
  if(found){
    console.log('[PEDIDO] getPedidoActivo() fallback="'+found.pedido+'"');
    return found.pedido;
  }
  console.warn('[PEDIDO] getPedidoActivo()="" — nada seleccionado');
  return '';
}

/* ── GENERAR INFORME ─────────────────────────── */
function generarInforme(){
  var pedido=getPedidoActivo();
  console.log('[PEDIDO] generarInforme() pedido="'+pedido+'"');
  if(!pedido){alert('Selecciona un pedido del buscador antes de generar el informe');return;}
  var de=$r('inp-de').value.trim()||CFG.defaults.de;
  var para=$r('inp-para').value.trim()||CFG.defaults.para;
  $r('informe-wrap').innerHTML='<div class="loading">⏳ Cargando datos del pedido...</div>';

  var conts=DB.contenedores.filter(function(c){return normStr(c.pedido)===normStr(pedido);});
  var packingPedido=DB.packing.filter(function(p){return normStr(p.pedido)===normStr(pedido);});

  Promise.all([cargarHorasPedido(pedido),cargarRecepcionesPedido(pedido)]).then(function(res){
    var horas=res[0], recepciones=res[1];

    function getHoras(cont){
      var h=horas.find(function(h){return normStr(h.Contenedor||'')===normStr(cont);});
      if(!h) console.warn('[LHORAS-INFO] getHoras("'+cont+'") -> NO ENCONTRADO en',horas.length,'registros LHoras');
      return h||{};
    }

    // Fecha recepción
    var fechaRec='';
    conts.forEach(function(c){if(!fechaRec&&c.fechaRec) fechaRec=c.fechaRec;});
    horas.forEach(function(h){if(!fechaRec&&h.FechaRegistro) fechaRec=h.FechaRegistro;});

    // ── NOVEDADES ─────────────────────────────────────────────────
    var lineasNovedad=[];

    // Daños y observaciones por registro
    recepciones.forEach(function(r){
      var est=normStr(r.Estado||'');
      var nov=(r.Novedades||'').trim();
      if(est==='CORRECCION') return;
      if(est==='DAÑADO'||est==='DANADO'||est==='DAÑADA'){
        lineasNovedad.push({sku:r.CodProducto||'',lote:r.Lote||'',cantidad:Number(r.Cantidad)||0,marca:getMarca(r.CodProducto||''),obs:'DAÑADO',contenedor:r.Contenedor||''});
      } else if(nov){
        lineasNovedad.push({sku:r.CodProducto||'',lote:r.Lote||'',cantidad:Number(r.Cantidad)||0,marca:getMarca(r.CodProducto||''),obs:nov,contenedor:r.Contenedor||''});
      }
    });

    // Diferencias vs Packing
    // REGLA: el neto incluye TODOS los registros (OK + DAÑADO + CORRECCION).
    // Las correcciones son cantidades negativas que ajustan el saldo real.
    // Se excluyen solo como líneas independientes de novedad, no del cálculo.
    packingPedido.forEach(function(pk){
      var esperado=pk.cantidad;
      var recibidoNeto=0;
      var contEj='',loteEj='';
      recepciones.forEach(function(r){
        if(normStr(r.CodProducto||'')===normStr(pk.sku)){
          recibidoNeto+=Number(r.Cantidad)||0;
          if(!contEj){contEj=r.Contenedor||'';loteEj=r.Lote||'';}
        }
      });
      var diff=recibidoNeto-esperado;
      if(diff!==0){
        lineasNovedad.push({
          sku:pk.sku,lote:loteEj,cantidad:Math.abs(diff),
          marca:getMarca(pk.sku),
          obs:diff<0?'FALTANTE':'SOBRANTE',
          contenedor:contEj,
        });
      }
    });
    
    var orden={'DAÑADO':0,'FALTANTE':1,'SOBRANTE':2};
    lineasNovedad.sort(function(a,b){
      var oa=orden[a.obs]!==undefined?orden[a.obs]:3;
      var ob=orden[b.obs]!==undefined?orden[b.obs]:3;
      return oa-ob||(a.sku<b.sku?-1:a.sku>b.sku?1:0);
    });

    // Comentarios
    var comentarios='';
    conts.forEach(function(c){
      var h=getHoras(c.contenedor);
      if(h.Novedades&&h.Novedades.trim()) comentarios+='CONTENEDOR '+c.contenedor+':\n'+h.Novedades.trim()+'\n\n';
    });
    comentarios=comentarios.trim();

    // ── PAGINACIÓN (10 fijos por página) ─────────────────────────
    var TOTAL=10;
    var paginas=[];
    if(conts.length===0){paginas=[[]];}
    else{for(var i=0;i<conts.length;i+=TOTAL) paginas.push(conts.slice(i,i+TOTAL));}

    var htmlOut='';
    paginas.forEach(function(paginaConts,pIdx){
      var esUltima=pIdx===paginas.length-1;
      var totalPallets=0;
      paginaConts.forEach(function(c){totalPallets+=Number(getHoras(c.contenedor).PalletsRecibidos||0);});

      htmlOut+='<div class="informe-page">';

      // Encabezado
      htmlOut+='<div class="inf-titulo">INFORME DE NOVEDADES DE IMPORTACION</div>';
      htmlOut+='<div class="inf-meta"><table>';
      htmlOut+='<tr><td>DE&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;:</td><td>'+esc(de)+'</td></tr>';
      htmlOut+='<tr><td>PARA&nbsp;&nbsp;:</td><td>'+esc(para)+'</td></tr>';
      htmlOut+='<tr><td>FECHA</td><td>'+fechaCorta(hoy())+'</td></tr>';
      htmlOut+='<tr><td>PEDIDO</td><td><b>'+esc(pedido)+'</b></td></tr>';
      htmlOut+='</table></div>';
      htmlOut+='<p class="inf-narr">Informo a Ud. que con fecha <b>'+(fechaRec?fechaLarga(fechaRec):'_______________')+'</b> hemos recibido el/los siguiente(s) contenedor(es) con la(s) siguiente(s) denominación(es) y sello(s) respectivo(s):</p>';

      // ── TABLA CONTENEDORES: siempre 10 filas ──────────────────
      htmlOut+='<table class="inf-tabla">';
      htmlOut+='<colgroup><col class="c-num"><col class="c-cont"><col class="c-sello"><col class="c-sello"><col class="c-cap"><col class="c-fecha"><col class="c-pall"></colgroup>';
      htmlOut+='<thead><tr><th>#</th><th>CONTENEDOR</th><th>Sello I</th><th>Sello II</th><th>Capacidad</th><th>Fecha Recepción</th><th>N° Pallets</th></tr></thead><tbody>';
      for(var ri=0;ri<TOTAL;ri++){
        var c=paginaConts[ri];
        var n=pIdx*TOTAL+ri+1;
        if(c){
          var h=getHoras(c.contenedor);
          var fr=c.fechaRec||h.FechaRegistro||'';
          htmlOut+='<tr><td>'+n+'</td><td class="left"><b>'+esc(c.contenedor)+'</b></td>'+
            '<td>'+esc(h.Sello1||'')+'</td><td>'+esc(h.Sello2||'')+'</td>'+
            '<td>'+(h.Capacidad?h.Capacidad+"'":'')+'</td>'+
            '<td>'+fechaCorta(fr)+'</td>'+
            '<td>'+(Number(h.PalletsRecibidos||0)||'')+'</td></tr>';
        } else {
          htmlOut+='<tr><td>'+n+'</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
        }
      }
      htmlOut+='</tbody><tfoot><tr><td colspan="6">TOTAL</td><td>'+(totalPallets||'')+'</td></tr></tfoot></table>';

      // Personal
      var h0=paginaConts.length>0?getHoras(paginaConts[0].contenedor):{};
      htmlOut+='<div class="inf-personal">Personal de estiba particular: <span>'+(h0.Personas?h0.Personas+' personas':'—')+'</span>&nbsp;&nbsp;&nbsp;de Inverneg: <span>'+esc(h0.Operario||'')+'</span></div>';
      htmlOut+='<div class="inf-personal" style="margin-bottom:5px">Tipo de estiba en el interior: ________________________________</div>';

      // ── TABLA TIEMPOS: siempre 10 filas ───────────────────────
      htmlOut+='<div class="inf-seccion">Tiempos por contenedor</div>';
      htmlOut+='<table class="inf-tabla-tiempos">';
      htmlOut+='<colgroup><col class="c-num"><col class="c-hora"><col class="c-hora"><col class="c-tpo"><col class="c-hora"><col class="c-hora"><col class="c-tpo"></colgroup>';
      htmlOut+='<thead><tr><th>#</th><th>Llegada</th><th>Salida</th><th>Tiempo Op.</th><th>Apertura</th><th>Cierre</th><th>Tiempo Desc.</th></tr></thead><tbody>';
      for(var ri=0;ri<TOTAL;ri++){
        var c=paginaConts[ri];
        var n=pIdx*TOTAL+ri+1;
        if(c){
          var h=getHoras(c.contenedor);
          htmlOut+='<tr><td>'+n+'</td>'+
            '<td>'+esc(h.HoraLlegada||'')+'</td><td>'+esc(h.HoraSalida||'')+'</td>'+
            '<td><b>'+calcTiempo(h.HoraLlegada,h.HoraSalida)+'</b></td>'+
            '<td>'+esc(h.HoraApertura||'')+'</td><td>'+esc(h.HoraCierre||'')+'</td>'+
            '<td><b>'+calcTiempo(h.HoraApertura,h.HoraCierre)+'</b></td></tr>';
        } else {
          htmlOut+='<tr><td>'+n+'</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
        }
      }
      htmlOut+='</tbody></table>';

      // Secciones 3, 4 y firmas solo en última página
      if(esUltima){
        // Mercadería con novedad
        htmlOut+='<div class="inf-seccion">Mercadería recibida en bodega: CND2</div>';
        htmlOut+='<div class="inf-bodega">Observaciones (Detalles)</div>';
        htmlOut+='<table class="inf-tabla-nov">';
        htmlOut+='<colgroup><col class="c-num"><col class="c-item"><col class="c-lote"><col class="c-cant"><col class="c-marc"><col class="c-obs"><col class="c-cont"></colgroup>';
        htmlOut+='<thead><tr><th>#</th><th>Item</th><th>Lote</th><th>Total Unidades</th><th>Marca</th><th>Observación</th><th>Contenedor</th></tr></thead><tbody>';
        if(lineasNovedad.length===0){
          htmlOut+='<tr><td colspan="7" style="text-align:center;color:#777;font-style:italic">Sin novedades registradas.</td></tr>';
        } else {
          lineasNovedad.forEach(function(n,ni){
            var colorObs=n.obs==='DAÑADO'?'color:red;font-weight:700':n.obs==='FALTANTE'?'color:#b85c00;font-weight:700':n.obs==='SOBRANTE'?'color:#006600;font-weight:700':'';
            htmlOut+='<tr>'+
              '<td style="text-align:center">'+(ni+1)+'</td>'+
              '<td>'+esc(n.sku)+'</td>'+
              '<td>'+esc(n.lote)+'</td>'+
              '<td class="right">'+n.cantidad+'</td>'+
              '<td>'+esc(n.marca)+'</td>'+
              '<td style="'+colorObs+'">'+esc(n.obs)+'</td>'+
              '<td>'+esc(n.contenedor)+'</td>'+
            '</tr>';
          });
        }
        htmlOut+='</tbody></table>';

        // Comentarios
        htmlOut+='<div class="inf-seccion">Comentarios</div>';
        htmlOut+='<div class="inf-comentarios">'+esc(comentarios||'Sin novedades.')+'</div>';

        // Firmas con posición absoluta al fondo
        htmlOut+=
          '<div class="inf-firmas">'+
            '<div class="inf-firma-bloque"><div class="inf-firma-linea">'+esc(de)+'<br>Jefe de Bodega</div></div>'+
            '<div class="inf-firma-bloque"><div class="inf-firma-linea">___________________________<br>Jefe de Importaciones /<br>Supervisor de Importaciones</div></div>'+
            '<div class="inf-firma-bloque"><div class="inf-firma-linea">___________________________<br>Asistente Financiero</div></div>'+
          '</div>';
      }

      htmlOut+='</div>'; // fin informe-page
    });

    $r('informe-wrap').innerHTML=htmlOut;
  });
}


function generarDetalle(){
  var pedido=getPedidoActivo();
  console.log('[PEDIDO] generarInforme() pedido="'+pedido+'"');
  if(!pedido){alert('Selecciona un pedido del buscador antes de generar el informe');return;}
  var de=$r('inp-de').value.trim()||CFG.defaults.de;
  document.getElementById('informe-wrap').innerHTML='<div class="loading">⏳ Generando detalle...</div>';

  var packingPedido=DB.packing.filter(function(p){return normStr(p.pedido)===normStr(pedido);});

  cargarRecepcionesPedido(pedido).then(function(recepciones){
    // ── Calcular neto por SKU (incluyendo correcciones negativas) ──
    var netoSKU={}; // {sku: {cant, dañado, lote, cont, desc}}
    recepciones.forEach(function(r){
      var sku=r.CodProducto||'';
      if(!sku) return;
      if(!netoSKU[sku]) netoSKU[sku]={cant:0,dañado:0,lote:'',cont:'',desc:r.Nombre||''};
      netoSKU[sku].cant+=Number(r.Cantidad)||0; // incluye negativos de CORRECCION
      if(normStr(r.Estado||'')==='DAÑADO'||normStr(r.Estado||'')==='DANADO'){
        netoSKU[sku].dañado+=Number(r.Cantidad)||0;
      }
      if(!netoSKU[sku].lote&&r.Lote) netoSKU[sku].lote=r.Lote;
      if(!netoSKU[sku].cont&&r.Contenedor) netoSKU[sku].cont=r.Contenedor;
    });

    // ── Construir filas del detalle ──
    // Todos los SKUs del packing + SKUs recibidos que no están en packing
    var skusVistos={};
    var filas=[];

    packingPedido.forEach(function(pk){
      skusVistos[normStr(pk.sku)]=true;
      var rec=netoSKU[pk.sku]||{cant:0,dañado:0,lote:'',cont:'',desc:''};
      var diff=rec.cant-pk.cantidad;
      var desc=pk.desc||(DB.codigosBarra.find(function(c){return normStr(c.sku)===normStr(pk.sku);})||{}).desc||'';
      // Líneas de novedad independientes
      var novedades=[];
      if(rec.dañado>0) novedades.push({tipo:'DAÑADO',cant:rec.dañado});
      if(diff<0) novedades.push({tipo:'FALTANTE',cant:Math.abs(diff)});
      else if(diff>0) novedades.push({tipo:'SOBRANTE',cant:diff});
      filas.push({sku:pk.sku,desc:desc,planificado:pk.cantidad,recibido:rec.cant,diff:diff,novedades:novedades,lote:rec.lote,cont:rec.cont,marca:getMarca(pk.sku)});
    });

    // SKUs recibidos sin packing (sobrantes totales)
    Object.keys(netoSKU).forEach(function(sku){
      if(skusVistos[normStr(sku)]) return;
      var rec=netoSKU[sku];
      var desc=(DB.codigosBarra.find(function(c){return normStr(c.sku)===normStr(sku);})||{}).desc||rec.desc||'';
      filas.push({sku:sku,desc:desc,planificado:0,recibido:rec.cant,diff:rec.cant,novedades:[{tipo:'SOBRANTE',cant:rec.cant}],lote:rec.lote,cont:rec.cont,marca:getMarca(sku)});
    });

    // Ordenar: con novedades primero, luego alfabético por SKU
    filas.sort(function(a,b){
      var an=a.novedades.length>0?0:1, bn=b.novedades.length>0?0:1;
      return an-bn||(a.sku<b.sku?-1:a.sku>b.sku?1:0);
    });

    // ── Resumen ──
    var totalPlan=0,totalRec=0,totalComp=0,totalFalt=0,totalSobr=0,totalDan=0;
    filas.forEach(function(f){
      totalPlan+=f.planificado; totalRec+=f.recibido;
      var tipos=f.novedades.map(function(n){return n.tipo;});
      if(tipos.indexOf('FALTANTE')>-1) totalFalt++;
      else if(tipos.indexOf('SOBRANTE')>-1) totalSobr++;
      else totalComp++;
      if(tipos.indexOf('DAÑADO')>-1) totalDan++;
    });

    // ── Construir HTML del informe ──
    var htmlOut='<div class="det-page">';
    htmlOut+='<div class="det-titulo">Detalle de Recepción</div>';
    htmlOut+='<div class="det-meta">'+
      '<b>Pedido:</b> '+esc(pedido)+'&nbsp;&nbsp;&nbsp;'+
      '<b>Fecha:</b> '+fechaCorta(hoy())+'&nbsp;&nbsp;&nbsp;'+
      '<b>Preparado por:</b> '+esc(de)+
    '</div>';

    // Tabla principal
    htmlOut+='<table class="det-tabla">';
    htmlOut+='<thead><tr>'+
      '<th style="width:12%">SKU</th>'+
      '<th style="width:28%">Descripción</th>'+
      '<th style="width:11%">Marca</th>'+
      '<th style="width:10%;text-align:right">Planificado</th>'+
      '<th style="width:10%;text-align:right">Recibido</th>'+
      '<th style="width:9%;text-align:right">Diferencia</th>'+
      '<th style="width:20%">Novedad</th>'+
    '</tr></thead><tbody>';

    if(!filas.length){
      htmlOut+='<tr><td colspan="7" style="text-align:center;color:#777">Sin datos de packing para este pedido.</td></tr>';
    } else {
      filas.forEach(function(f){
        var nTipos=f.novedades.length;
        var trClass=nTipos===0?'completo':'novedad';
        if(nTipos===0){
          // Sin novedad — una fila
          htmlOut+='<tr class="'+trClass+'">'+
            '<td>'+esc(f.sku)+'</td>'+
            '<td>'+esc(f.desc)+'</td>'+
            '<td>'+esc(f.marca)+'</td>'+
            '<td class="right">'+f.planificado+'</td>'+
            '<td class="right">'+f.recibido+'</td>'+
            '<td class="right">'+(f.diff===0?'—':(f.diff>0?'+':'')+f.diff)+'</td>'+
            '<td class="center" style="color:green">✅ Completo</td>'+
          '</tr>';
        } else {
          // Con novedades — una fila por tipo de novedad
          f.novedades.forEach(function(n,ni){
            var colorNov=n.tipo==='DAÑADO'?'color:red;font-weight:700':n.tipo==='FALTANTE'?'color:#b85c00;font-weight:700':'color:#006600;font-weight:700';
            htmlOut+='<tr class="novedad">'+
              (ni===0?'<td rowspan="'+nTipos+'">'+esc(f.sku)+'</td>':'')+
              (ni===0?'<td rowspan="'+nTipos+'">'+esc(f.desc)+'</td>':'')+
              (ni===0?'<td rowspan="'+nTipos+'">'+esc(f.marca)+'</td>':'')+
              (ni===0?'<td class="right" rowspan="'+nTipos+'">'+f.planificado+'</td>':'')+
              (ni===0?'<td class="right" rowspan="'+nTipos+'">'+f.recibido+'</td>':'')+
              (ni===0?'<td class="right" rowspan="'+nTipos+'">'+(f.diff===0?'—':(f.diff>0?'+':'')+f.diff)+'</td>':'')+
              '<td style="'+colorNov+'">'+n.tipo+(n.cant?(' ('+n.cant+' un)'):'')+'</td>'+
            '</tr>';
          });
        }
      });
    }
    htmlOut+='</tbody></table>';

    // Resumen estadístico
    htmlOut+='<div class="det-resumen">'+
      '<b>Resumen:</b> &nbsp;'+
      'Total SKUs: <b>'+filas.length+'</b> &nbsp;|&nbsp; '+
      '✅ Completos: <b>'+totalComp+'</b> &nbsp;|&nbsp; '+
      '⚠ Faltantes: <b style="color:#b85c00">'+totalFalt+'</b> &nbsp;|&nbsp; '+
      '⚠ Sobrantes: <b style="color:#006600">'+totalSobr+'</b> &nbsp;|&nbsp; '+
      '⚠ Dañados: <b style="color:red">'+totalDan+'</b>'+
      '<br><b>Cantidades:</b> &nbsp;'+
      'Planificado: <b>'+totalPlan+' un</b> &nbsp;|&nbsp; '+
      'Recibido: <b>'+totalRec+' un</b> &nbsp;|&nbsp; '+
      'Diferencia: <b>'+(totalRec-totalPlan>=0?'+'+(totalRec-totalPlan):(totalRec-totalPlan))+' un</b>'+
    '</div>';

    // Pie
    htmlOut+='<div style="margin-top:16px;font-size:7.5pt;color:#777;text-align:right">'+
      'Generado automáticamente desde RF Recepción · Inverneg CND · '+fechaCorta(hoy())+
    '</div>';
    htmlOut+='</div>';

    document.getElementById('informe-wrap').innerHTML=htmlOut;
  });
}

// ── Informe: Detalle de Recepción ─────────────────────────────────
function generarDetalleRecepcion(){
  var pedido=getPedidoActivo();
  console.log('[PEDIDO] generarInforme() pedido="'+pedido+'"');
  if(!pedido){alert('Selecciona un pedido del buscador antes de generar el informe');return;}
  var de=($r('inp-de')||{}).value||CFG.defaults.de;
  $r('informe-wrap').innerHTML='<div class="loading">⏳ Cargando detalle de recepción...</div>';

  var packingPedido=DB.packing.filter(function(p){return normStr(p.pedido)===normStr(pedido);});

  cargarRecepcionesPedido(pedido).then(function(recepciones){
    // ── Construir tabla de SKUs ──────────────────────────────────
    var filas=[];

    packingPedido.forEach(function(pk){
      var esperado=pk.cantidad;
      // Cantidad neta: suma todos los registros (incluyendo correcciones negativas)
      var recibidoNeto=0;
      var totalDanado=0;
      recepciones.forEach(function(r){
        if(normStr(r.CodProducto||'')!==normStr(pk.sku)) return;
        recibidoNeto+=Number(r.Cantidad)||0;
        if(normStr(r.Estado||'')==='DAÑADO'||normStr(r.Estado||'')==='DANADO')
          totalDanado+=Number(r.Cantidad)||0;
      });
      var diff=recibidoNeto-esperado;

      // Descripción desde C.Barra o Packing
      var desc=pk.desc||'';
      if(!desc){
        var cb=DB.codigosBarra.find(function(x){return normStr(x.sku)===normStr(pk.sku);});
        if(cb) desc=cb.desc;
      }

      // Determinar novedades — líneas separadas
      var novedades=[];
      if(totalDanado>0) novedades.push({tipo:'DAÑADO',cant:totalDanado});
      if(diff<0)        novedades.push({tipo:'FALTANTE',cant:Math.abs(diff)});
      if(diff>0)        novedades.push({tipo:'SOBRANTE',cant:diff});

      if(novedades.length===0){
        filas.push({sku:pk.sku,desc:desc,esperado:esperado,recibido:recibidoNeto,diff:diff,novedad:'—',novCant:null,primera:true});
      } else {
        novedades.forEach(function(n,i){
          filas.push({
            sku:pk.sku,desc:desc,
            esperado:i===0?esperado:null,
            recibido:i===0?recibidoNeto:null,
            diff:i===0?diff:null,
            novedad:n.tipo,novCant:n.cant,
            primera:i===0,
            rowspan:i===0?novedades.length:0,
          });
        });
      }
    });

    // Totales
    var totalEsp=packingPedido.reduce(function(a,p){return a+p.cantidad;},0);
    var totalRec=0;
    var skusCompletos=0,skusFaltantes=0,skusSobrantes=0;
    packingPedido.forEach(function(pk){
      var neto=0;
      recepciones.forEach(function(r){if(normStr(r.CodProducto||'')===normStr(pk.sku))neto+=Number(r.Cantidad)||0;});
      totalRec+=neto;
      var d=neto-pk.cantidad;
      if(d===0) skusCompletos++;
      else if(d<0) skusFaltantes++;
      else skusSobrantes++;
    });

    // ── Renderizar informe A4 ────────────────────────────────────
    var colorDiff=function(d){return d===0?'':'color:'+(d<0?'#cc6600':'#006600')+';font-weight:700';};
    var colorNov=function(n){
      if(n==='DAÑADO') return 'color:red;font-weight:700';
      if(n==='FALTANTE') return 'color:#cc6600;font-weight:700';
      if(n==='SOBRANTE') return 'color:#006600;font-weight:700';
      return 'color:#666';
    };
    var signo=function(d){return d>0?'+'+d:d<0?String(d):'0';};

    var h='<div class="informe-page">';
    h+='<div class="inf-titulo">DETALLE DE RECEPCIÓN</div>';
    h+='<div class="inf-meta"><table>';
    h+='<tr><td>DE&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;:</td><td>'+esc(de)+'</td></tr>';
    h+='<tr><td>PEDIDO</td><td><b>'+esc(pedido)+'</b></td></tr>';
    h+='<tr><td>FECHA</td><td>'+fechaCorta(hoy())+'</td></tr>';
    h+='</table></div>';

    // Resumen ejecutivo
    h+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0;font-size:8pt">'+
      '<div style="border:1px solid #888;border-radius:4px;padding:5px 8px;text-align:center">'+
        '<div style="font-size:7pt;color:#666">Total SKUs Packing</div>'+
        '<div style="font-size:13pt;font-weight:700">'+packingPedido.length+'</div></div>'+
      '<div style="border:1px solid #3c3;border-radius:4px;padding:5px 8px;text-align:center">'+
        '<div style="font-size:7pt;color:#666">Completos</div>'+
        '<div style="font-size:13pt;font-weight:700;color:green">'+skusCompletos+'</div></div>'+
      '<div style="border:1px solid #cc6600;border-radius:4px;padding:5px 8px;text-align:center">'+
        '<div style="font-size:7pt;color:#666">Con Faltante</div>'+
        '<div style="font-size:13pt;font-weight:700;color:#cc6600">'+skusFaltantes+'</div></div>'+
      '<div style="border:1px solid #006600;border-radius:4px;padding:5px 8px;text-align:center">'+
        '<div style="font-size:7pt;color:#666">Con Sobrante</div>'+
        '<div style="font-size:13pt;font-weight:700;color:#006600">'+skusSobrantes+'</div></div>'+
    '</div>';

    // Tabla detalle SKU
    h+='<div class="inf-seccion">Detalle por SKU — Mercadería recibida en bodega: CND2</div>';
    h+='<table class="inf-tabla-det"><colgroup>'+
      '<col style="width:12%"><col style="width:30%"><col style="width:10%">'+
      '<col style="width:10%"><col style="width:10%"><col style="width:28%">'+
    '</colgroup>'+
    '<thead><tr>'+
      '<th>SKU</th><th>Descripción</th><th>Planificado</th>'+
      '<th>Recibido Neto</th><th>Diferencia</th><th>Novedades</th>'+
    '</tr></thead><tbody>';

    filas.forEach(function(f){
      h+='<tr>';
      if(f.primera){
        h+='<td>'+esc(f.sku)+'</td>'+
          '<td class="left">'+esc(f.desc)+'</td>'+
          '<td>'+f.esperado+'</td>'+
          '<td>'+f.recibido+'</td>'+
          '<td style="'+colorDiff(f.diff)+'">'+signo(f.diff)+'</td>';
      } else {
        h+='<td colspan="5"></td>';
      }
      h+='<td style="'+colorNov(f.novedad)+'">'+esc(f.novedad)+(f.novCant!==null?' ('+f.novCant+' un)':'')+'</td>';
      h+='</tr>';
    });

    // Fila totales
    h+='</tbody><tfoot><tr>'+
      '<td colspan="2" style="text-align:right;font-weight:700">TOTALES</td>'+
      '<td>'+totalEsp+'</td>'+
      '<td>'+totalRec+'</td>'+
      '<td style="'+colorDiff(totalRec-totalEsp)+'">'+signo(totalRec-totalEsp)+'</td>'+
      '<td></td>'+
    '</tr></tfoot></table>';

    h+='<div class="inf-firmas">'+
      '<div class="inf-firma-bloque"><div class="inf-firma-linea">'+esc(de)+'<br>Jefe de Bodega</div></div>'+
      '<div class="inf-firma-bloque"><div class="inf-firma-linea">___________________________<br>Jefe de Importaciones /<br>Supervisor de Importaciones</div></div>'+
      '<div class="inf-firma-bloque"><div class="inf-firma-linea">___________________________<br>Asistente Financiero</div></div>'+
    '</div>';
    h+='</div>'; // fin informe-page

    $r('informe-wrap').innerHTML=h;
  });
}

// ── Reporte: Detalle por LPN ───────────────────────────────────────
function generarDetalleLPN(){
  var pedido=getPedidoActivo();
  if(!pedido){alert('Selecciona un pedido primero');return;}
  var de=($r('inp-de')||{}).value||CFG.defaults.de;
  $r('informe-wrap').innerHTML='<div class="loading">⏳ Cargando detalle por LPN...</div>';

  var packingPedido=DB.packing.filter(function(p){return normStr(p.pedido)===normStr(pedido);});

  cargarRecepcionesPedido(pedido).then(function(recepciones){
    // Calcular saldo neto por SKU (incluyendo correcciones negativas)
    var skuMap={};
    packingPedido.forEach(function(pk){skuMap[normStr(pk.sku)]={packing:pk,regs:[]};});

    // Agrupar registros por SKU (excluir CORRECCION de las líneas, pero incluirlo en el neto)
    recepciones.forEach(function(r){
      var k=normStr(r.CodProducto||'');
      if(!skuMap[k]) skuMap[k]={packing:null,regs:[]};
      skuMap[k].regs.push(r);
    });

    // Filtrar solo SKUs con FALTANTE o SOBRANTE
    var skusConNovedad=[];
    Object.keys(skuMap).forEach(function(k){
      var entry=skuMap[k];
      var packing=entry.packing?entry.packing.cantidad:null;
      if(packing===null) return; // sin packing → ignorar
      // Neto incluye correcciones
      var neto=0;
      entry.regs.forEach(function(r){neto+=Number(r.Cantidad)||0;});
      var diff=neto-packing;
      if(diff===0) return; // completo → no mostrar
      skusConNovedad.push({
        sku:entry.packing.sku,
        desc:entry.packing.desc,
        packing:packing,
        neto:neto,
        diff:diff,
        tipo:diff<0?'FALTANTE':'SOBRANTE',
        regs:entry.regs,
      });
    });

    // Ordenar: FALTANTE primero, luego por SKU
    skusConNovedad.sort(function(a,b){
      if(a.tipo!==b.tipo) return a.tipo==='FALTANTE'?-1:1;
      return a.sku<b.sku?-1:a.sku>b.sku?1:0;
    });

    // ── Renderizar ────────────────────────────────────────────────
    var colorNov=function(t){return t==='FALTANTE'?'color:#b85c00;font-weight:700':'color:#006600;font-weight:700';};
    var signo=function(d){return d>0?'+'+d:String(d);};

    var h='<div class="informe-page">';
    h+='<div class="inf-titulo">DETALLE POR LPN — NOVEDADES</div>';
    h+='<div class="inf-meta"><table>';
    h+='<tr><td>DE&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;:</td><td>'+esc(de)+'</td></tr>';
    h+='<tr><td>PEDIDO</td><td><b>'+esc(pedido)+'</b></td></tr>';
    h+='<tr><td>FECHA</td><td>'+fechaCorta(hoy())+'</td></tr>';
    h+='</table></div>';

    // Resumen
    var nFalt=skusConNovedad.filter(function(s){return s.tipo==='FALTANTE';}).length;
    var nSobr=skusConNovedad.filter(function(s){return s.tipo==='SOBRANTE';}).length;
    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0;font-size:8pt">'+
      '<div style="border:1px solid #888;border-radius:4px;padding:5px 8px;text-align:center">'+
        '<div style="font-size:7pt;color:#666">SKUs con Novedad</div>'+
        '<div style="font-size:13pt;font-weight:700">'+skusConNovedad.length+'</div></div>'+
      '<div style="border:1px solid #cc6600;border-radius:4px;padding:5px 8px;text-align:center">'+
        '<div style="font-size:7pt;color:#666">Faltantes</div>'+
        '<div style="font-size:13pt;font-weight:700;color:#cc6600">'+nFalt+'</div></div>'+
      '<div style="border:1px solid #006600;border-radius:4px;padding:5px 8px;text-align:center">'+
        '<div style="font-size:7pt;color:#666">Sobrantes</div>'+
        '<div style="font-size:13pt;font-weight:700;color:#006600">'+nSobr+'</div></div>'+
    '</div>';

    if(skusConNovedad.length===0){
      h+='<div style="text-align:center;padding:20px;font-size:10pt;color:#555">'+
        '✅ Sin novedades — todos los SKUs coinciden con el Packing List.</div>';
    } else {
      h+='<div class="inf-seccion">Detalle por SKU y LPN</div>';
      skusConNovedad.forEach(function(s){
        // Agrupar registros no-corrección por LPN para mostrar desglose
        var porLPN={};
        s.regs.forEach(function(r){
          if(normStr(r.Estado||'')==='CORRECCION') return; // no mostrar correcciones
          var lpn=(r.LPN||'(sin LPN)').toString().trim()||'(sin LPN)';
          if(!porLPN[lpn]) porLPN[lpn]=0;
          porLPN[lpn]+=Number(r.Cantidad)||0;
        });
        var lpnKeys=Object.keys(porLPN).sort();
        var totalLPN=lpnKeys.reduce(function(a,k){return a+porLPN[k];},0);

        h+='<div class="inf-bloque-sku">';
        // Cabecera del SKU
        h+='<div class="inf-sku-hdr">'+
          '<div class="inf-sku-cell"><div class="lbl">SKU</div><div class="val">'+esc(s.sku)+'</div></div>'+
          '<div class="inf-sku-cell" style="grid-column:span 2"><div class="lbl">Descripción</div><div class="val" style="font-size:8pt">'+esc(s.desc)+'</div></div>'+
          '<div class="inf-sku-cell"><div class="lbl">Packing</div><div class="val">'+s.packing+'</div></div>'+
          '<div class="inf-sku-cell"><div class="lbl">Novedad</div>'+
            '<div class="val" style="'+colorNov(s.tipo)+'">'+s.tipo+'</div></div>'+
        '</div>';
        h+='<div style="display:flex;gap:12px;font-size:8pt;margin-bottom:6px">'+
          '<span>Recibido neto: <b>'+s.neto+'</b></span>'+
          '<span style="'+colorNov(s.tipo)+'">Diferencia: <b>'+signo(s.diff)+'</b></span>'+
        '</div>';

        // Tabla de LPNs
        if(lpnKeys.length===0){
          h+='<div style="font-size:8pt;color:#888;font-style:italic">Sin registros de LPN.</div>';
        } else {
          h+='<table class="inf-tabla-lpn"><colgroup>'+
            '<col style="width:55%"><col style="width:45%">'+
            '</colgroup>'+
            '<thead><tr><th>LPN</th><th>Cantidad registrada</th></tr></thead><tbody>';
          lpnKeys.forEach(function(lpn){
            h+='<tr>'+
              '<td>'+esc(lpn)+'</td>'+
              '<td class="right">'+porLPN[lpn]+'</td>'+
            '</tr>';
          });
          h+='</tbody><tfoot><tr>'+
            '<td>TOTAL</td>'+
            '<td class="right">'+totalLPN+'</td>'+
          '</tr></tfoot></table>';
        }
        h+='</div>'; // fin bloque SKU
      });
    }

    h+='<div class="inf-firmas">'+
      '<div class="inf-firma-bloque"><div class="inf-firma-linea">'+esc(de)+'<br>Jefe de Bodega</div></div>'+
      '<div class="inf-firma-bloque"><div class="inf-firma-linea">___________________________<br>Jefe de Importaciones /<br>Supervisor de Importaciones</div></div>'+
      '<div class="inf-firma-bloque"><div class="inf-firma-linea">___________________________<br>Asistente Financiero</div></div>'+
    '</div>';
    h+='</div>'; // fin informe-page
    $r('informe-wrap').innerHTML=h;
  });
}
function esc(s){return(s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function boot(){
  $r('ftr-user').textContent=msalAcc.username||msalAcc.name||'—';
  render('<div class="loading">⏳ Cargando catálogos...</div>');
  Promise.all([descubrirListas(),cargarCatalogos()]).then(function(){
    setConn('ok');
    showPanel();
  }).catch(function(e){console.error('[BOOT]',e.message);setConn('err');showPanel();});
}
