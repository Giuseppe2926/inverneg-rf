<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RF MKT Operación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ──────────────────────────────────────────────────────────────── */
:root {
  --bg:#f0fdf4; --bg-card:#ffffff; --bg-muted:#f8fafc;
  --fg:#0f172a; --fg-muted:#64748b; --fg-subtle:#94a3b8;
  --border:#d1fae5; --border-focus:#059669;
  --primary:#059669; --primary-h:#047857; --primary-fg:#fff;
  --ok:#16a34a; --ok-bg:#f0fdf4; --ok-bd:#bbf7d0;
  --warn:#d97706; --warn-bg:#fffbeb; --warn-bd:#fde68a;
  --err:#dc2626; --err-bg:#fef2f2; --err-bd:#fecaca;
  --info:#0284c7; --info-bg:#f0f9ff; --info-bd:#bae6fd;
  --gray:#f1f5f9;
  --r:8px; --r-lg:12px;
  --sh:0 1px 3px rgba(0,0,0,.08);
  --sh-md:0 4px 12px rgba(0,0,0,.1);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --bg-card:#1e293b; --bg-muted:#162032;
    --fg:#f0fdf4; --fg-muted:#94a3b8; --fg-subtle:#64748b;
    --border:#334155; --border-focus:#10b981;
    --primary:#10b981; --primary-h:#059669;
    --ok-bg:#052e16; --ok-bd:#14532d;
    --warn-bg:#1c1400; --warn-bd:#78350f;
    --err-bg:#1c0a0a; --err-bd:#7f1d1d;
    --info-bg:#0c1a24; --info-bd:#0c4a6e;
    --gray:#1e293b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --bg-card:#1e293b; --bg-muted:#162032;
  --fg:#f0fdf4; --fg-muted:#94a3b8; --fg-subtle:#64748b;
  --border:#334155; --border-focus:#10b981;
  --primary:#10b981; --primary-h:#059669;
  --ok-bg:#052e16; --ok-bd:#14532d;
  --warn-bg:#1c1400; --warn-bd:#78350f;
  --err-bg:#1c0a0a; --err-bd:#7f1d1d;
  --info-bg:#0c1a24; --info-bd:#0c4a6e;
  --gray:#1e293b;
  color-scheme:dark;
}

/* ── RESET & BASE ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;font-size:14px;
     background:var(--bg);color:var(--fg);
     padding-inline:16px;padding-block:16px}

/* ── LAYOUT ───────────────────────────────────────────────────────────────── */
.app-hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px;
         padding-bottom:14px;border-bottom:2px solid var(--border)}
.app-hdr h1{margin:0;font-size:17px;font-weight:700;flex:1}
.app-hdr .user{font-size:12px;color:var(--fg-muted);max-width:160px;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── BUTTONS ──────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
     border-radius:var(--r);border:none;font:inherit;font-size:13px;
     font-weight:500;cursor:pointer;transition:.15s;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover:not(:disabled){background:var(--primary-h)}
.btn-secondary{background:var(--bg-muted);color:var(--fg);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--gray)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover:not(:disabled){background:#15803d}
.btn-warn{background:var(--warn);color:#fff}
.btn-warn:hover:not(:disabled){background:#b45309}
.btn-err{background:var(--err);color:#fff}
.btn-err:hover:not(:disabled){background:#b91c1c}
.btn-info{background:var(--info);color:#fff}
.btn-info:hover:not(:disabled){background:#0369a1}
.btn-ghost{background:transparent;color:var(--fg-muted);border:none;padding:4px 8px}
.btn-ghost:hover:not(:disabled){color:var(--fg)}
.btn-sm{padding:4px 10px;font-size:12px}

/* ── ALERTS ───────────────────────────────────────────────────────────────── */
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
.a-ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}
.a-err{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err)}
.a-warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn)}
.a-info{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info)}

/* ── CARD ─────────────────────────────────────────────────────────────────── */
.card{background:var(--bg-card);border:1px solid var(--border);
      border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:14px}
.card-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;
          border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-title{font-size:15px;font-weight:700;margin:0;flex:1}
.card-body{padding:14px 16px}

/* ── BADGES ───────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
       font-size:11px;font-weight:600;white-space:nowrap}
.b-pendiente{background:var(--gray);color:var(--fg-muted);border:1px solid var(--border)}
.b-aprobada{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-reprogramada{background:var(--info-bg);color:var(--info);border:1px solid var(--info-bd)}
.b-rechazada{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.b-parcial{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-cancelada{background:var(--gray);color:var(--fg-subtle);border:1px solid var(--border)}
.b-recibidook{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-novedades{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-parcialrec{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-rechazadoop{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.b-nopresentado{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.b-anticipada{background:var(--info-bg);color:var(--info);border:1px solid var(--info-bd);font-size:10px}

/* ── SOLICITUDES LIST ─────────────────────────────────────────────────────── */
.sol-row{display:flex;align-items:center;gap:10px;padding:12px 16px;
         border-bottom:1px solid var(--border);cursor:pointer;
         transition:background .12s;flex-wrap:wrap}
.sol-row:last-child{border-bottom:none}
.sol-row:hover{background:var(--bg-muted)}
.sol-info{flex:1;min-width:0}
.sol-nro{font-weight:600;font-size:14px}
.sol-meta{font-size:12px;color:var(--fg-muted);margin-top:2px}
.sol-pending-count{font-size:11px;font-weight:700;
                   background:var(--ok-bg);color:var(--ok);
                   border:1px solid var(--ok-bd);
                   padding:2px 7px;border-radius:20px;white-space:nowrap}

/* ── VER LINEA ────────────────────────────────────────────────────────────── */
.ver-grupo{border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:18px;overflow:hidden}
.ver-ghdr{background:var(--gray);padding:10px 16px;font-size:13px;font-weight:600;
          border-bottom:1px solid var(--border)}
.ver-linea{padding:14px 16px;border-bottom:1px solid var(--border)}
.ver-linea:last-child{border-bottom:none}
.ver-linea-done{opacity:.55}
.ver-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.ver-cell{display:flex;flex-direction:column;gap:2px}
.ver-clbl{font-size:10px;font-weight:600;text-transform:uppercase;
          letter-spacing:.05em;color:var(--fg-muted)}
.ver-cval{font-size:13px;color:var(--fg)}

/* ── ACTION PANEL ─────────────────────────────────────────────────────────── */
.act-panel{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.act-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.act-form{background:var(--bg-muted);border:1px solid var(--border);
          border-radius:var(--r);padding:12px;display:none;margin-top:8px}
.act-form.open{display:block}
.act-form-title{font-size:12px;font-weight:700;text-transform:uppercase;
                letter-spacing:.05em;margin:0 0 10px;color:var(--fg-muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.single{grid-template-columns:1fr}
.form-row.triple{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:11px;font-weight:600;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.form-ctrl{border:1px solid var(--border);border-radius:var(--r);
           background:var(--bg-card);color:var(--fg);font:inherit;font-size:13px;
           padding:7px 10px;transition:.15s}
.form-ctrl:focus{outline:none;border-color:var(--border-focus)}
.form-ctrl:read-only{background:var(--bg-muted);color:var(--fg-muted);cursor:default}
.form-ctrl.err{border-color:var(--err)}
textarea.form-ctrl{resize:vertical;min-height:56px}
.form-actions{display:flex;gap:8px;margin-top:10px}

/* ── FILTER TABS ──────────────────────────────────────────────────────────── */
.op-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.op-tab{padding:5px 12px;border-radius:20px;border:1px solid var(--border);
        background:var(--bg-card);color:var(--fg-muted);font:inherit;font-size:12px;
        font-weight:500;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.op-tab:hover{background:var(--gray);color:var(--fg)}
.op-tab.tab-active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tab-cnt{font-size:11px;font-weight:700;opacity:.8}

/* ── STATS BAR ────────────────────────────────────────────────────────────── */
.stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat-chip{display:flex;align-items:center;gap:6px;padding:7px 12px;
           background:var(--bg-card);border:1px solid var(--border);
           border-radius:var(--r);font-size:12px}
.stat-num{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-lbl{color:var(--fg-muted)}

/* ── MISC ─────────────────────────────────────────────────────────────────── */
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;
               letter-spacing:.06em;color:var(--fg-muted);margin:0 0 10px}
.empty{text-align:center;padding:40px 20px;color:var(--fg-muted)}
.empty p{margin:0}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);
      border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.login-wrap{display:flex;flex-direction:column;align-items:center;
            justify-content:center;min-height:100vh;padding:24px;text-align:center}
.login-card{background:var(--bg-card);border:1px solid var(--border);
            border-radius:var(--r-lg);padding:40px;max-width:380px;width:100%;
            box-shadow:var(--sh-md)}
.login-card h2{font-size:20px;font-weight:700;margin:0 0 6px}
.sol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sol-fld{display:flex;flex-direction:column;gap:2px}
.sol-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted)}
.sol-val{font-size:13px}
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:60px 20px"><span class="spin"></span></div></div>

<script>
/* ── CONFIG ───────────────────────────────────────────────────────────────── */
const MSAL_CFG = {
  auth:{
    clientId:'ec976114-e146-4ce4-850c-5d978e12acfd',
    authority:'https://login.microsoftonline.com/5e008bd3-17b6-4f83-8d23-019691a40609',
    redirectUri: location.origin + location.pathname
  },
  cache:{cacheLocation:'sessionStorage',storeAuthStateInCookie:false}
};
const SITE  = 'inverneg.sharepoint.com,8b946a6c-31b9-4bf7-95d0-ab47d29a4d63,ad88c61f-b207-49a4-9105-8b3b57b31906';
const SCOPES = ['https://graph.microsoft.com/Sites.ReadWrite.All'];
const BASE   = 'https://graph.microsoft.com/v1.0';

/* ── STATE ────────────────────────────────────────────────────────────────── */
// Líneas que Jefatura aprobó y Operación puede ejecutar
const OP_PROCESABLE = new Set(['Aprobada','Reprogramada']);
// Estados de recepción finales (ya ejecutados por Operación)
const OP_EJECUTADO  = new Set(['Recibido OK','Recibido con Novedades','Parcialmente Recibida','Rechazado por Operación','No Presentado']);

let msalApp, me;
let screen   = 'lista'; // 'lista' | 'ver'
let fPeriodo = 'Hoy';   // 'Hoy' | 'Semana' | 'Todas'
let sols     = [], lineas = [];
let viewId   = null;
let busy     = false;

/* ── GRAPH ────────────────────────────────────────────────────────────────── */
async function gGet(url) {
  const t = await tok();
  const r = await fetch(url,{headers:{Authorization:`Bearer ${t}`}});
  if(!r.ok){const e=await r.text();throw new Error(`${r.status} ${e}`);}
  return r.json();
}
async function gPost(url,body) {
  const t = await tok();
  const r = await fetch(url,{method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.text();throw new Error(`${r.status} ${e}`);}
  return r.json();
}
async function gPatch(url,body) {
  const t = await tok();
  const r = await fetch(url,{method:'PATCH',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){const e=await r.text();throw new Error(`${r.status} ${e}`);}
  return r.status===204?null:r.json();
}
async function gAll(url) {
  let res=[],next=url;
  while(next){const d=await gGet(next);res=res.concat(d.value||[]);next=d['@odata.nextLink']||null;}
  return res;
}

/* ── UTILS ────────────────────────────────────────────────────────────────── */
const esc    = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fDate  = s => {if(!s)return'—';try{return new Date(s).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});}catch{return s;}};
const fDT    = s => {if(!s)return'—';try{return new Date(s).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return s;}};
const toISO  = s => {if(!s)return null;try{return new Date(s).toISOString().split('T')[0];}catch{return null;}};

function hoy() { return new Date().toISOString().split('T')[0]; }

function inicioSemana() {
  const d=new Date(); const dia=d.getDay();
  const l=new Date(d); l.setDate(d.getDate()-(dia===0?6:dia-1));
  return l.toISOString().split('T')[0];
}
function finSemana() {
  const i=new Date(inicioSemana()+'T12:00:00');
  const f=new Date(i); f.setDate(i.getDate()+6);
  return f.toISOString().split('T')[0];
}

function badge(e) {
  const m = {
    'Pendiente':'pendiente','Aprobada':'aprobada','Reprogramada':'reprogramada',
    'Rechazada':'rechazada','Cancelada':'cancelada','Parcial':'parcial',
    'Recibido OK':'recibidook','Recibido con Novedades':'novedades',
    'Parcialmente Recibida':'parcialrec','Rechazado por Operación':'rechazadoop',
    'No Presentado':'nopresentado'
  };
  return `<span class="badge b-${m[e]||'pendiente'}">${esc(e||'Pendiente')}</span>`;
}

function iconRecepcion(e) {
  const m={'Recibido OK':'✅','Recibido con Novedades':'⚠️','Parcialmente Recibida':'📦',
           'Rechazado por Operación':'❌','No Presentado':'🚫'};
  return m[e]||'⏳';
}

/* ── FILTROS ──────────────────────────────────────────────────────────────── */
function esGestionable(l) {
  return OP_PROCESABLE.has(l.EstadoLinea) && !OP_EJECUTADO.has(l.EstadoRecepcion);
}

function lineasPorPeriodo(periodo) {
  return lineas.filter(l=>{
    if(!OP_PROCESABLE.has(l.EstadoLinea)) return false;
    const fRef = toISO(l.FechaAprobada) || toISO(l.FechaSolicitada);
    if(periodo==='Hoy')    return fRef === hoy();
    if(periodo==='Semana') return fRef >= inicioSemana() && fRef <= finSemana();
    return true; // Todas
  });
}

function lineasDeSol(sol) {
  return lineas.filter(l=>String(l.SolicitudId)===String(sol.id)||l.NroSolicitud===sol.NroSolicitud);
}

function solsPorPeriodo(periodo) {
  // SolicitudId viene como número desde SharePoint; s.id es string → normalizar ambos
  const ids = new Set(lineasPorPeriodo(periodo).map(l=>String(l.SolicitudId)));
  return sols.filter(s=>ids.has(String(s.id)));
}

/* ── RENDER ───────────────────────────────────────────────────────────────── */
function render() {
  const app=document.getElementById('app');
  if(busy){app.innerHTML='<div style="text-align:center;padding:60px 20px"><span class="spin"></span><p style="color:var(--fg-muted);margin-top:12px;font-size:13px">Cargando…</p></div>';return;}
  app.innerHTML=`
    <div class="app-hdr">
      <span style="font-size:22px">📦</span>
      <h1>RF MKT · Operación</h1>
      <span class="user">${esc(me?.name||me?.username||'')}</span>
    </div>
    <div id="ac"></div>
    ${screen==='lista' ? listaHTML() : verHTML()}`;
  if(screen==='lista') bindLista();
  else bindVer();
}

/* ── PANTALLA: LISTA ──────────────────────────────────────────────────────── */
const FILTROS_OP = ['Hoy','Semana','Todas'];

function listaHTML() {
  const todasLineas  = lineasPorPeriodo(fPeriodo);
  const nPendientes  = todasLineas.filter(l=>esGestionable(l)).length;
  const nProcesadas  = todasLineas.filter(l=>OP_EJECUTADO.has(l.EstadoRecepcion)).length;
  const solsFiltradas = solsPorPeriodo(fPeriodo);

  const tabsHTML = FILTROS_OP.map(f=>{
    const n = lineasPorPeriodo(f).filter(l=>esGestionable(l)).length;
    const active = f===fPeriodo ? ' tab-active' : '';
    return `<button class="op-tab${active}" data-periodo="${f}">${f} <span class="tab-cnt">${n}</span></button>`;
  }).join('');

  const statsBar = `
    <div class="stats-bar">
      <div class="stat-chip"><span class="stat-num" style="color:var(--primary)">${nPendientes}</span><span class="stat-lbl">pendiente${nPendientes!==1?'s':''}</span></div>
      <div class="stat-chip"><span class="stat-num" style="color:var(--ok)">${nProcesadas}</span><span class="stat-lbl">procesada${nProcesadas!==1?'s':''}</span></div>
      <div class="stat-chip"><span class="stat-num">${todasLineas.length}</span><span class="stat-lbl">total</span></div>
    </div>`;

  let rows = '';
  if(solsFiltradas.length === 0) {
    rows = `<div class="empty"><p>No hay recepciones para ${fPeriodo==='Hoy'?'hoy':fPeriodo==='Semana'?'esta semana':'mostrar'}.</p></div>`;
  } else {
    rows = solsFiltradas.map(s=>{
      const ls = lineasPorPeriodo(fPeriodo).filter(l=>String(l.SolicitudId)===String(s.id)||l.NroSolicitud===s.NroSolicitud);
      const nPend = ls.filter(l=>esGestionable(l)).length;
      const provs = [...new Set(ls.map(l=>l.Proveedor).filter(Boolean))].join(', ')||'—';
      const chip  = nPend>0 ? `<span class="sol-pending-count">${nPend} pendiente${nPend!==1?'s':''}</span>` : '';
      const allDone = ls.length>0 && ls.every(l=>OP_EJECUTADO.has(l.EstadoRecepcion));
      return `<div class="sol-row${allDone?' ver-linea-done':''}" data-id="${esc(s.id)}">
        <div class="sol-info">
          <div class="sol-nro">${esc(s.NroSolicitud||'(Sin número)')}</div>
          <div class="sol-meta">${esc(provs)} · ${ls.length} línea${ls.length!==1?'s':''}</div>
        </div>
        ${chip}
        <span style="color:var(--fg-muted);font-size:18px">›</span>
      </div>`;
    }).join('');
    rows = `<div class="card" style="padding:0;overflow:hidden">${rows}</div>`;
  }

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <p class="section-title" style="margin:0">Recepciones · ${fPeriodo}</p>
      <button class="btn btn-secondary btn-sm" id="btn-ref">🔄 Actualizar</button>
    </div>
    <div class="op-tabs">${tabsHTML}</div>
    ${statsBar}
    ${rows}`;
}

function bindLista() {
  document.querySelectorAll('.sol-row').forEach(row=>{
    row.addEventListener('click',()=>{ viewId=row.dataset.id; screen='ver'; render(); });
  });
  document.getElementById('btn-ref')?.addEventListener('click', reloadData);
  document.querySelectorAll('.op-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{ fPeriodo=btn.dataset.periodo; render(); });
  });
}

/* ── PANTALLA: VER SOLICITUD ──────────────────────────────────────────────── */
function verHTML() {
  const sol=sols.find(s=>s.id===viewId);
  if(!sol) return `<div class="alert a-err">Solicitud no encontrada.</div>
    <button class="btn btn-secondary" id="btn-bk">← Volver</button>`;

  const ls=lineasDeSol(sol);
  const grps={};
  ls.forEach(l=>{ const p=l.Proveedor||'(Sin proveedor)'; if(!grps[p])grps[p]=[]; grps[p].push(l); });

  const grpsHTML = Object.entries(grps).map(([p,lls])=>{
    const rows = lls.map(l=>{
      const gestionable = esGestionable(l);
      const done        = OP_EJECUTADO.has(l.EstadoRecepcion);

      const recepInfo = done ? `

        ${l.ObservacionOperacion?`<div class="ver-cell" style="grid-column:1/-1">
          <span class="ver-clbl">Obs. Operación</span>
          <span class="ver-cval">${esc(l.ObservacionOperacion)}</span>
        </div>`:''}
        <div class="ver-cell">
          <span class="ver-clbl">Ejecutado por</span>
          <span class="ver-cval">${esc(l.EjecutadoPor||'—')} · ${fDate(l.FechaEjecucionReal)}</span>

      const actPanel = gestionable ? `

          ${formNoPresentado(l)}

      return `
      <div class="ver-linea${done?' ver-linea-done':''}">
        <div class="ver-grid">
          <div class="ver-cell"><span class="ver-clbl">Marca</span><span class="ver-cval">${esc(l.Marca||'—')}</span></div>
          <div class="ver-cell"><span class="ver-clbl">Material</span><span class="ver-cval">${esc(l.Material||'—')}</span></div>
          <div class="ver-cell"><span class="ver-clbl">Cantidad</span><span class="ver-cval" style="font-weight:600;font-variant-numeric:tabular-nums">${l.Cantidad??'—'}</span></div>
          <div class="ver-cell"><span class="ver-clbl">Fecha Programada</span><span class="ver-cval">${fDate(l.FechaAprobada||l.FechaSolicitada)}</span></div>
          <div class="ver-cell"><span class="ver-clbl">Hora</span><span class="ver-cval">${l.HoraAprobada||l.HoraSolicitada||'—'}</span></div>
          <div class="ver-cell"><span class="ver-clbl">Estado Jef.</span><span class="ver-cval">${badge(l.EstadoLinea||'Pendiente')}</span></div>

          ${recepInfo}

      </div>`;
    }).join('');
    return `<div class="ver-grupo"><div class="ver-ghdr">🏭 ${esc(p)}</div><div>${rows}</div></div>`;
  }).join('')||`<div class="empty"><p>Sin líneas cargadas.</p></div>`;

  const lsPend   = ls.filter(l=>esGestionable(l)).length;
  const lsProc   = ls.filter(l=>OP_EJECUTADO.has(l.EstadoRecepcion)).length;

  return `
    <div style="margin-bottom:14px">
      <button class="btn btn-secondary" id="btn-bk">← Volver</button>
    </div>
    <div class="card" style="margin-bottom:18px">

        <h2 class="card-title">${esc(sol.NroSolicitud||'Solicitud')}</h2>

/* ── BIND VER ─────────────────────────────────────────────────────────────── */
const ACCIONES_OP = ['recibidook','novedades','parcial','rechazado','nopresentado'];

function bindVer() {
  document.getElementById('btn-bk')?.addEventListener('click',()=>{ screen='lista'; render(); });

  // Abrir/cerrar formularios
  document.querySelectorAll('.act-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const lid=btn.dataset.lid; const accion=btn.dataset.accion;
      ACCIONES_OP.forEach(a=>{
        const f=document.getElementById(`af-${a}-${lid}`);
        if(f) f.classList.remove('open');
      });
      const form=document.getElementById(`af-${accion}-${lid}`);
      if(form) form.classList.toggle('open');
    });
  });

  // Cancelar formularios
  document.querySelectorAll('.af-cx').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const f=document.getElementById(`af-${btn.dataset.accion}-${btn.dataset.lid}`);
      if(f) f.classList.remove('open');
    });
  });

  // Cálculo automático CantidadPendiente en formulario Parcial
  document.querySelectorAll('[id^="pc-cant-"]').forEach(inp=>{
    const lid = inp.id.replace('pc-cant-','');
    const pendEl = document.getElementById(`pc-pend-${lid}`);
    const submitBtn = document.getElementById(`pc-submit-${lid}`);
    const total = Number(submitBtn?.dataset.cantidad||0);
    inp.addEventListener('input',()=>{
      const rec=Number(inp.value)||0;
      if(pendEl) pendEl.value = rec>0 ? Math.max(0,total-rec) : '';
    });
  });

  // ✅ RECIBIDO OK
  document.querySelectorAll('[id^="ok-submit-"]').forEach(btn=>{
    btn.addEventListener('click', async()=>{
      const lid  = btn.dataset.lid;
      const cant = document.getElementById(`ok-cant-${lid}`)?.value;
      const obs  = document.getElementById(`ok-obs-${lid}`)?.value?.trim()||null;
      const cEl  = document.getElementById(`ok-cant-${lid}`);
      if(!cant||cant<=0){if(cEl){cEl.classList.add('err');cEl.focus();}return;}
      if(cEl) cEl.classList.remove('err');
      await ejecutarRecepcion(btn,lid,'Recibido OK',{
        EstadoRecepcion:'Recibido OK',CantidadRecibida:Number(cant),
        CantidadPendiente:0,ObservacionOperacion:obs||''
      },'Confirmar recepción');
    });
  });

  // ⚠️ RECIBIDO CON NOVEDADES
  document.querySelectorAll('[id^="nv-submit-"]').forEach(btn=>{
    btn.addEventListener('click', async()=>{
      const lid  = btn.dataset.lid;
      const cant = document.getElementById(`nv-cant-${lid}`)?.value;
      const obs  = document.getElementById(`nv-obs-${lid}`)?.value?.trim();
      const cEl  = document.getElementById(`nv-cant-${lid}`);
      const oEl  = document.getElementById(`nv-obs-${lid}`);
      if(!cant||cant<=0){if(cEl){cEl.classList.add('err');cEl.focus();}return;}
      if(cEl) cEl.classList.remove('err');
      if(!obs){if(oEl){oEl.classList.add('err');oEl.focus();}return;}
      if(oEl) oEl.classList.remove('err');
      await ejecutarRecepcion(btn,lid,'Recibido con Novedades',{
        EstadoRecepcion:'Recibido con Novedades',CantidadRecibida:Number(cant),
        CantidadPendiente:0,ObservacionOperacion:obs
      },'Confirmar recepción');
    });
  });

  // 📦 PARCIALMENTE RECIBIDA
  document.querySelectorAll('[id^="pc-submit-"]').forEach(btn=>{
    btn.addEventListener('click', async()=>{
      const lid   = btn.dataset.lid;
      const total = Number(btn.dataset.cantidad||0);
      const cant  = document.getElementById(`pc-cant-${lid}`)?.value;
      const obs   = document.getElementById(`pc-obs-${lid}`)?.value?.trim()||null;
      const cEl   = document.getElementById(`pc-cant-${lid}`);
      if(!cant||Number(cant)<=0){if(cEl){cEl.classList.add('err');cEl.focus();}return;}
      if(cEl) cEl.classList.remove('err');
      const recibida  = Number(cant);
      const pendiente = Math.max(0, total - recibida);
      await ejecutarRecepcion(btn,lid,'Parcialmente Recibida',{
        EstadoRecepcion:'Parcialmente Recibida',CantidadRecibida:recibida,
        CantidadPendiente:pendiente,ObservacionOperacion:obs||''
      },'Confirmar recepción parcial');
    });
  });

  // ❌ RECHAZADO POR OPERACIÓN
  document.querySelectorAll('[id^="rj-submit-"]').forEach(btn=>{
    btn.addEventListener('click', async()=>{
      const lid = btn.dataset.lid;
      const obs = document.getElementById(`rj-obs-${lid}`)?.value?.trim();
      const oEl = document.getElementById(`rj-obs-${lid}`);
      if(!obs){if(oEl){oEl.classList.add('err');oEl.focus();}return;}
      if(oEl) oEl.classList.remove('err');
      await ejecutarRecepcion(btn,lid,'Rechazado por Operación',{
        EstadoRecepcion:'Rechazado por Operación',CantidadRecibida:0,
        CantidadPendiente:0,ObservacionOperacion:obs
      },'Confirmar rechazo');
    });
  });

  // 🚫 NO PRESENTADO
  document.querySelectorAll('[id^="np-submit-"]').forEach(btn=>{
    btn.addEventListener('click', async()=>{
      const lid = btn.dataset.lid;
      const obs = document.getElementById(`np-obs-${lid}`)?.value?.trim()||null;
      await ejecutarRecepcion(btn,lid,'No Presentado',{
        EstadoRecepcion:'No Presentado',CantidadRecibida:0,
        CantidadPendiente:0,ObservacionOperacion:obs||''
      },'Confirmar no presentación');
    });
  });
}

/* ── EJECUTAR RECEPCIÓN (HELPER COMÚN) ──────────────────────────────────── */
async function ejecutarRecepcion(btn, lid, estadoNuevo, camposExtra, labelOriginal) {
  const txtOriginal = btn.textContent;
  btn.disabled=true; btn.textContent='Guardando…';
  try {
    const linea       = lineas.find(l=>l.id===lid);
    const estadoAntes = linea?.EstadoRecepcion||'—';
    const now         = new Date().toISOString();
    const hoyISO      = hoy();
    const quien       = quien_es();
    const anticipada  = esAnticipada(linea);

    const campos = {
      ...camposExtra,
      EjecutadoPor: quien,
      FechaEjecucionReal: hoyISO,
      EsAnticipada: anticipada
    };

    await gPatch(`${BASE}/sites/${SITE}/lists/MKT_Lineas/items/${lid}/fields`, campos);
    await historial(lid,'EstadoRecepcion',estadoAntes,estadoNuevo,quien,now,camposExtra.ObservacionOperacion||'');

    patchLocal(lid, campos);
    showAlert('ok',`${estadoNuevo} · línea registrada correctamente`);
    render();
  } catch(e) {
    btn.disabled=false; btn.textContent=labelOriginal||txtOriginal;
    showAlert('err','Error: '+e.message);
  }
}

/* ── HELPERS ──────────────────────────────────────────────────────────────── */
function quien_es() { return me?.name||me?.displayName||me?.username||'Desconocido'; }

function patchLocal(lid,fields) {
  const l=lineas.find(x=>x.id===lid);
  if(l) Object.assign(l,fields);
}

function esAnticipada(l) {
  if(!l) return false;
  const fAprobada = toISO(l.FechaAprobada);
  if(!fAprobada) return false;
  return hoy() < fAprobada;
}

async function historial(lineaId,campo,valorAnterior,valorNuevo,usuario,now,obs) {
  const sol=sols.find(s=>s.id===viewId);
  await gPost(`${BASE}/sites/${SITE}/lists/MKT_Historial/items`,{
    fields:{
      SolicitudId: viewId,
      NroSolicitud: sol?.NroSolicitud||'',
      LineaId: lineaId,
      Campo: campo,
      ValorAnterior: valorAnterior,
      ValorNuevo: valorNuevo,
      Modulo: 'Operacion',
      UsuarioAccion: usuario,
      Timestamp: now,
      Observacion: obs||''
    }
  });
}

let alertTimer;
function showAlert(type,msg){
  const el=document.getElementById('ac');if(!el)return;
  el.innerHTML=`<div class="alert a-${type}">${msg}</div>`;
  clearTimeout(alertTimer);
  if(type==='ok') alertTimer=setTimeout(()=>{el.innerHTML='';},5000);
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function reloadData() {
  busy=true;render();
  try {
    const[s,l]=await Promise.all([
      gAll(`${BASE}/sites/${SITE}/lists/MKT_Solicitudes/items?$expand=fields&$top=500`),
      gAll(`${BASE}/sites/${SITE}/lists/MKT_Lineas/items?$expand=fields&$top=500`)
    ]);
    sols   = s.map(i=>({id:i.id,...i.fields}));
    lineas = l.map(i=>({id:i.id,...i.fields}));
  } catch(e){ console.warn('[DATA]',e.message); }
  busy=false;render();
}

/* ── AUTH ─────────────────────────────────────────────────────────────────── */
function login(){ msalApp.loginRedirect({scopes:SCOPES}); }

async function tok(){
  if(!msalApp) throw new Error('MSAL no inicializado');
  const acc=msalApp.getActiveAccount();
  if(!acc) throw new Error('Sin sesión');
  return msalApp.acquireTokenSilent({scopes:SCOPES,account:acc})
    .catch(function(){ return msalApp.acquireTokenRedirect({scopes:SCOPES}); })
    .then(function(r){ return r?r.accessToken:Promise.reject(new Error('redirect')); });
}

function showLoginPage(){
  document.getElementById('app').innerHTML=
    '<div class="login-wrap"><div class="login-card">'+
    '<div style="font-size:40px;margin-bottom:8px">📦</div>'+
    '<h2 style="margin:0 0 6px">RF MKT · Operación</h2>'+
    '<p style="color:var(--fg-muted);margin:0 0 20px;font-size:13px">Inicia sesión con tu cuenta Microsoft</p>'+
    '<button class="btn btn-primary" style="width:100%;justify-content:center" onclick="login()">🔐 Iniciar sesión</button>'+
    '</div></div>';
}

async function postLogin(){
  busy=true;render();
  try {
    const[s,l]=await Promise.all([
      gAll(`${BASE}/sites/${SITE}/lists/MKT_Solicitudes/items?$expand=fields&$top=500`),
      gAll(`${BASE}/sites/${SITE}/lists/MKT_Lineas/items?$expand=fields&$top=500`)
    ]);
    sols   = s.map(i=>({id:i.id,...i.fields}));
    lineas = l.map(i=>({id:i.id,...i.fields}));
  } catch(e){ console.warn('[DATA]',e.message); }
  busy=false;render();
}

/* ── BOOT ─────────────────────────────────────────────────────────────────── */
(function bootMsal(){
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js';
  s.onload=function(){
    msalApp=new msal.PublicClientApplication(MSAL_CFG);
    msalApp.handleRedirectPromise().then(function(res){
      if(res&&res.account){ me=res.account; msalApp.setActiveAccount(me); postLogin(); }
      else {
        var all=msalApp.getAllAccounts();
        if(all.length>0){ me=all[0]; msalApp.setActiveAccount(me); postLogin(); }
        else{ showLoginPage(); }
      }
    }).catch(function(e){ console.error('[MSAL]',e); showLoginPage(); });
  };
  s.onerror=function(){
    document.getElementById('app').innerHTML=
      '<div class="login-wrap"><div class="login-card">'+
      '<p style="color:var(--err)">No se pudo cargar la librería de autenticación. Verifica tu conexión.</p>'+
      '</div></div>';
  };
  document.head.appendChild(s);
})();
</script>
