<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RF Conteo — Inverneg</title>
<style>
:root{
  --bg:#0D1117;--surface:#161B22;--surface2:#1C2330;--border:#2A3340;
  --text:#E6EDF3;--muted:#7D8590;--accent:#58A6FF;--accent2:#F85149;
  --ok:#3FB950;--warn:#E3B341;--inv:#58A6FF;--rec:#F0883E;
  --mono:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
#app{display:flex;flex-direction:column;min-height:100vh}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-title{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.hdr-sub{font-size:10px;color:var(--muted);margin-top:1px}
.hdr-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);font-size:11px;padding:5px 10px;border-radius:5px;cursor:pointer}
#screen{flex:1;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ftr{background:var(--surface);border-top:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:44px}
.ftr-op{font-size:11px;color:var(--muted)}
.ftr-mode{font-size:10px;font-family:var(--mono);color:var(--warn);letter-spacing:.06em}
/* Inputs */
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;margin-top:10px}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:16px;padding:10px 12px;border-radius:6px;outline:none;font-family:inherit}
.inp:focus{border-color:var(--accent)}
.inp-sm{font-size:14px;padding:8px 10px}
select.inp{appearance:none;-webkit-appearance:none}
/* Botones */
.btn{border:none;border-radius:6px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .1s}
.btn:active{opacity:.75}
.btn-pri{background:var(--accent);color:#000}
.btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ok{background:var(--ok);color:#000}
.btn-warn{background:var(--accent2);color:#fff}
.btn-big{width:100%;padding:13px;font-size:15px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
/* Cards de tipo */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.type-card{background:var(--surface2);border:2px solid var(--border);border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;transition:border-color .15s}
.type-card:active{border-color:var(--accent)}
.type-card.sel{border-color:var(--accent);background:#1a2030}
.type-card.rec.sel{border-color:var(--rec)}
.type-card-icon{font-size:28px;margin-bottom:6px}
.type-card-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--text)}
/* Badges */
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:4px;margin-bottom:8px;text-transform:uppercase}
.badge-inv{background:rgba(88,166,255,.15);color:var(--inv);border:1px solid rgba(88,166,255,.3)}
.badge-rec{background:rgba(240,136,62,.15);color:var(--rec);border:1px solid rgba(240,136,62,.3)}
.badge-sup{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.3)}
/* Valores */
.val{font-size:28px;font-weight:700;margin:6px 0;text-align:center}
.val.ok{color:var(--ok)}.val.accent{color:var(--accent)}.val.warn{color:var(--warn)}.val.sm{font-size:16px}
/* Progress */
.prog-wrap{background:var(--surface2);border-radius:6px;padding:10px 12px;margin:6px 0}
.prog-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.prog-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.prog-fill.rec{background:var(--rec)}
/* Alert */
.alert{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:var(--accent2);border-radius:6px;padding:8px 12px;font-size:12px;margin:6px 0}
.alert-warn{background:rgba(227,179,65,.12);border:1px solid rgba(227,179,65,.3);color:var(--warn)}
/* Steps bar */
.steps{display:flex;gap:3px;margin-bottom:10px}
.step{height:3px;border-radius:2px;flex:1;background:var(--border)}
.step.on{background:var(--accent)}
.step.on.rec{background:var(--rec)}
/* Estado toggle */
.estado-toggle{display:flex;gap:8px;margin:4px 0}
.estado-opt{flex:1;padding:10px;border-radius:6px;text-align:center;font-size:13px;font-weight:700;cursor:pointer;background:var(--surface2);border:2px solid var(--border);color:var(--muted)}
.sel-ok{border-color:var(--ok);color:var(--ok);background:rgba(63,185,80,.1)}
.sel-dan{border-color:var(--accent2);color:var(--accent2);background:rgba(248,81,73,.1)}
/* Toast */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;font-size:12px;z-index:999;white-space:nowrap;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
/* Conexión indicator */
.conn-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.conn-ok{background:var(--ok)}.conn-warn{background:var(--warn)}.conn-err{background:var(--accent2)}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div>
      <div class="hdr-title">▸ RF CONTEO</div>
      <div class="hdr-sub" id="hdr-sub">Inverneg · CND</div>
    </div>
    <button class="hdr-btn" onclick="window.goHome&&goHome()">⌂ Inicio</button>
  </div>
  <div id="screen"><div style="text-align:center;padding:40px;color:var(--muted)">Iniciando...</div></div>
  <div class="ftr">
    <div class="ftr-op" id="ftr-op">—</div>
    <div style="display:flex;align-items:center">
      <span class="conn-dot conn-warn" id="conn-dot"></span>
      <span class="ftr-mode" id="ftr-mode">CONECTANDO</span>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════════
// 1. UTILIDADES PURAS
// ═══════════════════════════════════════════════════════════════════
function pad(n){ return String(n).padStart(2,'0'); }

function ahora(){
  var d=new Date();
  var fecha=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var hora=pad(d.getHours())+':'+pad(d.getMinutes());
  return {fecha:fecha,hora:hora,ts:fecha+' '+hora+':'+pad(d.getSeconds()),raw:d};
}

function sid(){
  var t=ahora();
  return 'CNT-'+t.fecha.replace(/-/g,'')+'-'+pad(Math.floor(Math.random()*100));
}

function toast(msg,dur){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},dur||2200);
}

function render(html){ document.getElementById('screen').innerHTML=html; }

function stepsBar(cur,tot,tipo){
  var cls=tipo==='rec'?'on rec':'on';
  var html='<div class="steps">';
  for(var i=0;i<tot;i++) html+='<div class="step'+(i<cur?' '+cls:'')+'"></div>';
  return html+'</div>';
}

function setConn(estado){
  var dot=document.getElementById('conn-dot');
  var lbl=document.getElementById('ftr-mode');
  dot.className='conn-dot';
  if(estado==='ok'){dot.classList.add('conn-ok');lbl.textContent='LIVE';}
  else if(estado==='warn'){dot.classList.add('conn-warn');lbl.textContent='CONECTANDO';}
  else{dot.classList.add('conn-err');lbl.textContent='SIN CONEXIÓN';}
}

function updateFooter(){
  var op=S.operario||'—';
  var rol=S.rol?(' · '+(S.rol==='supervisor'?'SUP':'OP')):'';
  document.getElementById('ftr-op').textContent=op+rol;

var S={

};

// ═══════════════════════════════════════════════════════════════════
// 6. GRAPH HELPERS
// ═══════════════════════════════════════════════════════════════════
function getToken(){
  if(!msalAccount) return Promise.reject(new Error('Sin sesión'));
  var req={scopes:GRAPH_SCOPES,account:msalAccount};
  return msalInstance.acquireTokenSilent(req).catch(function(){
    return msalInstance.acquireTokenRedirect(req);
  });
}

function graphGet(url){
  return getToken().then(function(r){
    return fetch(url,{headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'}});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+': '+t.substring(0,120));});
    return r.json();
  });
}

function graphPost(url,body){
  return getToken().then(function(r){
    return fetch(url,{method:'POST',
      headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'},
      body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+': '+t.substring(0,120));});
    return r.json();
  });
}

function graphPatch(url,body){
  return getToken().then(function(r){
    return fetch(url,{method:'PATCH',
      headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'},
      body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+': '+t.substring(0,120));});
    return r.status===204?{}:r.json();
  });
}

function urlLista(listId){
  return 'https://graph.microsoft.com/v1.0/sites/'+CFG.siteId+'/lists/'+listId;
}

function urlWorkbook(hoja){
  return 'https://graph.microsoft.com/v1.0/drives/'+DB.catalogoDriveId+
    '/items/'+DB.catalogoItemId+
    "/workbook/worksheets('"+hoja+"')/usedRange";
}

// ═══════════════════════════════════════════════════════════════════
// 7. DESCUBRIMIENTO AUTOMÁTICO DE LISTAS SP
// ═══════════════════════════════════════════════════════════════════
function descubrirListas(){
  console.log('[INIT] descubrirListas — buscando en siteId:',CFG.siteId);
  var url='https://graph.microsoft.com/v1.0/sites/'+CFG.siteId+
    '/lists?$select=id,displayName&$top=200';
  return graphGet(url).then(function(data){
    if(!data.value){
      console.error('[INIT] descubrirListas — respuesta vacía de SP');
      return false;
    }
    console.log('[INIT] Listas encontradas en SP ('+data.value.length+'):',
      data.value.map(function(l){return l.displayName;}).join(', '));
    data.value.forEach(function(lst){
      if(lst.displayName===CFG.listaConteos){
        DB.listIds.conteos=lst.id;
        console.log('[INIT] ✓ '+CFG.listaConteos+' → id:'+lst.id);
      }
      if(lst.displayName===CFG.listaRecepciones){
        DB.listIds.recepciones=lst.id;
        console.log('[INIT] ✓ '+CFG.listaRecepciones+' → id:'+lst.id);
      }
    });
    if(!DB.listIds.conteos)
      console.error('[INIT] ✗ No encontrada: "'+CFG.listaConteos+'" — verifica el nombre exacto en SP');
    if(!DB.listIds.recepciones)
      console.error('[INIT] ✗ No encontrada: "'+CFG.listaRecepciones+'" — verifica el nombre exacto en SP');
    var ok=!!(DB.listIds.conteos&&DB.listIds.recepciones);
    console.log('[INIT] descubrirListas resultado:',ok?'OK':'FALLÓ');
    return ok;
  }).catch(function(e){
    console.error('[INIT] descubrirListas error:',e.message);
    return false;
  });
}

// ═══════════════════════════════════════════════════════════════════
// 8. DESCUBRIMIENTO AUTOMÁTICO DEL EXCEL
// ═══════════════════════════════════════════════════════════════════
function descubrirCatalogoExcel(){
  var nombre=CFG.catalogoNombre;
  console.log('[INIT] descubrirCatalogoExcel — buscando:',nombre);
  var url='https://graph.microsoft.com/v1.0/me/drive/root/search(q='+
    encodeURIComponent("'"+nombre+"'")+')';
  return graphGet(url).then(function(data){
    if(!data.value||data.value.length===0){
      console.error('[INIT] ✗ Excel no encontrado:',nombre,
        '— verifica que el archivo existe en OneDrive/SharePoint y el nombre es exacto');
      return false;
    }
    console.log('[INIT] Resultados búsqueda Excel ('+data.value.length+'):',
      data.value.map(function(f){return f.name+'@'+f.parentReference.path;}).join(' | '));
    var archivo=null;
    for(var i=0;i<data.value.length;i++){
      if(data.value[i].name===nombre){archivo=data.value[i];break;}
    }
    if(!archivo){
      console.error('[INIT] ✗ Sin coincidencia exacta para:',nombre,
        '— los resultados tienen nombres similares pero no exactos');
      return false;
    }
    DB.catalogoDriveId=archivo.parentReference&&archivo.parentReference.driveId
      ?archivo.parentReference.driveId:null;
    DB.catalogoItemId=archivo.id;
    console.log('[INIT] ✓ Excel descubierto:',nombre);
    console.log('[INIT]   driveId:',DB.catalogoDriveId);
    console.log('[INIT]   itemId: ',DB.catalogoItemId);
    console.log('[INIT]   ruta:   ',archivo.parentReference&&archivo.parentReference.path);
    return true;
  }).catch(function(e){
    console.error('[INIT] descubrirCatalogoExcel error:',e.message);
    return false;
  });
}

// ═══════════════════════════════════════════════════════════════════
// 9. LECTURA DE CATÁLOGOS DESDE EXCEL (Workbook API)
// ═══════════════════════════════════════════════════════════════════
function leerCatalogos(){
  return descubrirCatalogoExcel().then(function(ok){
    if(!ok||!DB.catalogoDriveId||!DB.catalogoItemId){
      console.warn('[INIT] Excel no disponible — usando operadores de respaldo ('+DB.operarios.length+')');

      return;
    }
    console.log('[INIT] Leyendo hojas Excel: Asignaciones, D365, Pedidos, Contenedores, Compra');
    return Promise.all([
      graphGet(urlWorkbook('Asignaciones')).then(function(r){
        console.log('[INIT] Hoja Asignaciones — filas:'+(r&&r.values?r.values.length-1:0));return r;
      }).catch(function(e){console.error('[INIT] Hoja Asignaciones error:',e.message);return null;}),
      graphGet(urlWorkbook('D365')).then(function(r){
        console.log('[INIT] Hoja D365 — filas:'+(r&&r.values?r.values.length-1:0));return r;
      }).catch(function(e){console.error('[INIT] Hoja D365 error:',e.message);return null;}),
      graphGet(urlWorkbook('Pedidos')).then(function(r){
        console.log('[INIT] Hoja Pedidos — filas:'+(r&&r.values?r.values.length-1:0));return r;
      }).catch(function(e){console.error('[INIT] Hoja Pedidos error:',e.message);return null;}),
      graphGet(urlWorkbook('Contenedores')).then(function(r){
        console.log('[INIT] Hoja Contenedores — filas:'+(r&&r.values?r.values.length-1:0));return r;
      }).catch(function(e){console.error('[INIT] Hoja Contenedores error:',e.message);return null;}),
      graphGet(urlWorkbook('Compra')).then(function(r){
        console.log('[INIT] Hoja Compra — filas:'+(r&&r.values?r.values.length-1:0));return r;
      }).catch(function(e){console.error('[INIT] Hoja Compra error:',e.message);return null;}),
    ]).then(function(res){
      if(res[0]) _parsearAsignaciones(res[0]);
      if(res[1]) _parsearD365(res[1]);
      if(res[2]) _parsearPedidos(res[2]);
      if(res[3]) _parsearContenedores(res[3]);
      if(res[4]) _parsearCompra(res[4]);
      console.log('[INIT] Catálogos cargados — resumen:');
      console.log('[INIT]   Asignaciones activas:',DB.asignaciones.length);
      console.log('[INIT]   Items D365:          ',DB.d365.length);
      console.log('[INIT]   Pedidos:             ',DB.pedidos.length);
      console.log('[INIT]   Contenedores:        ',DB.contenedores.length);
      console.log('[INIT]   Items Compra:        ',DB.compra.length);
    }).catch(function(e){
      console.error('[INIT] Error general leyendo Excel:',e.message,'— usando respaldo');
    });
  });
}

function _parsearAsignaciones(data){
  if(!data||!data.values||data.values.length<2){
    console.warn('[INIT] _parsearAsignaciones vacía'); return;
  }
  // Cols: FechaAsignacion(A),Supervisor(B),Operario(C),Tipo(D),Valor(E),Modalidad(F),Status(G),FechaInventario(H)
  var raw=data.values.slice(1);
  console.log('[INIT] Asignaciones filas brutas:',raw.length);
  var NOISE=/^[\u2191\*\-\#]/;
  DB.asignaciones=raw.filter(function(r){
    if(!r[2]) return false;
    var s=r[6]?r[6].toString().trim().toLowerCase():'';
    if(s!=='activo') return false;
    var a=r[0]?r[0].toString().trim():'';
    return a.length<=60&&!NOISE.test(a);

function getItemsAsignados(asig){
  if(!asig) return [];
  console.log('[INV] getItemsAsignados tipo:"'+asig.tipo+'" valor:"'+asig.valor+'"');
  console.log('[INV] DB.d365:',DB.d365.length);
  if(DB.d365.length===0){
    console.error('[INV] ✗ DB.d365 vacío — hoja D365 no cargó');
    return [];
  }
  var resultado;
  if(asig.tipo==='Marca'){
    var marcaNorm=asig.valor.trim().toUpperCase();
    var marcasU=[];
    DB.d365.forEach(function(r){if(marcasU.indexOf(r.marca)<0)marcasU.push(r.marca);});
    console.log('[INV] Marcas D365('+marcasU.length+'):',marcasU.sort().join(','));
    resultado=DB.d365.filter(function(r){return r.marca.trim().toUpperCase()===marcaNorm;});
    if(resultado.length===0) console.warn('[INV] ✗ Marca "'+asig.valor+'" no encontrada');
    else console.log('[INV] ✓ Items marca "'+asig.valor+'":',resultado.length);
  } else {
    var val=asig.valor.trim();
    console.log('[INV] Muestra ubicaciones D365:',DB.d365.slice(0,5).map(function(r){return r.ubicacion;}).join(','));
    if(val.indexOf(',')>-1){
      var pasillos=val.split(',').map(function(s){return s.trim();});
      console.log('[INV] Pasillos:',pasillos.join(','));
      resultado=DB.d365.filter(function(r){return pasillos.some(function(p){return r.ubicacion.startsWith(p);});});
    } else if(val.indexOf('-')>-1){
      var pts=val.split('-');
      var base=pts[0].replace(/[0-9]+$/,'');
      var n1=parseInt(pts[0].replace(base,''));
      var n2=parseInt(pts[1].replace(base,''));
      console.log('[INV] Rango base:"'+base+'" n1:'+n1+' n2:'+n2);
      resultado=DB.d365.filter(function(r){
        var mx=r.ubicacion.match(/^([A-Za-z]+)([0-9]+)/);
        if(!mx||mx[1].toUpperCase()!==base.toUpperCase()) return false;
        var n=parseInt(mx[2]); return n>=n1&&n<=n2;
      });
    } else {
      resultado=DB.d365.filter(function(r){return r.ubicacion.startsWith(val);});
    }
    if(resultado.length===0) console.warn('[INV] ✗ Sin items para "'+asig.valor+'"');
    else console.log('[INV] ✓ Items "'+asig.valor+'":',resultado.length);
  }
  console.log('[INV] Ubicaciones:',agruparPorUbicacion(resultado).length);
  return resultado;
}
function agruparPorUbicacion(items){
  var map={};
  items.forEach(function(it){
    if(!map[it.ubicacion]) map[it.ubicacion]=[];
    map[it.ubicacion].push(it);
  });
  return Object.entries(map).sort(function(a,b){return a[0].localeCompare(b[0]);});
}

function getPedidoInfo(pedido){
  return DB.pedidos.find(function(p){return p.pedido===pedido;})||null;
}

function getContenedoresDePedido(pedido){
  return DB.contenedores.filter(function(c){return c.pedido===pedido;});
}

function calcDiferenciasPedido(pedido){
  var compra=DB.compra.filter(function(c){return c.pedido===pedido;});
  var recibido={};
  S.conteoActual.forEach(function(r){
    if(r.pedido===pedido&&r.tipo==='RECEPCION'){
      var sku=r.cod_interno||r.cod_producto;
      recibido[sku]=(recibido[sku]||0)+Number(r.cantidad);
    }
  });
  var diffs=[];
  compra.forEach(function(c){
    var rec=recibido[c.sku]||0;
    if(rec!==c.cantidad) diffs.push({sku:c.sku,desc:c.desc,esperado:c.cantidad,recibido:rec,diff:rec-c.cantidad});
  });
  Object.keys(recibido).forEach(function(sku){
    if(!compra.find(function(c){return c.sku===sku;}))
      diffs.push({sku:sku,desc:'',esperado:0,recibido:recibido[sku],diff:recibido[sku]});
  });
  return diffs;
}

  var op=document.getElementById('asig-op').value;
  var valEl=document.getElementById('asig-val');
  var val=valEl?valEl.value.trim():'';
  var mod=document.getElementById('asig-mod')?document.getElementById('asig-mod').value:'datos';
  var fechaInv=document.getElementById('asig-fecha-inv')?document.getElementById('asig-fecha-inv').value:'';
  if(!op){toast('Selecciona el operario');return;}
  if(!_tipoAsig){toast('Selecciona el tipo');return;}
  if(!val){toast('Ingresa el valor de la asignación');return;}
  if(!fechaInv){toast('Ingresa la fecha del inventario');return;}
  var existe=DB.asignaciones.find(function(a){return a.operario===op;});
  if(existe){
    if(!confirm('El operario '+op+' ya tiene una asignación ('+existe.valor+'). ¿Reemplazar?')) return;
    DB.asignaciones=DB.asignaciones.filter(function(a){return a.operario!==op;});
  }
  DB.asignaciones.push({operario:op,tipo:_tipoAsig,valor:val,modalidad:mod,fechaInventario:fechaInv});
  _tipoAsig='';
  toast('Asignación guardada');
  showSupAsignaciones();
}

function confConteoSku(){
  var cant=parseInt(document.getElementById('inp-cant-inv').value);
  if(isNaN(cant)||cant<0){toast('Ingresa una cantidad válida');return;}
  var ubic=S.invGrupos[S.invUbicIdx][0];
  var items=S.invGrupos[S.invUbicIdx][1];
  var item=items[S.invSkuIdx];
  var key=ubic+'|'+item.sku;
  S.invConteos[key]=cant;
  if(!S._logCount) S._logCount={};
  S._logCount[key]=(S._logCount[key]||0)+1;
  var t=ahora();
  var asig=S.invAsignacion||{};
  var reg={
    // Para SP List RF_PRecepciones_LConteos
    tipo:'CONTEO',
    fecha_inventario:  asig.fechaInventario||'',
    fecha_registro:    t.fecha,
    hora_registro:     t.hora+':'+pad(t.raw.getSeconds()),
    sesion:            S.sesionId,
    supervisor:        S.supervisor||S.operario,
    operario:          S.operario,
    tipo_asignacion:   asig.tipo||'',
    asignacion:        asig.valor||'',
    modalidad:         S.modalidad==='datos'?'Con datos':'A ciegas',
    almacen:           item.almacen,
    ubicacion:         ubic,
    sku:               item.sku,
    descripcion:       item.desc,
    marca:             item.marca,
    inv_d365:          item.inv,
    conteo:            cant,
    diferencia:        cant-item.inv,
    num_registro:      S._logCount[key],
  };
  S.conteoActual.push(reg);
  // Escritura asíncrona a SP — no bloquea la UI
  escribirConteo(reg).catch(function(e){console.warn('escribirConteo falló:',e.message);});
  S.invSkuIdx++;
  showInvSku();
}

      (diffs.length>0?' · <span style="color:var(--accent2)">'+diffs.length+' con diferencia</span>':' · sin diferencias')+
    '</div>'+
    (diffs.length>0
      ?'<div style="background:var(--surface2);border-radius:6px;padding:8px;margin-bottom:8px;font-size:11px">'+
        diffs.map(function(it){

        }).join('')+'</div>'
      :'')+
    '<div class="btn-row" style="margin-top:10px">'+
      '<button class="btn btn-sec" onclick="S.invSkuIdx=0;window.showInvSku()">↩ Repasar</button>'+

function onContenedorChange(){

    S.recSello=found.sello||'';

  }
  document.getElementById('rec-sello').value=S.recSello;
  document.getElementById('rec-sello').style.color=S.recSello?'var(--accent)':'var(--muted)';

  S.recPedido=document.getElementById('rec-pedido').value;

  S.lpnsEsperados=nPallets>0?Array.from({length:nPallets},function(_,i){

function calcTotalUds(){
  var uxc=parseFloat(document.getElementById('inp-unxcaja')?document.getElementById('inp-unxcaja').value:S.unxcaja||0);
  var cajas=parseFloat(document.getElementById('inp-numcajas')?document.getElementById('inp-numcajas').value:S.numCajas||0);
  if(isNaN(uxc))uxc=0;if(isNaN(cajas))cajas=0;
  return (uxc*cajas)||0;
}

function updateTotalUds(){
  var el=document.getElementById('lbl-total-uds');
  if(el)el.textContent=calcTotalUds();
}

function confCantidadRec(){
  var uxc=parseFloat(document.getElementById('inp-unxcaja').value);
  var cajas=parseFloat(document.getElementById('inp-numcajas').value);
  if(isNaN(uxc)||uxc<=0){toast('Ingresa las unidades por caja');return;}
  if(isNaN(cajas)||cajas<0){toast('Ingresa el número de cajas');return;}
  S.unxcaja=uxc;S.numCajas=cajas;
  var cant=uxc*cajas;
  var t=ahora();
  var reg={
    // Para SP List RF_PRecepciones_LRecepciones
    tipo:'RECEPCION',
    fecha:           t.fecha,
    hora:            t.hora,
    sesion:          S.sesionId,
    operario:        S.operario,
    solicitante:     S.solicitante,
    subtipo:         S.recSubtipo==='importacion'?'IMPORTACION':'COMPRA LOCAL',
    pedido:          S.recPedido,
    contenedor:      S.recContenedor,
    sello:           S.recSello,
    pallets:         parseInt(S.recPallets)||0,
    hora_llegada:    S.recHoraLlegada,
    hora_apertura:   S.recHoraApertura,
    hora_cierre:     S.recHoraCierre,
    hora_salida:     S.recHoraSalida,
    lpn:             S.lpn,
    lpn_ok:          S.lpnMismatch?'NO':'SI',
    cod_producto:    S.codProducto,
    cod_interno:     S.productoInfo?S.productoInfo.sku:'',
    nombre:          S.productoInfo?S.productoInfo.desc:'NO ENCONTRADO',
    unxcaja:         uxc,
    numcajas:        cajas,
    cantidad:        cant,
    estado:          S.estadoSku,
    alerta_producto: S.productoAlerta?'SI':'NO',
  };
  S.conteoActual.push(reg);S.itemsLPN.push(reg);
  // Escritura asíncrona a SP — guardamos _spItemId para poder parchear con novedades al cerrar
  escribirRecepcion(reg).then(function(spResult){
    if(spResult&&spResult.id) reg._spItemId=spResult.id;
  }).catch(function(e){console.warn('escribirRecepcion falló:',e.message);});
  showRecConfirmado(reg);
}

function confRecCierre(){
  S.recNovedades =document.getElementById('rec-novedades').value.trim();
  S.recPersonas  =Number(document.getElementById('rec-personas').value)||0;
  // Parchar los registros SP de este contenedor con novedades y personas
  // (se escribieron sin estos datos — se agregan al cerrar)
  var regsContedor=S.itemsLPN.concat(
    S.conteoActual.filter(function(r){
      return r.tipo==='RECEPCION'&&r.contenedor===S.recContenedor&&r._spItemId;
    })
  );
  if(S.recNovedades||S.recPersonas){
    regsContedor.forEach(function(reg){
      if(reg._spItemId&&DB.listIds.recepciones){
        graphPatch(
          urlLista(DB.listIds.recepciones)+'/items/'+reg._spItemId,
          {fields:{
            'Novedades': S.recNovedades||'',
            'Personas':  S.recPersonas,
          }}
        ).catch(function(e){console.warn('patch novedades:',e.message);});
      }
    });
  }
  // Verificar si es el último contenedor del pedido
  var pedInfo=getPedidoInfo(S.recPedido);
  var totalConts=pedInfo?pedInfo.contsTotal:null;
  var recibidos=S.conteoActual.filter(function(r){
    return r.tipo==='RECEPCION'&&r.pedido===S.recPedido;
  }).map(function(r){return r.contenedor;});
  var recibidosUnicos=[...new Set(recibidos)].length;
  if(totalConts&&recibidosUnicos>=totalConts){
    var diffs=calcDiferenciasPedido(S.recPedido);
    if(diffs.length>0){
      showModalDiferencias(diffs,function(){showRecNuevaOpcion();});
      return;
    }
  }
  showRecNuevaOpcion();
}

function showModalDiferencias(diffs,onContinuar){
  var rows=diffs.map(function(d){
    var icon,cls;
    if(d.esperado===0){icon='🆕';cls='warn';}
    else if(d.recibido===0){icon='❌';cls='danger';}
    else if(d.diff<0){icon='↓';cls='danger';}
    else{icon='↑';cls='warn';}
    return '<tr>'+
      '<td style="padding:4px 6px;font-size:11px;font-weight:600">'+d.sku+'</td>'+
      '<td style="padding:4px 6px;text-align:center;font-size:11px">'+(d.esperado||'—')+'</td>'+
      '<td style="padding:4px 6px;text-align:center;font-size:11px">'+(d.recibido||'0')+'</td>'+
      '<td style="padding:4px 6px;text-align:center;font-size:11px;color:'+(cls==='danger'?'var(--accent2)':'var(--warn)')+'">'+icon+' '+(d.diff>0?'+':'')+d.diff+'</td>'+
    '</tr>';
  }).join('');
  document.getElementById('screen').innerHTML=
    '<div style="background:var(--surface2);border-radius:10px;padding:14px;margin-bottom:8px">'+
      '<div style="font-size:13px;font-weight:700;color:var(--accent2);margin-bottom:8px">⚠ PEDIDO '+S.recPedido+' — DIFERENCIAS</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-bottom:10px">Último contenedor del pedido. Diferencias vs packing list:</div>'+
      '<table style="width:100%;border-collapse:collapse">'+
        '<thead><tr style="border-bottom:1px solid var(--border)">'+
          '<th style="padding:4px 6px;font-size:11px;text-align:left;color:var(--muted)">SKU</th>'+
          '<th style="padding:4px 6px;font-size:11px;color:var(--muted)">Esperado</th>'+
          '<th style="padding:4px 6px;font-size:11px;color:var(--muted)">Recibido</th>'+
          '<th style="padding:4px 6px;font-size:11px;color:var(--muted)">Dif.</th>'+
        '</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
      '</table>'+
    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">'+
      '<button class="btn btn-warn btn-big" onclick="('+onContinuar.toString()+')()">Cerrar de todas formas</button>'+
      '<button class="btn btn-sec btn-big" onclick="window.showRecCierre()">← Volver a revisar</button>'+
    '</div>';
}

function showRecNuevaOpcion(){
  S.step='rec-nueva';
  var pedInfo=getPedidoInfo(S.recPedido);
  var totalConts=pedInfo?pedInfo.contsTotal:'?';
  var recibidos=S.conteoActual.filter(function(r){
    return r.tipo==='RECEPCION'&&r.pedido===S.recPedido;
  }).map(function(r){return r.contenedor;});
  var recibidosUnicos=[...new Set(recibidos)].length;

    '</div>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+

var script=document.createElement('script');
script.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js';
script.onload=function(){
  msalInstance=new msal.PublicClientApplication(msalCfg);
  msalInstance.handleRedirectPromise().then(function(result){
    if(result&&result.account){
      msalAccount=result.account;
      postLogin();
    } else {
      var accounts=msalInstance.getAllAccounts();
      if(accounts.length>0){msalAccount=accounts[0];postLogin();}
      else showPantallaLogin();
    }
  }).catch(function(e){
    console.error('handleRedirectPromise:',e.message);
    showPantallaLogin();
  });
};
script.onerror=function(){
  render('<div class="alert">Error cargando MSAL. Verifica tu conexión.</div>');
};
document.head.appendChild(script);

})();
