<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>INVERNEG · Conteo RF</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0d0d14;--surface:#13131f;--surface2:#1a1a2a;--border:#2a2a40;
    --accent:#00e5a0;--accent2:#e05a6e;--warn:#f0c040;--text:#e8e8f0;--muted:#6b6b88;
    --mono:'Courier New',monospace;
  }
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;max-width:400px;margin:0 auto}
  .hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  .hdr-logo{font-size:11px;font-weight:700;letter-spacing:0.12em;color:var(--accent)}
  .hdr-info{font-size:10px;color:var(--muted);text-align:right}
  .hdr-info span{display:block}
  .hdr-home{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);font-size:11px;font-family:var(--mono);padding:4px 8px;cursor:pointer;letter-spacing:0.05em;transition:color 0.15s,border-color 0.15s}
  .hdr-home:hover{color:var(--accent);border-color:var(--accent)}
  .screen{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .steps{display:flex;gap:3px;margin-bottom:4px}
  .step-dot{flex:1;height:3px;border-radius:2px;background:var(--border);transition:background 0.2s}
  .step-dot.done{background:var(--accent)}
  .step-dot.cur{background:var(--warn)}
  .badge{display:inline-block;padding:3px 10px;border-radius:3px;font-size:10px;letter-spacing:0.1em;font-weight:700;margin-bottom:2px}
  .badge-inv{background:rgba(0,229,160,0.12);color:var(--accent);border:1px solid rgba(0,229,160,0.3)}
  .badge-rec{background:rgba(224,90,110,0.12);color:var(--accent2);border:1px solid rgba(224,90,110,0.3)}
  .lbl{font-size:10px;color:var(--muted);letter-spacing:0.09em;text-transform:uppercase;margin-bottom:4px}
  .val{font-size:20px;font-weight:700;color:var(--text);margin-bottom:10px;line-height:1.2}
  .val.sm{font-size:14px}.val.accent{color:var(--accent)}.val.warn{color:var(--warn)}.val.ok{color:var(--accent);font-size:28px}
  .inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:10px 12px;font-size:15px;color:var(--text);font-family:var(--mono);outline:none;transition:border 0.15s}
  .inp:focus{border-color:var(--accent)}
  .inp::placeholder{color:var(--muted)}
  select.inp{appearance:none;cursor:pointer}
  select.inp option{background:var(--bg)}
  .inp-sm{padding:8px 10px;font-size:13px}
  .alert{background:rgba(240,192,64,0.1);border:1px solid rgba(240,192,64,0.35);border-radius:4px;padding:9px 11px;font-size:11px;color:var(--warn);line-height:1.5}
  .prog-wrap{margin-top:auto}
  .prog-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px}
  .prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
  .prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s}
  .btn-row{display:flex;gap:8px;margin-top:4px}
  .btn{flex:1;padding:12px 8px;border-radius:4px;font-size:13px;font-family:var(--mono);font-weight:700;letter-spacing:0.06em;cursor:pointer;border:1px solid;transition:opacity 0.15s,transform 0.1s;text-align:center}
  .btn:active{transform:scale(0.97)}
  .btn-pri{background:var(--accent);border-color:var(--accent);color:#0d0d14}
  .btn-sec{background:transparent;border-color:var(--border);color:var(--muted)}
  .btn-ok{background:var(--accent);border-color:var(--accent);color:#0d0d14}
  .btn-big{flex:unset;width:100%;padding:14px;font-size:14px}
  .btn-warn{background:rgba(224,90,110,0.15);border-color:var(--accent2);color:var(--accent2)}
  .item-list{background:var(--surface2);border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;font-size:12px;border-bottom:1px solid var(--border)}
  .item-row:last-child{border-bottom:none}
  .item-cod{color:var(--muted);flex:1}
  .item-qty{color:var(--accent);font-weight:700;margin-right:6px}
  .item-estado{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700}
  .item-estado.ok{background:rgba(0,229,160,0.12);color:var(--accent)}
  .item-estado.dan{background:rgba(224,90,110,0.12);color:var(--accent2)}
  .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .type-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:20px 12px;text-align:center;cursor:pointer;transition:border-color 0.15s,background 0.15s}
  .type-card:hover,.type-card.sel{border-color:var(--accent);background:rgba(0,229,160,0.07)}
  .type-card.rec:hover,.type-card.rec.sel{border-color:var(--accent2);background:rgba(224,90,110,0.07)}
  .type-card-icon{font-size:28px;margin-bottom:8px}
  .type-card-lbl{font-size:12px;font-weight:700;letter-spacing:0.08em}
  .type-card.sel .type-card-lbl{color:var(--accent)}
  .type-card.rec.sel .type-card-lbl{color:var(--accent2)}
  /* ESTADO OK/DAÑADO toggle */
  .estado-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
  .estado-opt{padding:10px 8px;border-radius:4px;text-align:center;cursor:pointer;font-size:13px;font-weight:700;font-family:var(--mono);border:1px solid var(--border);color:var(--muted);transition:all 0.15s;letter-spacing:0.05em}
  .estado-opt.sel-ok{border-color:var(--accent);background:rgba(0,229,160,0.12);color:var(--accent)}
  .estado-opt.sel-dan{border-color:var(--accent2);background:rgba(224,90,110,0.12);color:var(--accent2)}
  /* Subtipo recepción */
  .subtipo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
  .subtipo-opt{padding:12px 8px;border-radius:4px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;font-family:var(--mono);border:1px solid var(--border);color:var(--muted);transition:all 0.15s;letter-spacing:0.04em}
  .subtipo-opt.sel{border-color:var(--accent2);background:rgba(224,90,110,0.12);color:var(--accent2)}
  .divider{height:1px;background:var(--border);margin:4px 0}
  .ftr{padding:8px 14px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .ftr-op{font-size:11px;color:var(--muted)}
  .ftr-op span{color:var(--accent)}
  .ftr-sess{font-size:10px;color:var(--muted)}
</style>

// ── Helpers de inventario ──────────────────────────────────────────────────────
// Obtener asignación del operario hoy
function getAsignacion(operario){
  var opNorm = operario ? operario.trim().toUpperCase() : '';
  console.log('[INV] getAsignacion — buscando operario: "'+operario+'" (normalizado: "'+opNorm+'")');
  console.log('[INV] Asignaciones en DB ('+DB.asignaciones.length+'):',
    DB.asignaciones.map(function(a){return '"'+a.operario+'" → norm:"'+a.operario.trim().toUpperCase()+'"';}).join(' | '));
  var found = DB.asignaciones.find(function(a){
    return a.operario.trim().toUpperCase() === opNorm;
  }) || null;
  if(found){
    console.log('[INV] ✓ Asignación encontrada:', JSON.stringify(found));
  } else {
    console.warn('[INV] ✗ Sin asignación para "'+operario+'"');
    if(DB.asignaciones.length > 0){
      console.warn('[INV]   Valores disponibles:', DB.asignaciones.map(function(a){return a.operario;}).join(', '));
    } else {
      console.warn('[INV]   DB.asignaciones está vacío — Excel Asignaciones no cargó');
    }
  }
  return found;
}
// Filtrar items D365 según asignación
function getItemsAsignados(asig){
  if(!asig) return [];
  console.log('[INV] getItemsAsignados — tipo:'+asig.tipo+' valor:"'+asig.valor+'"');
  console.log('[INV] DB.d365 total items:', DB.d365.length);
  if(DB.d365.length === 0){
    console.error('[INV] ✗ DB.d365 vacío — hoja D365 no cargó');
    return [];
  }
  var resultado;
  if(asig.tipo==='Marca'){
    var marcaNorm = asig.valor.trim().toUpperCase();
    var marcasUnicas = [];
    DB.d365.forEach(function(r){ if(marcasUnicas.indexOf(r.marca)<0) marcasUnicas.push(r.marca); });
    console.log('[INV] Marcas en D365 ('+marcasUnicas.length+'):', marcasUnicas.sort().join(', '));
    resultado = DB.d365.filter(function(r){
      return r.marca.trim().toUpperCase() === marcaNorm;
    });
    if(resultado.length===0)
      console.warn('[INV] ✗ Marca "'+asig.valor+'" no encontrada — revisa variaciones en la lista anterior');
    else
      console.log('[INV] ✓ Items para marca "'+asig.valor+'": '+resultado.length);
  } else {
    var val = asig.valor.trim();
    var ubicsMuestra = DB.d365.slice(0,5).map(function(r){return r.ubicacion;});
    console.log('[INV] Muestra ubicaciones D365:', ubicsMuestra.join(', '));
    if(val.indexOf(',') > -1){
      var pasillos = val.split(',').map(function(s){return s.trim();});
      console.log('[INV] Filtrando por pasillos:', pasillos.join(', '));
      resultado = DB.d365.filter(function(r){
        return pasillos.some(function(p){return r.ubicacion.startsWith(p);});
      });
    } else if(val.indexOf('-') > -1){
      var parts = val.split('-');
      var base = parts[0].replace(/[0-9]+$/,'');
      var n1 = parseInt(parts[0].replace(base,''));
      var n2 = parseInt(parts[1].replace(base,''));
      console.log('[INV] Rango: base="'+base+'" n1='+n1+' n2='+n2);
      resultado = DB.d365.filter(function(r){
        var m = r.ubicacion.match(/^([A-Za-z]+)([0-9]+)/);
        if(!m || m[1].toUpperCase() !== base.toUpperCase()) return false;
        var n = parseInt(m[2]);
        return n >= n1 && n <= n2;
      });
    } else {
      console.log('[INV] Filtrando por prefijo: "'+val+'"');
      resultado = DB.d365.filter(function(r){return r.ubicacion.startsWith(val);});
    }
    if(resultado.length===0)
      console.warn('[INV] ✗ Sin items para ubicaciones "'+asig.valor+'"');
    else
      console.log('[INV] ✓ Items para "'+asig.valor+'": '+resultado.length);
  }
  console.log('[INV] Ubicaciones generadas:', agruparPorUbicacion(resultado).length);
  return resultado;
}

// Agrupar items por ubicación (ordenados)
function agruparPorUbicacion(items){
  const map={};
  for(const it of items){
    if(!map[it.ubicacion])map[it.ubicacion]=[];
    map[it.ubicacion].push(it);
  }
  return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0]));
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function localTime(){const n=new Date(),p=x=>String(x).padStart(2,'0');return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+' '+p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds())}
function ts(){return localTime()}
function sid(){return(S.tipo==='inv'?'CNT':'REC')+'-'+new Date().getFullYear()+'-'+String(Math.floor(Math.random()*900)+100)}
function lookup(cod){const c=cod.trim();for(const[k,v]of Object.entries(DB.productos)){if(k===c||v.interno===c)return v}return null}
function guardarRegistro(reg){DB.registros.push(reg);console.log('[DEMO]',reg)}
function render(html){document.getElementById('screen').innerHTML=html}
function stepsBar(cur,total){return '<div class="steps">'+Array.from({length:total},(_,i)=>`<div class="step-dot ${i<cur?'done':i===cur?'cur':''}"></div>`).join('')+'</div>'}
function fmtTime(){
  const n=new Date(),p=x=>String(x).padStart(2,'0');
  document.getElementById('hdr-time').textContent=p(n.getHours())+':'+p(n.getMinutes());
  document.getElementById('hdr-date').textContent=p(n.getDate())+'/'+(p(n.getMonth()+1))+'/'+n.getFullYear();
}
function updateFooter(){
  document.getElementById('ftr-op').textContent=S.operario||'—';
  document.getElementById('ftr-sess').textContent=S.sesionId?'Sesión: '+S.sesionId:'sin sesión activa';
}

function iniciarSesion(){
  S.operario=document.getElementById('sel-quien').value;
  if(!S.rol){alert('Selecciona tu rol');return}
  if(!S.operario){alert('Selecciona '+(S.rol==='supervisor'?'el supervisor':'el operario'));return}
  if(!S.tipo){alert('Selecciona el módulo');return}
  S.sesionId=sid();S.conteoActual=[];S.lpnCount=0;

function confNuevaAsig(){
  const op=document.getElementById('asig-op').value;
  const val=document.getElementById('asig-val')?document.getElementById('asig-val').value.trim():'';
  const mod=document.getElementById('asig-mod')?document.getElementById('asig-mod').value:'datos';
  if(!op){alert('Selecciona el operario');return}
  if(!_tipoAsig){alert('Selecciona el tipo de asignación');return}
  if(!val){alert('Ingresa el valor de la asignación');return}
  // Verificar que el operario no tenga ya una asignación activa
  const existe=DB.asignaciones.find(a=>a.operario===op);
  if(existe){if(!confirm('El operario '+op+' ya tiene una asignación ('+existe.valor+'). ¿Reemplazarla?'))return;
    DB.asignaciones=DB.asignaciones.filter(a=>a.operario!==op);}
  DB.asignaciones.push({operario:op,tipo:_tipoAsig,valor:val,modalidad:mod});
  guardarRegistro({tipo:'SUP_NUEVA_ASIG',supervisor:S.operario,operario:op,tipoAsig:_tipoAsig,valor:val,modalidad:mod,timestamp:ts()});
  _tipoAsig='';
  showSupAsignaciones();
}

function showInvUbicacion(){
  S.step='inv-ubic';
  console.log('[INV] showInvUbicacion — idx:'+S.invUbicIdx+'/'+S.invGrupos.length);
  if(S.invGrupos.length === 0){
    console.error('[INV] ✗ invGrupos vacío al llegar a showInvUbicacion — esto no debería ocurrir aquí');
    showInvFin();return;
  }
  if(S.invUbicIdx>=S.invGrupos.length){
    console.log('[INV] Todas las ubicaciones procesadas → showInvFin');
    showInvFin();return;
  }
  const [ubic,items]=S.invGrupos[S.invUbicIdx];
  const contadas=Object.keys(S.invConteos).filter(k=>k.startsWith(ubic+'|')).length;
  const pct=Math.round((S.invUbicIdx/S.invGrupos.length)*100);
  render(`
    ${stepsBar(S.invUbicIdx,S.invGrupos.length)}
    <div class="badge badge-inv">${S.invAsignacion.valor}</div>
    <div class="prog-wrap" style="margin-bottom:8px">

    </div>
    <div style="background:var(--surface2);border:1px solid var(--accent);border-radius:8px;padding:12px;margin-bottom:10px">
      <div style="font-size:11px;color:var(--muted)">UBICACIÓN ACTUAL</div>
      <div style="font-size:22px;font-weight:700;color:var(--accent);letter-spacing:0.05em">${ubic}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">${items.length} SKU${items.length>1?'s':''} a contar · ${contadas} contados</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-sec" onclick="S.invUbicIdx=Math.max(0,S.invUbicIdx-1);S.invSkuIdx=0;showInvUbicacion()">← ATR</button>
      <button class="btn btn-pri" onclick="S.invSkuIdx=0;showInvSku()">CONTAR →</button>
    </div>
    <button class="btn btn-sec btn-big" style="margin-top:8px;font-size:11px" onclick="saltarUbicacion()">⏭ Saltar esta ubicación</button>

function saltarUbicacion(){
  if(!confirm('¿Saltar la ubicación '+S.invGrupos[S.invUbicIdx][0]+'? Se marcará como pendiente.'))return;
  S.invUbicIdx++;S.invSkuIdx=0;showInvUbicacion();
}
function showInvSku(){
  S.step='inv-sku';
  const [ubic,items]=S.invGrupos[S.invUbicIdx];
  if(S.invSkuIdx>=items.length){
    // Terminó todos los SKUs de esta ubicación
    showInvUbicConfirmada(ubic,items);return;
  }
  const item=items[S.invSkuIdx];
  const key=ubic+'|'+item.sku;
  const yaContado=S.invConteos[key];
  render(`
    ${stepsBar(S.invSkuIdx,items.length)}
    <div class="badge badge-inv">${ubic}</div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:4px">SKU ${S.invSkuIdx+1} de ${items.length}</div>

    </div>
    ${S.modalidad==='datos'?`
      <div style="background:var(--surface2);border-radius:6px;padding:8px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">

      <button class="btn btn-sec" onclick="S.invSkuIdx=Math.max(0,S.invSkuIdx-1);showInvSku()">← ATR</button>
      <button class="btn btn-ok" onclick="confConteoSku()">✓ CONFIRMAR</button>
    </div>
  `);
  setTimeout(()=>{const el=document.getElementById('inp-cant-inv');if(el){el.focus();el.select()}},100);
}
function confConteoSku(){
  const cant=parseInt(document.getElementById('inp-cant-inv').value);
  if(isNaN(cant)||cant<0){alert('Ingresa una cantidad válida (0 o más)');return}
  const [ubic,items]=S.invGrupos[S.invUbicIdx];
  const item=items[S.invSkuIdx];
  const key=ubic+'|'+item.sku;
  S.invConteos[key]=cant;
  // Registrar
  const reg={
    sesion:S.sesionId,tipo:'INVENTARIO',
    modalidad:S.modalidad==='datos'?'CON DATOS':'A CIEGAS',
    operario:S.operario,
    marca:item.marca,almacen:item.almacen,ubicacion:ubic,
    sku:item.sku,descripcion:item.desc,
    inv_d365:item.inv,conteo:cant,
    diferencia:cant-item.inv,
    timestamp:ts()
  };
  guardarRegistro(reg);S.conteoActual.push(reg);
  S.invSkuIdx++;
  showInvSku();
}
function showInvUbicConfirmada(ubic,items){
  S.step='inv-ubic-ok';
  const contados=items.filter(it=>S.invConteos[ubic+'|'+it.sku]!==undefined).length;
  const diffs=items.filter(it=>{
    const c=S.invConteos[ubic+'|'+it.sku];
    return c!==undefined&&c!==it.inv;
  });
  render(`
    <div class="badge badge-inv">${ubic} ✓</div>
    <div class="val ok">✓ UBICACIÓN COMPLETADA</div>
    <div style="font-size:12px;color:var(--muted);margin:8px 0">${contados} SKUs contados${diffs.length>0?` · <span style="color:var(--accent2)">${diffs.length} con diferencia</span>`:' · sin diferencias'}</div>
    ${diffs.length>0?`
      <div style="background:var(--surface2);border-radius:6px;padding:8px;margin-bottom:8px;font-size:11px">
        ${diffs.map(it=>{const c=S.invConteos[ubic+'|'+it.sku];return`<div style="display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid var(--border)"><span style="color:var(--muted)">${it.sku}</span><span>D365: ${it.inv} → Conteo: <span style="color:${c>it.inv?'var(--ok)':'var(--accent2)'};font-weight:700">${c}</span></span></div>`}).join('')}
      </div>`:''}
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-sec" onclick="S.invSkuIdx=0;showInvSku()">↩ Repasar</button>
      <button class="btn btn-pri" onclick="S.invUbicIdx++;S.invSkuIdx=0;showInvUbicacion()">sig. ubic. →</button>
    </div>
  `);
}
function showInvFin(){
  S.step='inv-fin';

      <button class="btn btn-pri" onclick="confRecSubtipo()">ENT →</button>
    </div>
  `);
}
function confRecSubtipo(){
  if(!S.recSubtipo){alert('Selecciona el tipo de recepción');return}
  showRecCabecera();
}

function showRecCabecera(){
  S.step='rec-cabecera';
  render(`
    ${stepsBar(1,6)}
    <div class="badge badge-rec">${S.recSubtipo==='importacion'?'🌍 IMPORTACIÓN':'🏭 COMPRA LOCAL'}</div>
    <div class="lbl">pedido</div>
    <select class="inp inp-sm" id="rec-pedido" onchange="onPedidoChange()">
      <option value="">— seleccionar pedido —</option>
      ${Object.keys(DB.pedidosAbiertos).map(p=>`<option ${S.recPedido===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <div class="lbl" style="margin-top:6px"># contenedor</div>
    <select class="inp inp-sm" id="rec-cont" onchange="onContenedorChange()" ${!S.recPedido?'disabled':''}>
      <option value="">— seleccionar contenedor —</option>
      ${S.recPedido?(DB.pedidosAbiertos[S.recPedido]?.conts||[]).map(c=>`<option value="${c.contenedor}" ${S.recContenedor===c.contenedor?'selected':''}>${c.contenedor}</option>`).join(''):''}
    </select>
    <div class="lbl" style="margin-top:6px"># sello</div>
    <input class="inp inp-sm" id="rec-sello" type="text" placeholder="Auto al elegir contenedor" value="${S.recSello}" readonly style="background:var(--surface);color:${S.recSello?'var(--accent)':'var(--muted)'}">
    <div class="lbl" style="margin-top:6px"># pallets recibidos</div>
    <input class="inp inp-sm" id="rec-pallets" type="number" min="0" placeholder="0" value="${S.recPallets}" autocomplete="off">
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sec" onclick="showRecSubtipo()">← ATR</button>
      <button class="btn btn-pri" onclick="confRecCabecera()">ENT →</button>
    </div>
  `);
}
function onPedidoChange(){
  S.recPedido=document.getElementById('rec-pedido').value;
  S.recContenedor='';S.recSello='';S.recPallets='';
  showRecCabecera();
}
function onContenedorChange(){
  const cont=document.getElementById('rec-cont').value;
  S.recContenedor=cont;
  const pedInfo=DB.pedidosAbiertos[S.recPedido];
  const found=pedInfo?pedInfo.conts.find(c=>c.contenedor===cont):null;
  if(found){
    S.recSello=found.sello||'';
    if(!S.recPallets)S.recPallets=String(found.pallets||'');
  }
  document.getElementById('rec-sello').value=S.recSello;
  document.getElementById('rec-sello').style.color=S.recSello?'var(--accent)':'var(--muted)';
  document.getElementById('rec-pallets').value=S.recPallets;
}
function confRecCabecera(){
  S.recPedido=document.getElementById('rec-pedido').value;
  S.recContenedor=document.getElementById('rec-cont').value.trim();
  S.recSello=document.getElementById('rec-sello').value.trim();
  S.recPallets=document.getElementById('rec-pallets').value;
  if(!S.recPedido){alert('Selecciona un pedido');return}
  if(!S.recContenedor){alert('Selecciona un contenedor');return}
  const nPallets=parseInt(S.recPallets)||0;
  const esImportacion=S.recSubtipo==='importacion';
  const baseSeq=esImportacion?S.recContenedor:S.recPedido;
  S.lpnsEsperados=nPallets>0?Array.from({length:nPallets},(_,i)=>baseSeq+'-'+String(i+1).padStart(2,'0')):[];
  showRecHoras();
}

function showRecHoras(){
  S.step='rec-horas';
  render(`
    ${stepsBar(2,6)}
    <div class="badge badge-rec">${S.recContenedor}</div>
    <div class="lbl">hora llegada contenedor</div>
    <input class="inp inp-sm" id="rec-hllegada" type="time" value="${S.recHoraLlegada}">
    <div class="lbl" style="margin-top:6px">hora apertura contenedor</div>
    <input class="inp inp-sm" id="rec-hapertura" type="time" value="${S.recHoraApertura}">
    <div class="lbl" style="margin-top:6px">hora cierre contenedor</div>
    <input class="inp inp-sm" id="rec-hcierre" type="time" value="${S.recHoraCierre}">
    <div class="lbl" style="margin-top:6px">hora salida contenedor</div>
    <input class="inp inp-sm" id="rec-hsalida" type="time" value="${S.recHoraSalida}">
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sec" onclick="showRecCabecera()">← ATR</button>
      <button class="btn btn-pri" onclick="confRecHoras()">ENT →</button>
    </div>
  `);
}
function confRecHoras(){
  S.recHoraLlegada=document.getElementById('rec-hllegada').value;
  S.recHoraApertura=document.getElementById('rec-hapertura').value;
  S.recHoraCierre=document.getElementById('rec-hcierre').value;
  S.recHoraSalida=document.getElementById('rec-hsalida').value;
  S.lpn='';S.itemsLPN=[];
  showRecLPN();
}

function showRecLPN(){
  S.step='rec-lpn';
  render(`
    ${stepsBar(3,6)}
    <div class="badge badge-rec">${S.recContenedor} · ${S.recPedido}</div>
    <div class="lbl">escanea etiqueta LPN del pallet</div>
    <input class="inp" id="inp-lpn" type="text" placeholder="LPN-0001" value="${S.lpn}" autocomplete="off" autocorrect="off" spellcheck="false" style="font-size:18px;font-weight:700;letter-spacing:0.05em">
    ${S.lpnCount>0?`<div style="font-size:11px;color:var(--muted);margin-top:4px">${S.lpnCount} pallets contados en esta recepción</div>`:''}
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sec" onclick="showRecHoras()">← ATR</button>
      <button class="btn btn-pri" onclick="confLPN()">ENT →</button>
    </div>
  `);
  setTimeout(()=>{const el=document.getElementById('inp-lpn');if(el)el.focus()},100);
}
function confLPN(){
  const v=document.getElementById('inp-lpn').value.trim().toUpperCase();
  if(!v){alert('Escanea o ingresa el LPN');return}
  S.lpn=v;S.itemsLPN=[];S.codProducto='';S.productoInfo=null;S.productoAlerta=false;S.estadoSku='OK';
  showRecProducto();
}

function showRecProducto(){
  S.step='rec-prod';
  render(`
    ${stepsBar(4,6)}
    <div class="badge badge-rec">${S.lpn}</div>
    <div class="lbl">escanea o ingresa producto</div>
    <input class="inp" id="inp-prod-rec" type="text" placeholder="Cód. barras o interno" autocomplete="off" autocorrect="off" spellcheck="false">
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sec" onclick="showRecLPN()">← ATR</button>
      <button class="btn btn-pri" onclick="confProductoRec()">ENT →</button>
    </div>
    ${S.itemsLPN.length>0?`
      <div class="divider"></div>
      <div class="lbl">ítems en este pallet (${S.itemsLPN.length})</div>
      <div class="item-list">
        ${S.itemsLPN.map(i=>`<div class="item-row"><span class="item-cod">${i.cod_producto}</span><span class="item-qty">${i.cantidad}</span><span class="item-estado ${i.estado==='DAÑADO'?'dan':'ok'}">${i.estado}</span></div>`).join('')}
      </div>`:''}
  `);
  setTimeout(()=>{const el=document.getElementById('inp-prod-rec');if(el)el.focus()},100);
}
function confProductoRec(){
  const v=document.getElementById('inp-prod-rec').value.trim();
  if(!v){alert('Ingresa o escanea el código');return}
  S.codProducto=v;S.productoInfo=lookup(v);S.productoAlerta=!S.productoInfo;S.estadoSku='OK';
  showRecCantidad();
}

function showRecCantidad(){
  S.step='rec-cant';
  const p=S.productoInfo;
  render(`
    ${stepsBar(4,6)}
    <div class="badge badge-rec">${S.lpn}</div>
    ${S.productoAlerta?`<div class="alert">⚠ CÓD "${S.codProducto}" no encontrado. Puedes continuar.</div>`:''}
    <div class="lbl">producto</div>
    <div class="val sm ${S.productoAlerta?'warn':'accent'}">${p?p.nombre:S.codProducto}</div>
    ${p?`<div style="font-size:11px;color:var(--muted);margin-top:-8px;margin-bottom:8px">Interno: ${p.interno}</div>`:''}
    <div class="lbl">cantidad</div>
    <input class="inp" id="inp-cant-rec" type="number" min="0" placeholder="0" style="font-size:20px;font-weight:700" autocomplete="off">
    <div class="lbl" style="margin-top:8px">estado</div>
    <div class="estado-toggle">
      <div class="estado-opt ${S.estadoSku==='OK'?'sel-ok':''}" id="est-ok" onclick="S.estadoSku='OK';document.getElementById('est-ok').className='estado-opt sel-ok';document.getElementById('est-dan').className='estado-opt';">✓ OK</div>
      <div class="estado-opt ${S.estadoSku==='DAÑADO'?'sel-dan':''}" id="est-dan" onclick="S.estadoSku='DAÑADO';document.getElementById('est-dan').className='estado-opt sel-dan';document.getElementById('est-ok').className='estado-opt';">⚠ DAÑADO</div>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-sec" onclick="showRecProducto()">← ATR</button>
      <button class="btn btn-ok" onclick="confCantidadRec()">ENT ✓</button>
    </div>
  `);
  setTimeout(()=>{const el=document.getElementById('inp-cant-rec');if(el)el.focus()},100);
}
function confCantidadRec(){
  const cant=parseInt(document.getElementById('inp-cant-rec').value);
  if(isNaN(cant)||cant<0){alert('Ingresa una cantidad válida');return}
  const reg={
    sesion:S.sesionId,tipo:'RECEPCION',subtipo:S.recSubtipo==='importacion'?'IMPORTACION':'COMPRA LOCAL',
    operario:S.operario,solicitante:S.solicitante,
    pedido:S.recPedido,contenedor:S.recContenedor,sello:S.recSello,pallets:S.recPallets,
    hora_llegada:S.recHoraLlegada,hora_apertura:S.recHoraApertura,hora_cierre:S.recHoraCierre,hora_salida:S.recHoraSalida,
    lpn:S.lpn,cod_producto:S.codProducto,
    nombre_producto:S.productoInfo?S.productoInfo.nombre:'NO ENCONTRADO',
    cod_interno:S.productoInfo?S.productoInfo.interno:'',
    cantidad:cant,estado:S.estadoSku,
    alerta_producto:S.productoAlerta?'SI':'NO',timestamp:ts()
  };
  guardarRegistro(reg);S.conteoActual.push(reg);S.itemsLPN.push(reg);
  showRecConfirmado(reg);
}

function showRecConfirmado(reg){
  S.step='rec-ok';
  render(`
    ${stepsBar(4,6)}
    <div class="badge badge-rec">${S.lpn} · ${S.itemsLPN.length} ítems</div>
    <div class="lbl">registrado</div>
    <div class="val ok">✓ OK</div>
    <div class="lbl">${reg.cod_producto} · ${reg.cantidad} uds · <span style="color:${reg.estado==='DAÑADO'?'var(--accent2)':'var(--accent)'}">${reg.estado}</span></div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px">${reg.timestamp.slice(11,16)}</div>
    <div class="btn-row">
      <button class="btn btn-sec" onclick="showRecProducto()">+ ítem<br>mismo LPN</button>
      <button class="btn btn-pri" onclick="nextLPN()">nuevo<br>pallet →</button>
    </div>
    <button class="btn btn-warn btn-big" style="margin-top:8px" onclick="showRecCierre()">⏹ CERRAR RECEPCIÓN</button>
  `);
}

function nextLPN(){
  S.lpnCount++;S.lpn='';S.itemsLPN=[];
  showRecLPN();
}

function showRecCierre(){
  S.step='rec-cierre';
  render(`
    ${stepsBar(5,6)}
    <div class="badge badge-rec">${S.recContenedor} · ${S.conteoActual.length} registros</div>
    <div class="lbl">novedades</div>
    <textarea class="inp" id="rec-novedades" rows="3" placeholder="Ej: pallet dañado en muelle, faltante de 2 cajas..." style="resize:none;font-size:13px">${S.recNovedades}</textarea>
    <div class="lbl" style="margin-top:6px"># personas en cuadrilla</div>
    <input class="inp inp-sm" id="rec-personas" type="number" min="0" placeholder="0" value="${S.recPersonas}" autocomplete="off">
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-sec" onclick="showRecConfirmado(S.conteoActual[S.conteoActual.length-1]||{})">← ATR</button>
      <button class="btn btn-pri" onclick="confRecCierre()">GUARDAR →</button>
    </div>
  `);
}

function confRecCierre(){
  S.recNovedades=document.getElementById('rec-novedades').value.trim();
  S.recPersonas=document.getElementById('rec-personas').value;
  showRecNuevaOpcion();
}

function showRecNuevaOpcion(){
  S.step='rec-nueva';
  render(`
    ${stepsBar(5,6)}
    <div class="badge badge-rec">RECEPCIÓN COMPLETADA</div>
    <div class="lbl">recepción guardada</div>
    <div class="val ok">✓ OK</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">
      ${S.recContenedor} · ${S.recPedido}<br>
      ${S.conteoActual.length} registros · ${S.lpnCount+1} pallets
    </div>
    <div class="lbl">¿qué deseas hacer?</div>
    <div class="btn-row" style="flex-direction:column;gap:8px">
      <button class="btn btn-sec btn-big" onclick="nuevaRecepcionMismoPedido()">🔄 Nueva recepción<br>del mismo pedido</button>
      <button class="btn btn-sec btn-big" onclick="nuevaRecepcionDiferentePedido()">📦 Nueva recepción<br>de diferente pedido</button>
      <button class="btn btn-warn btn-big" style="margin-top:4px" onclick="cerrarSesion()">⏹ Cerrar sesión</button>
    </div>
  `);
}

function nuevaRecepcionMismoPedido(){
  // Mantiene pedido, limpia contenedor y horas
  S.recContenedor='';S.recSello='';S.recPallets='';
  S.recHoraLlegada='';S.recHoraApertura='';S.recHoraCierre='';S.recHoraSalida='';
  S.recNovedades='';S.recPersonas='';
  S.lpn='';S.itemsLPN=[];S.lpnCount=0;
  showRecCabecera();
}

function nuevaRecepcionDiferentePedido(){
  // Limpia todo y vuelve al inicio del flujo de recepción
  S.recSubtipo='';S.recPedido='';S.recContenedor='';S.recSello='';S.recPallets='';
  S.recHoraLlegada='';S.recHoraApertura='';S.recHoraCierre='';S.recHoraSalida='';
  S.recNovedades='';S.recPersonas='';
  S.lpn='';S.itemsLPN=[];S.lpnCount=0;
  showRecSubtipo();
}

// ─── CERRAR SESIÓN ────────────────────────────────────────────────────────────
function goHome(){
  if(S.sesionId&&S.conteoActual.length>0){
    if(!confirm('¿Salir? La sesión '+S.sesionId+' quedará activa con '+S.conteoActual.length+' registros.'))return;
  }
  S.sesionId='';S.conteoActual=[];S.tipo='';S.operario='';S.solicitante='';
  S.ubicacion='';S.codProducto='';S.productoInfo=null;S.productoAlerta=false;
  S.lpn='';S.itemsLPN=[];S.lpnCount=0;S.zona='';
  S.recSubtipo='';S.recPedido='';S.recContenedor='';S.recSello='';S.recPallets='';
  S.recHoraLlegada='';S.recHoraApertura='';S.recHoraCierre='';S.recHoraSalida='';
  S.recNovedades='';S.recPersonas='';S.estadoSku='OK';
  updateFooter();showHome();
}
function cerrarSesion(){
  if(!confirm('¿Cerrar sesión '+S.sesionId+'?\nRegistros: '+S.conteoActual.length))return;
  S.sesionId='';S.conteoActual=[];S.tipo='';S.operario='';S.solicitante='';
  S.ubicacion='';S.codProducto='';S.productoInfo=null;S.productoAlerta=false;
  S.lpn='';S.itemsLPN=[];S.lpnCount=0;S.zona='';
  S.recSubtipo='';S.recPedido='';S.recContenedor='';S.recSello='';S.recPallets='';
  S.recHoraLlegada='';S.recHoraApertura='';S.recHoraCierre='';S.recHoraSalida='';
  S.recNovedades='';S.recPersonas='';S.estadoSku='OK';
  updateFooter();showHome();
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
fmtTime();setInterval(fmtTime,30000);showHome();
</script>
</body>
</html>
