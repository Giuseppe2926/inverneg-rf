<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RF Inverneg — Portal Operativo</title>
<style>
:root{
  --bg:#0D1117;--sur:#161B22;--sur2:#1C2330;--bor:#2A3340;
  --txt:#E6EDF3;--mut:#7D8590;
  --acc:#58A6FF;--ok:#3FB950;--warn:#E3B341;--rec:#F0883E;--perc:#A78BFA;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  font-size:14px;color:var(--txt);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);min-height:100vh;
  display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* ── Header ── */
.hdr{
  background:var(--sur);border-bottom:2px solid var(--rec);
  padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-dot{
  width:10px;height:10px;border-radius:50%;background:var(--rec);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.hdr-brand{font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--txt)}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.hdr-right{text-align:right;font-size:11px}
.hdr-user{color:var(--acc);font-weight:600;margin-bottom:2px}
.hdr-date{color:var(--mut)}

/* ── Main ── */
.main{flex:1;padding:20px 16px;max-width:520px;margin:0 auto;width:100%}

.section-title{
  font-size:10px;font-weight:700;color:var(--mut);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;
}

/* ── App cards ── */
.app-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.app-card{
  background:var(--sur);border:1px solid var(--bor);border-radius:12px;
  padding:16px 18px;cursor:pointer;text-decoration:none;color:inherit;
  display:flex;align-items:center;gap:14px;
  transition:border-color .2s,background .2s,transform .1s;
  position:relative;overflow:hidden;
}
.app-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:3px 0 0 3px;
}
.app-card:hover{background:var(--sur2);transform:translateX(2px)}
.app-card:active{transform:scale(.98)}
.app-card.rec::before{background:var(--rec)}
.app-card.dash::before{background:var(--acc)}
.app-card.inf::before{background:var(--ok)}
.app-card.perc::before{background:var(--perc)}
.app-card.des::before{background:var(--warn)}

.app-icon{font-size:28px;flex-shrink:0;width:44px;text-align:center}
.app-name{font-size:15px;font-weight:700;margin-bottom:3px}
.app-desc{font-size:11px;color:var(--mut);line-height:1.4}
.app-arrow{
  margin-left:auto;font-size:16px;color:var(--bor);
  transition:color .2s,transform .2s;flex-shrink:0;
}
.app-card:hover .app-arrow{color:var(--mut);transform:translateX(3px)}

/* ── Info strip ── */
.info-strip{
  background:var(--sur2);border:1px solid var(--bor);border-radius:10px;
  padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.info-item{}
.info-lbl{font-size:9px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.info-val{font-size:13px;font-weight:600}

/* ── Login state ── */
.login-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 20px;text-align:center;
}
.login-logo{font-size:48px;margin-bottom:16px}
.login-title{font-size:20px;font-weight:700;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--mut);margin-bottom:28px}
.btn-login{
  background:var(--rec);color:#000;border:none;border-radius:8px;
  padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;
}
.btn-login:active{opacity:.8}

/* ── Footer ── */
.ftr{
  border-top:1px solid var(--bor);padding:8px 20px;
  font-size:10px;color:var(--mut);
  display:flex;justify-content:space-between;align-items:center;
  padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
}
.ftr-live{display:flex;align-items:center;gap:5px}
.ftr-dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}

#loading-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;color:var(--mut);font-size:13px;
}
.spin{font-size:28px;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">
    <div class="hdr-dot"></div>
    <div>
      <div class="hdr-brand">RF INVERNEG</div>
      <div class="hdr-sub">Portal Operativo · CND</div>
    </div>
  </div>
  <div class="hdr-right" id="hdr-right" style="display:none">
    <div class="hdr-user" id="hdr-user">—</div>
    <div class="hdr-date" id="hdr-date">—</div>
  </div>
</div>

<div id="loading-wrap">
  <div class="spin">⏳</div>
  <div>Conectando...</div>
</div>

<div class="ftr">
  <span>Inverneg S.A. · Centro de Distribución Nacional</span>
  <span class="ftr-live"><span class="ftr-dot"></span>LIVE</span>
</div>

<script>
(function(){
'use strict';

var CFG={
  clientId:'ec976114-e146-4ce4-850c-5d978e12acfd',
  tenantId:'5e008bd3-17b6-4f83-8d23-019691a40609',
};
var SCOPES=['User.Read'];

// Rutas relativas — todos los archivos en la misma carpeta del repo
var APPS=[
  {
    id:'rec',
    icon:'📦',
    name:'RF Recepción',
    desc:'Registro de mercadería recibida por contenedor y LPN',
    href:'rf_recepcion.html',
    cls:'rec',
  },
  {
    id:'inf',
    icon:'📋',
    name:'RF Informes',
    desc:'Informes de novedades, detalle de recepción y detalle por LPN',
    href:'rf_informe.html',
    cls:'inf',
  },
  {
    id:'perc',
    icon:'🏭',
    name:'RF Perchado',
    desc:'Perchado, separación y visualización de movimientos',
    href:'rf_perchado.html',
    cls:'perc',
  },
  {
    id:'des',
    icon:'🚚',
    name:'RF Despacho',
    desc:'Registro y control de despachos desde bodega',
    href:'rf_despacho.html',
    cls:'des',
  },
];

function fechaCorta(){
  var d=new Date();
  var dias=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return dias[d.getDay()]+', '+d.getDate()+' '+meses[d.getMonth()]+' '+d.getFullYear();
}

function renderPortal(user){
  var loading=document.getElementById('loading-wrap');
  if(loading) loading.remove();

  // Header usuario
  var hdrRight=document.getElementById('hdr-right');
  if(hdrRight) hdrRight.style.display='block';
  var hdrUser=document.getElementById('hdr-user');
  var hdrDate=document.getElementById('hdr-date');
  if(hdrUser) hdrUser.textContent=user.displayName||user.name||user.username||'—';
  if(hdrDate) hdrDate.textContent=fechaCorta();

  // Crear main
  var main=document.createElement('div');
  main.className='main';

  // Título de sección
  var st=document.createElement('div');
  st.className='section-title';
  st.textContent='Aplicativos RF disponibles';
  main.appendChild(st);

  // Tarjetas
  var grid=document.createElement('div');
  grid.className='app-grid';

  APPS.forEach(function(app){
    var card;
    if(app.disabled){
      card=document.createElement('div');
    } else {
      card=document.createElement('a');
      card.href=app.href;
    }
    card.className='app-card '+app.cls;
    if(app.disabled) card.style.opacity='.45';

    card.innerHTML=
      '<div class="app-icon">'+app.icon+'</div>'+
      '<div>'+
        '<div class="app-name">'+app.name+'</div>'+
        '<div class="app-desc">'+app.desc+'</div>'+
      '</div>'+
      '<div class="app-arrow">'+(app.disabled?'🔒':'›')+'</div>';

    grid.appendChild(card);
  });
  main.appendChild(grid);

  // Info strip
  var strip=document.createElement('div');
  strip.className='info-strip';
  strip.innerHTML=
    '<div class="info-item">'+
      '<div class="info-lbl">Usuario</div>'+
      '<div class="info-val">'+
        (user.displayName||user.name||'—').split(' ').slice(0,2).join(' ')+
      '</div>'+
    '</div>'+
    '<div class="info-item">'+
      '<div class="info-lbl">Fecha</div>'+
      '<div class="info-val">'+fechaCorta().split(', ')[1]+'</div>'+
    '</div>'+
    '<div class="info-item">'+
      '<div class="info-lbl">Sistema</div>'+
      '<div class="info-val">RF Inverneg v1.0</div>'+
    '</div>'+
    '<div class="info-item">'+
      '<div class="info-lbl">Bodega</div>'+
      '<div class="info-val">CND · Guayaquil</div>'+
    '</div>';
  main.appendChild(strip);

  // Insertar antes del footer
  var ftr=document.querySelector('.ftr');
  document.body.insertBefore(main,ftr);
}

function showLogin(){
  var loading=document.getElementById('loading-wrap');
  if(loading) loading.remove();

  var wrap=document.createElement('div');
  wrap.className='login-wrap';
  wrap.innerHTML=
    '<div class="login-logo">🏭</div>'+
    '<div class="login-title">RF Inverneg</div>'+
    '<div class="login-sub">Portal Operativo · Centro de Distribución Nacional</div>'+
    '<button class="btn-login" id="btn-login">🔐 Iniciar sesión con Microsoft</button>';
  var ftr=document.querySelector('.ftr');
  document.body.insertBefore(wrap,ftr);
  document.getElementById('btn-login').addEventListener('click',function(){
    if(window._msalLogin) window._msalLogin();
  });
}

// ── MSAL ──────────────────────────────────────────────────────────
var s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js';
s.onload=function(){
  var msalInst=new msal.PublicClientApplication({
    auth:{
      clientId:CFG.clientId,
      authority:'https://login.microsoftonline.com/'+CFG.tenantId,
      redirectUri:location.href.split('?')[0].split('#')[0],
      navigateToLoginRequestUrl:false,
    },
    cache:{cacheLocation:'localStorage',storeAuthStateInCookie:true},
  });

  window._msalLogin=function(){
    msalInst.loginRedirect({scopes:SCOPES});
  };

  msalInst.handleRedirectPromise().then(function(res){
    var acc=res&&res.account?res.account:msalInst.getAllAccounts()[0];
    if(acc){
      // Obtener nombre completo si está disponible
      var user={
        username:acc.username||'',
        name:acc.name||'',
        displayName:acc.name||acc.username||'',
      };
      renderPortal(user);
    } else {
      showLogin();
    }
  }).catch(function(e){
    console.error('[MSAL]',e.message);
    showLogin();
  });
};
document.head.appendChild(s);

})();
</script>
</body>
</html>
