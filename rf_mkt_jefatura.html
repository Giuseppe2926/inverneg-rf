<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RF MKT Jefatura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ──────────────────────────────────────────────────────────────── */
:root {
  --bg:#f1f5f9; --bg-card:#ffffff; --bg-muted:#f8fafc;
  --fg:#0f172a; --fg-muted:#64748b; --fg-subtle:#94a3b8;
  --border:#e2e8f0; --border-focus:#7c3aed;
  --primary:#7c3aed; --primary-h:#6d28d9; --primary-fg:#fff;
  --ok:#16a34a; --ok-bg:#f0fdf4; --ok-bd:#bbf7d0;
  --warn:#d97706; --warn-bg:#fffbeb; --warn-bd:#fde68a;
  --err:#dc2626; --err-bg:#fef2f2; --err-bd:#fecaca;
  --info:#7c3aed; --info-bg:#f5f3ff; --info-bd:#ddd6fe;
  --gray:#f1f5f9;
  --r:8px; --r-lg:12px;
  --sh:0 1px 3px rgba(0,0,0,.08);
  --sh-md:0 4px 12px rgba(0,0,0,.1);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a; --bg-card:#1e293b; --bg-muted:#162032;
    --fg:#f1f5f9; --fg-muted:#94a3b8; --fg-subtle:#64748b;
    --border:#334155; --border-focus:#8b5cf6;
    --primary:#8b5cf6; --primary-h:#7c3aed;
    --ok-bg:#052e16; --ok-bd:#14532d;
    --warn-bg:#1c1400; --warn-bd:#78350f;
    --err-bg:#1c0a0a; --err-bd:#7f1d1d;
    --info-bg:#1e1533; --info-bd:#3b2d6a;
    --gray:#1e293b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a; --bg-card:#1e293b; --bg-muted:#162032;
  --fg:#f1f5f9; --fg-muted:#94a3b8; --fg-subtle:#64748b;
  --border:#334155; --border-focus:#8b5cf6;
  --primary:#8b5cf6; --primary-h:#7c3aed;
  --ok-bg:#052e16; --ok-bd:#14532d;
  --warn-bg:#1c1400; --warn-bd:#78350f;
  --err-bg:#1c0a0a; --err-bd:#7f1d1d;
  --info-bg:#1e1533; --info-bd:#3b2d6a;
  --gray:#1e293b;
  color-scheme:dark;
}

/* ── RESET & BASE ─────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;font-size:14px;
     background:var(--bg);color:var(--fg);
     padding-inline:16px;padding-block:16px}

/* ── LAYOUT ───────────────────────────────────────────────────────────────── */
.app-hdr{display:flex;align-items:center;gap:10px;margin-bottom:20px;
         padding-bottom:14px;border-bottom:1px solid var(--border)}
.app-hdr h1{margin:0;font-size:17px;font-weight:700;flex:1}
.app-hdr .user{font-size:12px;color:var(--fg-muted);max-width:160px;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── BUTTONS ──────────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
     border-radius:var(--r);border:none;font:inherit;font-size:13px;
     font-weight:500;cursor:pointer;transition:.15s;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:hover:not(:disabled){background:var(--primary-h)}
.btn-secondary{background:var(--bg-muted);color:var(--fg);
               border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--gray)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover:not(:disabled){background:#15803d}
.btn-warn{background:var(--warn);color:#fff}
.btn-warn:hover:not(:disabled){background:#b45309}
.btn-err{background:var(--err);color:#fff}
.btn-err:hover:not(:disabled){background:#b91c1c}
.btn-ghost{background:transparent;color:var(--fg-muted);border:none;padding:4px 8px}
.btn-ghost:hover:not(:disabled){color:var(--fg)}
.btn-sm{padding:4px 10px;font-size:12px}

/* ── ALERTS ───────────────────────────────────────────────────────────────── */
.alert{padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px}
.a-ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}
.a-err{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err)}
.a-warn{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn)}
.a-info{background:var(--info-bg);border:1px solid var(--info-bd);color:var(--info)}

/* ── CARD ─────────────────────────────────────────────────────────────────── */
.card{background:var(--bg-card);border:1px solid var(--border);
      border-radius:var(--r-lg);box-shadow:var(--sh);margin-bottom:14px}
.card-hdr{display:flex;align-items:center;gap:10px;padding:14px 16px;
          border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-title{font-size:15px;font-weight:700;margin:0;flex:1}
.card-body{padding:14px 16px}

/* ── BADGES ───────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
       font-size:11px;font-weight:600;white-space:nowrap}
.b-pendiente{background:var(--gray);color:var(--fg-muted);border:1px solid var(--border)}
.b-aprobada{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-reprogramada{background:var(--info-bg);color:var(--info);border:1px solid var(--info-bd)}
.b-rechazada{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.b-parcial{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-cancelada{background:var(--gray);color:var(--fg-subtle);border:1px solid var(--border)}
.b-recibidook{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-novedades{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-parcialrec{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-rechazadoop{background:var(--err-bg);color:var(--err);border:1px solid var(--err-bd)}
.b-nopresentado{background:var(--gray);color:var(--fg-muted);border:1px solid var(--border)}
.ver-recepcion-hdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-subtle);margin:6px 0 2px}
.b-recibido{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-bd)}
.b-novedades{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}

/* ── SOLICITUDES LIST ─────────────────────────────────────────────────────── */
.sol-row{display:flex;align-items:center;gap:10px;padding:12px 16px;
         border-bottom:1px solid var(--border);cursor:pointer;
         transition:background .12s;flex-wrap:wrap}
.sol-row:last-child{border-bottom:none}
.sol-row:hover{background:var(--bg-muted)}
.sol-info{flex:1;min-width:0}
.sol-nro{font-weight:600;font-size:14px}
.sol-meta{font-size:12px;color:var(--fg-muted);margin-top:2px}
.sol-pending-count{font-size:11px;font-weight:700;
                   background:var(--warn-bg);color:var(--warn);
                   border:1px solid var(--warn-bd);
                   padding:2px 7px;border-radius:20px;white-space:nowrap}

/* ── VER LINEA ────────────────────────────────────────────────────────────── */
.ver-grupo{border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:18px;overflow:hidden}
.ver-ghdr{background:var(--primary);color:var(--primary-fg);padding:10px 16px;font-size:13px;font-weight:700;
          border-bottom:1px solid var(--border);text-transform:capitalize}
.ver-subgrupo{border-top:1px solid var(--border)}
.ver-subgrupo+.ver-subgrupo{border-top:1px solid var(--border)}
.ver-subghdr{background:var(--gray);padding:8px 16px;font-size:12px;font-weight:600;
             border-bottom:1px solid var(--border);color:var(--fg-muted)}
.ver-linea{padding:14px 16px;border-bottom:1px solid var(--border)}
.ver-linea:last-child{border-bottom:none}
.ver-linea-done{opacity:.55}
.ver-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.ver-cell{display:flex;flex-direction:column;gap:2px}
.ver-clbl{font-size:10px;font-weight:600;text-transform:uppercase;
          letter-spacing:.05em;color:var(--fg-muted)}
.ver-cval{font-size:13px;color:var(--fg)}

/* ── ACTION PANEL ─────────────────────────────────────────────────────────── */
.act-panel{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.act-btns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.act-form{background:var(--bg-muted);border:1px solid var(--border);
          border-radius:var(--r);padding:12px;display:none;margin-top:8px}
.act-form.open{display:block}
.act-form-title{font-size:12px;font-weight:700;text-transform:uppercase;
                letter-spacing:.05em;margin:0 0 10px;color:var(--fg-muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:11px;font-weight:600;color:var(--fg-muted);text-transform:uppercase;letter-spacing:.04em}
.form-ctrl{border:1px solid var(--border);border-radius:var(--r);
           background:var(--bg-card);color:var(--fg);font:inherit;font-size:13px;
           padding:7px 10px;transition:.15s}
.form-ctrl:focus{outline:none;border-color:var(--border-focus)}
.form-ctrl.err{border-color:var(--err)}
textarea.form-ctrl{resize:vertical;min-height:56px}
.form-actions{display:flex;gap:8px;margin-top:10px}

/* ── CARGA DEL DÍA ────────────────────────────────────────────────────────── */
.carga-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;
           border-radius:var(--r);border:1px solid var(--border);
           background:var(--bg-muted);margin-bottom:12px;flex-wrap:wrap}
.carga-label{font-size:11px;font-weight:700;text-transform:uppercase;
             letter-spacing:.05em;color:var(--fg-muted)}
.carga-dot{font-size:16px;line-height:1}
.carga-val{font-size:13px;font-weight:600}
.carga-detail{font-size:12px;color:var(--fg-muted)}
.carga-sep{color:var(--border);margin:0 2px}

/* ── FILTER TABS ──────────────────────────────────────────────────────────── */
.jef-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.jef-tab{padding:5px 12px;border-radius:20px;border:1px solid var(--border);
         background:var(--bg-card);color:var(--fg-muted);font:inherit;font-size:12px;
         font-weight:500;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px}
.jef-tab:hover{background:var(--gray);color:var(--fg)}
.jef-tab.tab-active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tab-cnt{font-size:11px;font-weight:700;opacity:.8}

/* ── MISC ─────────────────────────────────────────────────────────────────── */
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;
               letter-spacing:.06em;color:var(--fg-muted);margin:0 0 10px}
.empty{text-align:center;padding:40px 20px;color:var(--fg-muted)}
.empty p{margin:0}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--border);
      border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.login-wrap{display:flex;flex-direction:column;align-items:center;
            justify-content:center;min-height:100vh;padding:24px;text-align:center}
.login-card{background:var(--bg-card);border:1px solid var(--border);
            border-radius:var(--r-lg);padding:40px;max-width:380px;width:100%;
            box-shadow:var(--sh-md)}
.login-card h2{font-size:20px;font-weight:700;margin:0 0 6px}
.sol-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sol-fld{display:flex;flex-direction:column;gap:2px}
.sol-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted)}
.sol-val{font-size:13px}

/* ── NAV ──────────────────────────────────────────────────────────────────── */
.jef-nav{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.jef-nav-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;
  border-radius:var(--r);border:1px solid var(--border);background:var(--bg-card);
  color:var(--fg-muted);font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:.15s}
.jef-nav-btn:hover{background:var(--gray);color:var(--fg)}
.jef-nav-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── PERFIL SWITCH ────────────────────────────────────────────────────────── */
.perfil-sw{display:inline-flex;border:1px solid var(--border);border-radius:20px;
           overflow:hidden;background:var(--bg-muted);padding:2px;gap:2px}
.perfil-opt{padding:3px 11px;font-size:11px;font-weight:600;cursor:pointer;
            border:none;background:transparent;color:var(--fg-muted);font-family:inherit;
            transition:.15s;white-space:nowrap;border-radius:20px;line-height:1.4}
.perfil-opt:hover{color:var(--fg)}
.perfil-opt.perfil-active{background:var(--primary);color:#fff}
.perfil-opt.perfil-active-sup{background:#0369a1;color:#fff}
.perfil-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
              border-radius:20px;font-size:10px;font-weight:700;
              background:var(--info-bg);color:var(--info);border:1px solid var(--info-bd)}
.perfil-badge.pb-sup{background:#e0f2fe;color:#0369a1;border-color:#bae6fd}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .perfil-badge.pb-sup{background:#0c2a3d;color:#38bdf8;border-color:#0369a1}
}
:root[data-theme="dark"] .perfil-badge.pb-sup{background:#0c2a3d;color:#38bdf8;border-color:#0369a1}

/* ── CALENDARIO ───────────────────────────────────────────────────────────── */
.cal-wrap{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:780px){.cal-wrap.panel-open{grid-template-columns:1fr 360px;align-items:start}}
.cal-card-c{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh)}
.cal-hdr-c{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)}
.cal-month-lbl{font-size:15px;font-weight:700;text-transform:capitalize}
.cal-nav-c{display:flex;gap:4px;align-items:center}
.btn-cal-t{padding:4px 10px;font-size:11px;font-weight:600;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-card);color:var(--fg-muted);cursor:pointer;font-family:inherit}
.btn-cal-t:hover{background:var(--gray)}
.btn-cal-n{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:var(--r);background:var(--bg-card);color:var(--fg-muted);font-size:14px;cursor:pointer;font-family:inherit}
.btn-cal-n:hover{background:var(--gray)}
.cal-grid-c{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow-c{padding:7px 4px;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-subtle);background:var(--gray);border-bottom:1px solid var(--border)}
.cal-day-c{min-height:90px;padding:6px;cursor:pointer;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px;transition:background .1s}
.cal-day-c:nth-child(7n){border-right:none}
.cal-day-c:hover{background:var(--bg-muted)}
.cal-day-c.c-other{opacity:.3;pointer-events:none}
.cal-day-c.c-today .cal-dn-c{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.cal-day-c.c-sel{background:var(--info-bg);outline:2px solid var(--primary);outline-offset:-2px}
.cal-dn-c{font-size:11px;font-weight:600;color:var(--fg);width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cal-day-c.c-other .cal-dn-c{color:var(--fg-subtle)}
.c-info{display:flex;flex-direction:column;gap:2px;margin-top:1px}
.c-load-row{display:flex;align-items:center;gap:4px}
.c-load-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.c-load-txt{font-size:10px;font-weight:600;line-height:1}
.c-units{font-size:10px;color:var(--fg-subtle);line-height:1}
.c-exec-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.c-exec-ico{font-size:10px;line-height:1.4;white-space:nowrap}
.clv-ok   .c-load-dot{background:#16a34a}.clv-ok   .c-load-txt{color:#16a34a}
.clv-warn .c-load-dot{background:#d97706}.clv-warn .c-load-txt{color:#d97706}
.clv-alrt .c-load-dot{background:#ea580c}.clv-alrt .c-load-txt{color:#ea580c}
.clv-crit .c-load-dot{background:#dc2626}.clv-crit .c-load-txt{color:#dc2626}
.cal-legend-c{display:flex;gap:14px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--border);background:var(--gray)}
.cal-leg-it{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--fg-muted)}
.cal-leg-d{width:7px;height:7px;border-radius:50%}
.cal-dp-c{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-md)}
.cal-dp-hdr-c{padding:13px 16px;background:var(--info-bg);border-bottom:1px solid var(--info-bd);display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.cal-dp-date{font-size:13px;font-weight:700;color:var(--primary);text-transform:capitalize;line-height:1.3}
.cal-dp-meta{font-size:11px;color:var(--fg-muted);margin-top:3px}
.cal-dp-cls{width:26px;height:26px;flex-shrink:0;border-radius:var(--r);border:1px solid var(--info-bd);background:transparent;color:var(--primary);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:inherit}
.cal-dp-cls:hover{background:var(--info-bd)}
.cal-dp-acts{display:flex;gap:7px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border)}
.cal-dp-acts:empty{display:none}
.cal-dp-body{max-height:440px;overflow-y:auto}
.cal-dp-empty-c{padding:30px 16px;text-align:center;color:var(--fg-muted);font-size:13px}
.cal-line-c{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.cal-line-c:last-child{border-bottom:none}
.cal-lt{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cal-lprov{font-size:13px;font-weight:600;color:var(--fg)}
.cal-lhora{font-size:11px;color:var(--fg-subtle);white-space:nowrap}
.cal-lmat{font-size:12px;color:var(--fg-muted)}
.cal-lmid{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:3px}
.cal-lacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.btn-cla{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid;transition:.12s;font-family:inherit;background:transparent}
.btn-cla-p{border-color:var(--primary);color:var(--primary)}.btn-cla-p:hover{background:var(--primary);color:#fff}
.btn-cla-e{border-color:var(--err);color:var(--err)}.btn-cla-e:hover{background:var(--err);color:#fff}
.btn-cla-ok{border-color:var(--ok);color:var(--ok)}.btn-cla-ok:hover{background:var(--ok);color:#fff}
@media(max-width:600px){.cal-day-c{min-height:64px;padding:4px}.c-units,.c-exec-row{display:none}}
</style>
</head>

<div id="app"><div style="text-align:center;padding:60px 20px"><span class="spin"></span></div></div>

<script>
/* ── CONFIG ───────────────────────────────────────────────────────────────── */
const MSAL_CFG = {
  auth:{
    clientId:'ec976114-e146-4ce4-850c-5d978e12acfd',
    authority:'https://login.microsoftonline.com/5e008bd3-17b6-4f83-8d23-019691a40609',
    redirectUri: location.origin + location.pathname
  },

/* ── GRAPH ────────────────────────────────────────────────────────────────── */
async function gGet(url) {
  const t = await tok();
  const r = await fetch(url, {headers:{Authorization:`Bearer ${t}`}});
  if (!r.ok) { const e = await r.text(); throw new Error(`${r.status} ${e}`); }
  return r.json();
}
async function gPost(url, body) {
  const t = await tok();
  const r = await fetch(url, {method:'POST',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if (!r.ok) { const e = await r.text(); throw new Error(`${r.status} ${e}`); }
  return r.json();
}
async function gPatch(url, body) {
  const t = await tok();
  const r = await fetch(url, {method:'PATCH',headers:{Authorization:`Bearer ${t}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if (!r.ok) { const e = await r.text(); throw new Error(`${r.status} ${e}`); }
  return r.status === 204 ? null : r.json();
}
async function gAll(url) {
  let res=[], next=url;
  while(next){ const d=await gGet(next); res=res.concat(d.value||[]); next=d['@odata.nextLink']||null; }
  return res;
}

/* ── CARGA DEL DÍA ────────────────────────────────────────────────────────── */
function cargaDia(fecha) {
  // Cuenta líneas aprobadas/reprogramadas para esa fecha
  const isoFecha = toISODate(fecha);
  if(!isoFecha) return null;
  const lsDelDia = lineas.filter(l=>{
    const fAprobada = toISODate(l.FechaAprobada);
    const fSol      = toISODate(l.FechaSolicitada);
    const fRef      = fAprobada || fSol;
    const estadoOk  = ['Aprobada','Reprogramada'].includes(l.EstadoLinea);
    return estadoOk && fRef === isoFecha;
  });
  const nLineas   = lsDelDia.length;
  const nUnidades = lsDelDia.reduce((s,l)=> s + (Number(l.Cantidad)||0), 0);
  let dot, nivel;
  if(nLineas <= 3)      { dot='🟢'; nivel='Capacidad libre'; }
  else if(nLineas <= 5) { dot='🟡'; nivel='Capacidad media'; }
  else if(nLineas <= 7) { dot='🟠'; nivel='Capacidad alta'; }
  else                  { dot='🔴'; nivel='Capacidad máxima'; }
  return { dot, nivel, nLineas, nUnidades, isoFecha };
}

// Mapa de fechas ya renderizadas en la vista actual (se resetea en revisarHTML)
let _cargaRendered = {};
function cargaHTMLOnce(fecha) {
  const isoFecha = toISODate(fecha);
  if(!isoFecha) return '';
  if(_cargaRendered[isoFecha]) return ''; // ya mostrado para esta fecha
  _cargaRendered[isoFecha] = true;
  const c = cargaDia(fecha);
  if(!c) return '';
  const fechaLabel = new Date(isoFecha+'T12:00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  return `<div class="carga-bar">
    <span class="carga-label">${fechaLabel}</span>
    <span class="carga-dot">${c.dot}</span>
    <span class="carga-val">${c.nivel}</span>
    <span class="carga-sep">·</span>
    <span class="carga-detail">${c.nLineas} recepcion${c.nLineas!==1?'es':''} programada${c.nLineas!==1?'s':''}</span>
    <span class="carga-sep">·</span>

}

function calBuildGrid_j(){
  const yr=calYr, mo=calMo;
  document.getElementById('calLbl').textContent=`${CAL_MON_J[mo]} ${yr}`;
  const grid=document.getElementById('calGrid');
  const first=new Date(yr,mo,1).getDay();
  const inMon=new Date(yr,mo+1,0).getDate();
  const inPrev=new Date(yr,mo,0).getDate();
  let h=CAL_DOW_J.map(d=>`<div class="cal-dow-c">${d}</div>`).join('');
  let cells='';
  for(let i=0;i<first;i++){
    const d=inPrev-first+1+i;
    const iso=`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=calCell_j(iso,d,true);
  }
  for(let d=1;d<=inMon;d++){
    const iso=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=calCell_j(iso,d,false);
  }
  const tail=(first+inMon)%7; const nx=tail?7-tail:0;
  for(let i=1;i<=nx;i++){
    const iso=`${yr}-${String(mo+2).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    cells+=calCell_j(iso,i,true);
  }
  grid.innerHTML=h+cells;
  grid.querySelectorAll('.cal-day-c:not(.c-other)').forEach(el=>{
    el.addEventListener('click',()=>{
      grid.querySelectorAll('.cal-day-c').forEach(d=>d.classList.remove('c-sel'));

}

/* ── PANTALLA: SOLICITUDES ────────────────────────────────────────────────── */
const FILTROS_JEF = ['Pendientes','Aprobadas','Reprogramadas','Rechazadas','Canceladas','Todas'];

function solsPorFiltro(filtro) {
  switch(filtro) {
    case 'Pendientes':
      // Tiene al menos una línea que Jefatura aún puede gestionar
      return sols.filter(s=>{
        const ls = lineasDeSol(s);
        return ls.some(l=> JEFATURA_ACCIONES.has(l.EstadoLinea||'Pendiente'));
      });
    case 'Aprobadas':
      return sols.filter(s=> calcEstado(s) === 'Aprobada');
    case 'Reprogramadas':
      // Al menos una línea reprogramada (sin importar el estado global)
      return sols.filter(s=>{
        const ls = lineasDeSol(s);
        return ls.some(l=> l.EstadoLinea === 'Reprogramada');
      });
    case 'Rechazadas':
      return sols.filter(s=> calcEstado(s) === 'Rechazada');
    case 'Canceladas':
      return sols.filter(s=>{
        const ls = lineasDeSol(s);
        return ls.length > 0 && ls.every(l=> l.EstadoLinea==='Cancelada');
      });
    default: // Todas
      return sols;
  }
}

function pendientesHTML() {

  const tabsHTML = FILTROS_JEF.map(f=>{

    return `<button class="jef-tab${active}" data-filtro="${f}">${f} <span class="tab-cnt">${count}</span></button>`;
  }).join('');

  const emptyMsg = fEstado === 'Pendientes'
    ? 'No hay solicitudes pendientes de revisión.'
    : `No hay solicitudes en estado ${fEstado.toLowerCase()}.`;

  const rows = filtradas.map(s=>{
    const ls = lineasDeSol(s);
    const nPend = ls.filter(l=> JEFATURA_ACCIONES.has(l.EstadoLinea||'Pendiente')).length;
    const provs = [...new Set(ls.map(l=>l.Proveedor).filter(Boolean))].join(', ') || '—';
    const pendChip = nPend > 0
      ? `<span class="sol-pending-count">${nPend} pendiente${nPend!==1?'s':''}</span>` : '';
    return `<div class="sol-row" data-id="${esc(s.id)}">
      <div class="sol-info">
        <div class="sol-nro">${esc(s.NroSolicitud||'(Sin número)')}</div>

  }).join('');

  const listHTML = filtradas.length
    ? `<div class="card" style="padding:0;overflow:hidden">${rows}</div>`

  return `

function lineasDeSol(sol) {
  return lineas.filter(l=> String(l.SolicitudId)===String(sol.id) || l.NroSolicitud===sol.NroSolicitud);
}

function revisarHTML() {
  const sol = sols.find(s=>s.id===viewId);
  if(!sol) return `<div class="alert a-err">Solicitud no encontrada.</div>
    <button class="btn btn-secondary" id="btn-bk">← Volver</button>`;

  const ls = lineasDeSol(sol);
  // Agrupar primero por FechaSolicitada, luego por Proveedor
  const byFecha = {};
  ls.forEach(l=>{
    const f = toISODate(l.FechaSolicitada) || '(Sin fecha)';
    if(!byFecha[f]) byFecha[f] = {};
    const p = l.Proveedor || '(Sin proveedor)';
    if(!byFecha[f][p]) byFecha[f][p] = [];
    byFecha[f][p].push(l);
  });

function bindRevisar() {
  document.getElementById('btn-bk')?.addEventListener('click',()=>{ screen='pendientes'; render(); });

  // Abrir/cerrar formularios de acción
  document.querySelectorAll('.act-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const lid    = btn.dataset.lid;
      const accion = btn.dataset.accion;
      const formId = `af-${accion}-${lid}`;
      // Cerrar todos los formularios de esta línea
      ['aprobar','reprogramar','rechazar','cancelar'].forEach(a=>{
        const f = document.getElementById(`af-${a}-${lid}`);
        if(f) f.classList.remove('open');
      });
      const form = document.getElementById(formId);
      if(form) form.classList.toggle('open');
    });
  });

  // Cancelar (cerrar) formularios
  document.querySelectorAll('.af-cx').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const f = document.getElementById(`af-${btn.dataset.accion}-${btn.dataset.lid}`);
      if(f) f.classList.remove('open');
    });
  });

  // Confirmar APROBAR
  document.querySelectorAll('[id^="af-ok-"]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const lid   = btn.dataset.lid;

      const obs   = document.getElementById(`af-obs-${lid}`)?.value?.trim() || null;

function quien_es() {
  const nombre = me?.name || me?.username || me?.displayName || 'Desconocido';
  return `${nombre} (${perfil})`;
}

function patchLocal(lid, fields) {
  const l = lineas.find(x=>x.id===lid);
  if(l) Object.assign(l, fields);
}

/* Calcula el estado consolidado de una solicitud a partir de sus líneas.
   Reglas:
     - Todas Pendiente          → 'Pendiente'
     - Hay al menos una Pendiente (y al menos una decidida) → 'Parcial'
     - Todas decididas, con al menos una Aprobada/Reprogramada → 'Aprobada'
     - Todas decididas, ninguna Aprobada/Reprogramada → 'Rechazada'
*/
function calcEstado(sol) {
  const ls = lineasDeSol(sol);
  if(!ls.length) return sol.Estado || 'Pendiente';
  const estados = ls.map(l=> l.EstadoLinea || 'Pendiente');
  if(estados.every(e=> e === 'Pendiente'))               return 'Pendiente';
  if(estados.some(e=> e === 'Pendiente'))                return 'Parcial'; // mezcla con pendiente
  if(estados.some(e=> e==='Aprobada'||e==='Reprogramada')) return 'Aprobada';
  return 'Rechazada'; // todas Rechazada/Cancelada
}

/* Persiste el estado calculado en MKT_Solicitudes si cambió */
async function recalcularEstadoSolicitud(solId) {
  const sol = sols.find(s=>s.id===solId);
  if(!sol) return;
  const nuevoEstado = calcEstado(sol);
  if(nuevoEstado === sol.Estado) return; // sin cambio
  await gPatch(`${BASE}/sites/${SITE}/lists/MKT_Solicitudes/items/${solId}/fields`,{
    Estado: nuevoEstado
  });
  sol.Estado = nuevoEstado;
}

async function historial(lineaId, campo, valorAnterior, valorNuevo, usuario, now, obs) {
  const sol = sols.find(s=>s.id===viewId);
  await gPost(`${BASE}/sites/${SITE}/lists/MKT_Historial/items`,{
    fields:{
      SolicitudId: viewId,
      NroSolicitud: sol?.NroSolicitud||'',
      LineaId: lineaId,
      Campo: campo,
      ValorAnterior: valorAnterior,
      ValorNuevo: valorNuevo,
      Modulo: 'Jefatura',
      UsuarioAccion: usuario,
      Timestamp: now,
      Observacion: obs||''
    }
  });
}

let alertTimer;
function showAlert(type, msg) {
  const el = document.getElementById('ac'); if(!el) return;
  el.innerHTML = `<div class="alert a-${type}">${msg}</div>`;
  clearTimeout(alertTimer);
  if(type==='ok') alertTimer = setTimeout(()=>{ el.innerHTML=''; }, 5000);
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

async function reloadData() {
  busy = true; render();
  try {
    const [s,l] = await Promise.all([
      gAll(`${BASE}/sites/${SITE}/lists/MKT_Solicitudes/items?$expand=fields&$top=500`),
      gAll(`${BASE}/sites/${SITE}/lists/MKT_Lineas/items?$expand=fields&$top=500`)
    ]);
    sols   = s.map(i=>({id:i.id,...i.fields}));
    lineas = l.map(i=>({id:i.id,...i.fields}));
  } catch(e) { console.warn('[DATA]', e.message); }
  busy = false; render();
}

async function tok() {
  if (!msalApp) throw new Error('MSAL no inicializado');
  const acc = msalApp.getActiveAccount();
  if (!acc) throw new Error('Sin sesión');
  return msalApp.acquireTokenSilent({scopes:SCOPES, account:acc})
    .catch(function(){ return msalApp.acquireTokenRedirect({scopes:SCOPES}); })
    .then(function(r){ return r ? r.accessToken : Promise.reject(new Error('redirect')); });
}

(function bootMsal(){
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js';
  s.onload = function() {
    msalApp = new msal.PublicClientApplication(MSAL_CFG);
    msalApp.handleRedirectPromise().then(function(res){
      if (res && res.account) {
        me = res.account; msalApp.setActiveAccount(me); postLogin();
      } else {
        var all = msalApp.getAllAccounts();
        if (all.length > 0) { me = all[0]; msalApp.setActiveAccount(me); postLogin(); }
        else { showLoginPage(); }
      }
    }).catch(function(e){ console.error('[MSAL]', e); showLoginPage(); });
  };
  s.onerror = function(){
    document.getElementById('app').innerHTML =
      '<div class="login-wrap"><div class="login-card">' +
      '<p style="color:var(--err)">No se pudo cargar la librería de autenticación. Verifica tu conexión.</p>' +
      '</div></div>';
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>

</body></html>
