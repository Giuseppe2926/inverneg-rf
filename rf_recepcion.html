<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>RF Recepción — Inverneg</title>
<style>
:root{
  --bg:#0D1117;--sur:#161B22;--sur2:#1C2330;--bor:#2A3340;
  --txt:#E6EDF3;--mut:#7D8590;
  --acc:#58A6FF;--ok:#3FB950;--warn:#E3B341;--dan:#F85149;--rec:#F0883E;
  --mono:'Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
#app{display:flex;flex-direction:column;min-height:100vh}

/* HEADER */
.hdr{background:var(--sur);border-bottom:1px solid var(--bor);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-brand{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--rec)}
.hdr-sub{font-size:10px;color:var(--mut);margin-top:1px}
.hdr-btn{background:var(--sur2);border:1px solid var(--bor);color:var(--mut);font-size:11px;padding:5px 10px;border-radius:5px;cursor:pointer}

/* SCREEN */
#screen{flex:1;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* FOOTER */
.ftr{background:var(--sur);border-top:1px solid var(--bor);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;min-height:44px}
.ftr-op{font-size:11px;color:var(--mut)}
.ftr-conn{display:flex;align-items:center;gap:5px;font-size:10px;font-family:var(--mono);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--ok)}.dot.err{background:var(--dan)}

/* INPUTS */
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;margin-top:10px}
.inp{width:100%;background:var(--sur2);border:1px solid var(--bor);color:var(--txt);font-size:16px;padding:10px 12px;border-radius:6px;outline:none;font-family:inherit}
.inp:focus{border-color:var(--acc)}
.inp-sm{font-size:14px;padding:8px 10px}
select.inp{appearance:none;-webkit-appearance:none}

/* BUTTONS */
.btn{border:none;border-radius:6px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .1s}
.btn:active{opacity:.75}
.btn-pri{background:var(--acc);color:#000}
.btn-ok{background:var(--ok);color:#000}
.btn-warn{background:var(--dan);color:#fff}
.btn-sec{background:var(--sur2);color:var(--txt);border:1px solid var(--bor)}
.btn-rec{background:var(--rec);color:#000}
.btn-big{width:100%;padding:13px;font-size:15px}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}

/* TYPE CARDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.card-t{background:var(--sur2);border:2px solid var(--bor);border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;transition:border-color .15s}
.card-t:active{border-color:var(--acc)}
.card-t.sel{border-color:var(--acc);background:#1a2030}
.card-t.sel-rec{border-color:var(--rec);background:#1e1a14}
.card-t-icon{font-size:26px;margin-bottom:6px}
.card-t-lbl{font-size:12px;font-weight:700;letter-spacing:.06em}

/* BADGES */
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;padding:3px 10px;border-radius:4px;margin-bottom:8px;text-transform:uppercase}
.badge-rec{background:rgba(240,136,62,.15);color:var(--rec);border:1px solid rgba(240,136,62,.3)}
.badge-sup{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.3)}
.badge-ok{background:rgba(63,185,80,.15);color:var(--ok);border:1px solid rgba(63,185,80,.3)}

/* STEPS */
.steps{display:flex;gap:3px;margin-bottom:10px}
.step{height:3px;border-radius:2px;flex:1;background:var(--bor)}
.step.on{background:var(--rec)}

/* ALERTS */
.alert{background:rgba(248,81,73,.12);border:1px solid rgba(248,81,73,.3);color:var(--dan);border-radius:6px;padding:8px 12px;font-size:12px;margin:6px 0}
.alert-w{background:rgba(227,179,65,.12);border:1px solid rgba(227,179,65,.3);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:12px;margin:6px 0}

/* CARDS DE PEDIDO/CONTENEDOR */
.card-item{background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;position:relative}
.card-item:active{border-color:var(--acc)}
.card-item-title{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:3px}
.card-item-sub{font-size:11px;color:var(--mut)}
.card-item-badge{position:absolute;right:12px;top:12px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:3px;text-transform:uppercase}
.status-pend{background:rgba(227,179,65,.2);color:var(--warn)}
.status-act{background:rgba(240,136,62,.2);color:var(--rec)}
.status-ok{background:rgba(63,185,80,.2);color:var(--ok)}

/* EVENTO CARD */
.evt-card{background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.evt-icon{font-size:22px;flex-shrink:0}
.evt-body{flex:1}
.evt-title{font-size:13px;font-weight:700}
.evt-time{font-size:12px;color:var(--ok);margin-top:2px}
.evt-pend{font-size:12px;color:var(--mut);margin-top:2px}
.evt-btn{flex-shrink:0}

/* CALENDARIO */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal-day{padding:8px 4px;text-align:center;font-size:12px;border-radius:6px;cursor:pointer;background:var(--sur2);border:1px solid var(--bor)}
.cal-day.hoy{border-color:var(--acc);color:var(--acc);font-weight:700}
.cal-day.sel{background:var(--acc);color:#000;font-weight:700}
.cal-day.has-data{border-color:var(--rec)}
.cal-day.vacio{background:transparent;border-color:transparent;cursor:default;color:var(--mut)}
.cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:8px}
.cal-hdr-d{text-align:center;font-size:10px;color:var(--mut);font-weight:700;padding:4px}

/* BUSQUEDA SKU */
.sku-item{background:var(--sur2);border:1px solid var(--bor);border-radius:6px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.sku-item:active{border-color:var(--acc)}
.sku-cod{font-size:12px;color:var(--acc);font-weight:700;margin-bottom:2px}
.sku-desc{font-size:13px;color:var(--txt)}

/* TOAST */
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--sur2);border:1px solid var(--bor);color:var(--txt);padding:8px 16px;border-radius:8px;font-size:12px;z-index:999;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* LOADING */
.loading{text-align:center;padding:40px 0}
.loading-icon{font-size:32px;margin-bottom:12px}
.loading-txt{font-size:13px;font-weight:700;color:var(--acc);margin-bottom:6px}
.loading-sub{font-size:11px;color:var(--mut)}

/* VAL */
.val{font-size:28px;font-weight:700;margin:6px 0;text-align:center}
.val.ok{color:var(--ok)}.val.rec{color:var(--rec)}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div>
      <div class="hdr-brand">▸ RF RECEPCIÓN</div>
      <div class="hdr-sub" id="hdr-sub">Inverneg · CND</div>
    </div>
    <button class="hdr-btn" onclick="window.goHome&&goHome()">⌂ Inicio</button>
  </div>
  <div id="screen">
    <div class="loading">
      <div class="loading-icon">📦</div>
      <div class="loading-txt">Iniciando...</div>
    </div>
  </div>
  <div class="ftr">
    <div class="ftr-op" id="ftr-op">—</div>
    <div class="ftr-conn"><div class="dot" id="conn-dot"></div><span id="conn-lbl">CONECTANDO</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ═══════════════════════════════════════════════════════════════════
// 1. UTILIDADES
// ═══════════════════════════════════════════════════════════════════
function pad(n){return String(n).padStart(2,'0');}
function ahora(){
  var d=new Date();
  var fecha=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var hora=pad(d.getHours())+':'+pad(d.getMinutes());
  return{fecha:fecha,hora:hora,ts:fecha+' '+hora+':'+pad(d.getSeconds()),raw:d};
}
function horaActual(){var t=ahora();return t.hora;}
function generarRecId(){
  var t=ahora();
  return 'REC-'+t.fecha.replace(/-/g,'')+'-'+String(Math.floor(Math.random()*900)+100);
}
function render(html){document.getElementById('screen').innerHTML=html;}
function toast(msg,dur){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');},dur||2200);
}
function setConn(s){
  var dot=document.getElementById('conn-dot');
  var lbl=document.getElementById('conn-lbl');
  dot.className='dot';
  if(s==='ok'){dot.classList.add('ok');lbl.textContent='LIVE';}
  else if(s==='err'){dot.classList.add('err');lbl.textContent='SIN CONEXIÓN';}
  else lbl.textContent='CONECTANDO';
}
function updateFtr(){
  var op=S.operario||'—';
  var rol=S.rol?(' · '+(S.rol==='supervisor'?'SUP':'OP')):'';
  document.getElementById('ftr-op').textContent=op+rol;
}
function stepsBar(cur,tot){
  var h='<div class="steps">';
  for(var i=0;i<tot;i++) h+='<div class="step'+(i<cur?' on':'')+'"></div>';
  return h+'</div>';
}
function normStr(s){return s?s.trim().toUpperCase():'';}
function fechaDisplay(iso){
  if(!iso) return '';
  var p=iso.split('-');
  return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;
}

// ═══════════════════════════════════════════════════════════════════
// 2. CFG
// ═══════════════════════════════════════════════════════════════════
var CFG={
  clientId:   'ec976114-e146-4ce4-850c-5d978e12acfd',
  tenantId:   '5e008bd3-17b6-4f83-8d23-019691a40609',
  siteId:     'inverneg.sharepoint.com,8b946a6c-31b9-4bf7-95d0-ab47d29a4d63,ad88c61f-b207-49a4-9105-8b3b57b31906',
  catalogoNombre: 'Inverneg_ConteoRF_Base_Live.xlsx',
  listas:{
    recepciones: 'RF_PRecepciones_LRecepciones',
    eventos:     'RF_PRecepciones_LEventos',
    asignaciones:'RF_PRecepciones_LAsignaciones',
    horas:'RF_PRecepciones_LHoras',
    horas:       'RF_PRecepciones_LHoras',
  },
};
var GRAPH='https://graph.microsoft.com/v1.0';

// ═══════════════════════════════════════════════════════════════════
// 3. DB
// ═══════════════════════════════════════════════════════════════════
var DB={
  operadores:[],supervisores:[],
  pedidos:[],contenedores:[],
  packing:[], // hoja Packing — única fuente de cantidades esperadas
  codigosBarra:[],
  skusPedidoCache:[], // registros SP del pedido activo para validación de exceso
  listIds:{recepciones:null,eventos:null,asignaciones:null,horas:null},
  catalogoDriveId:null,catalogoItemId:null,
};

// ═══════════════════════════════════════════════════════════════════
// 4. ESTADO DE SESIÓN
// ═══════════════════════════════════════════════════════════════════
var S={
  rol:'',operario:'',
  // Recepción activa
  recId:'',pedido:'',contenedor:'',sello:'',pallets:0,subtipo:'',
  eventos:{llegada:null,apertura:null,cierre:null,salida:null},
  skusRegistrados:[],
  step:'home',
  lpnActual:'', // LPN activo en el flujo de mercadería
  // Calendario
  calFecha:'',
  // SKU scan
  skuActual:null,
};

// ═══════════════════════════════════════════════════════════════════
// 5. MSAL
// ═══════════════════════════════════════════════════════════════════
var msalInst,msalAcc;
var SCOPES=['Files.ReadWrite','Sites.ReadWrite.All'];
var msalCfg={
  auth:{
    clientId:CFG.clientId,
    authority:'https://login.microsoftonline.com/'+CFG.tenantId,
    redirectUri:location.href.split('?')[0].split('#')[0],
    navigateToLoginRequestUrl:false,
  },
  cache:{cacheLocation:'localStorage',storeAuthStateInCookie:true},
};

// ═══════════════════════════════════════════════════════════════════
// 6. GRAPH HELPERS
// ═══════════════════════════════════════════════════════════════════
function getToken(){
  if(!msalAcc) return Promise.reject(new Error('Sin sesión'));
  var req={scopes:SCOPES,account:msalAcc};
  return msalInst.acquireTokenSilent(req).catch(function(){
    return msalInst.acquireTokenRedirect(req);
  });
}
function gGet(url){
  return getToken().then(function(r){
    return fetch(url,{headers:{'Authorization':'Bearer '+r.accessToken}});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+':'+t.slice(0,100));});
    return r.json();
  });
}
function gPost(url,body){
  return getToken().then(function(r){
    return fetch(url,{method:'POST',
      headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'},
      body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+':'+t.slice(0,100));});
    return r.json();
  });
}
function gPatch(url,body){
  return getToken().then(function(r){
    return fetch(url,{method:'PATCH',
      headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'},
      body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){throw new Error(r.status+':'+t.slice(0,100));});
    return r.status===204?{}:r.json();
  });
}
function urlLista(id){return GRAPH+'/sites/'+CFG.siteId+'/lists/'+id;}
function urlWB(hoja){
  return GRAPH+'/drives/'+DB.catalogoDriveId+'/items/'+DB.catalogoItemId+
    "/workbook/worksheets('"+hoja+"')/usedRange";
}

// ═══════════════════════════════════════════════════════════════════
// 7. DESCUBRIMIENTO AUTOMÁTICO
// ═══════════════════════════════════════════════════════════════════
function descubrirListas(){
  var url=GRAPH+'/sites/'+CFG.siteId+'/lists?$select=id,displayName&$top=200';
  return gGet(url).then(function(d){
    if(!d.value) return false;
    d.value.forEach(function(l){
      Object.keys(CFG.listas).forEach(function(k){
        if(l.displayName===CFG.listas[k]) DB.listIds[k]=l.id;
      });
    });
    var ok=DB.listIds.recepciones&&DB.listIds.eventos&&DB.listIds.asignaciones;
    console.log('[INIT] Listas:',JSON.stringify(DB.listIds));
    if(!ok) console.warn('[INIT] Alguna lista no encontrada');
    return ok;
  }).catch(function(e){console.error('[INIT] descubrirListas:',e.message);return false;});
}

function descubrirExcel(){
  var nom=CFG.catalogoNombre;
  // Buscar primero en SharePoint Team Site (fuente maestra)
  // Si no se encuentra, intentar OneDrive personal como fallback
  var urlSP=GRAPH+'/sites/'+CFG.siteId+'/drive/root/search(q='+encodeURIComponent("'"+nom+"'")+')';
  var urlOD=GRAPH+'/me/drive/root/search(q='+encodeURIComponent("'"+nom+"'")+')';
  console.log('[ARCHIVO] Buscando en SharePoint Team Site primero...');
  return gGet(urlSP).then(function(d){
    var f=d.value&&d.value.find(function(x){return x.name===nom;});
    if(f){
      console.log('[ARCHIVO] ✓ Encontrado en SharePoint Team Site');
      return f;
    }
    console.warn('[ARCHIVO] No encontrado en SP Team Site — intentando OneDrive personal...');
    return gGet(urlOD).then(function(d2){
      var f2=d2.value&&d2.value.find(function(x){return x.name===nom;});
      if(f2){console.log('[ARCHIVO] ⚠ Encontrado en OneDrive Personal (no es la fuente maestra)');return f2;}
      return null;
    });
  }).then(function(f){
    if(!f){console.error('[ARCHIVO] ✗ Excel no encontrado en ninguna ubicación:',nom);return false;}
    DB.catalogoDriveId=f.parentReference&&f.parentReference.driveId?f.parentReference.driveId:null;
    DB.catalogoItemId=f.id;

    // ── LOG IDENTIFICACIÓN DEL ARCHIVO ───────────────────────────
    var driveType=f.parentReference&&f.parentReference.driveType?f.parentReference.driveType:'?';
    console.log('[ARCHIVO] ═══════════════════════════════════════');
    console.log('[ARCHIVO] Nombre exacto:    ',f.name);
    console.log('[ARCHIVO] DriveId:          ',DB.catalogoDriveId);
    console.log('[ARCHIVO] ItemId:           ',DB.catalogoItemId);
    console.log('[ARCHIVO] WebUrl:           ',f.webUrl||'(sin webUrl)');
    console.log('[ARCHIVO] Última modificación:',f.lastModifiedDateTime||'(sin fecha)');
    console.log('[ARCHIVO] Modificado por:   ',f.lastModifiedBy&&f.lastModifiedBy.user?f.lastModifiedBy.user.displayName:'(sin info)');
    console.log('[ARCHIVO] Drive tipo:       ',driveType,driveType==='personal'?'→ OneDrive Personal':driveType==='documentLibrary'?'→ SharePoint Team Site':'→ tipo desconocido');
    console.log('[ARCHIVO] Path:             ',f.parentReference&&f.parentReference.path?f.parentReference.path:'(sin path)');
    console.log('[ARCHIVO] ═══════════════════════════════════════');
    // Leer primeras 10 filas de Pedidos para confirmar contenido
    getToken().then(function(tk){
      return fetch('https://graph.microsoft.com/v1.0/drives/'+DB.catalogoDriveId+
        '/items/'+DB.catalogoItemId+"/workbook/worksheets('Pedidos')/usedRange",
        {headers:{'Authorization':'Bearer '+tk.accessToken}});
    }).then(function(r){return r.json();}).then(function(d){
      console.log('[ARCHIVO] Hoja Pedidos — filas totales:',(d.values?d.values.length:0));
      if(d.values&&d.values.length>0){
        d.values.slice(0,11).forEach(function(row,i){
          console.log('[ARCHIVO] Pedidos['+i+']:',JSON.stringify(row));
        });
      }
    }).catch(function(e){console.error('[ARCHIVO] Error leyendo Pedidos:',e.message);});
    // ─────────────────────────────────────────────────────────────

    return true;
  }).catch(function(e){console.error('[INIT] descubrirExcel:',e.message);return false;});
}

// ═══════════════════════════════════════════════════════════════════
// 8. LECTURA DE CATÁLOGOS DESDE EXCEL
// ═══════════════════════════════════════════════════════════════════
var NOISE=/^[\u2191\*\-\#]/;

// Normalizar fechas desde Workbook API a formato YYYY-MM-DD
// Excel Online en Ecuador/España devuelve fechas como D/M/YYYY (ej: 6/9/2026 = 6 sep 2026)
function normalizarFecha(v){
  if(!v) return '';
  // Número serial Excel (días desde 1900-01-00)
  if(typeof v==='number'){
    var d=new Date(Math.round((v-25569)*86400*1000));
    var pn=function(n){return String(n).padStart(2,'0');};
    return d.getUTCFullYear()+'-'+pn(d.getUTCMonth()+1)+'-'+pn(d.getUTCDate());
  }
  var s=v.toString().trim();
  if(!s) return '';
  // Ya es YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0,10);
  // ISO con T: 2026-09-06T00:00:00
  if(s.indexOf('T')>-1) return s.substring(0,10);
  // Formato con /: Excel Online Ecuador/España usa D/M/YYYY
  // ej: "6/9/2026" = 6 de septiembre de 2026
  var partes=s.split('/');
  if(partes.length===3){
    var dia=partes[0].trim();
    var mes=partes[1].trim();
    var anio=partes[2].trim().length===4?partes[2].trim():'20'+partes[2].trim();
    var d2=parseInt(dia);
    var m2=parseInt(mes);
    // Si el primer valor > 12, definitivamente es día (D/M/YYYY)
    // Si el segundo valor > 12, definitivamente es día en posición 2 (M/D/YYYY inverso — raro)
    // Excel Online en configuración ES siempre usa D/M/YYYY
    if(d2>12 || (d2<=12 && m2<=12)){
      // Asumir D/M/YYYY (formato Ecuador/España)
      return anio+'-'+String(m2).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
    }
  }
  console.warn('[FECHA] Formato no reconocido:',v);
  return s;
}

function filaValida(v,maxLen){
  if(!v) return false;
  var s=v.toString().trim();
  return s.length>0&&s.length<=(maxLen||80)&&!NOISE.test(s);
}

function leerCatalogos(){
  return descubrirExcel().then(function(ok){
    if(!ok||!DB.catalogoDriveId||!DB.catalogoItemId){
      render('<div class="loading"><div class="loading-icon">⚠️</div>'+
        '<div class="loading-txt" style="color:var(--dan)">Excel no encontrado</div>'+
        '<div class="loading-sub">Verifica que "'+CFG.catalogoNombre+'" está disponible.<br>'+
        'Revisa consola (F12) para más detalle.</div>'+
        '<button class="btn btn-sec btn-big" style="margin-top:16px" onclick="location.reload()">↻ Reintentar</button></div>');
      return;
    }
    var hojas=['Operadores','Supervisores','Pedidos','Contenedores','Packing','C.Barra','Asignaciones'];
    return Promise.all(hojas.map(function(h){
      return gGet(urlWB(h)).then(function(r){return{hoja:h,data:r,err:null};})
        .catch(function(e){
          console.warn('[EXCEL] Hoja '+h+' error:',e.message);
          return{hoja:h,data:null,err:e.message};
        });
    })).then(function(res){
      res.forEach(function(r){parsear(r.hoja,r.data,r.err);});
    });
  });
}

function logHoja(nombre,rawTotal,cargados,descartados,muestra){

  console.log('[EXCEL]   Filas brutas (excl encabezado): '+rawTotal);

function parsear(hoja,data,err){
  if(err){
    console.error('[EXCEL] '+hoja+' — ERROR:',err);
    return;
  }
  if(!data||!data.values||data.values.length<2){
    console.warn('[EXCEL] '+hoja+' — sin datos (filas:',data&&data.values?data.values.length:0,')');
    return;
  }
  // Log del encabezado real que devuelve el API
  var hdrs=data.values[0];
  console.log('[EXCEL] '+hoja+' encabezado raw:',
    hdrs.map(function(v,i){return i+'="'+(v||'')+'"]';}).join(' '));

  var raw=data.values.slice(1);
  var rawTotal=raw.length;

  if(hoja==='Operadores'){
    var carg=raw.filter(function(r){return filaValida(r[0]);});
    DB.operadores=carg.map(function(r){return r[0].toString().trim();});
    logHoja('Operadores',rawTotal,DB.operadores.length,rawTotal-DB.operadores.length,
      DB.operadores.map(function(v){return{Operador:v};}));

  } else if(hoja==='Supervisores'){
    var carg=raw.filter(function(r){return filaValida(r[0]);});
    DB.supervisores=carg.map(function(r){return r[0].toString().trim();});
    logHoja('Supervisores',rawTotal,DB.supervisores.length,rawTotal-DB.supervisores.length,
      DB.supervisores.map(function(v){return{Supervisor:v};}));

  } else if(hoja==='Pedidos'){
    // Mapeo por nombre de encabezado real del API
    var hdrP=data.values[0].map(function(v){return v?v.toString().trim().toLowerCase():'';});
    console.log('[EXCEL] Pedidos encabezado real:',hdrP.map(function(v,i){return i+'='+v;}).join(' | '));
    var iP_ped =hdrP.findIndex(function(h){return h==='pedido';});
    var iP_tipo=hdrP.findIndex(function(h){return h==='tipo';});
    var iP_cont=hdrP.findIndex(function(h){return h.indexOf('contenedor')>-1;});
    var iP_stat=hdrP.findIndex(function(h){return h==='status'||h==='estado';});
    var iP_obs =hdrP.findIndex(function(h){return h.indexOf('observ')>-1;});
    console.log('[EXCEL] Pedidos índices: ped='+iP_ped+' tipo='+iP_tipo+' conts='+iP_cont+' stat='+iP_stat+' obs='+iP_obs);
    if(iP_ped<0){
      console.error('[EXCEL] Pedidos — columna Pedido no encontrada en encabezado');
      return;
    }
    var rawTotal=raw.length;
    var descartadas=0;
    var carg=raw.filter(function(r){
      var v=r[iP_ped];
      if(v===null||v===undefined||v===''){descartadas++;return false;}
      var s=v.toString().trim();
      if(s.length===0){descartadas++;return false;}
      return true;
    });
    DB.pedidos=carg.map(function(r){return{
      pedido:    r[iP_ped]?r[iP_ped].toString().trim():'',
      tipo:      iP_tipo>=0&&r[iP_tipo]?r[iP_tipo].toString().trim():'',
      contsTotal:iP_cont>=0&&r[iP_cont]?Number(r[iP_cont]):1,
      status:    iP_stat>=0&&r[iP_stat]?r[iP_stat].toString().trim():'Pendiente',
      obs:       iP_obs>=0&&r[iP_obs]?r[iP_obs].toString().trim():'',
    };});
    console.log('[EXCEL] Pedidos — filas brutas:'+rawTotal+' | cargadas:'+DB.pedidos.length+' | descartadas:'+descartadas);
    DB.pedidos.slice(0,10).forEach(function(p,i){
      console.log('[EXCEL] Pedidos['+i+']:',JSON.stringify(p));
    });

  } else if(hoja==='Contenedores'){
    // Mapeo 100% por nombre de encabezado real del API
    // El API omite columnas con todos los valores vacíos (ej: FechaProgramada vacía)
    var hdrC=data.values[0].map(function(v){return v?v.toString().trim().toLowerCase():'';});
    console.log('[EXCEL] Contenedores encabezado real:',hdrC.map(function(v,i){return i+'="'+v+'"';}).join(' | '));
    var iC_ped =hdrC.findIndex(function(h){return h==='pedido';});
    var iC_fp  =hdrC.findIndex(function(h){return h.indexOf('fechaprog')>-1||h==='fechaprogramada'||h==='fecha_programada';});
    var iC_cont=hdrC.findIndex(function(h){return h.indexOf('contenedor')>-1;});
    var iC_sell=hdrC.findIndex(function(h){return h.indexOf('sello')>-1;});
    var iC_pall=hdrC.findIndex(function(h){return h.indexOf('pallet')>-1;});
    var iC_stat=hdrC.findIndex(function(h){return h==='status'||h==='estado';});
    var iC_frec=hdrC.findIndex(function(h){return h.indexOf('fecharec')>-1||h==='fecharecepcion'||h==='fecha_recepcion';});
    var iC_obs =hdrC.findIndex(function(h){return h.indexOf('observ')>-1;});
    console.log('[EXCEL] Contenedores índices:'+
      ' ped='+iC_ped+' fp='+iC_fp+' cont='+iC_cont+' sell='+iC_sell+
      ' pall='+iC_pall+' stat='+iC_stat+' frec='+iC_frec+' obs='+iC_obs);
    window._iC_stat=iC_stat; // guardar para PATCH posterior
    if(iC_ped<0||iC_cont<0){
      console.error('[EXCEL] Contenedores — faltan columnas esenciales (Pedido o Contenedor)');
      return;
    }
    var rawTotal=raw.length;
    var descartadas=0;
    var carg=raw.filter(function(r){
      var v=r[iC_ped];
      if(v===null||v===undefined||v===''){descartadas++;return false;}
      var s=v.toString().trim();
      if(s.length===0){descartadas++;return false;}
      return true;
    });
    DB.contenedores=carg.map(function(r){
      var pv=iC_pall>=0&&r[iC_pall]!==null&&r[iC_pall]!==undefined&&r[iC_pall]!==''?Number(r[iC_pall]):0;
      return{
        pedido:    r[iC_ped]?r[iC_ped].toString().trim():'',
        fechaProg: iC_fp>=0?normalizarFecha(r[iC_fp]):'',
        contenedor:iC_cont>=0&&r[iC_cont]?r[iC_cont].toString().trim():'',
        sello:     iC_sell>=0&&r[iC_sell]?r[iC_sell].toString().trim():'',
        pallets:   isNaN(pv)?0:pv,
        status:    iC_stat>=0&&r[iC_stat]?r[iC_stat].toString().trim():'Pendiente',
        fechaRec:  iC_frec>=0?normalizarFecha(r[iC_frec]):'',
        obs:       iC_obs>=0&&r[iC_obs]?r[iC_obs].toString().trim():'',
      };
    });
    console.log('[EXCEL] Contenedores — filas brutas:'+rawTotal+' | cargadas:'+DB.contenedores.length+' | descartadas:'+descartadas);
    DB.contenedores.slice(0,10).forEach(function(c,i){
      console.log('[EXCEL] Contenedores['+i+']:',JSON.stringify(c));
    });

  
  } else if(hoja==='Packing'){
    // Hoja única de packing list — Cols: Pedido(0), SKU(1), Descripcion(2), Cantidad(3)
    var carg=raw.filter(function(r){return filaValida(r[0],50)&&r[1];});
    DB.packing=carg.map(function(r){return{
      pedido:  r[0]?r[0].toString().trim():'',
      sku:     r[1]?r[1].toString().trim():'',
      desc:    r[2]?r[2].toString().trim():'',
      cantidad:r[3]?Number(r[3]):0,
    };});
    logHoja('Packing',rawTotal,DB.packing.length,rawTotal-DB.packing.length,DB.packing);

  } else if(hoja==='C.Barra'){
    // Cols: SKU(0), Descripcion(1), Un(2), Cód.BarrasUnidad(3), Un/CJ(4), Cód.BarrasCaja(5)
    DB.codigosBarra=[];
    var carg=raw.filter(function(r){return filaValida(r[0],50);});
    carg.forEach(function(r){
      var sku =r[0]?r[0].toString().trim():'';
      var desc=r[1]?r[1].toString().trim():'';
      var cbU =r[3]?r[3].toString().trim():'';
      var uncj=r[4]?Number(r[4]):1;
      var cbC =r[5]?r[5].toString().trim():'';
      if(cbU) DB.codigosBarra.push({sku:sku,desc:desc,cb:cbU,tipo:'Unidad',factor:1});
      if(cbC) DB.codigosBarra.push({sku:sku,desc:desc,cb:cbC,tipo:'Caja',factor:uncj||1});
    });
    logHoja('C.Barra',rawTotal,DB.codigosBarra.length,rawTotal-carg.length,DB.codigosBarra);

  } else if(hoja==='Asignaciones'){
    // Cols: FechaAsignacion(0), Supervisor(1), Pedido(2), TipoAsignacion(3),
    //       Operario(4), Status(5)
    // Workbook API devuelve encabezado en values[0] — ya mapeamos por nombre arriba
    // Para Asignaciones también mapear por nombre para robustez
    var hdrA=data.values[0].map(function(v){return v?v.toString().trim().toLowerCase():'';});
    console.log('[EXCEL] Asignaciones — columnas:',hdrA.join(' | '));
    var iA_fecha=hdrA.findIndex(function(h){return h.indexOf('fecha')>-1&&h.indexOf('asig')>-1;});
    var iA_sup  =hdrA.findIndex(function(h){return h.indexOf('superv')>-1;});
    var iA_ped  =hdrA.findIndex(function(h){return h.indexOf('pedido')>-1;});
    var iA_tipo =hdrA.findIndex(function(h){return h.indexOf('tipo')>-1;});
    var iA_op   =hdrA.findIndex(function(h){return h.indexOf('operari')>-1||h.indexOf('operador')>-1;});
    var iA_stat =hdrA.findIndex(function(h){return h==='status'||h==='estado';});
    console.log('[EXCEL] Asignaciones índices: fecha='+iA_fecha+' sup='+iA_sup+
      ' ped='+iA_ped+' tipo='+iA_tipo+' op='+iA_op+' stat='+iA_stat);

    // Log de valores de Status para diagnóstico
    var statusVals=raw.filter(function(r){return r[iA_op>=0?iA_op:4];})
      .map(function(r){return'"'+(iA_stat>=0&&r[iA_stat]?r[iA_stat].toString().trim():'(vacío)')+'"';});
    console.log('[EXCEL] Asignaciones — valores de Status encontrados:',statusVals.join(', '));

    // Filtro: Operario no vacío + Status = Activo (case-insensitive, trim)
    var carg=raw.filter(function(r){
      var opVal=iA_op>=0&&r[iA_op]?r[iA_op].toString().trim():'';
      if(!opVal) return false;
      var stVal=iA_stat>=0&&r[iA_stat]?r[iA_stat].toString().trim().toLowerCase():'';
      return stVal==='activo';
    });
    DB.asignaciones=carg.map(function(r){
      return{
        fechaAsignacion:iA_fecha>=0&&r[iA_fecha]?r[iA_fecha].toString():'',
        supervisor:     iA_sup>=0&&r[iA_sup]?r[iA_sup].toString().trim():'',
        pedido:         iA_ped>=0&&r[iA_ped]?r[iA_ped].toString().trim():'',
        tipo:           iA_tipo>=0&&r[iA_tipo]?r[iA_tipo].toString().trim():'',
        operario:       iA_op>=0&&r[iA_op]?r[iA_op].toString().trim():'',
        status:         iA_stat>=0&&r[iA_stat]?r[iA_stat].toString().trim():'',
      };
    });
    logHoja('Asignaciones',rawTotal,DB.asignaciones.length,rawTotal-DB.asignaciones.length,DB.asignaciones);
    if(DB.asignaciones.length===0){
      console.error('[EXCEL] Asignaciones — 0 activas. Verifica que Status="Activo" (con A mayúscula, sin espacios).');
    }
  }
}

function escribirAsignacion(pedido,tipo,operario){
  if(!DB.listIds.asignaciones) return Promise.resolve();
  // Verificar duplicados ANTES de crear: Pedido + TipoAsignacion deben ser únicos
  return cargarAsignacionesSP().then(function(asigs){
    var existentes=asigs.filter(function(a){
      return normStr(a.Pedido)===normStr(pedido)&&
             normStr(a.TipoAsignacion)===normStr(tipo)&&
             normStr(a.Status||'')!=='ANULADA'&&
             normStr(a.Status||'')!=='CERRADA';
    });
    if(existentes.length>0){
      var ex=existentes[0];
      console.warn('[SP] Asignación duplicada detectada:',pedido,tipo,'->',ex.Operario,'Status:',ex.Status);
      // Retornar objeto especial indicando duplicado
      return {_duplicado:true, asignacion:ex};
    }
    // No existe — crear nueva
    var t=ahora();
    var fields={
      Title:          pedido+'-'+tipo,
      Pedido:         pedido,
      TipoAsignacion: tipo,
      Operario:       operario||'',
      Supervisor:     S.operario,
      FechaAsignacion:t.fecha,
      Status:         'Activo',
    };
    return gPost(urlLista(DB.listIds.asignaciones)+'/items',{fields:fields})
      .then(function(r){console.log('[SP] Asignacion creada OK:',pedido,tipo,operario);return r;})
      .catch(function(e){console.error('[SP] Asignacion error:',e.message);});
  });
}

// Actualizar status de asignación existente (PATCH por Title)
function actualizarStatusAsignacion(pedido,tipo,nuevoStatus,nuevoOperario){
  if(!DB.listIds.asignaciones) return Promise.resolve();
  return cargarAsignacionesSP().then(function(asigs){
    var ex=asigs.find(function(a){
      return normStr(a.Pedido)===normStr(pedido)&&normStr(a.TipoAsignacion)===normStr(tipo);
    });
    if(!ex||!ex.ID) return;
    var fields={Status:nuevoStatus};
    if(nuevoOperario) fields.Operario=nuevoOperario;
    return gPatch(urlLista(DB.listIds.asignaciones)+'/items/'+ex.ID,{fields:fields})
      .then(function(){console.log('[SP] Asignacion actualizada:',pedido,tipo,'->',nuevoStatus);})
      .catch(function(e){console.error('[SP] PATCH asignacion:',e.message);});
  });
}

// ── Helpers pendiente por pedido ────────────────────────────────
function saldoSKU(pedido,sku){
  // Suma registros de SP de otros contenedores (caché) + sesión actual
  // La comparación es a nivel Pedido + SKU (todos los contenedores)
  var total=0;
  // Registros ya persistidos en SP (otros contenedores del pedido)
  DB.skusPedidoCache.forEach(function(r){
    if(normStr(r.CodProducto||'')===normStr(sku))
      total+=Number(r.Cantidad)||0;
  });
  // Registros de la sesión actual (aún no en el caché)
  S.skusRegistrados.forEach(function(r){
    if(normStr(r.sku)===normStr(sku)&&normStr(r.pedido||S.pedido)===normStr(pedido))
      total+=Number(r.cantidad)||0;
  });
  return total;
}

// Cargar caché de SKUs del pedido desde SP (llamar al iniciar flujo de mercadería)
function cargarCacheSKUsPedido(pedido){
  return cargarSKUsSP(pedido, null).then(function(regs){
    // Excluir registros de la sesión actual para no doble-contar
    // Identificar por RecId de sesión
    DB.skusPedidoCache=regs.filter(function(r){
      return (r.Sesion||'')!==S.recId;
    });
    console.log('[CACHE-SKU] Pedido='+pedido+' registros SP total:'+regs.length+' en caché:'+DB.skusPedidoCache.length+' (excluidos sesión actual RecId='+S.recId+')');
    // Log desglosado por SKU para verificar
    var porSKU={};
    DB.skusPedidoCache.forEach(function(r){
      var k=r.CodProducto||'?';
      porSKU[k]=(porSKU[k]||0)+(Number(r.Cantidad)||0);
    });
    console.log('[CACHE-SKU] Totales por SKU en caché:',JSON.stringify(porSKU));
  }).catch(function(e){
    console.warn('[CACHE-SKU] Error cargando caché:',e.message);
    DB.skusPedidoCache=[];
  });
}
function esperadoSKU(sku){
  // Fuente única: hoja Packing (sin distinción de subtipo)
  var it=DB.packing.find(function(r){
    return normStr(r.pedido)===normStr(S.pedido)&&normStr(r.sku)===normStr(sku);
  });
  if(!it){
    console.log('[PACKING] SKU='+sku+' Pedido='+S.pedido+' → NO encontrado en Packing ('+DB.packing.length+' items)');
  } else {
    console.log('[PACKING] SKU='+sku+' Pedido='+S.pedido+' → Esperado='+it.cantidad);
  }
  return it?it.cantidad:null;
}

// ── Actualizar status de contenedor en Excel ──────────────────────
function actualizarStatusContenedorExcel(pedido, contenedor, nuevoStatus){
  if(!DB.catalogoDriveId||!DB.catalogoItemId) return Promise.resolve();

  // Estrategia: leer el usedRange completo de la hoja,
  // buscar la fila del contenedor Y la columna Status dentro de los mismos datos,
  // y usar el address devuelto por Graph para calcular la celda exacta.
  // Esto evita cualquier desincronización entre DB y el Excel real.

  var urlUR='https://graph.microsoft.com/v1.0/drives/'+DB.catalogoDriveId+
    '/items/'+DB.catalogoItemId+"/workbook/worksheets('Contenedores')/usedRange";

  return gGet(urlUR).then(function(d){
    if(!d.values||!d.values.length){
      console.error('[PATCH-CONT] usedRange vacío');return;
    }

    // Obtener la letra de columna inicial del rango (normalmente A)
    // d.address ejemplo: "Contenedores!A1:H10"
    var startColLetra='A';
    if(d.address){
      var mAddr=d.address.match(/!([A-Z]+)\d/);
      if(mAddr) startColLetra=mAddr[1];
    }
    // Convertir letra a número base-1
    var startColNum=startColLetra.split('').reduce(function(acc,c){
      return acc*26+(c.charCodeAt(0)-64);
    },0);

    var values=d.values;
    var hdr=values[0]; // fila 0 = encabezado

    // Log completo del encabezado para diagnóstico
    console.log('[PATCH-CONT] address="'+d.address+'" startCol='+startColLetra+'('+startColNum+') filas='+values.length+' cols='+hdr.length);
    console.log('[PATCH-CONT] Encabezado:',hdr.map(function(v,i){return i+'="'+(v||'')+'"]';}).join(' | '));

    // Encontrar columna Status en encabezado
    var colStatIdx=-1;
    hdr.forEach(function(v,i){
      if((v||'').toString().trim().toLowerCase()==='status') colStatIdx=i;
    });
    if(colStatIdx<0){
      console.error('[PATCH-CONT] Columna Status no encontrada en encabezado');
      return;
    }

    // Encontrar fila del contenedor buscando en los datos (no en DB.contenedores)
    // Columna 0 del array = Pedido, buscar también por Contenedor
    var contColIdx=-1;
    hdr.forEach(function(v,i){
      var n=(v||'').toString().trim().toLowerCase();
      if(n==='contenedor'||n==='#contenedor') contColIdx=i;
    });
    var pedColIdx=0; // Pedido siempre es col 0

    var filaDataIdx=-1; // índice base-0 dentro de values (0=encabezado, 1=primera fila datos)
    for(var ri=1;ri<values.length;ri++){
      var row=values[ri];
      var pedVal=(row[pedColIdx]||'').toString().trim();
      var contVal=contColIdx>=0?(row[contColIdx]||'').toString().trim():'';
      if(normStr(pedVal)===normStr(pedido)&&normStr(contVal)===normStr(contenedor)){
        filaDataIdx=ri;
        break;
      }
    }
    if(filaDataIdx<0){
      console.error('[PATCH-CONT] Contenedor no encontrado en usedRange. Pedido="'+pedido+'" Cont="'+contenedor+'"');
      // Mostrar primeras filas para diagnóstico
      values.slice(0,5).forEach(function(r,i){
        console.log('[PATCH-CONT] Fila '+i+':',r.slice(0,4).join(' | '));
      });
      return;
    }

    // Fila Excel real = filaDataIdx + startRow del address
    var startRowNum=1;
    if(d.address){
      var mRow=d.address.match(/!([A-Z]+)(\d+)/);
      if(mRow) startRowNum=parseInt(mRow[2]);
    }
    var rowExcelReal=startRowNum+filaDataIdx; // fila real en Excel

    // Columna Excel real = startColNum + colStatIdx
    var colExcelReal=startColNum+colStatIdx;
    var colLetraReal=colExcelReal<=26?String.fromCharCode(64+colExcelReal):'col'+colExcelReal;
    var celdaDestino=colLetraReal+rowExcelReal;

    console.log('[PATCH-CONT] Fila encontrada en usedRange: idx='+filaDataIdx+' rowExcel='+rowExcelReal);
    console.log('[PATCH-CONT] ColStatus: idx='+colStatIdx+' colExcel='+colExcelReal+'('+colLetraReal+')');
    console.log('[PATCH-CONT] >>> DESTINO: '+celdaDestino+' | VALOR: "'+nuevoStatus+'"');

    // PATCH usando range(address='F11') — dirección exacta, imposible equivocarse
    var urlPatch='https://graph.microsoft.com/v1.0/drives/'+DB.catalogoDriveId+
      '/items/'+DB.catalogoItemId+
      "/workbook/worksheets('Contenedores')/range(address='"+celdaDestino+"')";
    var body={values:[[nuevoStatus]]};

    console.log('[PATCH-CONT] URL:',urlPatch);
    console.log('[PATCH-CONT] Body:',JSON.stringify(body));

    return getToken().then(function(r){
      return fetch(urlPatch,{method:'PATCH',
        headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'},
        body:JSON.stringify(body)});
    }).then(function(res){
      return res.text().then(function(txt){
        if(res.ok){
          DB.contenedores[filaDataIdx-1]&&(DB.contenedores[filaDataIdx-1].status=nuevoStatus);
          console.log('[PATCH-CONT] RESPUESTA OK ('+res.status+'). Celda '+celdaDestino+' = "'+nuevoStatus+'"');
        } else {
          console.error('[PATCH-CONT] RESPUESTA ERROR '+res.status+':',txt.slice(0,300));
        }
      });
    });
  }).catch(function(e){
    console.error('[PATCH-CONT] Error general:',e.message);
  });
}

// ── Actualizar status del pedido en Excel ─────────────────────────
function actualizarStatusPedidoExcel(pedido, nuevoStatus){
  if(!DB.catalogoDriveId||!DB.catalogoItemId) return Promise.resolve();
  var urlUR='https://graph.microsoft.com/v1.0/drives/'+DB.catalogoDriveId+
    '/items/'+DB.catalogoItemId+"/workbook/worksheets('Pedidos')/usedRange";
  return gGet(urlUR).then(function(d){
    if(!d.values||!d.values.length) return;
    var hdr=d.values[0];
    var startColNum=1, startRowNum=1;
    if(d.address){
      var mA=d.address.match(/!([A-Z]+)(\d+)/);
      if(mA){
        startColNum=mA[1].split('').reduce(function(a,c){return a*26+(c.charCodeAt(0)-64);},0);
        startRowNum=parseInt(mA[2]);
      }
    }
    var pedColIdx=-1, statColIdx=-1;
    hdr.forEach(function(v,i){
      var n=(v||'').toString().trim().toLowerCase();
      if(n==='pedido') pedColIdx=i;
      if(n==='status'||n==='estado') statColIdx=i;
    });
    if(pedColIdx<0||statColIdx<0){
      console.error('[PATCH-PED] Columnas Pedido/Status no encontradas en hoja Pedidos');
      return;
    }
    var filaIdx=-1;
    for(var ri=1;ri<d.values.length;ri++){
      if(normStr((d.values[ri][pedColIdx]||'').toString())===normStr(pedido)){
        filaIdx=ri; break;
      }
    }
    if(filaIdx<0){console.warn('[PATCH-PED] Pedido no encontrado:',pedido);return;}
    var rowExcel=startRowNum+filaIdx;
    var colExcel=startColNum+statColIdx;
    var colLetra=colExcel<=26?String.fromCharCode(64+colExcel):'col'+colExcel;
    var celda=colLetra+rowExcel;
    console.log('[PATCH-PED] Destino: '+celda+' Valor="'+nuevoStatus+'"');
    var urlPatch='https://graph.microsoft.com/v1.0/drives/'+DB.catalogoDriveId+
      '/items/'+DB.catalogoItemId+
      "/workbook/worksheets('Pedidos')/range(address='"+celda+"')";
    return getToken().then(function(r){
      return fetch(urlPatch,{method:'PATCH',
        headers:{'Authorization':'Bearer '+r.accessToken,'Content-Type':'application/json'},
        body:JSON.stringify({values:[[nuevoStatus]]})});
    }).then(function(res){
      if(res.ok){
        var pidx=DB.pedidos.findIndex(function(p){return normStr(p.pedido)===normStr(pedido);});
        if(pidx>=0) DB.pedidos[pidx].status=nuevoStatus;
        console.log('[PATCH-PED] OK — '+celda+' = "'+nuevoStatus+'"');
      } else {
        res.text().then(function(t){console.error('[PATCH-PED] Error:',t.slice(0,150));});
      }
    });
  }).catch(function(e){console.error('[PATCH-PED] Error:',e.message);});
}

function showCalendario(){
  S.step='calendario';
  var hoy=ahora().raw;
  var anio=hoy.getFullYear();
  var mes=hoy.getMonth();
  var fechaHoy=ahora().fecha;
  if(!S.calFecha) S.calFecha=fechaHoy;

  // Generar grid del mes
  var primerDia=new Date(anio,mes,1).getDay();
  var diasMes=new Date(anio,mes+1,0).getDate();
  var meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // Log para diagnóstico de fechas
  console.log('[CAL] Mes buscado:',anio+'-'+pad(mes+1));
  console.log('[CAL] Contenedores total:',DB.contenedores.length);
  console.log('[CAL] Muestra fechasProg:',DB.contenedores.slice(0,5).map(function(c){return c.pedido+':'+c.fechaProg;}).join(' | '));

  // Contenedores del mes con fecha programada
  var contsMes=DB.contenedores.filter(function(c){
    if(!c.fechaProg) return false;
    var fp=c.fechaProg.substring(0,7); // YYYY-MM
    return fp===anio+'-'+pad(mes+1);
  });
  console.log('[CAL] Contenedores del mes:',contsMes.length);
  var diasConData={};
  contsMes.forEach(function(c){
    var d=c.fechaProg.substring(8,10);
    if(!diasConData[d]) diasConData[d]=0;
    diasConData[d]++;
  });

  var html='<div class="badge badge-sup">📅 CALENDARIO DE RECEPCIÓN</div>'+
    '<div style="font-size:14px;font-weight:700;color:var(--txt);margin-bottom:8px;text-align:center">'+
      meses[mes]+' '+anio+'</div>'+
    '<div class="cal-hdr"><div class="cal-hdr-d">Do</div><div class="cal-hdr-d">Lu</div>'+
    '<div class="cal-hdr-d">Ma</div><div class="cal-hdr-d">Mi</div>'+
    '<div class="cal-hdr-d">Ju</div><div class="cal-hdr-d">Vi</div><div class="cal-hdr-d">Sa</div></div>'+
    '<div class="cal-grid">';

  // Celdas vacías antes del primer día
  for(var i=0;i<primerDia;i++) html+='<div class="cal-day vacio"></div>';

  for(var d=1;d<=diasMes;d++){
    var dStr=pad(d);
    var fechaD=anio+'-'+pad(mes+1)+'-'+dStr;
    var cls='cal-day';
    if(fechaD===fechaHoy) cls+=' hoy';
    if(fechaD===S.calFecha) cls+=' sel';
    if(diasConData[dStr]) cls+=' has-data';
    html+='<div class="'+cls+'" onclick="selCalDia(\''+fechaD+'\')">'+d+
      (diasConData[dStr]?'<div style="font-size:8px;color:var(--rec)">'+diasConData[dStr]+'</div>':'')+'</div>';
  }
  html+='</div>';

  // Contenedores del día seleccionado
  var diaConts=DB.contenedores.filter(function(c){return c.fechaProg===S.calFecha;});
  html+='<div class="lbl" style="margin-top:12px">'+fechaDisplay(S.calFecha)+
    ' · '+diaConts.length+' contenedor'+(diaConts.length!==1?'es':'')+'</div>';

  if(!diaConts.length){
    html+='<div class="alert-w" style="margin-top:6px">Sin contenedores programados para este día.</div>';
  } else {
    diaConts.forEach(function(c){
      var statusCls=c.status==='Recibido'?'status-ok':c.status==='En proceso'?'status-act':'status-pend';
      html+='<div class="card-item">'+
        '<div class="card-item-title">'+c.pedido+' · '+c.contenedor+'</div>'+
        '<div class="card-item-sub">'+c.pallets+' pallets'+'</div>'+
        '<div class="card-item-badge '+statusCls+'">'+c.status+'</div>'+
      '</div>';
    });
  }

  html+='<button class="btn btn-sec btn-big" style="margin-top:10px" onclick="'+(S.rol==='supervisor'?'showMenuSup':'showMenuOp')+'()">← Volver</button>';
  render(html);
}

function selCalDia(fecha){
  S.calFecha=fecha;
  showCalendario();
}

function confAsignar(){
  _asigPedido=document.getElementById('asig-ped').value;
  _asigOp=document.getElementById('asig-op').value;
  if(!_asigPedido){toast('Selecciona el pedido');return;}
  if(!_asigTipo){toast('Selecciona el tipo');return;}

        '</div>'

      showMenuSup();

function reasignarExistente(){
  var ex=window._asigExistente;
  if(!ex){toast('Error: no encontrado');return;}
  var spId=ex._spId;
  if(!spId){toast('Error: id SP faltante');return;}
  var t=ahora();
  gPatch(urlLista(DB.listIds.asignaciones)+'/items/'+spId,{
    fields:{Operario:_asigOp,Supervisor:S.operario,FechaAsignacion:t.fecha,Status:'Activo'}
  }).then(function(){
    toast('Reasignado: '+_asigOp+' -> '+_asigPedido);
    showMenuSup();
  }).catch(function(e){toast('Error reasignando: '+e.message.slice(0,50));showMenuSup();});
}

function selContRow(cont,sello,pallets){
  S.contenedor=cont;S.sello=sello||'';S.pallets=pallets||0;
  S.skusRegistrados=[];
  S.lpnActual='';
  DB.skusPedidoCache=[];
  S.eventos={llegada:null,apertura:null,cierre:null,salida:null};

  // Obtener status del contenedor desde Excel (fuente única de verdad)
  var contExcel=DB.contenedores.find(function(c){
    return normStr(c.pedido)===normStr(S.pedido)&&normStr(c.contenedor)===normStr(cont);
  });
  var statusExcel=contExcel?normStr(contExcel.status||''):'PENDIENTE';
  console.log('[SEL-CONT] Cont="'+cont+'" Excel_Status="'+(contExcel?contExcel.status:'(no encontrado en DB)')+'" normStatus="'+statusExcel+'"');

  // Si Excel dice Recibido → mostrar resumen (contenedor ya procesado)
  // Si Excel dice Pendiente (o cualquier otro) → flujo normal de recepción
  if(statusExcel==='RECIBIDO'){
    console.log('[SEL-CONT] Excel=RECIBIDO → cargar SKUs y mostrar resumen');
    S.recId=generarRecId();
    cargarSKUsSP(S.pedido,cont).then(function(skus){
      S.skusRegistrados=skus.map(function(f){return{
        sku:f.CodProducto||'',desc:f.Nombre||'',
        cantidad:Number(f.Cantidad)||0,estado:f.Estado||'OK',novedad:f.Novedades||'',
      };});
      // Reconstruir horas desde eventos SP solo para mostrar en resumen
      cargarEventosSP(S.pedido).then(function(evts){
        evts.filter(function(e){return e.Contenedor===cont;}).forEach(function(e){
          var t=e.TipoEvento?e.TipoEvento.toLowerCase():'';
          if(t==='llegada')  S.eventos.llegada=e.Hora;
          if(t==='apertura') S.eventos.apertura=e.Hora;
          if(t==='cierre')   S.eventos.cierre=e.Hora;
          if(t==='salida')   S.eventos.salida=e.Hora;
          if(e.RecepcionId)  S.recId=e.RecepcionId;
        });
        showResumenContenedor('','');
      }).catch(function(){showResumenContenedor('','');});
    });
  } else {
    // Excel dice Pendiente → flujo normal
    console.log('[SEL-CONT] Excel='+statusExcel+' → flujo normal de recepcion');
    S.recId=generarRecId();
    // Cargar eventos SP para retomar donde quedó (apertura, escaneo)
    render('<div class="loading"><div class="loading-icon">...</div>'+
      '<div class="loading-txt">Cargando...</div></div>');
    cargarEventosSP(S.pedido).then(function(evts){
      evts.filter(function(e){return e.Contenedor===cont;}).forEach(function(e){
        var t=e.TipoEvento?e.TipoEvento.toLowerCase():'';
        if(t==='llegada')  {S.eventos.llegada=e.Hora;if(e.RecepcionId)S.recId=e.RecepcionId;}
        if(t==='apertura') S.eventos.apertura=e.Hora;
        if(t==='cierre')   S.eventos.cierre=e.Hora;
        // IGNORAR evento SALIDA si Excel dice Pendiente
      });
      cargarSKUsSP(S.pedido,cont).then(function(skus){
        S.skusRegistrados=skus.map(function(f){return{
          sku:f.CodProducto||'',desc:f.Nombre||'',
          cantidad:Number(f.Cantidad)||0,estado:f.Estado||'OK',novedad:f.Novedades||'',
        };});
        // Navegar: siempre mostrar opciones (Horas o Mercadería)
        showOpcionesContenedor();
      });
    }).catch(function(){showEventoLlegada();});
  }
}

function showEscaneo(){
  S.step='escaneo';
  var nSkus=S.skusRegistrados.length;
  // Agrupar skus por LPN para mostrar resumen
  var porLPN={};
  S.skusRegistrados.forEach(function(r){
    var k=r.lpn||'(sin LPN)';
    if(!porLPN[k]) porLPN[k]=0;
    porLPN[k]++;
  });
  var html=stepsBar(4,5)+
    '<div class="badge badge-rec">'+S.contenedor+(S.lpnActual?' · LPN: '+S.lpnActual:'')+'</div>'+
    '<div class="lbl">escanea o ingresa código</div>'+
    '<input class="inp" id="inp-scan" type="text" placeholder="Código de barras o SKU" autocomplete="off" autocorrect="off" spellcheck="false">'+
    '<div class="btn-row" style="margin-top:8px">'+
      '<button class="btn btn-rec btn-big" onclick="confScan()">BUSCAR</button>'+
    '</div>';
  if(nSkus>0){
    html+='<div class="lbl" style="margin-top:12px">registrados — '+nSkus+' SKUs</div>'+
      '<div style="max-height:160px;overflow-y:auto">';
    S.skusRegistrados.slice(-5).reverse().forEach(function(r){
      html+='<div style="background:var(--sur2);border-radius:6px;padding:6px 10px;margin-bottom:4px;font-size:11px;display:flex;justify-content:space-between;align-items:center">'+
        '<span><span style="color:var(--mut);margin-right:6px">'+(r.lpn||'')+'</span><span style="color:var(--acc)">'+r.sku+'</span></span>'+
        '<span style="color:'+(r.estado==='DAÑADO'?'var(--dan)':'var(--ok)')+'">'+r.cantidad+' un</span>'+
      '</div>';
    });
    html+='</div>';
    // Resumen por LPN
    var lpnKeys=Object.keys(porLPN);
    if(lpnKeys.length>0){
      html+='<div style="font-size:10px;color:var(--mut);margin-top:4px">'+
        lpnKeys.map(function(k){return k+': '+porLPN[k]+' SKUs';}).join(' · ')+'</div>';
    }
  }
  html+='<div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">'+
    '<button class="btn btn-sec" style="font-size:12px" onclick="showIngresarLPN()">🔄 Nuevo LPN</button>'+
    '<button class="btn btn-sec" style="font-size:12px" onclick="showCorreccion()">✏ Corregir registro anterior</button>'+
    '<button class="btn btn-ok btn-big" onclick="finalizarRecepcionMercaderia()">✓ FINALIZAR RECEPCIÓN</button>'+
    '<button class="btn btn-sec" style="font-size:12px" onclick="guardarYSalir()">💾 Guardar y salir</button>'+
  '</div>';
  render(html);
  setTimeout(function(){var el=document.getElementById('inp-scan');if(el)el.focus();},100);
}

function confScan(){
  var v=document.getElementById('inp-scan').value.trim();
  if(!v){toast('Ingresa un código');return;}
  var hits=buscarCodigo(v);
  if(hits.length===0){
    // No encontrado — continuar con ingreso manual
    S.skuActual={sku:v,desc:'No encontrado en catálogo',factor:1,tipo:'Unidad',noEncontrado:true};
    showIngresoCantidad();
  } else if(hits.length===1){
    S.skuActual=hits[0];
    showIngresoCantidad();
  } else {
    showSeleccionSKU(hits);
  }
}

function showSeleccionSKU(hits){
  S.step='sel-sku';
  var html=stepsBar(4,6)+
    '<div class="badge badge-rec">'+S.contenedor+'</div>'+
    '<div class="lbl">múltiples coincidencias — selecciona el SKU</div>';
  hits.forEach(function(h,i){
    html+='<div class="sku-item" onclick="selSKU('+i+')">'+
      '<div class="sku-cod">'+h.sku+' · '+h.tipo+'</div>'+
      '<div class="sku-desc">'+h.desc+'</div>'+
    '</div>';
  });
  html+='<button class="btn btn-sec btn-big" style="margin-top:8px" onclick="showEscaneo()">← Volver</button>';
  render(html);
  // guardar hits para selección
  window._hitsTemp=hits;
}
function selSKU(i){

}

  h+='<div class="card-t" id="est-dan" onclick="selEstado(' + "'DA\u00d1ADO'" + ')">DANADO</div>';

function calcCantidad(){
  var a=parseFloat(document.getElementById('calc-uxc').value)||0;
  var b=parseFloat(document.getElementById('calc-cxp').value)||0;
  var c=parseFloat(document.getElementById('calc-np').value)||0;
  var el=document.getElementById('calc-res');
  if(el) el.textContent=Math.round(a*b*c)||0;
}
function aplicarCalculo(){
  var a=parseFloat(document.getElementById('calc-uxc').value)||0;
  var b=parseFloat(document.getElementById('calc-cxp').value)||0;
  var c=parseFloat(document.getElementById('calc-np').value)||0;
  var res=Math.round(a*b*c);
  if(res>0){document.getElementById('inp-cant').value=res;toast(''+res+' unidades aplicadas');}
  else toast('Ingresa valores en la calculadora');
}

function selEstado(e){
  window._estadoActual=e;
  document.getElementById('est-ok').className='card-t'+(e==='OK'?' sel':'');
  document.getElementById('est-dan').className='card-t'+(e==='DAÑADO'?' sel':'');
  var nw=document.getElementById('novedad-wrap');
  if(nw) nw.style.display=e==='DAÑADO'?'block':'none';
}
function confCantidad(){
  var cant=parseInt(document.getElementById('inp-cant').value);
  if(isNaN(cant)||cant<0){toast('Ingresa una cantidad válida');return;}
  var sk=S.skuActual;

  // Verificar que el packing esté cargado (diagnóstico por si htmlPendiente no muestra nada)
  if(DB.packing.length===0) console.warn('[PACKING] DB.packing vacío — la hoja Packing no cargó o no tiene datos para este pedido');

  var esp=esperadoSKU(sk.sku);  // loguea [PACKING] Esperado=...
  var _spS=0,_seS=0;
  DB.skusPedidoCache.forEach(function(r){if(normStr(r.CodProducto||'')===normStr(sk.sku))_spS+=Number(r.Cantidad)||0;});
  S.skusRegistrados.forEach(function(r){if(normStr(r.sku)===normStr(sk.sku))_seS+=Number(r.cantidad)||0;});
  var _reg_actual=_spS+_seS;
  var _total=_reg_actual+cant;
  var _estado=esp===null?'SIN_PACKING':(_total>esp?'SOBRANTE':_total===esp?'COMPLETO':'PENDIENTE');
  console.log('[PACKING] --- confCantidad ---');
  console.log('[PACKING] Pedido='+S.pedido+' SKU='+sk.sku);
  console.log('[PACKING] Esperado='+(esp!==null?esp:'null'));
  console.log('[PACKING] SP='+_spS+' Sesion='+_seS+' Nueva='+cant+' Total='+_total);
  console.log('[PACKING] Estado='+_estado);
  console.log('[PACKING] DB.packing.length='+DB.packing.length+' DB.skusPedidoCache.length='+DB.skusPedidoCache.length);

  // Log detallado de componentes del saldo para diagnóstico
  var _spSum=0;
  DB.skusPedidoCache.forEach(function(r){
    if(normStr(r.CodProducto||'')===normStr(sk.sku)) _spSum+=Number(r.Cantidad)||0;
  });
  var _sesSum=0;
  S.skusRegistrados.forEach(function(r){
    if(normStr(r.sku)===normStr(sk.sku)) _sesSum+=Number(r.cantidad)||0;
  });
  var reg_actual=_spSum+_sesSum; // = saldoSKU(S.pedido, sk.sku)
  var total=reg_actual+cant;

  console.log('[EXCESO] Pedido='+S.pedido+' SKU='+sk.sku+
    ' Esperado='+(esp!==null?esp:'null(no en packing)')+
    ' SPCache='+_spSum+' ('+DB.skusPedidoCache.length+' regs)'+
    ' Sesion='+_sesSum+' ('+S.skusRegistrados.length+' regs)'+
    ' CantNueva='+cant+
    ' Total='+(reg_actual+cant)+
    ' Excede='+(esp!==null&&total>esp?'SI':'NO'));

  // Si el caché está vacío y hay registros anteriores, puede ser que no se cargó
  if(DB.skusPedidoCache.length===0&&_sesSum===0){
    console.warn('[EXCESO] ATENCION: caché SP vacío — ¿se llamó cargarCacheSKUsPedido?');
  }

  // Verificar sobrante ANTES de guardar — sin mostrar cantidades
  if(esp!==null&&total>esp){
    // Alerta roja — cantidad supera el esperado, no mostrar números
    window._cantPendiente=cant;
    render(
      '<div style="background:rgba(248,81,73,.15);border:2px solid var(--dan);border-radius:10px;padding:20px;margin:10px 0;text-align:center">'+
        '<div style="font-size:28px;margin-bottom:10px">⚠</div>'+
        '<div style="font-size:16px;font-weight:700;color:var(--dan);margin-bottom:8px">CANTIDAD MAYOR A LA ESPERADA</div>'+
        '<div style="font-size:12px;color:var(--txt);margin-bottom:16px">'+
          'La cantidad ingresada supera la cantidad indicada en el packing list para este SKU.'+
        '</div>'+
        '<div style="font-size:12px;color:var(--mut);margin-bottom:16px">'+
          '<strong>SKU:</strong> '+sk.sku+'<br><strong>Cantidad ingresada:</strong> '+cant+' unidades'+
        '</div>'+
      '</div>'+
      '<div class="btn-row">'+
        '<button class="btn btn-sec btn-big" onclick="showIngresoCantidad()">✗ Cancelar</button>'+
        '<button class="btn btn-warn btn-big" onclick="confirmarSobrante()">✓ Continuar</button>'+
      '</div>'
    );
    return;
  }
  _guardarSKU(cant);
}
function confirmarSobrante(){
  _guardarSKU(window._cantPendiente||0);
}
function _guardarSKU(cant){
  var novEl=document.getElementById('inp-novedad');
  var nov=novEl?novEl.value.trim():'';
  var sk=S.skuActual;
  var reg={
    sku:sk.sku,desc:sk.desc,factor:sk.factor||1,
    numCajas:1,cantidad:cant,
    estado:window._estadoActual||'OK',
    novedad:nov,
    pedido:S.pedido,
    lpn:S.lpnActual||'',
  };
  S.skusRegistrados.push(reg);
  escribirSKU(reg).catch(function(e){console.warn('[SP] SKU async:',e.message);});
  toast(sk.sku+' — '+cant+' un');
  showEscaneo();
}


function showCorreccion(){
  S.step='correccion';
  render('<div class="loading"><div class="loading-icon">...</div><div class="loading-txt">Cargando registros...</div></div>');
  cargarSKUsSP(S.pedido,null).then(function(spRegs){
    window._regsCorreccion=spRegs;
    renderCorreccion(spRegs,'','');
  }).catch(function(){
    window._regsCorreccion=S.skusRegistrados;
    renderCorreccion(S.skusRegistrados,'','');
  });
}
function renderCorreccion(regs,filtSKU,filtCont){
  var filtrados=regs.filter(function(r){
    if((r.Estado||r.estado||'')==='CORRECCION') return false;
    var sku=(r.CodProducto||r.sku||'').toUpperCase();
    var cont=(r.Contenedor||r.contenedor||'').toUpperCase();
    if(filtSKU&&sku.indexOf(filtSKU.toUpperCase())<0) return false;
    if(filtCont&&cont.indexOf(filtCont.toUpperCase())<0) return false;
    return true;
  });
  window._filtrados=filtrados;
  var h='<div class="badge badge-rec">CORREGIR REGISTRO</div>';
  h+='<div style="font-size:11px;color:var(--mut);margin-bottom:8px">Pedido: <strong>'+S.pedido+'</strong>';
  h+=' '+filtrados.length+' registros</div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">';
  h+='<input class="inp inp-sm" id="filt-sku" placeholder="Filtrar SKU" value="'+filtSKU+'" ';
  h+='oninput="renderCorreccion(window._regsCorreccion,this.value,document.getElementById(\'filt-cont\').value)">';
  h+='<input class="inp inp-sm" id="filt-cont" placeholder="Filtrar contenedor" value="'+filtCont+'" ';
  h+='oninput="renderCorreccion(window._regsCorreccion,document.getElementById(\'filt-sku\').value,this.value)">'+
  '</div><div style="max-height:50vh;overflow-y:auto">';
  if(!filtrados.length){
    h+='<div class="alert-w">Sin registros.</div>';
  } else {
    filtrados.slice().reverse().slice(0,50).forEach(function(r,i){
      var sku=r.CodProducto||r.sku||'';
      var desc=r.Nombre||r.desc||'';
      var cant=Number(r.Cantidad!==undefined?r.Cantidad:r.cantidad)||0;
      var cont=r.Contenedor||r.contenedor||'';
      var op=r.Operario||r.operario||'';
      h+='<div class="card-item" style="margin-bottom:6px" onclick="iniciarCorreccion('+i+',\'' +sku+ '\','+cant+')">';
      h+='<div style="display:flex;justify-content:space-between">';
      h+='<div style="flex:1"><div style="font-size:12px;font-weight:700;color:var(--acc)">'+sku+'</div>';
      h+='<div style="font-size:11px;color:var(--txt)">'+desc+'</div>';
      h+='<div style="font-size:10px;color:var(--mut)">'+cont+(op?' · '+op:'')+'</div></div>';
      h+='<div style="text-align:right;margin-left:10px">';
      h+='<div style="font-size:16px;font-weight:700">'+cant+'</div>';
      h+='<div style="font-size:10px;color:var(--mut)">un</div></div></div></div>';
    });
  }
  h+='</div><button class="btn btn-sec btn-big" style="margin-top:8px" onclick="showEscaneo()">Volver</button>';
  render(h);
}
function iniciarCorreccion(idx,sku,cantOrig){
  window._corrSKU=sku; window._corrOriginal=cantOrig; window._corrIdx=idx;
  var reg=window._filtrados[idx]||{};
  var desc=reg.Nombre||reg.desc||sku;
  var h='<div class="badge badge-rec">CORREGIR</div>';
  h+='<div style="background:var(--sur2);border-radius:8px;padding:12px;margin-bottom:10px">';
  h+='<div style="font-size:12px;font-weight:700;color:var(--acc)">'+sku+'</div>';
  h+='<div style="font-size:12px;color:var(--txt)">'+desc+'</div>';
  h+='<div style="font-size:11px;color:var(--mut);margin-top:4px">Original: <strong>'+cantOrig+'</strong></div></div>';
  h+='<div class="lbl">cantidad correcta</div>';
  h+='<input class="inp" id="inp-corr-real" type="number" placeholder="Ej: 90" ';
  h+='style="font-size:24px;font-weight:700;text-align:center" autocomplete="off">';
  h+='<div id="corr-preview" style="font-size:12px;color:var(--mut);margin-top:6px;text-align:center">Se registra la diferencia</div>';
  h+='<div class="lbl" style="margin-top:8px">observacion (requerida)</div>';
  h+='<textarea class="inp inp-sm" id="inp-corr-obs" rows="2" style="resize:none" placeholder="Motivo..."></textarea>';
  h+='<div class="btn-row" style="margin-top:10px">';
  h+='<button class="btn btn-sec" onclick="showCorreccion()">ATR</button>';
  h+='<button class="btn btn-warn btn-big" onclick="confCorreccion()">APLICAR CORRECCION</button></div>';
  render(h);
  setTimeout(function(){
    var el=document.getElementById('inp-corr-real');
    if(el){el.focus();el.addEventListener('input',function(){
      var real=parseFloat(el.value);
      var prev=document.getElementById('corr-preview');
      if(!isNaN(real)&&prev){
        var d=real-window._corrOriginal;
        prev.textContent='Ajuste: '+(d>=0?'+':'')+d+' ('+window._corrOriginal+' a '+real+')';
        prev.style.color=d<0?'var(--ok)':d>0?'var(--dan)':'var(--mut)';
      }
    });}
  },100);
}
function confCorreccion(){
  var real=parseFloat(document.getElementById('inp-corr-real').value);
  if(isNaN(real)){toast('Ingresa la cantidad correcta');return;}
  var obs=document.getElementById('inp-corr-obs').value.trim();
  if(!obs){toast('Ingresa una observacion');return;}
  var diff=real-window._corrOriginal;
  if(diff===0){toast('Sin cambios');return;}
  var reg=window._filtrados[window._corrIdx]||{};
  var regCorr={
    sku:window._corrSKU,
    desc:reg.Nombre||reg.desc||window._corrSKU,
    factor:1,numCajas:1,
    cantidad:diff,
    estado:'CORRECCION',
    novedad:'Correccion de '+window._corrOriginal+' a '+real+' - '+obs,
    pedido:S.pedido,
  };
  S.skusRegistrados.push(regCorr);

    toast('Correccion aplicada: '+(diff>=0?'+':'')+diff+' unidades');

// ── Escribir/actualizar horas del contenedor en LHoras ────────────
// Buscar ítem en LHoras sin $filter en Title (Title no es filtrable en Graph SP)
// Trae todos y filtra en JS por Pedido + Contenedor
function buscarItemHorasSP(pedido, contenedor){
  if(!DB.listIds.horas){console.warn('[LHORAS] Lista horas no disponible');return Promise.resolve(null);}
  return gGet(urlLista(DB.listIds.horas)+'/items?$expand=fields&$top=500')
    .then(function(d){
      var items=d.value||[];
      console.log('[LHORAS] Items en lista:',items.length,'Buscando Pedido="'+pedido+'" Cont="'+contenedor+'"');
      var found=items.find(function(i){
        var f=i.fields||{};
        return normStr(f.Pedido||'')===normStr(pedido)&&
               normStr(f.Contenedor||'')===normStr(contenedor);
      });
      if(found){
        console.log('[LHORAS] Encontrado: id='+found.id+' Llegada="'+(found.fields.HoraLlegada||'')+'"');
        var f=found.fields;
        f._spId=found.id;
        return f;
      }
      console.log('[LHORAS] No existe aún para este contenedor');
      return null;
    })
    .catch(function(e){console.error('[LHORAS] buscar error:',e.message);return null;});
}

function escribirHoras(datos){
  if(!DB.listIds.horas){console.warn('[LHORAS] Lista horas no disponible');return Promise.resolve();}
  var t=ahora();
  var titulo=S.pedido+'-'+S.contenedor;
  var fields={
    Title:        titulo,
    Pedido:       S.pedido,
    Contenedor:   S.contenedor,
    Operario:     S.operario,
    HoraLlegada:  datos.llegada||'',
    HoraApertura: datos.apertura||'',
    HoraCierre:   datos.cierre||'',
    HoraSalida:   datos.salida||'',
    FechaRegistro:t.fecha,
    Personas:     Number(datos.personas)||0,
    Novedades:    datos.novedades||'',
    Estado:          datos.estado||'En Proceso',
    Sello1:          datos.sello1||'',
    Sello2:          datos.sello2||'',
    PalletsRecibidos:Number(datos.palletsRecibidos)||0,
    Capacidad:       datos.capacidad||'',
    Timestamp:       t.ts,
  };
  return buscarItemHorasSP(S.pedido, S.contenedor).then(function(existing){
    if(existing&&existing._spId){
      console.log('[LHORAS] PATCH existente id='+existing._spId+' titulo='+titulo);
      return gPatch(urlLista(DB.listIds.horas)+'/items/'+existing._spId,{fields:fields})
        .then(function(r){
          console.log('[LHORAS] PATCH OK id='+existing._spId+' Pedido='+S.pedido+' Cont='+S.contenedor);
          return r;
        });
    } else {
      console.log('[LHORAS] POST nuevo titulo='+titulo);
      return gPost(urlLista(DB.listIds.horas)+'/items',{fields:fields})
        .then(function(r){
          console.log('[LHORAS] POST OK id='+(r&&r.id)+' Pedido='+S.pedido+' Cont='+S.contenedor);
          return r;
        });
    }
  }).catch(function(e){console.error('[LHORAS] escribirHoras error:',e.message);});
}

function cargarHorasContenedor(pedido, contenedor){
  return buscarItemHorasSP(pedido, contenedor);
}

// ═══════════════════════════════════════════════════════════════════
function showFlujoPerchado(){
  S.step='perchado';
  S.recId=generarRecId();
  render('<div class="loading"><div class="loading-icon">...</div><div class="loading-txt">Cargando resumen de recepcion...</div></div>');
  cargarSKUsSP(S.pedido,null).then(function(spRegs){
    var consol={};
    spRegs.forEach(function(r){
      var sku=r.CodProducto||'';
      if(!sku) return;
      if(!consol[sku]) consol[sku]={desc:r.Nombre||sku,total:0};
      consol[sku].total+=Number(r.Cantidad)||0;
    });
    var packing=getPacingList(S.pedido);
    packing.forEach(function(p){
      if(!consol[p.sku]) consol[p.sku]={desc:p.desc,total:0};
    });
    var rows=Object.keys(consol).map(function(sku){
      var c=consol[sku];
      var pack=packing.find(function(p){return normStr(p.sku)===normStr(sku);});
      var esp=pack?pack.cantidad:null;
      var pend=esp!==null?esp-c.total:null;
      var col=pend===null?'var(--txt)':pend>0?'var(--warn)':pend===0?'var(--ok)':'var(--dan)';
      var lbl=pend===null?'':pend>0?' Pend:'+pend:pend===0?' OK':' Sobr:'+Math.abs(pend);
      return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bor)">'+
        '<div><div style="font-size:12px;font-weight:700;color:var(--acc)">'+sku+'</div>'+
        '<div style="font-size:11px;color:var(--mut)">'+c.desc+'</div></div>'+
        '<div style="text-align:right">'+
          '<div style="font-size:14px;font-weight:700">'+c.total+' un</div>'+
          '<div style="font-size:10px;color:'+col+'">'+( esp!==null?'Esp:'+esp:'')+lbl+'</div>'+
        '</div></div>';
    }).join('');
    var men=S.rol==='supervisor'?'showMenuSup':'showMenuOp';
    render('<div class="badge badge-rec">PERCHADO - '+S.pedido+'</div>'+
      '<div style="background:var(--sur2);border-radius:8px;padding:12px;margin-bottom:10px">'+
        '<div style="font-size:11px;color:var(--mut);margin-bottom:6px">RESUMEN RECIBIDO - '+S.subtipo+'</div>'+
        (rows?'<div style="max-height:35vh;overflow-y:auto">'+rows+'</div>':'<div class="alert-w">Sin registros de recepcion.</div>')+
      '</div>'+
      '<div class="lbl">hora de inicio de perchado</div>'+
      '<input class="inp inp-sm" id="ev-hora" type="time" value="'+horaActual()+'">'+
      '<button class="btn btn-rec btn-big" style="margin-top:10px" onclick="confPerchadoInicio()">INICIAR PERCHADO</button>'+
      '<button class="btn btn-sec btn-big" style="margin-top:6px" onclick="'+men+'()">Volver</button>');
  }).catch(function(){
    var men=S.rol==='supervisor'?'showMenuSup':'showMenuOp';
    render('<div class="badge badge-rec">PERCHADO - '+S.pedido+'</div>'+
      '<div class="alert-w" style="margin-bottom:10px">Sin conexion. Continuando sin resumen.</div>'+
      '<div class="lbl">hora de inicio</div>'+
      '<input class="inp inp-sm" id="ev-hora" type="time" value="'+horaActual()+'">'+
      '<button class="btn btn-rec btn-big" style="margin-top:10px" onclick="confPerchadoInicio()">INICIAR</button>'+
      '<button class="btn btn-sec btn-big" style="margin-top:6px" onclick="'+men+'()">Volver</button>');
  });
}

function confPerchadoInicio(){
  var hora=document.getElementById('ev-hora').value;
  if(!hora){toast('Ingresa la hora');return;}
  S.eventos.llegada=hora;
  escribirEvento('PERCHADO_INICIO',hora);
  showPerchadoActivo();
}
function showPerchadoActivo(){
  S.step='perchado-activo';
  render(
    '<div class="badge badge-rec">🗄️ PERCHADO EN CURSO</div>'+
    '<div class="val rec">▶ ACTIVO</div>'+
    '<div style="font-size:13px;color:var(--mut);text-align:center;margin-bottom:16px">'+S.pedido+' · inicio: '+S.eventos.llegada+'</div>'+
    '<div class="lbl">hora de fin de perchado</div>'+
    '<input class="inp inp-sm" id="ev-hora-fin" type="time" value="'+horaActual()+'">'+
    '<button class="btn btn-ok btn-big" style="margin-top:10px" onclick="confPerchadoFin()">✓ FINALIZAR PERCHADO</button>'
  );
}
function confPerchadoFin(){
  var hora=document.getElementById('ev-hora-fin').value;
  if(!hora){toast('Ingresa la hora de fin');return;}
  escribirEvento('PERCHADO_FIN',hora);
  toast('✓ Perchado completado: '+S.pedido);
  if(S.rol==='supervisor') showMenuSup();
  else showMenuOp();
}

// 23. RESET
// ═══════════════════════════════════════════════════════════════════
function goHome(){
  if(S.skusRegistrados&&S.skusRegistrados.length>0){
    if(!confirm('¿Salir? Hay '+S.skusRegistrados.length+' SKUs en sesión activa.')) return;
  }
  S.rol='';S.operario='';S.pedido='';S.contenedor='';S.sello='';
  S.pallets=0;S.subtipo='';S.recId='';S.step='home';
  S.eventos={llegada:null,apertura:null,cierre:null,salida:null};
  S.skusRegistrados=[];S.skuActual=null;
  updateFtr();showHome();
}

// 24. MSAL — LOGIN / INIT
// ═══════════════════════════════════════════════════════════════════
function msalLogin(){msalInst.loginRedirect({scopes:SCOPES});}

function postLogin(){
  console.log('[INIT] RF Recepción — cuenta:',msalAcc?msalAcc.username:'?');
  // Mostrar home inmediatamente — carga en background
  showHome();
  // Carga paralela en background
  Promise.all([
    descubrirListas(),
    leerCatalogos(),
  ]).then(function(res){
    var listasOk=res[0];
    setConn(listasOk?'ok':'err');
    document.getElementById('hdr-sub').textContent=
      'Inverneg · CND'+(listasOk?'':' · sin SP');
    console.log('[INIT] Listo — ops:'+DB.operadores.length+' sups:'+DB.supervisores.length+
      ' pedidos:'+DB.pedidos.length+' conts:'+DB.contenedores.length);
    // Refrescar home si el usuario sigue ahí para mostrar operadores/supervisores reales
    if(S.step==='home') showHome();
  }).catch(function(e){
    console.error('[INIT] postLogin error:',e.message);
    setConn('err');
  });
}

function showPantallaLogin(){
  render(
    '<div class="loading">'+
      '<div class="loading-icon">📦</div>'+
      '<div style="font-size:16px;font-weight:700;color:var(--rec);margin-bottom:8px">RF Recepción</div>'+
      '<div style="font-size:12px;color:var(--mut);margin-bottom:24px">Inverneg · Centro de Distribución Nacional</div>'+
      '<button class="btn btn-rec btn-big" onclick="msalLogin()">🔐 Iniciar sesión Microsoft</button>'+
    '</div>'
  );
}

var s=document.createElement('script');
s.src='https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.0/lib/msal-browser.min.js';
s.onload=function(){
  msalInst=new msal.PublicClientApplication(msalCfg);
  msalInst.handleRedirectPromise().then(function(result){
    if(result&&result.account){
      msalAcc=result.account;postLogin();
    } else {
      var acc=msalInst.getAllAccounts();
      if(acc.length>0){msalAcc=acc[0];postLogin();}
      else showPantallaLogin();
    }
  }).catch(function(e){
    console.error('[MSAL]',e.message);showPantallaLogin();
  });
};
s.onerror=function(){
  render('<div class="alert" style="margin-top:20px">Error cargando MSAL. Verifica tu conexión.</div>');
};
document.head.appendChild(s);

})();
